<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Score Dashboard</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .gate {
      text-align: center;
      max-width: 28rem;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      font-weight: 700;
    }
    p {
      margin: 0 0 24px;
      color: #808080;
      font-size: 0.875rem;
      line-height: 1.5;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    a {
      display: inline-block;
      min-width: 8rem;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      background: #202020;
      color: #fff;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
    }
    a:hover, a:focus-visible {
      border-color: rgba(255, 255, 255, 0.35);
      outline: none;
    }
  </style>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      if (params.has('choose')) return;

      var force = params.get('view');
      if (force === 'desktop') {
        location.replace('desktop.html');
        return;
      }
      if (force === 'mobile') {
        location.replace('mobile.html');
        return;
      }

      var preferMobile = window.matchMedia('(max-width: 799px), (pointer: coarse)').matches;
      location.replace(preferMobile ? 'mobile.html' : 'desktop.html');
    })();
  </script>
</head>
<body>
  <div class="gate">
    <h1>Score Dashboard</h1>
    <p>自動で開けない場合は、使う画面を選んでください。</p>
    <div class="links">
      <a href="desktop.html">PC版</a>
      <a href="mobile.html">モバイル版</a>
    </div>
  </div>
</body>
</html>
