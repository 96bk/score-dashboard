  let cameraLockCornerRemainWallAlongPrev = null;
  let cameraLockCornerRemainWallStillFrames = 0;
  let cameraLockCornerAwaitSecondPark = false;
  let cameraLockCornerAllowOverflowHypot = false;
  let cameraLockCornerParkCatchActive = false;
  let cameraLockCornerParkCatchW = 0;
  let cameraLockCornerParkCatchH = 0;
  let cameraLockCornerParkCatchFixed = false;
  let cameraLockCornerParkCatchFixedW = 0;
  let cameraLockCornerParkCatchFixedH = 0;
  let cameraLockCornerParkCatchRaf = null;
  let cameraLockCornerParkCatchLastTs = 0;
  let draggedPlayerId = null;
  let dragStartOrderIds = null; // ドラッグ開始時点の並び（順番が本当に変わったか判定用）
  let placeholderElement = null;
  let customDragGhost = null; 
  let dragLock = false; 

  // ★ 追加：名前の動的縮小ギミック用のリアルタイム監視
  const nameScaleObserver = new ResizeObserver(entries => {
    for (let entry of entries) {
      const boxEl = entry.target; 
      if (!boxEl.offsetParent) continue;

      const nameEl = boxEl.querySelector('.card-name');
      if (!nameEl) continue;

      // ① 発生条件の検知（②の縮小率計算と同じ、小数点以下まで精度のある
      // getBoundingClientRectで統一。clientWidth/scrollWidthは整数に丸められるため、
      // 倍率ギミックの--adj-zoom（100%未満は75〜100、100%超は100〜125へ当てはめ）と
      // 組み合わさった際、実際には押し潰されていない短い名前でも丸め誤差だけで
      // 誤ってはみ出し判定してしまうことがあったため、判定方法をここで統一します。
      const currentScale = parseFloat(nameEl.dataset.currentScale) || 1.0;
      const exactNaturalW = currentScale > 0 ? nameEl.getBoundingClientRect().width / currentScale : 0;
      const exactAvailableW = boxEl.getBoundingClientRect().width;

      // 枠が物理的に押し潰されて、中身が明らかにはみ出ようとしている時（誤差を考慮して差が0.5pxより大きい時）
      // 極小 scale での計測崩壊→等倍復帰の振動は syncFitTransformScale 側で防ぐ
      syncFitTransformScale(nameEl, exactNaturalW, exactAvailableW, 'currentScale');
    }
  });

  // ★ 追加：スコア「数字＋pt」の横幅縮小ギミック用のリアルタイム監視
  //   既存の倍率ギミック（--zoom-level / --adj-zoom / --inv-zoom）には一切触れず、
  //   その計算結果である"見た目"の上に transform:scale を追加で重ねがけする。
  //   カードごとに、必要な時に必要な分だけ、黒い箱内の「数字＋pt」だけを縮小する。
  //   黒い箱・ペン・✔・余白などのサイズは変更しない（transformはレイアウトを変えない）。
  const scoreScaleObserver = new ResizeObserver(entries => {
    for (let entry of entries) {
      fitScoreBox(entry.target);
    }
  });

  // ★ btn-fit-label: ボタン「幅」が狭くなり「高さ」は変わらないときだけ使う文字 scale 縮小（名前ボックスと同じ方式）
  //
  // 【使う】横幅だけ減るボタン（拡張カード内グリッド、左パネル btn-row-2 等）
  //   ・拡張カード: 最低余白 2px（変更取消／ポイントリセット行は 4px）
  //   ・その他（固定幅で幅のみ縮小する想定）: 8px — 仕組みは拡張カードと同じ
  //
  // 【使わない】ヘッダー／撮影ヘッダーのように zoom や transform: scale で
  //   ボタン全体（高さごと）が縮む場所。文字はボタンに連動して小さくなるので二重に載せない。
  //   将来そういうボタンを足すときも btn-fit-label は付けない。
  //
  // 【将来】高さを変えず幅だけ縮める新ボタン → 拡張カードと同様に span + fitBtnFitLabel + 最低余白
  const BTN_LABEL_SIDE_PAD = 2;
  const BTN_LABEL_SIDE_PAD_UNDO = 4;
  const BTN_LABEL_SIDE_PAD_STD = 8;
  const btnLabelScaleObserver = new ResizeObserver(entries => {
    const consolesToSync = new Set();
    for (let entry of entries) {
      fitBtnFitLabel(entry.target);
      const topGrid = entry.target.closest('.ext-grid-top');
      if (topGrid) {
        const consoleEl = topGrid.closest('.card-console');
        if (consoleEl) consolesToSync.add(consoleEl);
      }
    }
    consolesToSync.forEach(scheduleExtBottomSync);
  });

  function getBtnLabelSidePad(btnEl) {
    if (btnEl.closest('.ext-grid-undo') || btnEl.closest('.btn-row-2')) return BTN_LABEL_SIDE_PAD_UNDO;
    if (btnEl.closest('.card-console')) return BTN_LABEL_SIDE_PAD;
    return BTN_LABEL_SIDE_PAD_STD;
  }

  function observeBtnFitLabelButtons(root) {
    const scope = root || document;
    scope.querySelectorAll('button').forEach(btn => {
      if (btn.classList.contains('camera-size-label')) return;
      if (btn.querySelector('.btn-fit-label')) btnLabelScaleObserver.observe(btn);
    });
    scope.querySelectorAll('.sort-menu-trigger, .header-select-trigger').forEach(btn => {
      if (btn.querySelector('.btn-fit-label')) btnLabelScaleObserver.observe(btn);
    });
  }

  function fitBtnFitLabelButtons(root) {
    const scope = root || document;
    const seen = new Set();
    scope.querySelectorAll('button, .sort-menu-trigger, .header-select-trigger').forEach(btn => {
      if (!btn.querySelector('.btn-fit-label') || seen.has(btn)) return;
      seen.add(btn);
      fitBtnFitLabel(btn);
    });
  }

  function fitBtnFitLabel(btnEl) {
    if (!btnEl || !btnEl.offsetParent) return;
    if (btnEl.classList.contains('camera-size-label')) return;
    const labelEl = btnEl.querySelector('.btn-fit-label');
    if (!labelEl) return;

    const currentScale = parseFloat(labelEl.dataset.currentScale) || 1.0;
    const labelRect = labelEl.getBoundingClientRect();
    const exactNaturalW = currentScale > 0 ? labelRect.width / currentScale : 0;

    const sidePad = getBtnLabelSidePad(btnEl);
    const btnRect = btnEl.getBoundingClientRect();
    const offsetW = btnEl.offsetWidth;
    const innerW = offsetW > 0
      ? btnRect.width * (btnEl.clientWidth / offsetW)
      : btnRect.width;
    const padVisual = offsetW > 0
      ? sidePad * (btnRect.width / offsetW)
      : sidePad;
    const exactAvailableW = Math.max(0, innerW - padVisual * 2);

    syncFitTransformScale(labelEl, exactNaturalW, exactAvailableW, 'currentScale');
  }

  // 拡張下段を上段プラマイ列に同期する。
  // ・32px 超: flex。適用だけ 64〜68（入力が吸収）。+/-・C は 32 固定。
  // ・32px 以下: 上段と同じ6列グリッドに切替（入力2 / +/-1 / C1 / 適用2）。幅はCSSのみで揃う。
  const EXT_ALIGN_PM_W = 32;
  const extBottomSyncPending = new Set();
  let extBottomSyncRaf = 0;

  function scheduleExtBottomSync(consoleEl) {
    if (!consoleEl) return;
    extBottomSyncPending.add(consoleEl);
    if (extBottomSyncRaf) return;
    extBottomSyncRaf = requestAnimationFrame(() => {
      extBottomSyncRaf = 0;
      const list = Array.from(extBottomSyncPending);
      extBottomSyncPending.clear();
      list.forEach(syncExtBottomToTop);
    });
  }

  function clearExtBottomInlineSize(el) {
    if (!el) return;
    el.style.width = '';
    el.style.flex = '';
    el.style.minWidth = '';
    el.style.maxWidth = '';
  }

  function syncExtBottomToTop(consoleEl) {
    if (!consoleEl || !consoleEl.offsetParent) return;
    const topBtns = consoleEl.querySelectorAll('.ext-grid-top > button');
    const bottom = consoleEl.querySelector('.ext-grid-bottom');
    if (!bottom || topBtns.length < 6) return;

    const inputWrap = bottom.querySelector('.input-wrapper');
    const bottomBtns = bottom.querySelectorAll(':scope > button');
    if (!inputWrap || bottomBtns.length < 3) return;
    const signBtn = bottomBtns[0];
    const clearBtn = bottomBtns[1];
    const applyBtn = bottomBtns[2];

    const pmW = Math.round(
      (topBtns[2].offsetWidth + topBtns[3].offsetWidth) / 2
    );
    if (pmW <= 0) return;

    // ヒステリシス: 32以下で lock、33以上で grow
    let mode = consoleEl.dataset.extBottomMode || 'grow';
    if (mode === 'grow' && pmW <= EXT_ALIGN_PM_W) mode = 'lock';
    else if (mode === 'lock' && pmW >= EXT_ALIGN_PM_W + 1) mode = 'grow';
    else if (mode !== 'lock' && mode !== 'grow') {
      mode = pmW <= EXT_ALIGN_PM_W ? 'lock' : 'grow';
    }
    const modeChanged = consoleEl.dataset.extBottomMode !== mode;
    consoleEl.dataset.extBottomMode = mode;

    if (mode === 'lock') {
      if (!bottom.classList.contains('is-ext-locked') || modeChanged) {
        bottom.classList.add('is-ext-locked');
        [inputWrap, signBtn, clearBtn, applyBtn].forEach(clearExtBottomInlineSize);
        // 高さだけ維持（Type C）
        inputWrap.style.height = '32px';
        inputWrap.style.overflow = 'hidden';
        signBtn.style.height = '32px';
        signBtn.style.padding = '0';
        clearBtn.style.height = '32px';
        clearBtn.style.padding = '0';
        applyBtn.style.height = '32px';
        applyBtn.style.padding = '0';
        requestAnimationFrame(() => {
          [signBtn, clearBtn, applyBtn].forEach(fitBtnFitLabel);
        });
      }
      return;
    }

    // grow: flex + 適用64〜68
    if (bottom.classList.contains('is-ext-locked') || modeChanged) {
      bottom.classList.remove('is-ext-locked');
    }

    const setFixedW = (el, w) => {
      const n = Math.max(0, Math.round(w));
      const widthPx = `${n}px`;
      if (el.style.width === widthPx && el.style.flex === `0 0 ${widthPx}`) return false;
      el.style.width = widthPx;
      el.style.flex = `0 0 ${widthPx}`;
      el.style.minWidth = '0';
      el.style.maxWidth = widthPx;
      el.style.height = '32px';
      el.style.padding = '0';
      return true;
    };

    const applyW = Math.max(64, Math.min(68, 100 - pmW));
    let changed = false;
    changed = setFixedW(applyBtn, applyW) || changed;
    changed = setFixedW(signBtn, EXT_ALIGN_PM_W) || changed;
    changed = setFixedW(clearBtn, EXT_ALIGN_PM_W) || changed;

    if (inputWrap.style.flex !== '1 1 0' || inputWrap.style.width || inputWrap.style.maxWidth) {
      inputWrap.style.width = '';
      inputWrap.style.flex = '1 1 0';
      inputWrap.style.minWidth = '32px';
      inputWrap.style.maxWidth = '';
      inputWrap.style.height = '32px';
      inputWrap.style.overflow = 'hidden';
      changed = true;
    }

    if (changed) {
      [signBtn, clearBtn, applyBtn].forEach(fitBtnFitLabel);
    }
  }

  // 黒い箱1個ぶんのスコア「数字＋pt」を、横幅が足りない時だけ縮小して収める。
  //   ・2列以上（中央配置）：
  //       第0段階＝中央のまま右端がペン/✔に触れずに収まるうちは、中央・等倍のまま。
  //       それ以降は「はみ出さない2通りの置き方」のうち“文字がより大きくなる方”を常に採用する：
  //         (A) 右のペン/✔へベタ付け（左は最低8px）… 縮小は右端基準。高さ制約なし。
  //         (B) 全幅・中央配置（両壁最低8px）… ただし✔と□ペンの縦すき間に収まる高さが上限。
  //       (A)と(B)は切替点で同じ文字サイズになるため、「すき間に入る大きさになった瞬間」に
  //       文字サイズを変えずに (A)→(B) へ切り替わり中央へ戻る。そこから更に狭まれば中央のまま縮小。
  //   ・1列/リスト（左寄せ）：左寄せのまま、右のペン/✔に到達しそうなら縮小（中央配置は無し）
  const SCORE_MIN_GAP = 8; // 数字と壁の最低すき間（画面px）
  function fitScoreBox(boxEl) {
    if (!boxEl || !boxEl.offsetParent) return;
    const contentEl = boxEl.querySelector('.card-score-content');
    if (!contentEl) return;

    const grid = document.getElementById('playerGrid');
    const isScoreLeft = !!(grid && grid.classList.contains('score-left'));

    const boxRect = boxEl.getBoundingClientRect();
    if (boxRect.width <= 0) return;

    // カメラモード中は右側アイコンが存在しないため、箱の全幅だけを基準に収める。
    if (isCameraMode) {
      boxEl.classList.remove('score-fit');
      const curScale = parseFloat(contentEl.dataset.scoreScale) || 1.0;
      const contentRect = contentEl.getBoundingClientRect();
      const natW = curScale > 0 ? contentRect.width / curScale : 0;
      if (natW <= 0) return;
      // 1px枠は画面上常に1px固定（inv-adj-zoom 打ち消し後）
      const border = 1;
      const rightWall = boxRect.right - border;

      if (isScoreLeft) {
        contentEl.style.transformOrigin = 'left center';
        const leftEdge = contentEl.getBoundingClientRect().left;
        applyScoreScale(contentEl, natW, rightWall - SCORE_MIN_GAP - leftEdge);
      } else {
        contentEl.style.transformOrigin = 'center center';
        applyScoreScale(contentEl, natW, boxRect.width - border * 2 - SCORE_MIN_GAP * 2);
      }
      return;
    }

    // 右アンカーの基準＝右のペン/✔の左端。要素を実測し、borderやinv-adj-zoomを自動で吸収する
    //（ペン/✔は zoom:inv-adj-zoom により画面上は常に24px幅で右端に張り付いている）
    const penEl = boxEl.querySelector('.score-edit-container');
    const rightBoundPen = penEl ? penEl.getBoundingClientRect().left : (boxRect.right - 24);

    // いまかかっている縮小(scale)を打ち消して「等倍時の実寸（幅・高さ）」を得る（名前縮小と同じ手法。
    // getBoundingClientRectで小数点以下まで測り、丸め誤差での誤発動を防ぐ）
    const curScale = parseFloat(contentEl.dataset.scoreScale) || 1.0;
    const crect = contentEl.getBoundingClientRect();
    const natW = curScale > 0 ? crect.width / curScale : 0;
    const natH = curScale > 0 ? crect.height / curScale : 0;
    if (natW <= 0) return;

    if (isScoreLeft) {
      // 【1列・リストモード】中央配置は無し。左寄せのまま、右のペン/✔に到達しそうなら縮小。
      boxEl.classList.remove('score-fit');
      contentEl.style.transformOrigin = 'left center';
      // 左端は transform-origin:left の縮小では動かないので、そのまま基準にできる
      const leftEdge = contentEl.getBoundingClientRect().left;
      applyScoreScale(contentEl, natW, rightBoundPen - leftEdge);
      return;
    }

    // 【2列以上：中央配置モード】
    // 1px枠は画面上常に1px固定（inv-adj-zoom 打ち消し後）
    const border = 1;
    const leftWall = boxRect.left + border;   // 箱の内側の左壁
    const rightWall = boxRect.right - border; // 箱の内側の右壁

    // 第0段階：中央のまま右端がペン/✔に触れずに収まる → 中央・等倍を維持（レイアウトそのまま）
    const centeredMax = 2 * rightBoundPen - boxRect.left - boxRect.right;
    if (natW - centeredMax <= 0.5) {
      boxEl.classList.remove('score-fit');
      contentEl.style.transformOrigin = 'center center';
      resetScoreScale(contentEl);
      return;
    }

    // 第0段階を超えた＝どこかを詰める必要がある。「はみ出さない2通りの置き方」で
    // より大きく置ける方を選ぶ（＝文字を常に最大化。切替時に文字サイズは不連続に増えない）：
    //   (A) 右アンカー：右のペン/✔へベタ付け＋左は最低8px。高さ制約なし。
    //   (B) 全幅・中央：両壁は最低8px。ただし✔と□ペンの「縦のすき間」に収まる高さが上限。
    //       → (B)の実効幅を「すき間に収まる高さ」で頭打ち(availFullCapped)にすることで、
    //         中央に戻しても数字がすき間より高くならず、✔/ペンに絶対重ならない。
    //   ✔は未done（非表示）でも常に右上24pxを占有している前提で、要素実測のすき間を使う。
    const checkEl = boxEl.querySelector('.check-mark');
    let iconGap = 0;
    if (checkEl && penEl) {
      iconGap = penEl.getBoundingClientRect().top - checkEl.getBoundingClientRect().bottom;
    }
    const availFit = rightBoundPen - leftWall - SCORE_MIN_GAP;          // (A) 右アンカーの使える幅
    let availFullCapped = -1;                                           // (B) 全幅中央（高さ上限付き）
    if (iconGap > 0 && natH > 0) {
      const availFull = (rightWall - leftWall) - SCORE_MIN_GAP * 2;     // 両壁8pxずつの全幅
      availFullCapped = Math.min(availFull, natW * (iconGap / natH));   // 幅＆すき間高さの両制約
    }

    if (availFullCapped >= availFit) {
      // (B) 全幅・中央配置に戻して、✔と□ペンの縦すき間を通す。高さ上限付きなので重ならない。
      boxEl.classList.remove('score-fit');
      contentEl.style.transformOrigin = 'center center';
      applyScoreScale(contentEl, natW, availFullCapped);
    } else {
      // (A) 右のペン/✔へベタ付け＋左は最低8px。溢れる分だけ origin:right で縮小（第1・2段階）。
      boxEl.classList.add('score-fit');
      contentEl.style.transformOrigin = 'right center';
      applyScoreScale(contentEl, natW, availFit);
    }
  }

  function applyScoreScale(contentEl, natW, avail) {
    // 余白が尽きて溢れそうな分(0.5px超)だけ、なめらかに縮小を重ねがけする。
    // avail<=0 の極端に狭い状況でも、等倍(1)には戻さず最小限まで縮小してはみ出しを防ぐ。
    // 測定不能(natW<=0)時の等倍復帰は syncFitTransformScale が抑止（振動防止）。
    syncFitTransformScale(contentEl, natW, avail, 'scoreScale');
  }

  function resetScoreScale(contentEl) {
    if (contentEl.dataset.scoreScale !== "1") {
      contentEl.style.transform = 'scale(1)';
      contentEl.dataset.scoreScale = 1;
    }
  }

  // 通常Web版：メンバーDBはスプレッドシートではなくブラウザに永続化
  const MEMBERS_STORAGE_KEY = 'scoreDashMembers';

  function loadMembersFromStorage() {
    const raw = localStorage.getItem(MEMBERS_STORAGE_KEY);
    if (!raw) return { players: [], waitroom: [] };
    try {
      const data = JSON.parse(raw);
      if (!data || typeof data !== 'object') return { players: [], waitroom: [] };
      return {
        players: Array.isArray(data.players) ? data.players : [],
        waitroom: Array.isArray(data.waitroom) ? data.waitroom : []
      };
    } catch (_) {
      return { players: [], waitroom: [] };
    }
  }

  function saveMembersToStorage(playerList, waitList) {
    localStorage.setItem(MEMBERS_STORAGE_KEY, JSON.stringify({
      players: playerList || [],
      waitroom: waitList || []
    }));
  }

  function createPlayerId() {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
      return crypto.randomUUID();
    }
    return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
  }

  // onclick / data-id / getElementById に埋め込んでも壊れない文字だけ許可
  function isSafePlayerId(id) {
    return typeof id === 'string' && id.length > 0 && /^[A-Za-z0-9_-]+$/.test(id);
  }

  function ensureUniquePlayerIds(list) {
    const seen = new Set();
    let changed = false;
    (list || []).forEach(p => {
      const raw = p.id;
      let id = (raw == null || raw === '') ? '' : String(raw);
      // 空・重複・記号入り／不正形式は正規 ID に付け替え（過去データや DB 直編集対策）
      if (!id || !isSafePlayerId(id) || seen.has(id)) {
        do {
          id = createPlayerId();
        } while (seen.has(id));
        p.id = id;
        changed = true;
      } else if (p.id !== id) {
        // 数値などで保存されていた ID を文字列に揃える（=== 照合の失敗防止）
        p.id = id;
        changed = true;
      }
      seen.add(id);
    });
    return changed;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // onclick="... 'value' ..." 用（HTML属性＋JS単一引用符の両方を安全に）
  function escapeJsInDblQuotedAttr(str) {
    return String(str)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/\r/g, '\\r')
      .replace(/\n/g, '\\n')
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;');
  }

  // 撮影モード入場前に DB が未着のまま入場すると snapshot.players が [] のまま残る。
  // その後 load で cards は出るが、終了時に空スナップショットへ巻き戻って真っ白になるのを防ぐ。
  function syncCameraModeSnapshotAfterDataLoad() {
    if (!isCameraMode || !cameraModeSnapshot) return;
    cameraModeSnapshot.players = JSON.parse(JSON.stringify(players));
    cameraModeSnapshot.activePlayerId = null;
    cameraHiddenPlayers = [];
    if (isCameraHideMode) {
      cameraHideModeSnapshot = captureCameraHideModeSnapshot();
    }
    updateCameraHideEntryBtn();
  }

  // メンバー管理を DB 未着のまま開くと temp が空のまま残る。load 後に本体だけ埋まって管理画面が空のままになるのを防ぐ。
  // 未保存編集中は上書きしない。
  function syncMemberManagerAfterDataLoad() {
    const modal = document.getElementById('managerModal');
    if (!modal || modal.classList.contains('hidden')) return;
    if (isManagerDirty()) return;
    applyManagerReset();
  }

  function cancelPendingConfirm() {
    if (confirmResolver) resolveConfirm(false);
  }

  function updateDataReadyControls() {
    const locked = !dataReady;
    const main = document.getElementById('mainView');

      players = Array.isArray(data.players) ? data.players : [];
      waitroom = Array.isArray(data.waitroom) ? data.waitroom : [];
      activePlayerId = null;

      const idsFixed = ensureUniquePlayerIds(players);

      syncCameraModeSnapshotAfterDataLoad();
      syncMemberManagerAfterDataLoad();
      updateSortMenuUI();
      applyWaitSortMode();

      waitroom = [];
      activePlayerId = null;
      syncCameraModeSnapshotAfterDataLoad();
      syncMemberManagerAfterDataLoad();
      updateSortMenuUI();
      applyWaitSortMode();
      executeSort();

  /* --- リサイザー --- */
  let isResizing = false;
  let startX;
  let startWidth;

  function initResizer() {
    const resizer = document.createElement('div');
    resizer.className = 'resizer';
    const controlPanel = document.querySelector('.control-panel');
    controlPanel.appendChild(resizer);

    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      document.body.classList.add('is-resizing'); 
      startX = e.clientX;
      startWidth = controlPanel.getBoundingClientRect().width;
      document.body.style.cursor = 'ew-resize';
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const dx = startX - e.clientX;
      let newWidth = startWidth + dx;
      const maxWidth = window.innerWidth * 0.20;
      
      if (newWidth >= maxWidth) {
        document.documentElement.style.setProperty('--panel-width', '20%');
      } else {
        if (newWidth < 200) newWidth = 200;
        document.documentElement.style.setProperty('--panel-width', newWidth + 'px');
      }
      checkHeaderCollision();
    });

    window.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        document.body.classList.remove('is-resizing'); 
        document.body.style.cursor = 'default';
        saveSettings();
        applyRenderSettings(); 
      }
    });
  }

  const CENTER_HEADER_ITEM_W = 128;

  /* ヘッダー中央3項目を 128px 固定幅に揃える */
  function syncCenterItemWidths(centerGroup) {
    if (!centerGroup) return CENTER_HEADER_ITEM_W;
    Array.from(centerGroup.children).forEach(item => {
      item.style.width = CENTER_HEADER_ITEM_W + 'px';
    });
    return CENTER_HEADER_ITEM_W;
  }

  function applyCenterItemWidthsFromCache(centerGroup, width) {
    if (!centerGroup) return;
    const w = width || CENTER_HEADER_ITEM_W;
    Array.from(centerGroup.children).forEach(item => { item.style.width = w + 'px'; });
  }

  // 等倍時の各グループ幅。ウィンドウ幅変更だけなら再計測せず layout 計算に使い回す
  let headerBaseWidthsCache = null;

  function invalidateHeaderBaseWidthsCache() {
    headerBaseWidthsCache = null;
  }

  function measureAndCacheHeaderBases(leftEl, centerGroup, colZoomGroup, extCamGroup, rightWrap, header) {
    document.documentElement.style.setProperty('--header-gap', '16px');
    Array.from(centerGroup.children).forEach(c => c.style.zoom = 1);
    leftEl.style.zoom = 1;
    colZoomGroup.style.zoom = 1;
    extCamGroup.style.zoom = 1;

    const centerItemWidth = syncCenterItemWidths(centerGroup);

    colZoomGroup.style.marginRight = '0px';
    rightWrap.style.gap = '16px';
    colZoomGroup.style.gap = '';
    extCamGroup.style.gap = '';
    void header.offsetWidth;

    headerBaseWidthsCache = {
      L_base: leftEl.offsetWidth,
      C_base: centerGroup.offsetWidth,
      Col_base: colZoomGroup.offsetWidth,
      Ext_base: extCamGroup.offsetWidth,
      centerItemWidth,
      playerCount: players.length
    };
    return headerBaseWidthsCache;
  }

  function computeHeaderLayout(headerWidth, panelWidth, isExt, L_base, C_base, Col_base, Ext_base) {
    const X = Ext_base + 16;
    let margin = panelWidth - X;
    if (margin < 0 || isExt) margin = 0;

    const targetCenterLeft = isExt
      ? (headerWidth / 2 - C_base / 2)
      : ((headerWidth - panelWidth) / 2 - C_base / 2);

    let g = 16;
    let s = 1.0;
    let isCenterRuleBroken = false;

    let leftLimit = 24 + L_base;
    let rightLimit = headerWidth - 24 - Ext_base - 16 - margin - Col_base;

    if (!isExt && margin > 0) {
      if (targetCenterLeft < leftLimit + 16 || targetCenterLeft + C_base > rightLimit - 16) {
        margin = 0;
        rightLimit = headerWidth - 24 - Ext_base - 16 - margin - Col_base;
      }
    }

    if (targetCenterLeft < leftLimit + 16 || targetCenterLeft + C_base > rightLimit - 16) {
      isCenterRuleBroken = true;
    }

    let actualCenterLeft = targetCenterLeft;
    if (isCenterRuleBroken) {
      actualCenterLeft = leftLimit + (rightLimit - leftLimit) / 2 - C_base / 2;
    }

    if (actualCenterLeft < leftLimit + 16 || actualCenterLeft + C_base > rightLimit - 16) {
      const K = headerWidth + 24 - Ext_base - Col_base - L_base - C_base - margin;
      g = Math.floor(K / 7);

      if (g < 8) {
        g = 8;
        const scalable = (L_base + C_base + Col_base + Ext_base) - 64;
        const maxS = (headerWidth - 96 - margin) / scalable;
        if (maxS < 1.0) {
          s = Math.max(0.3, maxS);
        }
      }
    }

    return { g, s, margin, isCenterRuleBroken };
  }

  function applyHeaderZoomAndGaps(centerGroup, leftEl, colZoomGroup, extCamGroup, rightWrap, g, s, margin) {
    document.documentElement.style.setProperty('--header-gap', g + 'px');
    Array.from(centerGroup.children).forEach(c => c.style.zoom = s);
    leftEl.style.zoom = s;
    colZoomGroup.style.zoom = s;
    extCamGroup.style.zoom = s;
    rightWrap.style.gap = g + 'px';
    colZoomGroup.style.gap = (g / s) + 'px';
    extCamGroup.style.gap = (g / s) + 'px';
    colZoomGroup.style.marginRight = (margin / s) + 'px';
  }

  /* --- JS監視システム (ヘッダーのレスポンシブ) --- */
  function checkHeaderCollision() {
    const container = document.getElementById('mainView');
    const header = document.querySelector('.header');
    const leftEl = document.querySelector('.header-left');
    const centerWrap = document.querySelector('.header-center');
    const centerGroup = document.getElementById('centerButtonGroup');
    const rightWrap = document.querySelector('.header-right');
    const colZoomGroup = document.querySelector('.col-zoom-group');
    const extCamGroup = document.querySelector('.ext-cam-group');
    const controlPanel = document.querySelector('.control-panel');

    if (!header || !leftEl || !centerWrap || !centerGroup || !colZoomGroup || !extCamGroup) return;

    if (headerBaseWidthsCache && headerBaseWidthsCache.playerCount !== players.length) {
      invalidateHeaderBaseWidthsCache();
    }

    const wasResizing = document.body.classList.contains('is-resizing');
    if (!wasResizing) document.body.classList.add('is-resizing');

    let bases;
    if (headerBaseWidthsCache) {
      applyCenterItemWidthsFromCache(centerGroup, headerBaseWidthsCache.centerItemWidth);
      bases = headerBaseWidthsCache;
    } else {
      bases = measureAndCacheHeaderBases(leftEl, centerGroup, colZoomGroup, extCamGroup, rightWrap, header);
    }

    const headerWidth = header.offsetWidth;
    const isExt = container.classList.contains('extended-mode');
    const panelWidth = isExt ? 0 : (controlPanel ? controlPanel.offsetWidth : 0);

    const { L_base, C_base, Col_base, Ext_base } = bases;
    const { g, s, margin, isCenterRuleBroken } = computeHeaderLayout(
      headerWidth, panelWidth, isExt, L_base, C_base, Col_base, Ext_base
    );

    applyHeaderZoomAndGaps(centerGroup, leftEl, colZoomGroup, extCamGroup, rightWrap, g, s, margin);

    let rect_L;
    let rect_C;
    let rect_Col;
    let rect_Ext;
    const needsShrinkCorrection = isCenterRuleBroken && s < 1;

    if (needsShrinkCorrection) {
      rect_L = leftEl.getBoundingClientRect().width;
      rect_C = centerGroup.getBoundingClientRect().width;
      rect_Col = colZoomGroup.getBoundingClientRect().width;
      rect_Ext = extCamGroup.getBoundingClientRect().width;

      let correctedS = s;
      for (let iter = 0; iter < 4; iter++) {
        const M = rect_L + rect_C + rect_Col + rect_Ext;
        const s2 = correctedS * (headerWidth - 96 - margin) / (M - 32);
        const sc = Math.max(0.3, s2);
        if (Math.abs(sc - correctedS) < 0.0015) break;
        correctedS = sc;
        applyHeaderZoomAndGaps(centerGroup, leftEl, colZoomGroup, extCamGroup, rightWrap, g, correctedS, margin);
        rect_L = leftEl.getBoundingClientRect().width;
        rect_C = centerGroup.getBoundingClientRect().width;
        rect_Col = colZoomGroup.getBoundingClientRect().width;
        rect_Ext = extCamGroup.getBoundingClientRect().width;
      }
    } else {
      rect_L = L_base * s;
      rect_C = C_base * s;
      rect_Col = Col_base * s;
      rect_Ext = Ext_base * s;
    }

    const final_LeftLimit = 24 + rect_L;
    const final_RightLimit = headerWidth - 24 - rect_Ext - g - margin - rect_Col;

    let finalCenterLeft = isExt ? (headerWidth / 2 - rect_C / 2) : ((headerWidth - panelWidth) / 2 - rect_C / 2);

    if (isCenterRuleBroken) {
      finalCenterLeft = final_LeftLimit + (final_RightLimit - final_LeftLimit) / 2 - rect_C / 2;
    }

    centerWrap.style.left = finalCenterLeft + 'px';

    if (!wasResizing) {
      void centerWrap.offsetWidth;
      document.body.classList.remove('is-resizing');
    }
    fitBtnFitLabelButtons(header);
  }

  function saveSettings() {

  function saveSortModesToStorage() {

  }

  function persistCustomPresets() {
    const seen = new Set();
    const values = [];
    customPresets.forEach(chip => {
      if (isPresetEmptyValue(chip.value)) return;
      if (seen.has(chip.value)) return;
      seen.add(chip.value);
      values.push(chip.value);
    });
    values.sort((a, b) => a - b);
    if (values.length > PRESET_CHIP_MAX) values.length = PRESET_CHIP_MAX;
    localStorage.setItem('scoreDashCustomPresets', JSON.stringify(values));
  }

  function loadCustomPresetsFromStorage() {
    customPresets = [];
    presetIdSeq = 1;
    const raw = localStorage.getItem('scoreDashCustomPresets');
    if (!raw) return;
    let parsed;
    try { parsed = JSON.parse(raw); } catch (_) { return; }
    if (!Array.isArray(parsed)) return;
    const seen = new Set();
    parsed.forEach(v => {
      const n = parseInt(v, 10);
      if (!Number.isFinite(n) || n === 0) return;
      const clamped = clampPresetValue(n);
      if (!Number.isFinite(clamped) || clamped === 0 || seen.has(clamped)) return;
      seen.add(clamped);
      customPresets.push({ id: presetIdSeq++, value: clamped });
    });
    customPresets.sort((a, b) => a.value - b.value);
    if (customPresets.length > PRESET_CHIP_MAX) customPresets = customPresets.slice(0, PRESET_CHIP_MAX);
  }

  function loadSortModesFromStorage() {
    const savedSort = localStorage.getItem('scoreDashSortMode');
    if (savedSort === 'rank' || savedSort === 'name' || savedSort === 'custom') {
      sortMode = savedSort;
    } else {
      sortMode = 'rank';
    }
    const savedWait = localStorage.getItem('scoreDashWaitSortMode');
    if (savedWait === 'name' || savedWait === 'custom') {

      waitSortMode = 'custom';

  function sortTempPlayersByMode(mode) {
    if (mode === 'rank') {
      tempPlayers.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        return (a.baseOrder || 0) - (b.baseOrder || 0);
      });
    } else if (mode === 'name') {
      tempPlayers.sort((a, b) => {
        const byName = a.name.localeCompare(b.name, 'ja');
        return byName !== 0 ? byName : (a.baseOrder || 0) - (b.baseOrder || 0);
      });
    }
  }

  const ZOOM_PERCENT_PRESETS = [50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150];
  const ZOOM_STEP_VALUES = [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5];
  const ZOOM_STEP_NEAR = 0.01;

  // 表示専用。50〜150 の 10% 刻みは実値がその値のときだけ。近傍は四捨五入せず ±1 に寄せる
  function formatZoomPercentLabel(z) {
    const pct = z * 100;
    const exact = (target) => Math.abs(pct - target) < 1e-9;
    for (let i = 0; i < ZOOM_PERCENT_PRESETS.length; i++) {
      if (exact(ZOOM_PERCENT_PRESETS[i])) return ZOOM_PERCENT_PRESETS[i];
    }
    let n = Math.round(pct);
    if (ZOOM_PERCENT_PRESETS.indexOf(n) !== -1) n = pct > n ? n + 1 : n - 1;
    return n;
  }

  // 今の撮影高さ（ロック中は線のpx。倍率の理論値ではない）
  function getZoomLabelNowHeightPx() {
    if (isCameraMode) {
      const h = Math.round(getCameraCaptureHeight());
      if (h > 0) return h;
    }
    return Math.round(getDisplayedZoomHeightPx(currentZoom));
  }

  // 近い 0.1 刻みの整数pxと同じならその刻み（130 など）。違う／近くないなら formatZoomPercentLabel
  function getDisplayedZoomPercent(z) {
    if (!Number.isFinite(z)) return formatZoomPercentLabel(1);
    const near = getNearbyZoomStep(z);
    if (near != null && shouldMatchZoomPercentToDisplayedPx()) {
      const nowPx = getZoomLabelNowHeightPx();
      const stepPx = Math.round(getDisplayedZoomHeightPx(near));
      if (nowPx > 0 && stepPx > 0 && nowPx === stepPx) return Math.round(near * 100);
      // 内部が 1.5 でも高さが 1408 なら 150 にしない
      const tick = Math.round(near * 100);
      let n = Math.round(z * 100);
      if (n === tick) n = nowPx > 0 && stepPx > 0 && nowPx < stepPx ? n - 1 : n + 1;
      else if (ZOOM_PERCENT_PRESETS.indexOf(n) !== -1) n = z * 100 > n ? n + 1 : n - 1;
      return n;
    }
    return formatZoomPercentLabel(z);
  }

  function getNearbyZoomStep(z) {
    if (!Number.isFinite(z)) return null;
    for (let i = 0; i < ZOOM_STEP_VALUES.length; i++) {
      if (Math.abs(z - ZOOM_STEP_VALUES[i]) <= ZOOM_STEP_NEAR + 1e-9) return ZOOM_STEP_VALUES[i];
    }
    return null;
  }

  function zoomPresetStepStrFromPercent(pct) {
    if (ZOOM_PERCENT_PRESETS.indexOf(pct) === -1) return null;
    return (pct / 100).toFixed(1);
  }

  // 倍率→画面の整数px（カード下端+24 を四捨五入）
  function getDisplayedCameraZoomHeightPx(z) {
    const zoom = Number.isFinite(z) ? z : currentZoom;
    const cap = measureCameraCaptureHeightPxAtZoom(
      zoom,
      getCameraCaptureWidth(),
      Math.abs(zoom - currentZoom) >= 0.0005
    );
    return cap / CAMERA_CAPTURE_SCALE;
  }

  function measureNormalModeZoomHeightPx(targetZoom) {
    const z = Math.max(0.5, Math.min(1.5, Number(targetZoom) || 1));
    const grid = document.getElementById('playerGrid');
    const mainArea = document.getElementById('mainArea');
    const wrapperLive = document.querySelector('.grid-wrapper');
    if (!grid || !mainArea) return 0;
    const readMaxBottom = (host, cardsRoot) => {
      const hostRect = host.getBoundingClientRect();
      let maxBottom = 0;
      cardsRoot.querySelectorAll('.player-card:not(.is-hidden-dragging)').forEach(card => {
        const rect = card.getBoundingClientRect();
        maxBottom = Math.max(maxBottom, rect.bottom - hostRect.top);
      });
      return Math.round(Math.max(1, maxBottom));
    };
    if (Math.abs(z - currentZoom) < 0.0005 && wrapperLive) {
      return readMaxBottom(wrapperLive, grid);
    }
    const frameW = Math.max(1, Math.round(mainArea.clientWidth));
    const adj = getCaptureAdjZoom(z);
    const invZ = 1 / z;
    const invAdj = 1 / (z * adj);
    const app = document.querySelector('.app-container');
    const shell = document.createElement('div');
    shell.className = app ? app.className : 'app-container';
    shell.classList.remove('camera-mode', 'camera-hide-mode');
    shell.setAttribute('aria-hidden', 'true');
    shell.style.cssText = [
      'position:fixed',
      'left:-100000px',
      'top:0',
      `width:${frameW}px`,
      'height:auto',
      'display:block',
      'visibility:hidden',
      'pointer-events:none',
      'z-index:-1',
      'overflow:visible',
      'background:transparent'
    ].join(';');
    shell.style.setProperty('--zoom-level', String(z));
    shell.style.setProperty('--inv-zoom', invZ.toFixed(3));
    shell.style.setProperty('--adj-zoom', adj.toFixed(3));
    shell.style.setProperty('--inv-adj-zoom', invAdj.toFixed(3));
    applyCardSpacingVars(shell, z, adj, invAdj);
    const wrapper = document.createElement('div');
    wrapper.className = 'grid-wrapper';
    wrapper.style.cssText = 'overflow:visible;height:auto;position:relative;';
    const clone = grid.cloneNode(true);
    clone.removeAttribute('id');
    clone.style.transition = 'none';
    wrapper.appendChild(clone);
    shell.appendChild(wrapper);
    document.body.appendChild(shell);
    let h = 1;
    try {
      void shell.offsetHeight;
      h = readMaxBottom(wrapper, clone);
    } finally {
      shell.remove();
    }
    return h;
  }

  function getDisplayedZoomHeightPx(z) {
    if (isCameraMode) return getDisplayedCameraZoomHeightPx(z);
    return measureNormalModeZoomHeightPx(z);
  }

  function shouldMatchZoomPercentToDisplayedPx() {
    return !isZoomAuto;
  }

  function isZoomExactly100() {
    return getDisplayedZoomPercent(currentZoom) === 100;
  }

  // 10% 刻み表示になるときだけセレクト値にする
  function getExactZoomStepStr(z) {
    return zoomPresetStepStrFromPercent(getDisplayedZoomPercent(z));
  }

  function parseManualZoomValue(v) {
    if (typeof v === 'number' && Number.isFinite(v) && v > 0) return v;
    if (typeof v === 'string' && v !== '' && v !== 'dynamic') {
      const n = parseFloat(v);
      if (Number.isFinite(n) && n > 0) return n;
    }
    return 1.0;
  }

  function updateZoomUI() {
    const autoBtn = document.getElementById('zoomAutoBtn');
    const select = document.getElementById('zoomSelect');
    let dynOpt = document.getElementById('dynamicZoomOpt');
    
    if (!dynOpt) {
      dynOpt = document.createElement('option');
      dynOpt.id = 'dynamicZoomOpt';
      dynOpt.value = 'dynamic';
      dynOpt.hidden = true;
      select.appendChild(dynOpt);
    }

    if (isZoomAuto) autoBtn.classList.add('active-toggle');
    else autoBtn.classList.remove('active-toggle');

    // オート／点線ドラッグ中、または 10% 刻みに乗っていない倍率は表示だけ丸める
    // 整数pxが刻みと同じなら 130% など（内部が 1.299 でも）
    const shownPct = getDisplayedZoomPercent(currentZoom);
    const stepStr = zoomPresetStepStrFromPercent(shownPct);
    const useDynamic = isZoomAuto
      || (isCameraMode && (cameraCropDragging || cameraCornerDragging || cameraLockDragging))
      || !stepStr;
    if (useDynamic) {
      dynOpt.text = shownPct + '%';
      select.value = 'dynamic';
    } else {
      select.value = stepStr;
    }
    syncHeaderSelectLabel('zoomSelect');
    syncLockedZoomControls(shownPct);
  }

  // ロック中：その倍率の整数高さから幅を出したとき、320〜上限に収まるか
  function isLockedZoomStepReachable(z) {
    if (!isCameraMode || !isCameraAspectLockOn()) return true;
    if (!Number.isFinite(z) || z < 0.5 - 1e-9 || z > 1.5 + 1e-9) return false;
    const r = getCameraLockRatio();
    if (!(r > 0)) return true;
    const h = getDisplayedCameraZoomHeightPx(z);
    if (!(h > 0)) return false;
    const w = Math.round(h * r);
    const capW = getCameraSizeWidthMaxScreenPx();
    return w >= CAMERA_WIDTH_MIN - 0.5 && w <= capW + 0.5;
  }

  function isLockedZoomAtGrowLimit() {
    if (!isCameraMode || !isCameraAspectLockOn()) return false;
    const w = getCameraDisplayedFrameWidth();
    const h = getCameraDisplayedHeightPx() / CAMERA_CAPTURE_SCALE;
    return lockedSizeAtWidthMax(w) || lockedSizeAtHeightMax(w, h);
  }

  function isLockedZoomAtShrinkLimit() {
    if (!isCameraMode || !isCameraAspectLockOn()) return false;
    const w = getCameraDisplayedFrameWidth();
    const h = getCameraDisplayedHeightPx() / CAMERA_CAPTURE_SCALE;
    return lockedSizeAtWidthMin(w) || lockedSizeAtHeightMin(w, h);
  }

  function applyLockedZoomTowardLimit(grow) {
    if (!isCameraAspectLockOn() || cameraLockDragging) return;
    cameraLockAppliedW = null;
    cameraLockAppliedH = null;
    const capW = getCameraSizeWidthMaxScreenPx();
    if (grow) applyLockedFromWidth(Math.max(CAMERA_WIDTH_MIN, capW), true);
    else applyLockedFromWidth(CAMERA_WIDTH_MIN, true);
  }

  function syncLockedZoomControls(shownPct) {
    const minusBtn = document.querySelector('button[onclick="changeZoomManual(-1)"]');
    const plusBtn = document.querySelector('button[onclick="changeZoomManual(1)"]');
    if (!minusBtn || !plusBtn) return;
    const pct = Number.isFinite(shownPct) ? shownPct : getDisplayedZoomPercent(currentZoom);
    const nextUp = ZOOM_PERCENT_PRESETS.find(p => p > pct);
    const nextDown = [...ZOOM_PERCENT_PRESETS].reverse().find(p => p < pct);
    plusBtn.disabled = nextUp == null || isLockedZoomAtGrowLimit();
    minusBtn.disabled = nextDown == null || isLockedZoomAtShrinkLimit();
  }

  function colStepDisabled(value, delta) {
    const v = value || '';
    if (delta < 0) return v === 'list' || v === '1';
    if (delta > 0) return v === '6';
    return false;
  }

  function setColStepBtnDisabled(el, off) {
    if (!el) return;
    el.disabled = !!off;
  }

  // 通常ヘッダー／撮影モードヘッダーは同じボタン。モーダルは表示値。
  function syncColControls() {
    const select = document.getElementById('colSelect');
    const headerVal = select ? select.value : '';
    setColStepBtnDisabled(
      document.querySelector('button[onclick="changeColsManual(-1)"]'),
      colStepDisabled(headerVal, -1)
    );
    setColStepBtnDisabled(
      document.querySelector('button[onclick="changeColsManual(1)"]'),
      colStepDisabled(headerVal, 1)
    );
    const modalVal = cameraSizeColShownValue || headerVal;
    setColStepBtnDisabled(document.getElementById('cameraSizeColDecBtn'), colStepDisabled(modalVal, -1));
    setColStepBtnDisabled(document.getElementById('cameraSizeColIncBtn'), colStepDisabled(modalVal, 1));
  }

  // 通常モードの localStorage 相当：撮影モード中はオート以外の倍率操作だけ覚える
  function rememberCameraModeManualZoom(explicitZoom, force) {
    if (!isCameraMode) return;
    if (isZoomAuto && !force) return;
    const z = Number.isFinite(explicitZoom) ? explicitZoom : currentZoom;
    if (!Number.isFinite(z) || z <= 0) return;
    cameraModeManualZoom = z;
  }

  function getCameraDisplayedHeightPx(y) {
    const v = Number.isFinite(y) ? y : getCameraContentMaxY();
    return Math.round(Math.max(1, v)) * CAMERA_CAPTURE_SCALE;
  }

  function commitCameraCropRememberedFromLayout() {
    if (!isCameraMode || isZoomAuto) {
      cameraCropRememberedY = null;
      return;
    }
    const h = getCameraCapturePxSize().height;
    cameraCropRememberedY = (h > 0 && Number.isFinite(h)) ? h / CAMERA_CAPTURE_SCALE : null;
  }

  // 表示の撮影高さになる倍率を探し、足りない分は余白。撮影設定と列数変更の共通処理
  function applyCameraCaptureHeightPx(captureH, options) {
    if (!isCameraMode || !(captureH > 0) || !Number.isFinite(captureH)) return false;
    const onlyIfNeeded = !!(options && options.onlyIfNeeded);
    const frameW = Math.round(
      Number.isFinite(options && options.frameWidthPx)
        ? options.frameWidthPx
        : getCameraCaptureWidth()
    );

    resetCameraGridEdgePadding();
    cameraCropFixedY = null;
    cameraCropKind = 'max';
    cameraCropBoundaryY = null;
    cameraCropSnapTarget = null;

    const grid = document.getElementById('playerGrid');
    const prevTransition = grid ? grid.style.transition : '';
    if (grid) grid.style.transition = 'none';

    fitCameraCardTextScales();
    let liveH = getCameraDisplayedHeightPx();
    if (!onlyIfNeeded || liveH !== captureH) {
      const closestZ = findClosestZoomForCaptureHeight(captureH, frameW);
      if (!onlyIfNeeded || Math.abs(closestZ - currentZoom) >= 0.0005) {
        currentZoom = closestZ;
        updateCSSVariables();
        if (grid) void grid.offsetHeight;
        fitCameraCardTextScales();
      }
      liveH = getCameraDisplayedHeightPx();
    }

    const targetY = captureH / CAMERA_CAPTURE_SCALE;
    if (!onlyIfNeeded || liveH !== captureH) {
      const contentY = getCameraContentMaxY();
      const delta = targetY - contentY;
      if (Number.isFinite(delta) && (!onlyIfNeeded || Math.abs(delta) <= CAMERA_CROP_DISPLAY_PAD_MAX)) {
        applyCameraGridEdgePaddingSplit(delta);
        cameraCropFixedY = targetY;
        cameraCropKind = 'fixed';
        cameraCropBoundaryY = null;
        cameraCropSnapTarget = null;
      }
    }

    cameraCropRememberedY = targetY;
    rememberCameraModeManualZoom();
    if (grid) {
      void grid.offsetHeight;
      if (cameraLockDragging) grid.style.transition = 'none';
      else grid.style.transition = prevTransition;
    }
    updateZoomUI();
    return getCameraCapturePxSize().height === captureH;
  }

  function alignCameraLayoutToDisplayedHeight(targetH) {
    applyCameraCaptureHeightPx(targetH, { onlyIfNeeded: true });
  }

  function syncCameraZoomToRememberedY(options) {
    if (!isCameraMode || isZoomAuto || cameraCropDragging || cameraCornerDragging || cameraLockDragging) return;
    if (cameraCropRememberedY == null || !Number.isFinite(cameraCropRememberedY)) {
      commitCameraCropRememberedFromLayout();
      return;
    }
    const targetH = getCameraDisplayedHeightPx(cameraCropRememberedY);
    if (options && options.settle) {
      fitCameraCardTextScales();
      alignCameraLayoutToDisplayedHeight(targetH);
      fitCameraCardTextScales();
      alignCameraLayoutToDisplayedHeight(targetH);
      fitCameraCardTextScales();
    } else {
      alignCameraLayoutToDisplayedHeight(targetH);
    }
  }

  function captureCameraLineScrollAnchor() {
    const wrapper = getCameraGridWrapper();
    if (!wrapper || !isCameraMode || isZoomAuto) return null;
    const y = getCameraContentMaxY();
    if (!(y > 0) || !Number.isFinite(y)) return null;
    return { offset: y - wrapper.scrollTop };
  }

  function restoreCameraLineScrollAnchor(anchor) {
    if (!anchor || !isCameraMode) return;
    const wrapper = getCameraGridWrapper();
    if (!wrapper) return;
    const y = getCameraContentMaxY();
    if (!(y > 0) || !Number.isFinite(y)) return;
    wrapper.scrollTop = Math.max(0, y - anchor.offset);
  }

  function holdCameraScaleObservers() {
    cameraScaleObserversHeld = true;
    pauseCameraScaleObservers();
  }

  function releaseCameraScaleObservers() {
    cameraScaleObserversHeld = false;
    if (!cameraCropDragging && !cameraCornerDragging) resumeCameraScaleObservers();
  }

  function cancelCameraRememberedYSettle(opts) {
    if (cameraRememberedYSettleRaf) {
      cancelAnimationFrame(cameraRememberedYSettleRaf);
      cameraRememberedYSettleRaf = null;
    }
    cameraRememberedYSettleAnchor = null;
    if (opts && opts.release) releaseCameraScaleObservers();
    else cameraScaleObserversHeld = false;
    flushCameraSizeColModalChromeIfPending();
  }

  function runCameraRememberedYSettlePass(anchor) {
    if (!isCameraMode || isZoomAuto || cameraCropDragging || cameraCornerDragging || cameraLockDragging) return;
    holdCameraScaleObservers();
    const grid = document.getElementById('playerGrid');
    if (grid) grid.style.transition = 'none';
    syncCameraZoomToRememberedY({ settle: true });
    restoreCameraLineScrollAnchor(anchor);
    updateCameraGuides();
    checkCameraHeaderCollision();
    syncCustomScrollbars();
  }

  function scheduleCameraRememberedYSettle(anchor) {
    cancelCameraRememberedYSettle();
    cameraRememberedYSettleAnchor = anchor;
    runCameraRememberedYSettlePass(anchor);
    syncCameraLockAfterRememberedHeightSettle();
    cameraRememberedYSettleRaf = requestAnimationFrame(() => {
      cameraRememberedYSettleRaf = requestAnimationFrame(() => {
        cameraRememberedYSettleRaf = null;
        const savedAnchor = cameraRememberedYSettleAnchor;
        cameraRememberedYSettleAnchor = null;
        if (!isCameraMode || isZoomAuto || cameraCropDragging || cameraCornerDragging || cameraLockDragging) {
          releaseCameraScaleObservers();
          flushCameraSizeColModalChromeIfPending();
          return;
        }
        runCameraRememberedYSettlePass(savedAnchor);
        syncCameraLockAfterRememberedHeightSettle();
        releaseCameraScaleObservers();
        const grid = document.getElementById('playerGrid');
        if (grid && !cameraCropDragging && !cameraCornerDragging && !cameraLockDragging) grid.style.transition = '';
        flushCameraSizeColModalChromeIfPending();
      });
    });
  }

  function isCameraZoomAtAutoDefault() {
    return cameraDefaultAutoZoom != null && Number.isFinite(cameraDefaultAutoZoom)
      && Math.abs(currentZoom - cameraDefaultAutoZoom) <= 0.0005;
  }

  function isCameraZoomAtMaxLimit() {
    return currentZoom >= 1.5 - 0.001;
  }

  // ダブルクリック不要：画面いっぱいのオート着地、または150%で画面下端に届かない最大
  function isCameraCropAtDefaultMax(geo) {
    if (!isZoomAuto) return false;
    const g = geo || resolveCameraCropGeometry();
    if (isCameraZoomAtAutoDefault() && g.atViewportBottom) return true;
    return isCameraZoomAtMaxLimit() && !g.atViewportBottom;
  }

  function getCameraCropTipText() {
    if (!isCameraMode) return '';
    const geo = resolveCameraCropGeometry();
    if (isCameraCropAtDefaultMax(geo)) return UI_TIP_CROP_DRAG;
    return canCameraCropReachViewportAtMaxZoom() ? UI_TIP_CROP_DBL : UI_TIP_CROP_DBL_MAX;
  }

  function getCameraWidthTipText() {
    if (!isCameraMode) return '';
    return cameraFrameWidth == null ? UI_TIP_WIDTH_DRAG : UI_TIP_WIDTH_DBL;
  }

  function getCameraCornerTipText() {
    if (!isCameraMode) return '';
    const widthAtMax = cameraFrameWidth == null;
    const geo = resolveCameraCropGeometry();
    if (isCameraCropAtDefaultMax(geo) && widthAtMax) {
      return UI_TIP_CORNER_DRAG;
    }
    return UI_TIP_CORNER_DBL;
  }

  function isCameraCaptureAwayFromDefault() {
    if (!isCameraMode) return false;
    const geo = resolveCameraCropGeometry();
    return cameraFrameWidth != null || !isCameraCropAtDefaultMax(geo);
  }

  function resetCameraCaptureToDefault(options) {
    if (!isCameraMode) return;
    const opts = options || {};
    if (opts.hideTip) hideUiTip();
    if (opts.uiTipPressLock) uiTipPressLock = opts.uiTipPressLock;

    const widthWasCustom = cameraFrameWidth != null;
    const geo = resolveCameraCropGeometry();
    const cropNeedsReset = !isCameraCropAtDefaultMax(geo);
    if (!widthWasCustom && !cropNeedsReset) return;

    if (widthWasCustom && !isCameraSizeLockActive()) {
      cameraFrameWidth = null;
      applyCameraFrameWidth();
      fitCameraCardTextScales();
    }
    if (cropNeedsReset) {
      if (isCameraSizeLockActive()) {
        pinCameraFrameWidthIfFollow();
        commitCameraCropRememberedFromLayout();
        rememberCameraModeManualZoom();
        updateCameraGuides();
        updateZoomUI();
      } else {
        isZoomAuto = true;
        cameraCropRememberedY = null;
        resetCameraCropToMax();
        executeAutoFit();
        updateZoomUI();
      }
    } else if (widthWasCustom) {
      updateCameraGuides();
    }
    checkCameraHeaderCollision();
    updateCameraResetDefaultBtn();
  }

  function resetCameraCaptureToDefaultFromBtn() {
    if (isCameraAspectLockOn()) setCameraAspectLockLive(false);
    resetCameraCaptureToDefault();
  }

  function updateCameraResetDefaultBtn() {
    const btn = document.getElementById('cameraResetDefaultBtn');
    if (!btn) return;
    btn.disabled = !(isCameraMode && !isCameraHideMode && isCameraCaptureAwayFromDefault());
  }

  function handleManualChange() {
    syncHeaderSelectLabel('colSelect');
    saveSettings();
    applyRenderSettings();
    if (isCameraMode && !cameraRememberedYSettleRaf) {
      updateCameraGuides();
      checkCameraHeaderCollision();
    }
  }

  function toggleZoomAuto() {
    const turningOn = !isZoomAuto;
    if (turningOn && isCameraSizeModalOpen() && cameraSizeAspectLocked) return;
    if (turningOn && isCameraAspectLockOn()) setCameraAspectLockLive(false);
    isZoomAuto = turningOn;

    if (!isZoomAuto) {
      if (cameraCropAutoFitRaf) {
        cancelAnimationFrame(cameraCropAutoFitRaf);
        cameraCropAutoFitRaf = null;
      }
      cameraCropPendingY = null;
      const manual = isCameraMode
        ? parseManualZoomValue(cameraModeManualZoom)
        : parseManualZoomValue(localStorage.getItem('scoreDashZoomManual'));
      currentZoom = Math.max(0.5, Math.min(1.5, manual));
      if (!Number.isFinite(currentZoom) || currentZoom <= 0) currentZoom = 1.0;
      updateZoomUI();
      saveSettings();
      applyRenderSettings({ commitCameraCropY: true });
      commitCameraCropRememberedFromLayout();
      if (isCameraMode) {
        updateCameraGuides();
        checkCameraHeaderCollision();
      }
      return;
    }

    cameraCropRememberedY = null;
    if (isCameraMode) {
      cancelCameraRememberedYSettle({ release: true });
      executeAutoFit();
      resetCameraCropToMax();
      updateCameraGuides();
      checkCameraHeaderCollision();
      updateZoomUI();
      return;
    }

    saveSettings();
    applyRenderSettings();
  }

  function handleZoomSelect() {
    isZoomAuto = false;
    const picked = parseFloat(document.getElementById('zoomSelect').value);
    if (!isLockedZoomStepReachable(picked)) {
      updateZoomUI();
      return;
    }
    rememberCameraModeManualZoom(picked);
    saveSettings();
    applyRenderSettings({ commitCameraCropY: true });
    commitCameraCropRememberedFromLayout();
    if (isCameraAspectLockOn()) applyLockedWidthToCurrentHeight();
    else forgetCameraAspectLockRemembered();
    if (isCameraMode) {
      updateCameraGuides();
      checkCameraHeaderCollision();
    }
  }

  const HEADER_SELECT_IDS = {
    col: { select: 'colSelect', wrap: 'colSelectWrap', trigger: 'colSelectTrigger', dropdown: 'colSelectDropdown', label: 'colSelectLabel' },
    zoom: { select: 'zoomSelect', wrap: 'zoomSelectWrap', trigger: 'zoomSelectTrigger', dropdown: 'zoomSelectDropdown', label: 'zoomSelectLabel' }
  };
  const ZOOM_VALUE_CLICK_KEY = 'zoom-select-value';
  // 一覧の項目を選んだ同じクリックで、列数／倍率／順位ボタンがもう一度開かないようにする
  let headerMenuPickGuard = false;
  function armHeaderMenuPickGuard() {
    headerMenuPickGuard = true;
    setTimeout(() => { headerMenuPickGuard = false; }, 0);
  }
  function parkHeaderDropdown(dropdown, home) {
    if (!dropdown) return;
    dropdown.classList.add('hidden');
    dropdown.removeAttribute('style');
    const park = () => {
      if (!dropdown.classList.contains('hidden')) return;
      if (home && dropdown.parentElement !== home) home.appendChild(dropdown);
    };
    if (dropdown.parentElement === document.body) setTimeout(park, 0);
    else park();
  }

  function syncHeaderSelectLabel(selectId) {
    const select = document.getElementById(selectId);
    const labelId = selectId === 'zoomSelect' ? 'zoomSelectLabel' : 'colSelectLabel';
    const label = document.getElementById(labelId);
    if (!select || !label) return;
    const opt = select.options[select.selectedIndex];
    label.textContent = opt ? opt.text : '';
    if (selectId === 'colSelect') syncColControls();
    invalidateHeaderBaseWidthsCache();
    const triggerId = selectId === 'zoomSelect' ? 'zoomSelectTrigger' : 'colSelectTrigger';
    requestAnimationFrame(() => fitBtnFitLabel(document.getElementById(triggerId)));
  }

  function isHeaderSelectOpen(kind) {
    const dropdown = document.getElementById(HEADER_SELECT_IDS[kind].dropdown);
    return dropdown && !dropdown.classList.contains('hidden');
  }

  function isAnyHeaderMenuOpen() {
    const sortDd = document.getElementById('sortMenuDropdown');
    return !!(sortDd && !sortDd.classList.contains('hidden'))
      || isHeaderSelectOpen('col')
      || isHeaderSelectOpen('zoom')
      || isCameraSizeMenuOpen();
  }

  function isCameraSizeMenuOpen() {
    const preset = document.getElementById('cameraSizePresetMenu');
    const aspect = document.getElementById('cameraSizeAspectMenu');
    const col = document.getElementById('cameraSizeColMenu');
    return (preset && !preset.classList.contains('hidden'))
      || (aspect && !aspect.classList.contains('hidden'))
      || (col && !col.classList.contains('hidden'));
  }

  function isCameraSizeModalOpen() {
    const modal = document.getElementById('cameraSizeModal');
    return !!(modal && !modal.classList.contains('hidden'));
  }

  function syncCameraSizeModalInteractionLock() {
    const open = isCameraSizeModalOpen();
    document.body.classList.toggle('is-camera-size-modal-open', open);
    if (!open) return;
    if (uiTipZone === 'camera-crop-hit' || uiTipZone === 'camera-frame-resizer' || uiTipZone === 'camera-frame-corner') {
      hideUiTip();
    }
    const line = document.getElementById('cameraCropLine');
    const resizer = document.getElementById('cameraFrameResizer');
    if (line) line.classList.remove('is-hovering');
    if (resizer) resizer.classList.remove('is-hovering');
    syncCameraGuideCornerAfterPaint();
  }

  function syncHeaderMenuBlocker() {
    const headerOn = !!(document.getElementById('sortMenuDropdown')
      && !document.getElementById('sortMenuDropdown').classList.contains('hidden'))
      || isHeaderSelectOpen('col')
      || isHeaderSelectOpen('zoom');
    const cameraOn = isCameraSizeMenuOpen();
    const on = headerOn || cameraOn;
    document.body.classList.toggle('is-header-menu-open', on);
    const pageBlocker = document.getElementById('headerMenuBlocker');
    if (pageBlocker) pageBlocker.classList.toggle('hidden', !headerOn);
    const cameraModal = document.getElementById('cameraSizeModal');
    if (cameraModal) cameraModal.classList.toggle('is-dd-open', cameraOn);
    const chromeBlocker = document.getElementById('cameraSizeChromeBlocker');
    const panelBlocker = document.getElementById('cameraSizePanelBlocker');
    if (chromeBlocker) chromeBlocker.classList.toggle('hidden', !cameraOn);
    if (panelBlocker) panelBlocker.classList.toggle('hidden', !cameraOn);
    if (on) resetUiTipState();
    syncPopupMenuFocusPoll();
  }

  let popupMenuFocusPoll = null;
  let popupMenuHadFocus = false;
  function syncPopupMenuFocusPoll() {
    const on = isAnyHeaderMenuOpen();
    if (on) {
      if (!popupMenuFocusPoll) {
        popupMenuHadFocus = document.hasFocus();
        popupMenuFocusPoll = setInterval(() => {
          if (document.hasFocus()) {
            popupMenuHadFocus = true;
            return;
          }
          if (popupMenuHadFocus) dismissOpenHeaderMenus();
        }, 100);
      }
    } else if (popupMenuFocusPoll) {
      clearInterval(popupMenuFocusPoll);
      popupMenuFocusPoll = null;
      popupMenuHadFocus = false;
    }
  }

  function dismissOpenHeaderMenus() {
    cancelDeferredClick(ZOOM_VALUE_CLICK_KEY);
    closeSortMenu();
    closeAllHeaderSelectMenus();
    closeCameraSizeDropdownMenus();
  }

  function closeHeaderSelectMenu(kind) {
    const ids = HEADER_SELECT_IDS[kind];
    const dropdown = document.getElementById(ids.dropdown);
    const wrap = document.getElementById(ids.wrap);
    if (!dropdown) return;
    parkHeaderDropdown(dropdown, wrap);
    syncHeaderMenuBlocker();
  }

  function closeAllHeaderSelectMenus() {
    closeHeaderSelectMenu('col');
    closeHeaderSelectMenu('zoom');
  }

  function bindHeaderMenuItemHover(item) {
    if (!item || item._headerHoverBound) return;
    item._headerHoverBound = true;
    item.addEventListener('mouseenter', () => {
      if (item.disabled) return;
      const menu = item.closest('.sort-menu-dropdown');
      if (!menu) return;
      menu.querySelectorAll('.sort-menu-item').forEach(el => {
        if (el.disabled) {
          el.classList.remove('active');
          return;
        }
        el.classList.toggle('active', el === item);
      });
    });
  }

  /** 共有プルダウン行のホバー追従を束ねる（ソート／列数／倍率／撮影設定） */
  function prepareSharedDropdownMenu(menu) {
    if (!menu) return;
    menu.querySelectorAll('.sort-menu-item').forEach(bindHeaderMenuItemHover);
  }

  function fillHeaderSelectDropdown(kind) {
    const ids = HEADER_SELECT_IDS[kind];
    const select = document.getElementById(ids.select);
    const dropdown = document.getElementById(ids.dropdown);
    if (!select || !dropdown) return;
    const current = select.value;
    dropdown.innerHTML = '';
    [...select.options].forEach(opt => {
      if (opt.value === 'dynamic' || opt.hidden) return;
      const btn = document.createElement('button');
      const selected = opt.value === current;
      const zoomVal = kind === 'zoom' ? parseFloat(opt.value) : NaN;
      const unreachable = kind === 'zoom' && Number.isFinite(zoomVal)
        && !selected && !isLockedZoomStepReachable(zoomVal);
      btn.type = 'button';
      btn.disabled = unreachable;
      btn.className = 'sort-menu-item' + (selected ? ' active' : '');
      if (unreachable) btn.setAttribute('aria-disabled', 'true');
      btn.textContent = opt.textContent;
      if (!unreachable) {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          armHeaderMenuPickGuard();
          if (kind === 'zoom') cancelDeferredClick(ZOOM_VALUE_CLICK_KEY);
          closeHeaderSelectMenu(kind);
          select.value = opt.value;
          if (kind === 'zoom') handleZoomSelect();
          else handleManualChange();
        });
      }
      dropdown.appendChild(btn);
    });
    prepareSharedDropdownMenu(dropdown);
  }

  function openHeaderSelectMenu(kind) {
    if (headerMenuPickGuard) return;
    closeSortMenu();
    closeCameraSizeDropdownMenus();
    const other = kind === 'zoom' ? 'col' : 'zoom';
    closeHeaderSelectMenu(other);
    const ids = HEADER_SELECT_IDS[kind];
    const trigger = document.getElementById(ids.trigger);
    const dropdown = document.getElementById(ids.dropdown);
    if (!trigger || !dropdown) return;
    fillHeaderSelectDropdown(kind);
    const rect = trigger.getBoundingClientRect();
    document.body.appendChild(dropdown);
    dropdown.style.left = rect.left + 'px';
    dropdown.style.top = rect.bottom + 'px';
    dropdown.style.width = rect.width + 'px';
    dropdown.classList.remove('hidden');
    syncHeaderMenuBlocker();
  }

  function toggleColSelectMenu(e) {
    if (headerMenuPickGuard) return;
    if (e) e.stopPropagation();
    cancelDeferredClick(ZOOM_VALUE_CLICK_KEY);
    if (isHeaderSelectOpen('col')) {
      closeHeaderSelectMenu('col');
      return;
    }
    openHeaderSelectMenu('col');
  }

  function toggleZoomSelectMenu(e) {
    if (headerMenuPickGuard) return;
    if (e) e.stopPropagation();
    cancelDeferredClick(ZOOM_VALUE_CLICK_KEY);
    if (isHeaderSelectOpen('zoom')) {
      closeHeaderSelectMenu('zoom');
      return;
    }
    openHeaderSelectMenu('zoom');
