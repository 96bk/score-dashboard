  function getCameraSizeWidthRangePx() {
    return {
      min: Math.round(CAMERA_WIDTH_MIN) * CAMERA_CAPTURE_SCALE,
      max: CAMERA_SIZE_WIDTH_MAX_PX
    };
  }

  function getCameraSizeWidthMaxScreenPx() {
    return getCameraSizeWidthRangePx().max / CAMERA_CAPTURE_SCALE;
  }

  // 撮影設定の「640 - 5760」と同じ。画面pxではなくキャプチャpxで見る
  function isCameraFrameWidthAtSizeRangeLimit(screenW) {
    if (!Number.isFinite(screenW)) return false;
    const captureW = Math.round(screenW) * CAMERA_CAPTURE_SCALE;
    const r = getCameraSizeWidthRangePx();
    return captureW <= r.min || captureW >= r.max;
  }

  // 本番DOMの倍率は触らず、非表示クローン上で指定倍率の撮影高さを測る
  // （点線の free 位置ではなく、カード下端+24＝コンテンツ最大）
  // frameWidthPx: 省略時は今の撮影幅。既定プリセットは画面いっぱい幅を渡す。
  function measureCameraCaptureHeightPxAtZoom(targetZoom, frameWidthPx, forceClone) {
    const z = Math.max(0.5, Math.min(1.5, Number(targetZoom) || 1));
    const frameW = Math.max(1, Math.round(
      frameWidthPx != null ? frameWidthPx : getCameraCaptureWidth()
    ));
    const liveW = Math.round(getCameraCaptureWidth());
    if (!forceClone && Math.abs(z - currentZoom) < 0.0005 && Math.abs(frameW - liveW) < 0.5) {
      return Math.round(Math.max(1, getCameraContentMaxY())) * CAMERA_CAPTURE_SCALE;
    }
    const grid = document.getElementById('playerGrid');
    const mainArea = document.getElementById('mainArea');
    if (!grid || !mainArea) {
      return Math.round(Math.max(1, getCameraContentMaxY())) * CAMERA_CAPTURE_SCALE;
    }

    const adj = getCaptureAdjZoom(z);
    const invZ = 1 / z;
    const invAdj = 1 / (z * adj);

    const shell = document.createElement('div');
    shell.className = 'app-container camera-mode';
    shell.setAttribute('aria-hidden', 'true');
    shell.style.cssText = [
      'position:fixed',
      'left:-100000px',
      'top:0',
      `width:${frameW}px`,
      'height:auto',
      'display:block',
      'visibility:hidden',
      'pointer-events:none',
      'z-index:-1',
      'overflow:visible',
      'background:transparent'
    ].join(';');
    shell.style.setProperty('--zoom-level', String(z));
    shell.style.setProperty('--inv-zoom', invZ.toFixed(3));
    shell.style.setProperty('--adj-zoom', adj.toFixed(3));
    shell.style.setProperty('--inv-adj-zoom', invAdj.toFixed(3));
    applyCardSpacingVars(shell, z, adj, invAdj);

    const wrapper = document.createElement('div');
    wrapper.className = 'grid-wrapper';
    wrapper.style.cssText = 'overflow:visible;height:auto;position:relative;';

    const clone = grid.cloneNode(true);
    clone.removeAttribute('id');
    clone.style.transition = 'none';

    wrapper.appendChild(clone);
    shell.appendChild(wrapper);
    document.body.appendChild(shell);

    let captureH = 1;
    try {
      void shell.offsetHeight;
      const hostRect = wrapper.getBoundingClientRect();
      let maxBottom = 0;
      clone.querySelectorAll('.player-card:not(.is-hidden-dragging)').forEach(card => {
        const rect = card.getBoundingClientRect();
        maxBottom = Math.max(maxBottom, rect.bottom - hostRect.top);
      });
      captureH = Math.max(1, maxBottom + CAMERA_EDGE_PADDING);
    } finally {
      shell.remove();
    }
    return Math.round(captureH) * CAMERA_CAPTURE_SCALE;
  }

  function getCameraSizeHeightRangePx() {
    const at50 = measureCameraCaptureHeightPxAtZoom(0.5);
    const at150 = measureCameraCaptureHeightPxAtZoom(1.5);
    return {
      min: Math.min(at50, at150),
      max: Math.max(at50, at150)
    };
  }

  function getCameraSizeUnlockedHeightRangeScreen() {
    const cache = getCameraSizePresetMenuCache();
    const scale = CAMERA_CAPTURE_SCALE;
    return {
      min: cache.heightMin / scale,
      max: cache.heightMax / scale
    };
  }

  function getCameraSizeModalLockRatio() {
    if (!cameraSizeAspectLocked) return 0;
    const pair = readCameraSizeAspectFieldPair();
    if (pair && pair.aw > 0 && pair.ah > 0) return pair.aw / pair.ah;
    if (isCameraAspectLockOn()) return getCameraLockRatio();
    const size = getCameraCapturePxSize();
    if (size.width > 0 && size.height > 0) return size.width / size.height;
    return 0;
  }

  function getCameraSizeModalDimRangesScreen() {
    const wFree = {
      min: CAMERA_WIDTH_MIN,
      max: Math.round(getCameraSizeWidthMaxScreenPx())
    };
    const hFree = getCameraSizeUnlockedHeightRangeScreen();
    const r = getCameraSizeModalLockRatio();
    if (!(r > 0)) {
      return { w: wFree, h: hFree, locked: false, r: 0 };
    }
    const atHmin = roundLockedPairFromBase('h', hFree.min, r);
    const atHmax = roundLockedPairFromBase('h', hFree.max, r);
    const atWmin = roundLockedPairFromBase('w', wFree.min, r);
    const atWmax = roundLockedPairFromBase('w', wFree.max, r);
    const wLo = Math.max(wFree.min, Math.min(atHmin.w, atHmax.w));
    const wHi = Math.min(wFree.max, Math.max(atHmin.w, atHmax.w));
    const hLo = Math.max(hFree.min, Math.min(atWmin.h, atWmax.h));
    const hHi = Math.min(hFree.max, Math.max(atWmin.h, atWmax.h));
    return {
      w: { min: Math.min(wLo, wHi), max: Math.max(wLo, wHi) },
      h: { min: Math.min(hLo, hHi), max: Math.max(hLo, hHi) },
      locked: true,
      r
    };
  }

  function clampCameraSizeScreen(n, lo, hi) {
    const x = Math.round(Number(n));
    if (!Number.isFinite(x)) return x;
    if (!(lo <= hi)) return x;
    return Math.max(lo, Math.min(hi, x));
  }

  function updateCameraSizeRangeLabels() {
    const widthRange = document.getElementById('cameraSizeWidthRange');
    const heightRange = document.getElementById('cameraSizeHeightRange');
    const ranges = getCameraSizeModalDimRangesScreen();
    const scale = CAMERA_CAPTURE_SCALE;
    const wMin = Math.round(ranges.w.min) * scale;
    const wMax = Math.round(ranges.w.max) * scale;
    const hMin = Math.round(ranges.h.min) * scale;
    const hMax = Math.round(ranges.h.max) * scale;
    if (widthRange) widthRange.textContent = `${wMin} - ${wMax}`;
    if (heightRange) heightRange.textContent = `${hMin} - ${hMax}`;
  }

  function isCameraCaptureAtDefault() {
    if (!isCameraMode || !isZoomAuto) return false;
    if (cameraFrameWidth != null) return false;
    return isCameraCropAtDefaultMax();
  }

  function isCameraSizeCaptureAtUntouched() {
    if (!isCameraSizeModalOpen()) return false;
    if (cameraSizeModalUntouchedKind === 'default') return isCameraCaptureAtDefault();
    if (cameraSizeModalUntouchedKind !== 'fixed') return false;
    const size = getCameraCapturePxSize();
    return size.width === cameraSizeModalUntouchedW && size.height === cameraSizeModalUntouchedH;
  }

  function getCameraSizeExpectedFormSnapshot() {
    const size = getCameraCapturePxSize();
    const aspect = formatCameraSizeAspectDisplay(size.width, size.height);
    return JSON.stringify({
      aspectW: cameraSizeAspectFieldValue(aspect.w),
      aspectH: cameraSizeAspectFieldValue(aspect.h),
      width: digitsOnlyCameraSizeValue(size.width),
      height: digitsOnlyCameraSizeValue(size.height),
      locked: !!cameraSizeModalUntouchedLocked
    });
  }

  function syncCameraSizeModalLiveState() {
    if (!isCameraSizeModalOpen()) return;
    const size = getCameraCapturePxSize();
    const prevW = cameraSizeModalLiveSyncW;
    const prevH = cameraSizeModalLiveSyncH;
    if (size.width !== prevW || size.height !== prevH) {
      const widthInput = document.getElementById('cameraSizeWidthInput');
      const heightInput = document.getElementById('cameraSizeHeightInput');
      if (widthInput && !cameraSizeWidthDrafting) widthInput.value = String(size.width);
      if (heightInput && !cameraSizeHeightDrafting) heightInput.value = String(size.height);
      const locked = cameraSizeAspectLocked || isCameraAspectLockOn();
      if (!locked && !cameraSizeAspectDrafting) {
        const nextAspect = formatCameraSizeAspectDisplay(size.width, size.height);
        const prevAspect = (prevW > 0 && prevH > 0)
          ? formatCameraSizeAspectDisplay(prevW, prevH)
          : null;
        if (!prevAspect || prevAspect.w !== nextAspect.w || prevAspect.h !== nextAspect.h) {
          syncCameraSizeAspectFieldsFromPx(size.width, size.height);
          syncCameraSizeAspectMenuActive();
        }
      }
      cameraSizeModalLiveSyncW = size.width;
      cameraSizeModalLiveSyncH = size.height;
    }
    updateCameraSizeActionButtons();
  }

  function gcdInt(a, b) {
    let x = Math.abs(a | 0);
    let y = Math.abs(b | 0);
    while (y) {
      const t = y;
      y = x % y;
      x = t;
    }
    return x || 1;
  }

  function reduceAspectRatio(w, h) {
    const ww = Math.max(1, Math.round(Number(w) || 1));
    const hh = Math.max(1, Math.round(Number(h) || 1));
    const g = gcdInt(ww, hh);
    return { w: Math.round(ww / g), h: Math.round(hh / g) };
  }

  // 表示専用。2桁四捨五入が整数に乗っても、実値がその整数でなければ整数表示にしない
  // （1.999 → 2 ではなく 1.99。倍率の 10% 刻みと同じ）
  function formatCameraSizeAspectDecimal(n) {
    const x = Number(n);
    if (!Number.isFinite(x) || x <= 0) return '0';
    const rounded = Math.round(x * 100) / 100;
    const roundedInt = Math.round(rounded);
    let shown = rounded;
    if (Math.abs(rounded - roundedInt) < 1e-9 && Math.abs(x - roundedInt) >= 1e-9) {
      shown = x > roundedInt ? roundedInt + 0.01 : roundedInt - 0.01;
    }
    return shown.toFixed(2).replace(/\.?0+$/, '') || '0';
  }

  function formatCameraSizeAspectDisplay(width, height) {
    const ww = Math.max(1, Math.round(Number(width) || 1));
    const hh = Math.max(1, Math.round(Number(height) || 1));
    const reduced = reduceAspectRatio(ww, hh);
    // 1〜20 の整数比は、実pxがちょうどその比のときだけ
    if (reduced.w <= 20 && reduced.h <= 20) {
      return { w: String(reduced.w), h: String(reduced.h) };
    }
    if (ww >= hh) {
      return { w: formatCameraSizeAspectDecimal(ww / hh), h: '1' };
    }
    return { w: '1', h: formatCameraSizeAspectDecimal(hh / ww) };
  }

  function getCameraCaptureAspectRatioLabel() {
    if (cameraAspectLockOn && cameraLockLabel) return cameraLockLabel;
    const size = getCameraCapturePxSize();
    const aspect = formatCameraSizeAspectDisplay(size.width, size.height);
    return `${aspect.w} : ${aspect.h}`;
  }

  function isCameraAspectLockOn() {
    return !!cameraAspectLockOn && cameraLockAw > 0 && cameraLockAh > 0;
  }

  function isCameraSizeLockActive() {
    return isCameraAspectLockOn() || !!(isCameraSizeModalOpen() && cameraSizeAspectLocked);
  }

  function pinCameraFrameWidthIfFollow() {
    if (cameraFrameWidth != null) return;
    cameraFrameWidth = Math.round(getCameraDisplayedFrameWidth());
    applyCameraFrameWidth();
  }

  function ensureCameraZoomAutoOffIfLocked() {
    if (!isZoomAuto || !isCameraSizeLockActive()) return false;
    isZoomAuto = false;
    pinCameraFrameWidthIfFollow();
    commitCameraCropRememberedFromLayout();
    rememberCameraModeManualZoom();
    updateZoomUI();
    return true;
  }

  // 置いた撮影pxを残し、その実寸の比で鎖だけ更新する（計算機で出し直さない）
  function adoptCameraSizeLockFromCurrentCapture() {
    if (!isCameraSizeLockActive()) return;
    isZoomAuto = false;
    pinCameraFrameWidthIfFollow();
    commitCameraCropRememberedFromLayout();
    rememberCameraModeManualZoom();
    const size = getCameraCapturePxSize();
    const aspect = formatCameraSizeAspectDisplay(size.width, size.height);
    const aw = parseFloat(aspect.w);
    const ah = parseFloat(aspect.h);
    if (isCameraAspectLockOn() && aw > 0 && ah > 0) {
      cameraLockAw = aw;
      cameraLockAh = ah;
      if (!(cameraLockAw > 0)) cameraLockAw = 1;
      if (!(cameraLockAh > 0)) cameraLockAh = 1;
      cameraLockLabel = `${aspect.w} : ${aspect.h}`;
      rememberCameraAspectLockSnapshot();
      invalidateCameraLockColumnCaches();
    }
    updateZoomUI();
    if (isCameraMode) {
      updateCameraGuides();
      paintLockedSnapUi();
      updateCameraResetDefaultBtn();
      checkCameraHeaderCollision();
    }
  }

  function getCameraLockRatio() {
    return cameraLockAw / cameraLockAh;
  }

  // 角の四捨五入基準：比の小さい方。同じ（1:1）は横
  function isCameraLockWidthBaseA() {
    if (!(cameraLockAh > 0)) return true;
    return !(cameraLockAw > cameraLockAh);
  }

  // 同点フィットは片方の吸着だけ（両軸独立の 16 だと比が先に片軸を離す）。
  // 比の長い方（進みの速い軸）。四捨五入（小さい方）とは逆。1:1 は横
  function isCameraLockBothFitWidthSnap() {
    if (!(cameraLockAh > 0)) return true;
    return !(cameraLockAh > cameraLockAw);
  }

  function isLockedExactPair(w, h) {
    const r = getCameraLockRatio();
    const wi = Math.round(w);
    const hi = Math.round(h);
    if (!(r > 0) || !(wi > 0) || !(hi > 0)) return false;
    return Math.round(hi * r) === wi && Math.round(wi / r) === hi;
  }

  function invalidateLockedExactStepPairs() {
    cameraLockExactStepPairs = null;
    cameraLockExactStepSkipW = null;
    cameraLockExactStepSkipH = null;
    cameraLockFitCollectKey = null;
  }

  function lockedExactStepKey(pair) {
    if (!pair) return '';
    return pair.w + 'x' + pair.h;
  }

  function lockedFitNearValue(list, value) {
    if (!list || !list.length || !Number.isFinite(value)) return null;
    let best = null;
    let bestD = 0.5;
    for (let i = 0; i < list.length; i++) {
      const d = Math.abs(list[i] - value);
      if (d <= bestD) {
        bestD = d;
        best = list[i];
      }
    }
    return best;
  }

  function lockedFitPushUnique(list, value) {
    if (!Number.isFinite(value) || !(value > 0)) return;
    if (lockedFitNearValue(list, value) != null) return;
    list.push(value);
  }

  function getLockedFitCollectKey() {
    if (!isCameraAspectLockOn()) return '';
    const r = getCameraLockRatio();
    const maxRangeW = getCameraSizeWidthRangePx().max / CAMERA_CAPTURE_SCALE;
    const { minH, maxH } = getLockedReachableHeight();
    const walls = getLockedCornerLiveWalls();
    return [
      r, CAMERA_WIDTH_MIN, maxRangeW,
      minH, maxH,
      walls.maxW, walls.screenH
    ].join('\t');
  }

  function collectLockedFitLists() {
    const fitW = [];
    const fitH = [];
    const minW = CAMERA_WIDTH_MIN;
    const maxW = getCameraSizeWidthRangePx().max / CAMERA_CAPTURE_SCALE;
    const { minH, maxH } = getLockedReachableHeight();
    const walls = getLockedCornerLiveWalls();
    const wStep = CAMERA_WIDTH_STEP;
    const hStep = CAMERA_HEIGHT_STEP;
    const capW = Math.min(maxW, LOCKED_EXACT_STEP_LOOP_MAX);
    for (let w = wStep; w <= capW; w += wStep) {
      if (w >= minW - 0.5 && w <= maxW + 0.5) lockedFitPushUnique(fitW, w);
    }
    if (walls.maxW >= minW - 0.5) lockedFitPushUnique(fitW, walls.maxW);
    const capH = Math.min(maxH, LOCKED_EXACT_STEP_LOOP_MAX);
    for (let h = hStep; h <= capH; h += hStep) {
      if (h >= minH - 0.5 && h <= maxH + 0.5) lockedFitPushUnique(fitH, h);
    }
    if (walls.screenH > 0) lockedFitPushUnique(fitH, walls.screenH);
    return { fitW: fitW, fitH: fitH };
  }

  // フィットリストは80と画面端だけ。限界はクランプと実線のみ（リストに載せない）。
  // 横計算の縦が縦リストに0.5px以内ならその縦を無効。逆も同じ。リストに無い丸めは無視。
  // 双方から同じ w×h だけ同点（フィット＝長い軸、計算＝横）。
  function collectLockedExactStepData() {
    const empty = { pairs: [], skipW: [], skipH: [] };
    const r = getCameraLockRatio();
    if (!(r > 0) || !isCameraAspectLockOn()) return empty;
    const { fitW, fitH } = collectLockedFitLists();
    const fromW = [];
    const fromH = [];
    const skipW = [];
    const skipH = [];
    for (let i = 0; i < fitW.length; i++) {
      const srcW = fitW[i];
      const size = { w: srcW, h: Math.round(srcW / r) };
      const hitH = lockedFitNearValue(fitH, size.h);
      if (hitH == null) continue;
      fromW.push({ w: srcW, h: hitH });
      lockedFitPushUnique(skipH, hitH);
    }
    for (let i = 0; i < fitH.length; i++) {
      const srcH = fitH[i];
      const size = { w: Math.round(srcH * r), h: srcH };
      const hitW = lockedFitNearValue(fitW, size.w);
      if (hitW == null) continue;
      fromH.push({ w: hitW, h: srcH });
      lockedFitPushUnique(skipW, hitW);
    }
    const pairs = [];
    for (let i = 0; i < fromW.length; i++) {
      const a = fromW[i];
      let mutual = false;
      for (let j = 0; j < fromH.length; j++) {
        const b = fromH[j];
        if (Math.abs(a.w - b.w) <= 0.5 && Math.abs(a.h - b.h) <= 0.5) {
          mutual = true;
          break;
        }
      }
      if (!mutual) continue;
      pairs.push({ w: a.w, h: a.h, base: 'w' });
    }
    return { pairs: pairs, skipW: skipW, skipH: skipH };
  }

  function ensureLockedExactStepPairs() {
    const key = getLockedFitCollectKey();
    if (cameraLockExactStepPairs && cameraLockFitCollectKey === key) {
      return cameraLockExactStepPairs;
    }
    const data = collectLockedExactStepData();
    cameraLockFitCollectKey = key;
    cameraLockExactStepPairs = data.pairs;
    cameraLockExactStepSkipW = data.skipW;
    cameraLockExactStepSkipH = data.skipH;
    return cameraLockExactStepPairs;
  }

  function isLockedFitValueSkipped(skipList, value) {
    return lockedFitNearValue(skipList, value) != null;
  }

  function lockedExactStepPairNear(w, h) {
    ensureLockedExactStepPairs();
    const pairs = cameraLockExactStepPairs;
    if (!pairs || !Number.isFinite(w) || !Number.isFinite(h)) return null;
    for (let i = 0; i < pairs.length; i++) {
      const p = pairs[i];
      if (Math.abs(p.w - w) <= 0.5 && Math.abs(p.h - h) <= 0.5) return p;
    }
    return null;
  }

  function isLockedExactStepPairOnWidth(w) {
    ensureLockedExactStepPairs();
    const pairs = cameraLockExactStepPairs;
    if (!pairs || !Number.isFinite(w)) return false;
    for (let i = 0; i < pairs.length; i++) {
      if (Math.abs(pairs[i].w - w) <= 0.5) return true;
    }
    return false;
  }

  function isLockedExactStepPairOnHeight(h) {
    ensureLockedExactStepPairs();
    const pairs = cameraLockExactStepPairs;
    if (!pairs || !Number.isFinite(h)) return false;
    for (let i = 0; i < pairs.length; i++) {
      if (Math.abs(pairs[i].h - h) <= 0.5) return true;
    }
    return false;
  }

  // 角の単体フィットから外す（完全同点の軸＋片道の結果側）
  function isLockedExactStepWidth(w) {
    ensureLockedExactStepPairs();
    return isLockedFitValueSkipped(cameraLockExactStepSkipW, w);
  }

  function isLockedExactStepHeight(h) {
    ensureLockedExactStepPairs();
    return isLockedFitValueSkipped(cameraLockExactStepSkipH, h);
  }

  // 点線の単体。完全同点は残す（計算が一致する）。片道の結果側だけ踏まない
  function isLockedOneWayExactStepWidth(w) {
    if (!isLockedExactStepWidth(w)) return false;
    return !isLockedExactStepPairOnWidth(w);
  }

  function isLockedOneWayExactStepHeight(h) {
    if (!isLockedExactStepHeight(h)) return false;
    return !isLockedExactStepPairOnHeight(h);
  }

  function lockedCornerExactStepSnapOf(pair) {
    if (!pair) return null;
    if (isCameraLockBothFitWidthSnap()) {
      return { axis: 'w', type: 'step', value: pair.w, both: true, pairW: pair.w, pairH: pair.h };
    }
    return { axis: 'h', type: 'step', value: pair.h, both: true, pairW: pair.w, pairH: pair.h };
  }

  function applyLockedRatioRoundedSize(size) {
    if (!size) return;
    commitLockedCornerCalculatorSize(size.w, size.h);
  }

  function applyLockedFittedAxisSize(axis, value) {
    if (axis === 'w') applyLockedFromWidth(value, false);
    else applyLockedFromHeight(value, false);
  }

  // 洗い出し済みのペア。snap の pairW/pairH からの復元用
  function lockedExactStepPairFor(pair) {
    if (!pair) return null;
    return lockedExactStepPairNear(pair.w, pair.h);
  }

  // 完全同点の着地は横計算機。フィットは比の大きい方。画面端ならピン
  function applyLockedExactStepPair(pair) {
    if (!pair) return;
    const stored = lockedExactStepPairFor(pair) || pair;
    const w = stored.w;
    const walls = getLockedCornerLiveWalls();
    const atScreen = walls.maxW > 0 && Math.abs(w - walls.maxW) <= 0.5;
    applyLockedFromWidth(atScreen ? walls.maxW : w, atScreen);
  }

  function lockedSnapIsExact(snap) {
    if (!snap) return false;
    if (snap.both && snap.pairW != null && snap.pairH != null) {
      return isLockedExactPair(snap.pairW, snap.pairH);
    }
    const r = getCameraLockRatio();
    if (snap.axis === 'h') return isLockedExactPair(Math.round(snap.value * r), snap.value);
    return isLockedExactPair(snap.value, Math.round(snap.value / r));
  }

  function clearCameraAspectLock(options) {
    if (!(options && options.keepRemembered)) cameraLockRemembered = null;
    cameraAspectLockOn = false;
    cameraLockAw = 0;
    cameraLockAh = 0;
    invalidateLockedExactStepPairs();
    cameraLockLabel = '';
    cameraLockDragging = false;
    cameraLockKind = null;
    cameraLockPointerId = null;
    cameraLockMoved = false;
    cameraLockSnap = null;
    cameraLockLastAxis = null;
    cameraLockAppliedW = null;
    cameraLockAppliedH = null;
    cameraLockStartW = 0;
    cameraLockStartH = 0;
    cameraLockWallForW = null;
    cameraLockWallMinH = null;
    cameraLockWallMaxH = null;
    cameraLockCornerGrow = null;
    cameraLockFollowH = null;
    cameraLockLastClientY = null;
    cameraLockLastClientX = null;
    resetLockedCropEdgeState();
    resetLockedWidthEdgeState();
    resetLockedCornerEdgeState();
    if (!(options && options.keepCrop)) resetCameraCropToMax();
    if (cameraLockZoomRaf) {
      cancelAnimationFrame(cameraLockZoomRaf);
      cameraLockZoomRaf = null;
    }
  }

  function rememberCameraAspectLockSnapshot() {
    if (!isCameraAspectLockOn()) return;
    cameraLockRemembered = {
      aw: cameraLockAw,
      ah: cameraLockAh,
      label: cameraLockLabel
    };
  }

  function captureCameraAspectLockSnapshot() {
    const remembered = cameraLockRemembered
      ? { aw: cameraLockRemembered.aw, ah: cameraLockRemembered.ah, label: cameraLockRemembered.label }
      : null;
    return {
      on: isCameraAspectLockOn(),
      aw: cameraLockAw,
      ah: cameraLockAh,
      label: cameraLockLabel,
      remembered
    };
  }

  function restoreCameraAspectLockSnapshot(lock) {
    if (lock && lock.on && lock.aw > 0 && lock.ah > 0) {
      cameraLockAw = lock.aw;
      cameraLockAh = lock.ah;
      if (!(cameraLockAw > 0)) cameraLockAw = 1;
      if (!(cameraLockAh > 0)) cameraLockAh = 1;
      cameraLockLabel = lock.label || `${cameraLockAw} : ${cameraLockAh}`;
      cameraAspectLockOn = true;
      cameraLockRemembered = lock.remembered && lock.remembered.aw > 0
        ? { aw: lock.remembered.aw, ah: lock.remembered.ah, label: lock.remembered.label }
        : { aw: cameraLockAw, ah: cameraLockAh, label: cameraLockLabel };
      invalidateCameraLockColumnCaches();
      ensureCameraZoomAutoOffIfLocked();
    } else {
      cameraLockRemembered = lock && lock.remembered && lock.remembered.aw > 0
        ? { aw: lock.remembered.aw, ah: lock.remembered.ah, label: lock.remembered.label }
        : null;
      clearCameraAspectLock({ keepRemembered: !!cameraLockRemembered, keepCrop: true });
    }
    syncCameraAspectLockPadlockUi();
    updateZoomUI();
    if (isCameraMode) {
      updateCameraGuides();
      paintLockedSnapUi();
      updateCameraResetDefaultBtn();
      checkCameraHeaderCollision();
    }
  }

  function forgetCameraAspectLockRemembered() {
    cameraLockRemembered = null;
  }

  function invalidateCameraLockColumnCaches() {
    invalidateLockedExactStepPairs();
    cameraSizePresetMenuCache = null;
    cameraLockWallForW = null;
    cameraLockWallMinH = null;
    cameraLockWallMaxH = null;
    cameraLockAppliedW = null;
    cameraLockAppliedH = null;
  }

  function isCameraRememberedCaptureHeightHeld() {
    if (cameraCropRememberedY == null || !Number.isFinite(cameraCropRememberedY)) return false;
    const targetH = getCameraDisplayedHeightPx(cameraCropRememberedY);
    return getCameraCapturePxSize().height === targetH;
  }

  function suspendCameraAspectLockKeepRemembered() {
    if (!cameraLockRemembered) rememberCameraAspectLockSnapshot();
    clearCameraAspectLock({ keepRemembered: true, keepCrop: true });
    syncCameraAspectLockPadlockUi();
    if (isCameraMode) {
      updateCameraGuides();
      paintLockedSnapUi();
      updateCameraResetDefaultBtn();
      checkCameraHeaderCollision();
    }
  }

  function restoreCameraAspectLockRemembered() {
    const snap = cameraLockRemembered;
    if (!snap || !(snap.aw > 0) || !(snap.ah > 0)) return;
    cameraLockAw = snap.aw;
    cameraLockAh = snap.ah;
    if (!(cameraLockAw > 0)) cameraLockAw = 1;
    if (!(cameraLockAh > 0)) cameraLockAh = 1;
    cameraLockLabel = snap.label || `${cameraLockAw} : ${cameraLockAh}`;
    cameraAspectLockOn = true;
    invalidateCameraLockColumnCaches();
    syncCameraAspectLockPadlockUi();
    if (isCameraMode) {
      updateCameraGuides();
      paintLockedSnapUi();
      updateCameraResetDefaultBtn();
      checkCameraHeaderCollision();
    }
  }

  function forgetCameraSizeColumnLockPause() {
    cameraSizeLockPausedByColumn = false;
    cameraSizeAspectFieldsPausedByColumn = null;
  }

  function writeCameraSizeAspectFieldStrings(w, h) {
    const aspectW = document.getElementById('cameraSizeAspectW');
    const aspectH = document.getElementById('cameraSizeAspectH');
    if (aspectW) aspectW.value = w;
    if (aspectH) aspectH.value = h;
  }

  function writeCameraSizeAspectFieldsIfChanged(w, h) {
    const curW = cameraSizeAspectFieldValue(document.getElementById('cameraSizeAspectW')?.value);
    const curH = cameraSizeAspectFieldValue(document.getElementById('cameraSizeAspectH')?.value);
    if (curW === String(w) && curH === String(h)) return false;
    writeCameraSizeAspectFieldStrings(w, h);
    syncCameraSizeAspectMenuActive();
    return true;
  }

  function cameraSizeAspectStringsFromLiveLock() {
    const parts = String(cameraLockLabel || '').split(':');
    if (parts.length === 2) {
      const w = cameraSizeAspectFieldValue(parts[0]);
      const h = cameraSizeAspectFieldValue(parts[1]);
      if (w && h) return { w, h };
    }
    return formatRequestedCameraSizeAspect(cameraLockAw, cameraLockAh);
  }

  // 列数あと始末：鎖OFFのとき、高さ維持できない列は今のpx、戻れる列は錠の比
  function catchUpCameraSizeAspectFieldsAfterLockSettle(held) {
    if (cameraSizeAspectDrafting || cameraSizeAspectLocked) return;
    if (isCameraAspectLockOn()) {
      if (!held) return;
      const shown = cameraSizeAspectStringsFromLiveLock();
      if (shown) writeCameraSizeAspectFieldsIfChanged(shown.w, shown.h);
      return;
    }
    const size = getCameraCapturePxSize();
    const aspect = formatCameraSizeAspectDisplay(size.width, size.height);
    writeCameraSizeAspectFieldsIfChanged(aspect.w, aspect.h);
  }

  function syncCameraSizeModalChainAfterLockSettle() {
    if (!isCameraSizeModalOpen() || isZoomAuto) return;
    const held = isCameraRememberedCaptureHeightHeld();
    let paused = false;
    let restoring = false;
    if (cameraSizeAspectLocked) {
      if (!held) {
        cameraSizeAspectFieldsPausedByColumn = {
          w: cameraSizeAspectFieldValue(document.getElementById('cameraSizeAspectW')?.value),
          h: cameraSizeAspectFieldValue(document.getElementById('cameraSizeAspectH')?.value)
        };
        cameraSizeAspectLocked = false;
        cameraSizeLockPausedByColumn = true;
        paused = true;
      }
    } else if (held && cameraSizeLockPausedByColumn) {
      cameraSizeAspectLocked = true;
      cameraSizeLockPausedByColumn = false;
      restoring = true;
    }
    if (paused || restoring) {
      syncCameraSizeLockButtonUi();
      if (restoring) {
        const snap = cameraSizeAspectFieldsPausedByColumn;
        cameraSizeAspectFieldsPausedByColumn = null;
        if (snap) writeCameraSizeAspectFieldStrings(snap.w, snap.h);
        syncCameraSizeAspectMenuActive();
      } else {
        const size = getCameraCapturePxSize();
        const aspect = formatCameraSizeAspectDisplay(size.width, size.height);
        writeCameraSizeAspectFieldStrings(aspect.w, aspect.h);
        syncCameraSizeAspectMenuActive();
      }
      updateCameraSizeRangeLabels();
    }
    catchUpCameraSizeAspectFieldsAfterLockSettle(held);
    updateCameraSizeActionButtons();
  }

  function syncCameraLockAfterRememberedHeightSettle() {
    if (!isCameraMode || isZoomAuto) return;
    const held = isCameraRememberedCaptureHeightHeld();
    if (isCameraAspectLockOn()) {
      rememberCameraAspectLockSnapshot();
      if (held) {
        invalidateCameraLockColumnCaches();
        paintLockedSnapUi();
        syncCameraSizeModalChainAfterLockSettle();
        return;
      }
      suspendCameraAspectLockKeepRemembered();
      syncCameraSizeModalChainAfterLockSettle();
      return;
    }
    if (held && cameraLockRemembered) restoreCameraAspectLockRemembered();
    syncCameraSizeModalChainAfterLockSettle();
  }

  function syncCameraAspectLockPadlockUi() {
    const btn = document.getElementById('cameraSizePadlockBtn');
    if (!btn) return;
    const locked = isCameraAspectLockOn();
    btn.classList.toggle('is-locked', locked);
    btn.setAttribute('aria-pressed', locked ? 'true' : 'false');
    btn.setAttribute('aria-label', locked ? '縦横比の固定を解除' : '縦横比を固定');
  }

  function setCameraAspectLockLive(locked, requested) {
    if (!locked && cameraLockDragging) endLockedGuideDrag(null);
    if (locked) {
      let aspect = null;
      if (requested && requested.aw > 0 && requested.ah > 0) {
        const shownW = cameraSizeAspectFieldValue(
          document.getElementById('cameraSizeAspectW')?.value
        );
        const shownH = cameraSizeAspectFieldValue(
          document.getElementById('cameraSizeAspectH')?.value
        );
        aspect = {
          w: shownW || String(requested.aw),
          h: shownH || String(requested.ah)
        };
      }
      if (!aspect) {
        const size = getCameraCapturePxSize();
        aspect = formatCameraSizeAspectDisplay(size.width, size.height);
      }
      cameraLockAw = parseFloat(aspect.w);
      cameraLockAh = parseFloat(aspect.h);
      if (!(cameraLockAw > 0)) cameraLockAw = 1;
      if (!(cameraLockAh > 0)) cameraLockAh = 1;
      invalidateLockedExactStepPairs();
      cameraLockLabel = `${aspect.w} : ${aspect.h}`;
      cameraAspectLockOn = true;
      if (isZoomAuto) isZoomAuto = false;
      pinCameraFrameWidthIfFollow();
      cameraFrameWidth = Math.round(cameraFrameWidth);
      applyCameraFrameWidth();
      commitCameraCropRememberedFromLayout();
      rememberCameraModeManualZoom();
      rememberCameraAspectLockSnapshot();
      updateZoomUI();
    } else {
      forgetCameraAspectLockRemembered();
      clearCameraAspectLock({ keepCrop: true });
    }
    syncCameraAspectLockPadlockUi();
    if (isCameraMode) {
      updateCameraGuides();
      paintLockedSnapUi();
      updateCameraResetDefaultBtn();
      checkCameraHeaderCollision();
    }
  }

  function getLockedReachableHeight(frameWidthPx) {
    const w = Math.round(
      Number.isFinite(frameWidthPx) ? frameWidthPx : getCameraDisplayedFrameWidth()
    );
    const vp = getCameraVisibleBottomContentY();
    if (cameraLockDragging && cameraLockWallForW === w
      && cameraLockWallMinH != null && cameraLockWallMaxH != null) {
      return { minH: cameraLockWallMinH, maxH: cameraLockWallMaxH, vp };
    }
    const minH = measureCameraCaptureHeightPxAtZoom(0.5, w, true) / CAMERA_CAPTURE_SCALE;
    const maxH = measureCameraCaptureHeightPxAtZoom(1.5, w, true) / CAMERA_CAPTURE_SCALE;
    if (cameraLockDragging) {
      cameraLockWallForW = w;
      cameraLockWallMinH = minH;
      cameraLockWallMaxH = maxH;
    }
    return { minH, maxH, vp };
  }

  function canLockedHeightReachViewport() {
    const { maxH, vp } = getLockedReachableHeight();
    return vp > 0 && maxH >= vp - 0.5;
  }

  function lockedWidthFromClientX(clientX) {
    const contentArea = document.querySelector('.content-area');
    if (!contentArea || !Number.isFinite(clientX)) return null;
    const rect = contentArea.getBoundingClientRect();
    if (clientX < rect.left) return null;
    const pinnedClientX = Math.min(clientX, rect.right);
    return Math.max(CAMERA_WIDTH_MIN, pinnedClientX - rect.left);
  }

  function lockedHeightFromClientY(clientY) {
    const wrapper = getCameraGridWrapper();
    if (!wrapper || !Number.isFinite(clientY)) return null;
    const rect = wrapper.getBoundingClientRect();
    if (clientY < rect.top) return null;
    const pinnedClientY = Math.min(clientY, rect.bottom);
    return pinnedClientY - rect.top + wrapper.scrollTop;
  }

  // 中身のサイズが画面端ぴったりか。線の見た目は見ない（はみ出し中は線が常に端に張り付く）
  function isLockedContentAtScreenWidth() {
    const maxW = cameraLockKind === 'corner'
      ? getLockedCornerWidthWall()
      : getCameraMaxFrameWidth();
    const live = getCameraDisplayedFrameWidth();
    if (!(maxW >= CAMERA_WIDTH_MIN - 0.5) || !Number.isFinite(live)) return false;
    if (live > maxW + 0.5) return false;
    return live >= maxW - 0.5;
  }

  function isLockedContentAtScreenBottom() {
    const screenH = cameraLockKind === 'corner'
      ? getLockedCornerHeightWall()
      : getCameraScreenFrameHeight();
    const live = getLockedCropLineH();
    if (!(screenH > 0) || !Number.isFinite(live)) return false;
    if (live > screenH + 0.5) return false;
    return live >= screenH - 0.5;
  }

  function isLockedLiveWidthOnStep() {
    const w = Math.round(getCameraDisplayedFrameWidth());
    if (!(w >= CAMERA_WIDTH_MIN - 0.5) || w % CAMERA_WIDTH_STEP !== 0) return false;
    // はみ出し80は壁16の外。ゾーン判定は壁より手前だけ（壁そのものはパーク）
    if (isLockedOverflowEdgeStep('w', w)) return true;
    const maxW = cameraLockKind === 'corner'
      ? getLockedCornerWidthWall()
      : getCameraMaxFrameWidth();
    if (isCameraWidthInSnapWallZone(w, maxW)) return false;
    return true;
  }

  function isLockedLiveHeightOnStep() {
    const h = Math.round(getLockedCropLineH());
    if (!(h > 0) || h % CAMERA_HEIGHT_STEP !== 0) return false;
    if (isLockedOverflowEdgeStep('h', h)) return true;
    const screenH = cameraLockKind === 'corner'
      ? getLockedCornerHeightWall()
      : getCameraScreenFrameHeight();
    if (isCameraYInSnapWallZone(h, screenH)) return false;
    return true;
  }

  // 撮影設定の幅レンジ（640 - 5760）。80でも画面端でもない
  function isLockedContentAtWidthLimit() {
    const live = (cameraLockDragging && cameraLockAppliedW > 0)
      ? cameraLockAppliedW
      : getCameraDisplayedFrameWidth();
    return isCameraFrameWidthAtSizeRangeLimit(live);
  }

  // 50% / 150% のカード+24。画面端フィットではない
  function isLockedContentAtZoomHeightLimit() {
    const live = getLockedCropLineH();
    if (!(live > 0) || !Number.isFinite(live)) return false;
    const { minH, maxH } = getLockedReachableHeight();
    if (minH > 0 && live <= minH + 0.5) return true;
    return maxH > 0 && live >= maxH - 0.5;
  }

  function isLockedLiveWidthOnFitMark() {
    return isLockedContentAtScreenWidth() || isLockedLiveWidthOnStep() || isLockedContentAtWidthLimit();
  }

  function isLockedLiveHeightOnFitMark() {
    return isLockedContentAtScreenBottom() || isLockedLiveHeightOnStep() || isLockedContentAtZoomHeightLimit();
  }

  // 片軸の摘んでいない側。画面端と限界だけ。80は見ない
  function isLockedOtherAxisWallOrLimit(axis) {
    if (axis === 'w') return isLockedContentAtScreenWidth() || isLockedContentAtWidthLimit();
    return isLockedContentAtScreenBottom() || isLockedContentAtZoomHeightLimit();
  }

  // 摘み側だけ。端のピン（viewport）は線の張り付きなので見ない
  function isLockedDraggedAxisFitted(axis) {
    if (axis === 'w' ? isLockedLiveWidthOnFitMark() : isLockedLiveHeightOnFitMark()) return true;
    return !!(cameraLockSnap && cameraLockSnap.axis === axis && cameraLockSnap.type === 'step');
  }

  function paintLockedSnapUi() {
    const line = document.getElementById('cameraCropLine');
    const resizer = document.getElementById('cameraFrameResizer');
    if (!line || !resizer) return;
    if (!cameraLockDragging) return;
    let snapH = false;
    let snapW = false;
    if (cameraLockKind === 'corner') {
      // 角は生px（壁ぴったり or 80の上）だけ。同点も着地が80×80なので特別扱いしない
      snapH = isLockedLiveHeightOnFitMark();
      snapW = isLockedLiveWidthOnFitMark();
    } else if (cameraLockKind === 'crop') {
      snapH = isLockedDraggedAxisFitted('h');
      snapW = snapH && isLockedOtherAxisWallOrLimit('w');
    } else if (cameraLockKind === 'width') {
      snapW = isLockedDraggedAxisFitted('w');
      snapH = snapW && isLockedOtherAxisWallOrLimit('h');
    }
    line.classList.toggle('is-dragging', cameraLockKind !== 'width');
    resizer.classList.toggle('is-dragging', cameraLockKind !== 'crop');
    line.classList.remove('is-follow');
    resizer.classList.remove('is-follow');
    line.classList.toggle('is-snapped', snapH);
    resizer.classList.toggle('is-snapped', snapW);
    syncCameraFrameResizerHeight();
    syncCameraCropLineHit();
  }

  function cancelLockedZoomMatch() {
    if (!cameraLockZoomRaf) return;
    cancelAnimationFrame(cameraLockZoomRaf);
    cameraLockZoomRaf = null;
  }

  function matchLockedZoomToLine(frameW, captureH) {
    if (!(frameW > 0) || !(captureH > 0) || !(cameraCropFixedY > 0)) return;
    const grid = document.getElementById('playerGrid');
    if (grid) grid.style.transition = 'none';
    const closestZ = findClosestZoomForCaptureHeight(captureH, frameW);
    if (Math.abs(closestZ - currentZoom) >= 0.0005) {
      currentZoom = closestZ;
      updateCSSVariables();
      if (grid) void grid.offsetHeight;
      fitCameraCardTextScales();
    }
    const unpaddedCss = measureCameraCaptureHeightPxAtZoom(closestZ, frameW, true) / CAMERA_CAPTURE_SCALE;
    const delta = cameraCropFixedY - unpaddedCss;
    if (Number.isFinite(delta)) applyCameraGridEdgePaddingSplit(delta);
    rememberCameraModeManualZoom();
    updateZoomUI();
  }

  function scheduleLockedZoomMatch() {
    if (cameraLockZoomRaf) return;
    cameraLockZoomRaf = requestAnimationFrame(() => {
      cameraLockZoomRaf = null;
      if (!cameraLockDragging) return;
      matchLockedZoomToLine(cameraLockAppliedW, cameraLockAppliedH);
    });
  }

  function commitLockedLayout(widthPx, heightPx, keepZoom) {
    let w = Math.round(Number(widthPx));
    let h = Number(heightPx);
    if (!Number.isFinite(w) || !Number.isFinite(h) || !(getCameraLockRatio() > 0)) return;
    const capW = Math.round(getCameraSizeWidthMaxScreenPx());
    w = Math.max(CAMERA_WIDTH_MIN, Math.min(capW, w));
    const captureH = getCameraDisplayedHeightPx(h);
    if (cameraLockAppliedW === w && cameraLockAppliedH === captureH) {
      paintLockedSnapUi();
      return;
    }
    cameraFrameWidth = w;
    applyCameraFrameWidth();
    cameraCropFixedY = captureH / CAMERA_CAPTURE_SCALE;
    cameraCropKind = 'fixed';
    cameraCropBoundaryY = null;
    cameraCropSnapTarget = null;
    cameraCropRememberedY = cameraCropFixedY;
    cameraLockAppliedW = w;
    cameraLockAppliedH = captureH;
    if (cameraLockDragging) {
      if (!cameraLockDeferGuides) {
        if (cameraLockKind === 'width') {
          finishLockedWidthGuides();
        } else if (cameraLockKind === 'crop' || cameraLockKind === 'corner') {
          finishLockedCropGuides();
        } else {
          updateCameraGuides();
          paintLockedSnapUi();
          scheduleLockedZoomMatch();
        }
      }
      return;
    }
    if (!keepZoom) matchLockedZoomToLine(w, captureH);
    else {
      const unpaddedCss = measureCameraCaptureHeightPxAtZoom(currentZoom, w, true) / CAMERA_CAPTURE_SCALE;
      const delta = cameraCropFixedY - unpaddedCss;
      if (Number.isFinite(delta)) applyCameraGridEdgePaddingSplit(delta);
      rememberCameraModeManualZoom();
      updateZoomUI();
    }
    updateCameraGuides();
    paintLockedSnapUi();
  }

  function lockedSizeAtWidthMin(w) {
    return Number.isFinite(w) && w <= CAMERA_WIDTH_MIN + 0.5;
  }

  function lockedSizeAtWidthMax(w) {
    const capW = getCameraSizeWidthMaxScreenPx();
    return Number.isFinite(w) && capW > 0 && w >= capW - 0.5;
  }

  function lockedSizeAtHeightMin(w, h) {
    if (!Number.isFinite(h) || !(h > 0)) return false;
    const { minH } = getLockedReachableHeight(w);
    return minH > 0 && h <= minH + 0.5;
  }

  function lockedSizeAtHeightMax(w, h) {
    if (!Number.isFinite(h) || !(h > 0)) return false;
    const { maxH } = getLockedReachableHeight(w);
    return maxH > 0 && h >= maxH - 0.5;
  }

  function lockedPairAtBothLimits(pair) {
    if (!pair) return false;
    const atW = lockedSizeAtWidthMin(pair.w) || lockedSizeAtWidthMax(pair.w);
    const atH = lockedSizeAtHeightMin(pair.w, pair.h) || lockedSizeAtHeightMax(pair.w, pair.h);
    return atW && atH;
  }

  // 80／画面端だけ。50%・150%・幅レンジ限界そのものは両軸限界側
  function lockedSizeOnScreenOrStepFitW(w) {
    const wi = Math.round(w);
    const maxW = cameraLockKind === 'corner'
      ? getLockedCornerWidthWall()
      : getCameraMaxFrameWidth();
    if (maxW >= CAMERA_WIDTH_MIN - 0.5 && Number.isFinite(wi)
      && wi <= maxW + 0.5 && wi >= maxW - 0.5) {
      return true;
    }
    if (!(wi >= CAMERA_WIDTH_MIN - 0.5) || wi % CAMERA_WIDTH_STEP !== 0) return false;
    if (lockedSizeAtWidthMin(wi) || lockedSizeAtWidthMax(wi)) return false;
    if (isLockedOverflowEdgeStep('w', wi)) return true;
    if (isCameraWidthInSnapWallZone(wi, maxW)) return false;
    return true;
  }

  function lockedSizeOnScreenOrStepFitH(w, h) {
    const hi = Math.round(h);
    const screenH = cameraLockKind === 'corner'
      ? getLockedCornerHeightWall()
      : getCameraScreenFrameHeight();
    if (screenH > 0 && Number.isFinite(hi)
      && hi <= screenH + 0.5 && hi >= screenH - 0.5) {
      return true;
    }
    if (!(hi > 0) || hi % CAMERA_HEIGHT_STEP !== 0) return false;
    if (lockedSizeAtHeightMin(w, hi) || lockedSizeAtHeightMax(w, hi)) return false;
    if (isLockedOverflowEdgeStep('h', hi)) return true;
    if (isCameraYInSnapWallZone(hi, screenH)) return false;
    return true;
  }

  function lockedSmallerRatioRoundAxis() {
    return isCameraLockWidthBaseA() ? 'w' : 'h';
  }

  // 書くサイズが限界ならその軸の計算機。両方限界は下記。それ以外は defaultAxis
  // 同点フィットの吸着は比の長い方（別関数）。ここの計算機は短い方のまま
  function lockedLimitRoundAxis(w, h, defaultAxis) {
    const atWmin = lockedSizeAtWidthMin(w);
    const atWmax = lockedSizeAtWidthMax(w);
    const atHmin = lockedSizeAtHeightMin(w, h);
    const atHmax = lockedSizeAtHeightMax(w, h);
    const atW = atWmin || atWmax;
    const atH = atHmin || atHmax;
    if (atW && atH) {
      const fitW = lockedSizeOnScreenOrStepFitW(w);
      const fitH = lockedSizeOnScreenOrStepFitH(w, h);
      if (fitW || fitH) {
        if (fitW && !fitH) return 'w';
        if (fitH && !fitW) return 'h';
        return lockedSmallerRatioRoundAxis();
      }
      const r = getCameraLockRatio();
      if (!(r > 0)) return lockedSmallerRatioRoundAxis();
      const fromW = roundLockedPairFromBase('w', w, r);
      const fromH = roundLockedPairFromBase('h', h, r);
      const wBoth = lockedPairAtBothLimits(fromW);
      const hBoth = lockedPairAtBothLimits(fromH);
      if (wBoth && !hBoth) return 'w';
      if (hBoth && !wBoth) return 'h';
      return lockedSmallerRatioRoundAxis();
    }
    if (atW) return 'w';
    if (atH) return 'h';
    return defaultAxis === 'h' ? 'h' : 'w';
  }

  function clampLockedFloatSize(width, height) {
    const r = getCameraLockRatio();
    let w = Number(width);
    let h = Number(height);
    if (!Number.isFinite(w) || !Number.isFinite(h) || !(r > 0)) return null;
    const capW = getCameraSizeWidthMaxScreenPx();
    const minW = CAMERA_WIDTH_MIN;
    if (w > capW) {
      w = capW;
      h = w / r;
    }
    let { minH, maxH } = getLockedReachableHeight(w);
    if (h > maxH) {
      h = maxH;
      w = h * r;
      if (w > capW) {
        w = capW;
        h = w / r;
      }
    }
    ({ minH, maxH } = getLockedReachableHeight(w));
    if (h < minH) {
      h = minH;
      w = h * r;
    }
    if (w < minW) {
      w = minW;
      h = w / r;
    }
    if (w > capW) {
      w = capW;
      h = w / r;
    }
    return { w, h };
  }

  function commitLockedCalculatedSize(width, height, defaultAxis, pinAxis, pinValue, keepZoom) {
    const r = getCameraLockRatio();
    if (!(r > 0)) return;
    let clamped = clampLockedFloatSize(width, height);
    if (!clamped) return;
    let w = clamped.w;
    let h = clamped.h;
    let axis = lockedLimitRoundAxis(w, h, defaultAxis);
    if (pinAxis && pinAxis === axis && Number.isFinite(pinValue)) {
      if (axis === 'w') {
        if (Math.abs(w - pinValue) < 1.51) {
          w = pinValue;
          h = w / r;
        }
      } else if (Math.abs(h - pinValue) < 0.51) {
        h = pinValue;
        w = h * r;
      }
      clamped = clampLockedFloatSize(w, h);
      if (!clamped) return;
      w = clamped.w;
      h = clamped.h;
      axis = lockedLimitRoundAxis(w, h, axis);
    }
    const rounded = roundLockedPairFromBase(axis, axis === 'w' ? w : h, r);
    commitLockedLayout(rounded.w, rounded.h, keepZoom);
  }

  function applyLockedFromBase(axis, primary, keepPrimary, keepZoom) {
    const r = getCameraLockRatio();
    if (!(r > 0) || !Number.isFinite(primary)) return;
    let w;
    let h;
    if (axis === 'w') {
      w = primary;
      h = w / r;
    } else {
      h = primary;
      w = h * r;
    }
    let pinVal = null;
    if (keepPrimary) {
      if (axis === 'w') {
        const cap = getCameraSizeWidthMaxScreenPx();
        pinVal = Math.max(
          CAMERA_WIDTH_MIN,
          Math.min(getCameraMaxFrameWidth(), primary, cap)
        );
      } else {
        pinVal = primary;
      }
    }
    commitLockedCalculatedSize(w, h, axis, keepPrimary ? axis : null, pinVal, keepZoom);
  }

  // 計算機の丸め。横計算機は横を整数にして縦を出す。縦計算機はその逆
  function roundLockedPairFromBase(axis, primary, r) {
    if (axis === 'w') {
      const w = Math.round(primary);
      return { w: w, h: Math.round(w / r) };
    }
    const h = Math.round(primary);
    return { w: Math.round(h * r), h: h };
  }

  // 同じ位置で計算機だけ差し替えて大きくしない。動いたあとに掛ける
  function commitLockedCornerCalculatorSize(rawW, rawH) {
    const r = getCameraLockRatio();
    if (!(r > 0) || !Number.isFinite(rawW) || !Number.isFinite(rawH)) return false;
    let w = Math.max(0, Number(rawW));
    let h = Math.max(0, Number(rawH));
    const defaultAxis = isCameraLockWidthBaseA() ? 'w' : 'h';
    const clamped = clampLockedFloatSize(w, h);
    if (clamped) {
      w = clamped.w;
      h = clamped.h;
    }
    const axis = lockedLimitRoundAxis(w, h, defaultAxis);
    const rounded = roundLockedPairFromBase(axis, axis === 'w' ? w : h, r);
    rounded.w = Math.max(1, rounded.w);
    rounded.h = Math.max(1, rounded.h);
    const cur = getLockedCornerCurrentSize();
    const rawHyp = Math.hypot(Number(rawW), Number(rawH));
    const curHyp = Math.hypot(cur.w, cur.h);
    if (rawHyp <= curHyp + 1e-9
      && (rounded.w > cur.w + 0.5 || rounded.h > cur.h + 0.5)) {
      return false;
    }
    commitLockedLayout(rounded.w, rounded.h);
    return true;
  }

  function lockedCornerRafDt(lastTs, ts) {
    if (!(lastTs > 0)) return 0;
    return Math.min(48, Math.max(0, ts - lastTs));
  }

  function applyLockedFromHeight(h, keepPrimary, keepZoom) {
    applyLockedFromBase('h', h, !!keepPrimary, !!keepZoom);
  }

  function applyLockedFromWidth(w, keepPrimary) {
    applyLockedFromBase('w', w, !!keepPrimary);
  }

  function snapLockedHeightValue(rawH) {
    const { minH, maxH, vp } = getLockedReachableHeight();
    const r = getCameraLockRatio();
    if (cameraLockSnap && cameraLockSnap.axis === 'h'
      && shouldHoldCameraSnap(rawH, cameraLockSnap.value)) {
      return cameraLockSnap.value;
    }
    const nearWall = isCameraYInSnapWallZone(rawH, vp);
    if (!nearWall) {
      const step = Math.round(rawH / CAMERA_HEIGHT_STEP) * CAMERA_HEIGHT_STEP;
      const pastVp = vp > 0 && step > vp + 0.5;
      const snapOk = step > 0 && step >= minH - 0.5 && step <= maxH + 0.5
        && Math.abs(rawH - step) <= CAMERA_SNAP_ATTRACT_DISTANCE
        && (pastVp || isCameraSnapYAllowed(step, vp))
        && (step * r >= CAMERA_WIDTH_MIN - 0.5)
        && !isLockedOneWayExactStepHeight(step);
      if (snapOk) {
        cameraLockSnap = { axis: 'h', type: 'step', value: step };
        return step;
      }
    }
    if (canLockedHeightReachViewport() && vp > 0
      && rawH <= vp + 0.5 && (vp - rawH) <= CAMERA_SNAP_ATTRACT_DISTANCE) {
      const needW = vp * r;
      if (needW >= CAMERA_WIDTH_MIN - 0.5 && !isLockedOneWayExactStepHeight(vp)) {
        cameraLockSnap = { axis: 'h', type: 'viewport', value: vp };
        return vp;
      }
    }
    cameraLockSnap = null;
    return rawH;
  }

  function snapLockedWidthValue(rawW) {
    const maxW = getCameraMaxFrameWidth();
    if (cameraLockSnap && cameraLockSnap.axis === 'w'
      && shouldHoldCameraSnap(rawW, cameraLockSnap.value)) {
      return cameraLockSnap.value;
    }
    const nearWall = isCameraWidthInSnapWallZone(rawW, maxW);
    if (!nearWall) {
      const cand = getCameraWidthSnapCandidate(rawW);
      if (cand.width != null && cand.distance <= CAMERA_SNAP_ATTRACT_DISTANCE
        && !isLockedOneWayExactStepWidth(cand.width)) {
        cameraLockSnap = { axis: 'w', type: 'step', value: cand.width };
        return cand.width;
      }
    }
    if (maxW >= CAMERA_WIDTH_MIN - 0.5 && rawW <= maxW + 0.5
      && (maxW - rawW) <= CAMERA_SNAP_ATTRACT_DISTANCE
      && !isLockedOneWayExactStepWidth(maxW)) {
      cameraLockSnap = { axis: 'w', type: 'viewport', value: maxW };
      return maxW;
    }
    cameraLockSnap = null;
    return rawW;
  }

  function collectLockedCornerSnaps(rawW, rawH) {
    const r = getCameraLockRatio();
    const maxW = getCameraMaxFrameWidth();
    const { minH, maxH, vp } = getLockedReachableHeight();
    const cands = [];
    const wStep = getCameraWidthSnapCandidate(rawW);
    if (!isCameraWidthInSnapWallZone(rawW, maxW) && wStep.width != null
      && wStep.distance <= CAMERA_SNAP_ATTRACT_DISTANCE) {
      cands.push({ dist: wStep.distance, axis: 'w', type: 'step', value: wStep.width });
    }
    if (maxW >= CAMERA_WIDTH_MIN - 0.5 && rawW <= maxW + 0.5
      && (maxW - rawW) <= CAMERA_SNAP_ATTRACT_DISTANCE) {
      cands.push({ dist: Math.abs(maxW - rawW), axis: 'w', type: 'viewport', value: maxW });
    }
    const stepY = Math.round(rawH / CAMERA_HEIGHT_STEP) * CAMERA_HEIGHT_STEP;
    const pastVp = vp > 0 && stepY > vp + 0.5;
    if (!isCameraYInSnapWallZone(rawH, vp) && stepY > 0
      && stepY >= minH - 0.5 && stepY <= maxH + 0.5
      && Math.abs(rawH - stepY) <= CAMERA_SNAP_ATTRACT_DISTANCE
      && (pastVp || isCameraSnapYAllowed(stepY, vp))
      && stepY * r >= CAMERA_WIDTH_MIN - 0.5 && stepY * r <= maxW + 0.5) {
      cands.push({ dist: Math.abs(rawH - stepY), axis: 'h', type: 'step', value: stepY });
    }
    if (canLockedHeightReachViewport() && vp > 0
      && rawH <= vp + 0.5 && (vp - rawH) <= CAMERA_SNAP_ATTRACT_DISTANCE) {
      const needW = vp * r;
      if (needW >= CAMERA_WIDTH_MIN - 0.5 && needW <= maxW + 0.5) {
        cands.push({ dist: Math.abs(vp - rawH), axis: 'h', type: 'viewport', value: vp });
      }
    }
    return cands;
  }

  function compareLockedSnapCands(a, b) {
    if (a.dist !== b.dist) return a.dist - b.dist;
    const prefer = isCameraLockWidthBaseA() ? 'w' : 'h';
    const pa = a.axis === prefer ? 0 : 1;
    const pb = b.axis === prefer ? 0 : 1;
    if (pa !== pb) return pa - pb;
    const edgeA = a.type === 'viewport' ? 1 : 0;
    const edgeB = b.type === 'viewport' ? 1 : 0;
    return edgeA - edgeB;
  }

  function pickLockedCornerSnap(cands) {
    if (!cands.length) return null;
    const exact = cands.filter(lockedSnapIsExact);
    const pool = exact.length ? exact : cands;
    pool.sort(compareLockedSnapCands);
    return pool[0];
  }

  function applyLockedSnapChoice(snap) {
    cameraLockSnap = snap;
    cameraLockLastAxis = snap.axis;
    const keep = snap.type === 'viewport';
    if (snap.axis === 'w') applyLockedFromWidth(snap.value, keep);
    else applyLockedFromHeight(snap.value, keep);
  }

  function snapLockedGrab(kind) {
    const r = getCameraLockRatio();
    const h0 = Math.max(1, getCameraCaptureHeight());
    const w0 = getCameraDisplayedFrameWidth();
    cameraLockSnap = null;
    cameraLockLastAxis = null;
    cameraLockAppliedW = null;
    cameraLockAppliedH = null;
    if (kind === 'crop') applyLockedFromHeight(h0);
    else if (kind === 'width') applyLockedFromWidth(w0);
    else {
      const w = (w0 + h0 / r) / (1 + 1 / (r * r));
      const h = w / r;
      if (isCameraLockWidthBaseA()) applyLockedFromWidth(w);
      else applyLockedFromHeight(h);
    }
  }

  function getLockedCropLineH() {
    if (cameraCropFixedY != null && Number.isFinite(cameraCropFixedY)) return cameraCropFixedY;
    return Math.max(1, getCameraCaptureHeight());
  }

  function canLockedCropGrowPastViewport() {
    const { maxH } = getLockedReachableHeight();
    return getLockedCropLineH() < maxH - 0.5;
  }

  function isLockedCropAtExpandEdge() {
    const vp = getCameraVisibleBottomContentY() || 0;
    if (!(vp > 0)) return false;
    const h = getLockedCropLineH();
    if (cameraLockSnap && cameraLockSnap.axis === 'h' && cameraLockSnap.type === 'viewport') return true;
    if (isCameraVerticalScrollActive()) {
      return isCameraScrolledToVerticalEnd() && isCameraYAtViewportBottom(h, vp);
    }
    return isCameraYAtViewportBottom(h, vp);
  }

  function isLockedCropEdgeBusy() {
    return cameraLockCropEdgeExpanding || cameraLockCropEdgeShrinking
      || cameraLockCropEdgeExpandBlocked || cameraLockCropEdgeShrinkBlocked
      || cameraLockCropEdgeShrinkParkClientY != null;
  }

  function stopLockedCropEdgeExpand() {
    cameraLockCropEdgeExpanding = false;
    cameraLockCropEdgeExpandLastTs = 0;
    if (cameraLockCropEdgeExpandRaf) {
      cancelAnimationFrame(cameraLockCropEdgeExpandRaf);
      cameraLockCropEdgeExpandRaf = null;
    }
  }

  function stopLockedCropEdgeShrink() {
    cameraLockCropEdgeShrinking = false;
    cameraLockCropEdgeShrinkLastTs = 0;
    if (cameraLockCropEdgeShrinkRaf) {
      cancelAnimationFrame(cameraLockCropEdgeShrinkRaf);
      cameraLockCropEdgeShrinkRaf = null;
    }
  }

  function stopLockedCropParkCatch() {
    cameraLockCropParkCatchActive = false;
    cameraLockCropParkCatchLastTs = 0;
    if (cameraLockCropParkCatchRaf) {
      cancelAnimationFrame(cameraLockCropParkCatchRaf);
      cameraLockCropParkCatchRaf = null;
    }
  }

  function resetLockedCropEdgeState() {
    stopLockedCropEdgeExpand();
    stopLockedCropEdgeShrink();
    stopLockedCropParkCatch();
    cameraLockCropEdgeExpandVirtualH = 0;
    cameraLockCropEdgeExpandBlocked = false;
    cameraLockCropEdgeExpandPeakClientY = null;
    cameraLockCropEdgeExpandTroughClientY = null;
    cameraLockCropEdgeExpandSnapY = null;
    cameraLockCropEdgeExpandHoldPx = 0;
    cameraLockCropEdgeExpandPausedStep = null;
    cameraLockCropEdgeShrinkVirtualH = 0;
    cameraLockCropEdgeShrinkBlocked = false;
    cameraLockCropEdgeShrinkPeakClientY = null;
    cameraLockCropEdgeShrinkTroughClientY = null;
    cameraLockCropEdgeShrinkParkClientY = null;
    cameraLockCropEdgeShrinkSnapY = null;
    cameraLockCropEdgeShrinkHoldPx = 0;
    cameraLockCropEdgeShrinkPausedStep = null;
  }

  // 端の80は壁の外だけ。手前16は画面内用。壁そのものはパーク
  function isLockedOverflowEdgeStep(axis, step) {
    if (!Number.isFinite(step) || !(step > 0)) return false;
    if (axis === 'w') {
      if (step < CAMERA_WIDTH_MIN - 0.5) return false;
      const wall = cameraLockKind === 'corner'
        ? getLockedCornerWidthWall()
        : getCameraMaxFrameWidth();
      return wall > 0 && step > wall + 0.5;
    }
    const wall = cameraLockKind === 'corner'
      ? getLockedCornerHeightWall()
      : getCameraScreenFrameHeight();
    return wall > 0 && step > wall + 0.5;
  }

  function setLockedEdgeStepSnap(axis, value) {
    cameraLockSnap = { axis: axis, type: 'step', value: value };
    cameraLockLastAxis = axis;
    paintLockedSnapUi();
  }

  function setLockedEdgeExactStepSnap(pair) {
    const snap = lockedCornerExactStepSnapOf(pair);
    if (!snap) return;
    cameraLockSnap = snap;
    cameraLockLastAxis = snap.axis;
    paintLockedSnapUi();
  }

  function applyLockedCropEdgeHeightThenStep(h, stepY) {
    applyLockedCropEdgeHeight(h, false);
    if (stepY != null) setLockedEdgeStepSnap('h', stepY);
  }

  function applyLockedWidthEdgeWidthThenStep(w, stepW) {
    applyLockedWidthEdgeWidth(w, false);
    if (stepW != null) setLockedEdgeStepSnap('w', stepW);
  }

  function pinLockedCropToViewport() {
    scrollCameraWrapperToVerticalEnd();
    pinLockedFollowWidthIfOverflow();
    const vp = getCameraVisibleBottomContentY();
    if (vp > 0) {
      cameraLockSnap = { axis: 'h', type: 'viewport', value: vp };
      cameraLockLastAxis = 'h';
    }
    updateCameraGuides();
    paintLockedSnapUi();
  }

  function applyLockedCropEdgeHeight(h, keepPrimary) {
    cameraLockDeferGuides = true;
    applyLockedFromHeight(h, keepPrimary);
    cameraLockDeferGuides = false;
    finishLockedCropGuides();
    pinLockedCropToViewport();
  }

  function parkLockedCropAtViewport() {
    const vp = getCameraVisibleBottomContentY();
    if (!(vp > 0)) {
      pinLockedCropToViewport();
      return;
    }
    applyLockedCropEdgeHeight(vp, true);
  }

  function startLockedCropEdgeExpand() {
    if (cameraLockCropEdgeExpanding || !canLockedCropGrowPastViewport()) return;
    stopLockedCropEdgeShrink();
    stopLockedCropParkCatch();
    cameraLockCropEdgeShrinkBlocked = false;
    cameraLockCropEdgeShrinkPeakClientY = null;
    cameraLockCropEdgeShrinkTroughClientY = null;
    cameraLockCropEdgeShrinkParkClientY = null;
    cameraLockCropEdgeExpanding = true;
    cameraLockMoved = true;
    cameraLockCropEdgeExpandVirtualH = getLockedCropLineH();
    cameraLockCropEdgeExpandLastTs = 0;
    cameraLockCropEdgeExpandSnapY = null;
    cameraLockCropEdgeExpandPausedStep = null;
    cameraLockCropEdgeExpandHoldPx = 0;
    pinLockedCropToViewport();
    if (!cameraLockCropEdgeExpandRaf) {
      cameraLockCropEdgeExpandRaf = requestAnimationFrame(pumpLockedCropEdgeExpand);
    }
  }

  function pumpLockedCropEdgeExpand(ts) {
    cameraLockCropEdgeExpandRaf = null;
    if (!cameraLockCropEdgeExpanding || !cameraLockDragging || cameraLockKind !== 'crop' || !isCameraMode) {
      cameraLockCropEdgeExpanding = false;
      cameraLockCropEdgeExpandLastTs = 0;
      return;
    }
    const last = cameraLockCropEdgeExpandLastTs || ts;
    cameraLockCropEdgeExpandLastTs = ts;
    const dt = Math.min(48, Math.max(0, ts - last));
    const { maxH } = getLockedReachableHeight();
    if (getLockedCropLineH() < maxH - 1e-9) {
      const stepPx = MGR_AUTOSCROLL_SPEED_PX_S * (dt / 1000);
      if (cameraLockCropEdgeExpandSnapY != null
        && !isLockedOverflowEdgeStep('h', cameraLockCropEdgeExpandSnapY)) {
        cameraLockCropEdgeExpandSnapY = null;
        cameraLockCropEdgeExpandHoldPx = 0;
      }
      if (cameraLockCropEdgeExpandSnapY != null
        && cameraLockCropEdgeExpandHoldPx < CAMERA_HEIGHT_STEP) {
        cameraLockCropEdgeExpandHoldPx += stepPx;
        applyLockedCropEdgeHeightThenStep(
          cameraLockCropEdgeExpandSnapY, cameraLockCropEdgeExpandSnapY
        );
        if (cameraLockCropEdgeExpanding && cameraLockDragging && cameraLockKind === 'crop') {
          cameraLockCropEdgeExpandRaf = requestAnimationFrame(pumpLockedCropEdgeExpand);
        }
        return;
      }
      const prevH = cameraLockCropEdgeExpandVirtualH;
      cameraLockCropEdgeExpandVirtualH += stepPx;
      if (cameraLockCropEdgeExpandVirtualH > maxH) cameraLockCropEdgeExpandVirtualH = maxH;
      const virtualH = cameraLockCropEdgeExpandVirtualH;
      const crossed = getCrossedCameraHeightStep(prevH, virtualH, true);
      if (crossed != null && crossed !== cameraLockCropEdgeExpandPausedStep
        && isLockedOverflowEdgeStep('h', crossed)
        && !isLockedOneWayExactStepHeight(crossed)) {
        cameraLockCropEdgeExpandVirtualH = crossed;
        cameraLockCropEdgeExpandPausedStep = crossed;
        cameraLockCropEdgeExpandSnapY = crossed;
        cameraLockCropEdgeExpandHoldPx = 0;
        applyLockedCropEdgeHeightThenStep(crossed, crossed);
      } else {
        if (cameraLockCropEdgeExpandSnapY != null
          && Math.abs(virtualH - cameraLockCropEdgeExpandSnapY) >= CAMERA_SNAP_RELEASE_DISTANCE) {
          cameraLockCropEdgeExpandSnapY = null;
        }
        applyLockedCropEdgeHeightThenStep(virtualH, cameraLockCropEdgeExpandSnapY);
      }
    } else {
      pinLockedCropToViewport();
    }
    if (getLockedCropLineH() >= maxH - 1e-9) return;
    if (cameraLockCropEdgeExpanding && cameraLockDragging && cameraLockKind === 'crop') {
      cameraLockCropEdgeExpandRaf = requestAnimationFrame(pumpLockedCropEdgeExpand);
    }
  }

  function updateLockedCropEdgeExpandFromClientY(clientY) {
    if (!cameraLockDragging || cameraLockKind !== 'crop' || !isCameraMode) {
      stopLockedCropEdgeExpand();
      return;
    }
    if (!Number.isFinite(clientY)) return;
    const past = getCameraEdgePastPx(clientY);
    const dead = CAMERA_CROP_POINTER_DEAD_PX;
    const canStart = isLockedCropAtExpandEdge()
      && past > CAMERA_SNAP_RELEASE_DISTANCE
      && canLockedCropGrowPastViewport();
    if (cameraLockCropEdgeExpandBlocked) {
      if (cameraLockCropEdgeExpandTroughClientY == null || clientY < cameraLockCropEdgeExpandTroughClientY) {
        cameraLockCropEdgeExpandTroughClientY = clientY;
      }
      if (canStart && clientY >= cameraLockCropEdgeExpandTroughClientY + dead) {
        cameraLockCropEdgeExpandBlocked = false;
        cameraLockCropEdgeExpandTroughClientY = null;
        startLockedCropEdgeExpand();
        cameraLockCropEdgeExpandPeakClientY = clientY;
      } else if (past <= CAMERA_SNAP_RELEASE_DISTANCE) {
        cameraLockCropEdgeExpandBlocked = false;
        cameraLockCropEdgeExpandTroughClientY = null;
      }
      return;
    }
    if (cameraLockCropEdgeExpanding) {
      if (cameraLockCropEdgeExpandPeakClientY == null || clientY > cameraLockCropEdgeExpandPeakClientY) {
        cameraLockCropEdgeExpandPeakClientY = clientY;
      }
      if (clientY <= cameraLockCropEdgeExpandPeakClientY - dead) {
        cameraLockCropEdgeExpandBlocked = true;
        cameraLockCropEdgeExpandTroughClientY = clientY;
        cameraLockCropEdgeExpandPeakClientY = null;
        stopLockedCropEdgeExpand();
        if (!isCameraVerticalScrollActive()) parkLockedCropAtViewport();
        else pinLockedCropToViewport();
      }
      return;
    }
    if (canStart) {
      startLockedCropEdgeExpand();
      cameraLockCropEdgeExpandPeakClientY = clientY;
    }
  }

  function startLockedCropEdgeShrink() {
    if (cameraLockCropEdgeShrinking || cameraLockCropEdgeExpanding) return;
    if (!isCameraVerticalScrollActive()) return;
    const { minH } = getLockedReachableHeight();
    if (!(getLockedCropLineH() > minH + 0.5)) return;
    cameraLockCropEdgeExpandBlocked = false;
    cameraLockCropEdgeExpandPeakClientY = null;
    cameraLockCropEdgeExpandTroughClientY = null;
    cameraLockCropEdgeShrinkParkClientY = null;
    cameraLockCropEdgeShrinking = true;
    cameraLockMoved = true;
    cameraLockCropEdgeShrinkVirtualH = getLockedCropLineH();
    cameraLockCropEdgeShrinkLastTs = 0;
    cameraLockCropEdgeShrinkSnapY = null;
    cameraLockCropEdgeShrinkPausedStep = null;
    cameraLockCropEdgeShrinkHoldPx = 0;
    pinLockedCropToViewport();
    if (!cameraLockCropEdgeShrinkRaf) {
      cameraLockCropEdgeShrinkRaf = requestAnimationFrame(pumpLockedCropEdgeShrink);
    }
  }

  function pumpLockedCropEdgeShrink(ts) {
    cameraLockCropEdgeShrinkRaf = null;
    if (!cameraLockCropEdgeShrinking || !cameraLockDragging || cameraLockKind !== 'crop' || !isCameraMode) {
      cameraLockCropEdgeShrinking = false;
      cameraLockCropEdgeShrinkLastTs = 0;
      return;
    }
    const last = cameraLockCropEdgeShrinkLastTs || ts;
    cameraLockCropEdgeShrinkLastTs = ts;
    const dt = Math.min(48, Math.max(0, ts - last));
    const { minH } = getLockedReachableHeight();

    if (!isCameraVerticalScrollActive()) {
      cameraLockCropEdgeShrinkParkClientY = Number.isFinite(cameraLockLastClientY)
        ? cameraLockLastClientY
        : cameraLockCropEdgeShrinkParkClientY;
      parkLockedCropAtViewport();
      stopLockedCropEdgeShrink();
      return;
    }

    if (cameraLockCropEdgeShrinkVirtualH > minH + 0.5) {
      const stepPx = MGR_AUTOSCROLL_SPEED_PX_S * (dt / 1000);
      if (cameraLockCropEdgeShrinkSnapY != null
        && !isLockedOverflowEdgeStep('h', cameraLockCropEdgeShrinkSnapY)) {
        cameraLockCropEdgeShrinkSnapY = null;
        cameraLockCropEdgeShrinkHoldPx = 0;
      }
      if (cameraLockCropEdgeShrinkSnapY != null
        && cameraLockCropEdgeShrinkHoldPx < CAMERA_HEIGHT_STEP) {
        cameraLockCropEdgeShrinkHoldPx += stepPx;
        applyLockedCropEdgeHeightThenStep(
          cameraLockCropEdgeShrinkSnapY, cameraLockCropEdgeShrinkSnapY
        );
        if (cameraLockCropEdgeShrinking && cameraLockDragging && cameraLockKind === 'crop') {
          cameraLockCropEdgeShrinkRaf = requestAnimationFrame(pumpLockedCropEdgeShrink);
        }
        return;
      }
      const prevH = cameraLockCropEdgeShrinkVirtualH;
      cameraLockCropEdgeShrinkVirtualH -= stepPx;
      if (cameraLockCropEdgeShrinkVirtualH < minH) cameraLockCropEdgeShrinkVirtualH = minH;
      const virtualH = cameraLockCropEdgeShrinkVirtualH;
      const crossed = getCrossedCameraHeightStep(prevH, virtualH, false);
      if (crossed != null && crossed !== cameraLockCropEdgeShrinkPausedStep
        && isLockedOverflowEdgeStep('h', crossed)
        && !isLockedOneWayExactStepHeight(crossed)) {
        cameraLockCropEdgeShrinkVirtualH = crossed;
        cameraLockCropEdgeShrinkPausedStep = crossed;
        cameraLockCropEdgeShrinkSnapY = crossed;
        cameraLockCropEdgeShrinkHoldPx = 0;
        applyLockedCropEdgeHeightThenStep(crossed, crossed);
      } else {
        if (cameraLockCropEdgeShrinkSnapY != null
          && Math.abs(virtualH - cameraLockCropEdgeShrinkSnapY) >= CAMERA_SNAP_RELEASE_DISTANCE) {
          cameraLockCropEdgeShrinkSnapY = null;
        }
        applyLockedCropEdgeHeightThenStep(virtualH, cameraLockCropEdgeShrinkSnapY);
      }
    } else {
      pinLockedCropToViewport();
    }

    if (!isCameraVerticalScrollActive() || getLockedCropLineH() <= minH + 0.5) {
      if (getLockedCropLineH() > minH + 0.5 && !isCameraVerticalScrollActive()) {
        cameraLockCropEdgeShrinkParkClientY = Number.isFinite(cameraLockLastClientY)
          ? cameraLockLastClientY
          : cameraLockCropEdgeShrinkParkClientY;
        parkLockedCropAtViewport();
      }
      stopLockedCropEdgeShrink();
      return;
    }
    if (cameraLockCropEdgeShrinking && cameraLockDragging && cameraLockKind === 'crop') {
      cameraLockCropEdgeShrinkRaf = requestAnimationFrame(pumpLockedCropEdgeShrink);
    }
  }

  function startLockedCropParkCatch() {
    const vp = getCameraVisibleBottomContentY();
    if (!(vp > 0)) {
      stopLockedCropParkCatch();
      return;
    }
    cameraLockSnap = null;
    cameraLockCropParkCatchActive = true;
    cameraLockCropParkCatchH = vp;
    cameraLockCropParkCatchLastTs = 0;
    if (!cameraLockCropParkCatchRaf) {
      cameraLockCropParkCatchRaf = requestAnimationFrame(pumpLockedCropParkCatch);
    }
  }

  function pumpLockedCropParkCatch(ts) {
    cameraLockCropParkCatchRaf = null;
    if (!cameraLockCropParkCatchActive || !cameraLockDragging || cameraLockKind !== 'crop' || !isCameraMode) {
      stopLockedCropParkCatch();
      return;
    }
    const targetH = lockedHeightFromClientY(cameraLockLastClientY);
    if (targetH == null) {
      stopLockedCropParkCatch();
      return;
    }
    const last = cameraLockCropParkCatchLastTs || ts;
    cameraLockCropParkCatchLastTs = ts;
    const dt = Math.min(48, Math.max(0, ts - last));
    const step = CAMERA_PARK_CATCH_SPEED_PX_S * (dt / 1000);
    const dist = targetH - cameraLockCropParkCatchH;
    if (Math.abs(dist) <= 0.5) {
      cameraLockCropParkCatchH = targetH;
      applyLockedFromHeight(cameraLockCropParkCatchH, false);
      stopLockedCropParkCatch();
      return;
    }
    const dir = dist > 0 ? 1 : -1;
    cameraLockCropParkCatchH += dir * Math.min(step, Math.abs(dist));
    applyLockedFromHeight(cameraLockCropParkCatchH, false);
    if (Math.abs(targetH - cameraLockCropParkCatchH) <= 0.5) {
      stopLockedCropParkCatch();
      return;
    }
    cameraLockCropParkCatchRaf = requestAnimationFrame(pumpLockedCropParkCatch);
  }

  function updateLockedCropEdgeShrinkFromClientY(clientY) {
    if (!cameraLockDragging || cameraLockKind !== 'crop' || !isCameraMode) {
      stopLockedCropEdgeShrink();
      return;
    }
    if (cameraLockCropEdgeExpanding) {
      stopLockedCropEdgeShrink();
      return;
    }
    if (!Number.isFinite(clientY)) return;
    const above = getCameraEdgeAbovePx(clientY);
    const dead = CAMERA_CROP_POINTER_DEAD_PX;
    const { minH } = getLockedReachableHeight();
    const canStart = isLockedCropAtExpandEdge() && isCameraVerticalScrollActive()
      && above > CAMERA_SNAP_RELEASE_DISTANCE
      && getLockedCropLineH() > minH + 0.5;
    if (cameraLockCropEdgeShrinkParkClientY != null) {
      const parkY = cameraLockCropEdgeShrinkParkClientY;
      if (clientY <= parkY - CAMERA_SNAP_RELEASE_DISTANCE) {
        cameraLockCropEdgeShrinkParkClientY = null;
        startLockedCropParkCatch();
      }
      return;
    }
    if (cameraLockCropEdgeShrinkBlocked) {
      if (!isCameraVerticalScrollActive() || above <= CAMERA_SNAP_RELEASE_DISTANCE) {
        cameraLockCropEdgeShrinkBlocked = false;
        cameraLockCropEdgeShrinkTroughClientY = null;
        cameraLockCropEdgeShrinkPeakClientY = null;
        return;
      }
      if (cameraLockCropEdgeShrinkTroughClientY == null || clientY > cameraLockCropEdgeShrinkTroughClientY) {
        cameraLockCropEdgeShrinkTroughClientY = clientY;
