  function applyZoomPreset100() {
    const select = document.getElementById('zoomSelect');
    if (!select) return;
    select.value = '1.0';
    handleZoomSelect();
    syncHeaderSelectLabel('zoomSelect');
  }

  // 100% が一覧で選べないときだけ、ダブルクリック100%なし。クリックで即一覧
  function isZoomValueHitInstantOpen() {
    return !isLockedZoomStepReachable(1);
  }

  function bindHeaderSelects() {
    const hit = document.getElementById('zoomSelectValueHit');
    if (hit && !hit._zoomHitBound) {
      hit._zoomHitBound = true;
      hit.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
      });
      hit.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (headerMenuPickGuard) return;
        if (isHeaderSelectOpen('zoom')) {
          cancelDeferredClick(ZOOM_VALUE_CLICK_KEY);
          closeHeaderSelectMenu('zoom');
          return;
        }
        if (isZoomValueHitInstantOpen()) {
          cancelDeferredClick(ZOOM_VALUE_CLICK_KEY);
          openHeaderSelectMenu('zoom');
          return;
        }
        if (isZoomExactly100()) {
          cancelDeferredClick(ZOOM_VALUE_CLICK_KEY);
          openHeaderSelectMenu('zoom');
          return;
        }
        if (deferredClickTimers.has(ZOOM_VALUE_CLICK_KEY)) {
          cancelDeferredClick(ZOOM_VALUE_CLICK_KEY);
          applyZoomPreset100();
          return;
        }
        armDeferredClick(ZOOM_VALUE_CLICK_KEY, () => {
          if (isHeaderSelectOpen('zoom')) return;
          openHeaderSelectMenu('zoom');
        });
      });
      hit.addEventListener('dblclick', (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
    }
    syncHeaderSelectLabel('colSelect');
    syncHeaderSelectLabel('zoomSelect');
    const blocker = document.getElementById('headerMenuBlocker');
    if (blocker && !blocker._headerMenuBound) {
      blocker._headerMenuBound = true;
      blocker.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
      blocker.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dismissOpenHeaderMenus();
      });
      bindPopupMenuInactiveDismiss();
    }
  }

  function bindPopupMenuInactiveDismiss() {
    if (window.__popupMenuInactiveBound) return;
    window.__popupMenuInactiveBound = true;
    const onInactive = () => dismissOpenHeaderMenus();
    window.addEventListener('blur', onInactive);
    window.addEventListener('pagehide', onInactive);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden || document.visibilityState === 'hidden') onInactive();
    });
    document.addEventListener('focusout', (e) => {
      if (e.relatedTarget) return;
      setTimeout(() => {
        if (!isAnyHeaderMenuOpen()) return;
        if (document.hasFocus()) {
          popupMenuHadFocus = true;
          return;
        }
        if (popupMenuHadFocus) onInactive();
      }, 0);
    });
    const listenParent = (win) => {
      try {
        if (!win || win === window) return;
        win.addEventListener('blur', onInactive);
        win.addEventListener('focus', onInactive, true);
        win.document.addEventListener('mousedown', onInactive, true);
      } catch (_) {}
    };
    try { listenParent(window.parent); } catch (_) {}
    try { listenParent(window.top); } catch (_) {}
  }

  function changeColsManual(delta) {
    const select = document.getElementById('colSelect');
    if (!select || colStepDisabled(select.value, delta)) return;
    if (select.value === 'list') {
      if (delta > 0) { select.value = '3'; handleManualChange(); }
      return; 
    }
    const opts = ['1','2','3','4','5','6'];
    let currentIdx = opts.indexOf(select.value);
    if (currentIdx === -1) currentIdx = 3; 
    let newIdx = currentIdx + delta;
    if (newIdx >= 0 && newIdx < opts.length) {
      select.value = opts[newIdx];
      handleManualChange();
    }
  }

  function changeZoomManual(delta) {
    const select = document.getElementById('zoomSelect');
    const shownPct = getDisplayedZoomPercent(currentZoom);
    let targetPct;
    if (delta > 0) {
      targetPct = ZOOM_PERCENT_PRESETS.find(p => p > shownPct);
    } else {
      targetPct = [...ZOOM_PERCENT_PRESETS].reverse().find(p => p < shownPct);
    }
    if (targetPct === undefined) return;
    const targetVal = targetPct / 100;
    if (isCameraAspectLockOn() && !isLockedZoomStepReachable(targetVal)) {
      isZoomAuto = false;
      applyLockedZoomTowardLimit(delta > 0);
      saveSettings();
      if (isCameraMode) {
        updateCameraGuides();
        checkCameraHeaderCollision();
      }
      return;
    }
    
    select.value = targetVal.toFixed(1);
    isZoomAuto = false;
    rememberCameraModeManualZoom(targetVal);
    saveSettings();
    applyRenderSettings({ commitCameraCropY: true });
    commitCameraCropRememberedFromLayout();
    if (isCameraAspectLockOn()) applyLockedWidthToCurrentHeight();
    else forgetCameraAspectLockRemembered();
    if (isCameraMode) {
      updateCameraGuides();
      checkCameraHeaderCollision();
    }
  }

  function captureGridScrollRatio() {
    const wrapper = document.querySelector('.grid-wrapper');
    if (!wrapper) return null;
    const maxY = Math.max(0, wrapper.scrollHeight - wrapper.clientHeight);
    const maxX = Math.max(0, wrapper.scrollWidth - wrapper.clientWidth);
    return {
      wrapper,
      topRatio: maxY > 0 ? wrapper.scrollTop / maxY : 0,
      leftRatio: maxX > 0 ? wrapper.scrollLeft / maxX : 0
    };
  }

  function restoreGridScrollRatio(snap) {
    if (!snap || !snap.wrapper) return;
    const wrapper = snap.wrapper;
    const maxY = Math.max(0, wrapper.scrollHeight - wrapper.clientHeight);
    const maxX = Math.max(0, wrapper.scrollWidth - wrapper.clientWidth);
    wrapper.scrollTop = snap.topRatio * maxY;
    wrapper.scrollLeft = snap.leftRatio * maxX;
  }

  function applyRenderSettings(options) {
    ensureCameraZoomAutoOffIfLocked();
    const keepCameraZoom = !!(options && options.keepCameraZoom);
    const skipHeaderCollision = !!(options && options.skipHeaderCollision);
    const skipRememberedYSettle = !!(options && (options.commitCameraCropY || options.keepCameraZoom));
    // render() が innerHTML を空にすると scrollTop が 0 に戻るため、比率で復元する
    const lineScrollAnchor = (isCameraMode && !isZoomAuto && !skipRememberedYSettle)
      ? captureCameraLineScrollAnchor() : null;
    const scrollSnap = captureGridScrollRatio();
    const grid = document.getElementById('playerGrid');
    const prevGridTransition = grid ? grid.style.transition : '';
    if (grid) grid.style.transition = 'none';

    const colVal = document.getElementById('colSelect').value;
    
    isListMode = (colVal === 'list');
    currentCols = isListMode ? 2 : parseInt(colVal, 10);
    
    if (isZoomAuto) {
      executeAutoFit();
    } else {
      const zoomSelect = document.getElementById('zoomSelect');
      // dynamic は表示用。実倍率は currentZoom（0.001刻み）を正とする
      if (zoomSelect.value !== 'dynamic') {
         currentZoom = parseFloat(zoomSelect.value);
      }

      updateCSSVariables();
      updateZoomUI();
      render();
      if (!skipHeaderCollision) checkHeaderCollision();
    }

    restoreGridScrollRatio(scrollSnap);
    if (grid) {
      void grid.offsetHeight;
      const deferCameraSettle = isCameraMode && !isZoomAuto && !skipRememberedYSettle;
      if (!deferCameraSettle) grid.style.transition = prevGridTransition;
    }
    if (isCameraMode && !isZoomAuto && !skipRememberedYSettle) {
      scheduleCameraRememberedYSettle(lineScrollAnchor);
      scheduleRefreshCameraDefaultAutoZoom();
    } else if (isCameraMode && !isZoomAuto && keepCameraZoom) {
      // メンバー非表示など：倍率はそのまま。点線だけ新しいカード下端へ
      cancelCameraRememberedYSettle({ release: true });
      commitCameraCropRememberedFromLayout();
      scheduleRefreshCameraDefaultAutoZoom();
      updateCameraGuides();
      checkCameraHeaderCollision();
    }
    syncCustomScrollbars();
  }

  function getCameraRowCount() {
    return getCameraRowInfo().rows.length;
  }

  function getCameraGridRowCountFromN(n) {
    const cols = isListMode ? 2 : (parseInt(currentCols, 10) || 0);
    if (!(cols > 0)) return 0;
    n = Math.max(0, n | 0);
    return n ? Math.ceil(n / cols) : 0;
  }

  // メンバー非表示中：仮で幅いっぱい＋AUTO。錠の枠は維持しない。
  function applyCameraHideLayoutKeepZoom() {
    applyRenderSettings({ keepCameraZoom: true });
  }

  function applyCameraHideModePreview() {
    if (isCameraAspectLockOn()) {
      clearCameraAspectLock();
      syncCameraAspectLockPadlockUi();
    }
    cameraFrameWidth = null;
    cameraWidthDragPreview = null;
    cameraWidthSnapTarget = null;
    applyCameraFrameWidth();
    isZoomAuto = true;
    cameraCropRememberedY = null;
    resetCameraCropToMax();
    executeAutoFit();
    updateZoomUI();
  }

  function restoreCameraHideZoomAndWidth(snap) {
    if (!snap || !snap.capture) return null;
    let cap;
    try {
      cap = JSON.parse(snap.capture);
    } catch (_) {
      return null;
    }
    cameraFrameWidth = cap.frameWidth == null ? null : cap.frameWidth;
    cameraWidthDragPreview = null;
    cameraWidthSnapTarget = null;
    applyCameraFrameWidth();
    return cap;
  }

  /* --- オートズーム --- */
  function executeAutoFit(options) {
    if (!(options && options.force) && ensureCameraZoomAutoOffIfLocked()) {
      if (isCameraMode) {
        updateCameraGuides();
        checkCameraHeaderCollision();
      }
      return;
    }
    syncBottomBarStacked();
    if (players.length === 0) {
      // 0人でも render しないと、最後のカードや人数表示が画面に残る
      updateCSSVariables();
      updateZoomUI();
      render();
      return;
    }

    const wrapper = document.querySelector('.grid-wrapper');
    if (!wrapper) return;
    // 撮影モードはオーバーレイが浮いているだけなので、ヘッダー分48pxや -5 余白を引かない
    // （引くと下端復帰時に 5px＝表示pxで10px 上へズレる）
    let availableHeight = wrapper.clientHeight;
    if (!isCameraMode) availableHeight -= 48;

    // 点線は wrapper 内の absolute で scrollHeight を押し広げるため、計測中は外す
    const cropLine = document.getElementById('cameraCropLine');
    const prevLineDisplay = cropLine ? cropLine.style.display : '';
    if (cropLine) cropLine.style.display = 'none';
    
    currentZoom = 1.0;
    updateCSSVariables();
    render(); 

    const grid = document.getElementById('playerGrid');
    const prevGridTransition = grid ? grid.style.transition : '';
    if (grid) grid.style.transition = 'none';
    try {
      if (isCameraMode) {
        // 点線ドラッグと同じ：カード下端+24 ＝ 画面下端
        const viewportBottom = getCameraVisibleBottomContentY();
        if (viewportBottom > 0) {
          executeAutoZoomToMatchBoundary(viewportBottom, { precise: true });
        }
      } else {
        let gridH = grid.scrollHeight;
        const heightPad = 5;
        let targetZoom = (availableHeight - heightPad) / gridH;
        targetZoom = Math.floor(targetZoom * 100) / 100;
        targetZoom = Math.max(0.5, Math.min(1.5, targetZoom));
        currentZoom = targetZoom;
        updateCSSVariables();
        render();

        const applyFitZoom = (z) => {
          currentZoom = Math.max(0.5, Math.min(1.5, z));
          updateCSSVariables();
          if (grid) void grid.offsetHeight;
        };
        const fitsWithoutScroll = () => wrapper.scrollHeight <= wrapper.clientHeight;
        const growByStep = (step, maxLoops) => {
          let loops = maxLoops;
          while (fitsWithoutScroll() && currentZoom < 1.5 - 1e-9 && loops-- > 0) {
            const nextZoom = Math.round((currentZoom + step) * 1000) / 1000;
            if (nextZoom > 1.5 || nextZoom === currentZoom) break;
            applyFitZoom(nextZoom);
            if (!fitsWithoutScroll()) {
              applyFitZoom(Math.round((currentZoom - step) * 1000) / 1000);
              break;
            }
          }
        };
        const shrinkByStep = (step, maxLoops) => {
          let loops = maxLoops;
          while (!fitsWithoutScroll() && currentZoom > 0.5 + 1e-9 && loops-- > 0) {
            const nextZoom = Math.max(0.5, Math.round((currentZoom - step) * 1000) / 1000);
            if (nextZoom === currentZoom) break;
            applyFitZoom(nextZoom);
          }
        };
        growByStep(0.01, 100);
        shrinkByStep(0.01, 100);
        growByStep(0.001, 100);
        shrinkByStep(0.001, 100);
      }
    } finally {
      if (grid) grid.style.transition = prevGridTransition;
      if (cropLine) cropLine.style.display = prevLineDisplay;
    }

    updateCSSVariables(); 
    updateZoomUI();
    // この着地倍率＝「何も触っていない本来のオート」
    cameraDefaultAutoZoom = currentZoom;
    if (isCameraMode) {
      resetCameraCropToMax();
      updateCameraGuides();
      checkCameraHeaderCollision();
    }
  }

  function canCameraCropReachViewportAtMaxZoom() {
    const vp = getCameraVisibleBottomContentY();
    const content = getCameraContentMaxY();
    if (!(vp > 0) || !(content > 0) || !(currentZoom > 0)) return false;
    return content * (1.5 / currentZoom) >= vp - 0.5;
  }

  // 表示は戻す。今の窓でオートボタンを押したときの着地倍率だけ更新
  function refreshCameraDefaultAutoZoom() {
    if (!isCameraMode || isZoomAuto
      || cameraCropDragging || cameraCornerDragging || cameraWidthDragging || cameraLockDragging
      || players.length === 0
      || !canCameraCropReachViewportAtMaxZoom()) {
      flushCameraSizePresetInitialIfPending();
      return;
    }

    const savedZoom = currentZoom;
    const lineScrollAnchor = captureCameraLineScrollAnchor();
    const scrollSnap = captureGridScrollRatio();
    const cropLine = document.getElementById('cameraCropLine');
    const prevLineDisplay = cropLine ? cropLine.style.display : '';
    if (cropLine) cropLine.style.display = 'none';
    const grid = document.getElementById('playerGrid');
    const prevGridTransition = grid ? grid.style.transition : '';
    if (grid) grid.style.transition = 'none';
    holdCameraScaleObservers();

    currentZoom = 1.0;
    updateCSSVariables();
    render();
    try {
      const viewportBottom = getCameraVisibleBottomContentY();
      if (viewportBottom > 0) {
        executeAutoZoomToMatchBoundary(viewportBottom, { precise: true });
      }
      cameraDefaultAutoZoom = currentZoom;
    } finally {
      if (cropLine) cropLine.style.display = prevLineDisplay;
      currentZoom = savedZoom;
      updateCSSVariables();
      render();
      updateZoomUI();
      restoreGridScrollRatio(scrollSnap);
      restoreCameraLineScrollAnchor(lineScrollAnchor);
      if (grid) {
        void grid.offsetHeight;
        grid.style.transition = prevGridTransition;
      }
      updateCameraGuides();
      releaseCameraScaleObservers();
      flushCameraSizePresetInitialIfPending();
    }
  }

  function tryApplyCameraDefaultAutoZoom(vp) {
    if (!Number.isFinite(cameraDefaultAutoZoom) || !(vp > 0)) return false;
    if (Math.abs(currentZoom - cameraDefaultAutoZoom) < 0.0005) return true;
    const saved = currentZoom;
    currentZoom = cameraDefaultAutoZoom;
    updateCSSVariables();
    const grid = document.getElementById('playerGrid');
    if (grid) void grid.offsetHeight;
    if (cameraCropDragging || cameraCornerDragging) fitCameraCardTextScales();
    if (Math.abs(getCameraContentMaxY() - vp) <= 8) return true;
    currentZoom = saved;
    updateCSSVariables();
    if (grid) void grid.offsetHeight;
    if (cameraCropDragging || cameraCornerDragging) fitCameraCardTextScales();
    return false;
  }

  function cancelRefreshCameraDefaultAutoZoom() {
    if (cameraDefaultAutoZoomRefreshTimer) {
      clearTimeout(cameraDefaultAutoZoomRefreshTimer);
      cameraDefaultAutoZoomRefreshTimer = null;
    }
  }

  function scheduleRefreshCameraDefaultAutoZoom() {
    if (!isCameraMode || isZoomAuto) return;
    cancelRefreshCameraDefaultAutoZoom();
    cameraDefaultAutoZoomRefreshTimer = setTimeout(() => {
      cameraDefaultAutoZoomRefreshTimer = null;
      if (cameraRememberedYSettleRaf) {
        scheduleRefreshCameraDefaultAutoZoom();
        return;
      }
      refreshCameraDefaultAutoZoom();
    }, CAMERA_DEFAULT_AUTO_ZOOM_REFRESH_MS);
  }

  function updateCSSVariables() {
    document.documentElement.style.setProperty('--zoom-level', currentZoom);
    document.documentElement.style.setProperty('--inv-zoom', (1 / currentZoom).toFixed(3));
    
    let adjZoom;
    if (currentZoom < 1.0) {
      // 50〜100% → 見た目 75〜100%
      adjZoom = (0.75 + (currentZoom - 0.5) / 0.5 * 0.25) / currentZoom;
    } else if (currentZoom > 1.0) {
      // 100〜150% → 見た目 100〜125%
      adjZoom = (1.0 + (currentZoom - 1.0) / 0.5 * 0.25) / currentZoom;
    } else {
      adjZoom = 1.0;
    }
    document.documentElement.style.setProperty('--adj-zoom', adjZoom.toFixed(3));
    // 黒い箱(adj)の内側で ✔/□ペンを画面固定にするため、zoom×adj をまとめて打ち消す
    const invAdjZoom = 1 / (currentZoom * adjZoom);
    document.documentElement.style.setProperty('--inv-adj-zoom', invAdjZoom.toFixed(3));

    // カード余白：拡大時のみ100%見た目に固定。縮小側は従来どおりズームに追従。
    // player-card は grid zoom のみ。console 系は zoom×adj 配下なので inv-adj で換算。
    applyCardSpacingVars(document.documentElement, currentZoom, adjZoom, invAdjZoom);
  }

  // styleRoot: documentElement または撮影クローンの html 要素
  function applyCardSpacingVars(styleRoot, zoom, adjZoom, invAdjZoom) {
    if (!styleRoot || !styleRoot.style) return;
    const z = (typeof zoom === 'number' && zoom > 0) ? zoom : 1;
    const adj = (typeof adjZoom === 'number' && adjZoom > 0) ? adjZoom : 1;
    const invAdj = (typeof invAdjZoom === 'number' && invAdjZoom > 0)
      ? invAdjZoom
      : (1 / (z * adj));
    if (z > 1) {
      const invZ = 1 / z;
      styleRoot.style.setProperty('--card-pad', `${(16 * invZ).toFixed(4)}px`);
      styleRoot.style.setProperty('--card-gap', `${(16 * invZ).toFixed(4)}px`);
      styleRoot.style.setProperty('--console-gap', `${(8 * invAdj).toFixed(4)}px`);
      styleRoot.style.setProperty('--console-pad-top', `${(16 * invAdj).toFixed(4)}px`);
      styleRoot.style.setProperty('--console-bleed', `${(16 * invAdj).toFixed(4)}px`);
    } else {
      styleRoot.style.setProperty('--card-pad', '16px');
      styleRoot.style.setProperty('--card-gap', '16px');
      styleRoot.style.setProperty('--console-gap', '8px');
      styleRoot.style.setProperty('--console-pad-top', '16px');
      // カード padding 16 を console の adj-zoom 空間へ換算（従来の 16/adj）
      styleRoot.style.setProperty('--console-bleed', `${(16 / adj).toFixed(4)}px`);
    }
  }


  /* =========================================================
     ★ 新たなD&Dロジック
  ========================================================= */
  function isNodeBefore(nodeA, nodeB) {
    if (!nodeA || !nodeB) return false;
    return !!(nodeA.compareDocumentPosition(nodeB) & Node.DOCUMENT_POSITION_FOLLOWING);
  }

  function getChildrenRects(container) {
    const rects = new Map();
    Array.from(container.children).forEach(child => {
      rects.set(child, child.getBoundingClientRect());
    });
    return rects;
  }

  function getCardRectsById(container) {
    const rects = new Map();
    if (!container) return rects;
    container.querySelectorAll('.player-card').forEach(card => {
      if (card.dataset.id) rects.set(card.dataset.id, card.getBoundingClientRect());
    });
    return rects;
  }

  function animateCardsFlip(firstById) {
    const grid = document.getElementById('playerGrid');
    if (!grid || !firstById || firstById.size === 0) return;

    Array.from(grid.querySelectorAll('.player-card')).forEach(card => {
      const first = firstById.get(card.dataset.id);
      if (!first) return;
      const last = card.getBoundingClientRect();
      const dx = (first.left - last.left) / currentZoom;
      const dy = (first.top - last.top) / currentZoom;
      if (dx === 0 && dy === 0) return;

      card.style.setProperty('transition', 'none', 'important');
      card.style.transform = `translate(${dx}px, ${dy}px)`;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          card.style.setProperty('transition', `transform var(--drag-anim-speed) cubic-bezier(0.4, 0, 0.2, 1)`, 'important');
          card.style.transform = 'translate(0, 0)';
          setTimeout(() => {
            card.style.removeProperty('transition');
            card.style.transform = '';
          }, 250);
        });
      });
    });
  }

  const CAMERA_HIDE_FLIP_GUIDES_MS = 300;

  function cancelCameraHideFlipGuidesHold() {
    if (cameraHideFlipGuidesTimer) {
      clearTimeout(cameraHideFlipGuidesTimer);
      cameraHideFlipGuidesTimer = null;
    }
    cameraHideFlipGuidesHold = false;
  }

  function beginCameraHideFlipGuidesHold() {
    cancelCameraHideFlipGuidesHold();
    cameraHideFlipGuidesHold = true;
    cameraHideFlipGuidesTimer = setTimeout(() => {
      cameraHideFlipGuidesTimer = null;
      cameraHideFlipGuidesHold = false;
      if (!isCameraMode) return;
      updateCameraGuides();
      checkCameraHeaderCollision();
    }, CAMERA_HIDE_FLIP_GUIDES_MS);
  }

  function syncCardPlaceholderFrame(el) {
    if (!el) return;
    const NS = 'http://www.w3.org/2000/svg';
    let svg = el.querySelector('svg.card-placeholder-frame');
    if (!svg) {
      svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'card-placeholder-frame');
      svg.setAttribute('aria-hidden', 'true');
      svg.appendChild(document.createElementNS(NS, 'rect'));
      el.appendChild(svg);
    }
    const rect = svg.querySelector('rect');
    const w = el.clientWidth;
    const h = el.clientHeight;
    if (w < 1 || h < 1) return;
    // 画面上で太さ2・周期20（16+4）固定。grid の zoom を inv で打ち消す
    const z = (Number.isFinite(currentZoom) && currentZoom > 0) ? currentZoom : 1;
    const invZ = 1 / z;
    const sw = 2 * invZ;
    const targetPeriod = 20 * invZ;
    const rx = Math.max(0, 8 - sw / 2);
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    rect.setAttribute('x', String(sw / 2));
    rect.setAttribute('y', String(sw / 2));
    rect.setAttribute('width', String(Math.max(0, w - sw)));
    rect.setAttribute('height', String(Math.max(0, h - sw)));
    rect.setAttribute('rx', String(rx));
    rect.setAttribute('fill', 'none');
    rect.setAttribute('stroke', '#808080');
    rect.setAttribute('stroke-width', String(sw));
    let peri = 0;
    try { peri = rect.getTotalLength(); } catch (_) {}
    const n = Math.max(1, Math.round(peri > 0 ? peri / targetPeriod : 1));
    const period = peri > 0 ? peri / n : targetPeriod;
    rect.setAttribute('stroke-dasharray', `${period * 0.8} ${period * 0.2}`);
    // 左上角の中心に点の中心を置く → 上辺・左辺の隙間が角から同じ距離
    const boxW = Math.max(0, w - sw);
    const boxH = Math.max(0, h - sw);
    const R = Math.min(rx, boxW / 2, boxH / 2);
    const sTlMid = peri > 0 ? peri - (Math.PI * R) / 4 : 0;
    let offset = period * 0.4 - sTlMid;
    if (period > 0) {
      offset = ((offset % period) + period) % period;
    }
    rect.setAttribute('stroke-dashoffset', String(offset));
  }

  function syncBottomBarAddPlaceholderFrame() {
    const btn = document.getElementById('bottomBarAddPlaceholder');
    const rect = btn && btn.querySelector('.add-placeholder-frame rect');
    if (!btn || !rect) return;
    const w = 64;
    const h = 32;
    const sw = 2;
    const targetPeriod = 8;
    const rx = Math.max(0, 4 - sw / 2);
    const svg = rect.ownerSVGElement;
    if (svg) svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    rect.setAttribute('x', String(sw / 2));
    rect.setAttribute('y', String(sw / 2));
    rect.setAttribute('width', String(Math.max(0, w - sw)));
    rect.setAttribute('height', String(Math.max(0, h - sw)));
    rect.setAttribute('rx', String(rx));
    rect.setAttribute('fill', 'none');
    rect.setAttribute('stroke', 'currentColor');
    rect.setAttribute('stroke-width', String(sw));
    let peri = 0;
    try { peri = rect.getTotalLength(); } catch (_) {}
    const n = Math.max(1, Math.round(peri > 0 ? peri / targetPeriod : 1));
    const period = peri > 0 ? peri / n : targetPeriod;
    rect.setAttribute('stroke-dasharray', `${period * 0.5} ${period * 0.5}`);
    const boxW = Math.max(0, w - sw);
    const boxH = Math.max(0, h - sw);
    const R = Math.min(rx, boxW / 2, boxH / 2);
    const sTlMid = peri > 0 ? peri - (Math.PI * R) / 4 : 0;
    let offset = period * 0.25 - sTlMid;
    if (period > 0) {
      offset = ((offset % period) + period) % period;
    }
    rect.setAttribute('stroke-dashoffset', String(offset));
  }

  function updateGridPlaceholderFromPoint(clientX, clientY) {
    const grid = document.getElementById('playerGrid');
    if (!grid || !placeholderElement || dragLock || !draggedPlayerId) return;

    const hit = document.elementFromPoint(clientX, clientY);
    const targetCard = hit && hit.closest
      ? hit.closest('#playerGrid .player-card:not(.is-hidden-dragging)')
      : null;
    if (!targetCard || !grid.contains(targetCard)) return;

    const rect = targetCard.getBoundingClientRect();
    const placeholderRect = placeholderElement.getBoundingClientRect();
    const isMovingForward = isNodeBefore(placeholderElement, targetCard);

    let shouldMove = false;
    let insertAfter = false;
    const isSameRow = Math.abs(rect.top - placeholderRect.top) < (rect.height / 2);

    if (isListMode || currentCols === 1 || !isSameRow) {
      if (isMovingForward) {
        shouldMove = clientY > rect.top + rect.height * DND_THRESHOLD;
        insertAfter = true;
      } else {
        shouldMove = clientY < rect.bottom - rect.height * DND_THRESHOLD;
        insertAfter = false;
      }
    } else {
      if (isMovingForward) {
        shouldMove = clientX > rect.left + rect.width * DND_THRESHOLD;
        insertAfter = true;
      } else {
        shouldMove = clientX < rect.right - rect.width * DND_THRESHOLD;
        insertAfter = false;
      }
    }

    if (!shouldMove) return;
    if (insertAfter && placeholderElement.nextSibling === targetCard.nextSibling) return;
    if (!insertAfter && placeholderElement.previousSibling === targetCard.previousSibling) return;

    dragLock = true;
    setTimeout(() => { dragLock = false; }, 150);

    const firstRects = getChildrenRects(grid);
    if (insertAfter) targetCard.after(placeholderElement);
    else targetCard.before(placeholderElement);
    syncCardPlaceholderFrame(placeholderElement);
    const lastRects = getChildrenRects(grid);

    Array.from(grid.children).forEach(child => {
      if (child === placeholderElement) return;
      const first = firstRects.get(child);
      const last = lastRects.get(child);
      if (!first || !last) return;

      const dx = (first.left - last.left) / currentZoom;
      const dy = (first.top - last.top) / currentZoom;
      if (dx === 0 && dy === 0) return;

      child.style.transition = 'none';
      child.style.transform = `translate(${dx}px, ${dy}px)`;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          child.style.transition = `transform var(--drag-anim-speed) cubic-bezier(0.4, 0, 0.2, 1)`;
          child.style.transform = 'translate(0,0)';
          setTimeout(() => {
            child.style.transition = '';
            child.style.transform = '';
          }, 250);
        });
      });
    });
  }

  function finishGridPointerDrag(commit) {
    const ptr = gridPtrDrag;
    gridPtrDrag = null;
    if (!ptr) return;

    window.removeEventListener('pointermove', ptr.onMove);
    window.removeEventListener('pointerup', ptr.onUp);
    window.removeEventListener('pointercancel', ptr.onCancel);
    if (ptr.raf) {
      cancelAnimationFrame(ptr.raf);
      ptr.raf = 0;
    }
    if (customDragGhost) {
      if (customDragGhost.parentNode) customDragGhost.parentNode.removeChild(customDragGhost);
      customDragGhost = null;
    }
    dragLock = false;
    clearPointerDragCursor();
    if (ptr.card) ptr.card._suppressClick = false;

    const grid = document.getElementById('playerGrid');
    const didDrag = ptr.active;
    const playerId = ptr.playerId;

    if (!didDrag || !commit || !playerId || !placeholderElement || !grid || !placeholderElement.parentNode) {
      if (placeholderElement && placeholderElement.parentNode) placeholderElement.remove();
      placeholderElement = null;
      const hiddenCard = grid && grid.querySelector('.is-hidden-dragging');
      if (hiddenCard) hiddenCard.classList.remove('is-hidden-dragging');
      draggedPlayerId = null;
      dragStartOrderIds = null;
      return;
    }

    const newOrderIds = [];
    grid.childNodes.forEach(node => {
      if (node === placeholderElement) {
        newOrderIds.push(String(playerId));
      } else if (node.classList && node.classList.contains('player-card') && !node.classList.contains('is-hidden-dragging')) {
        newOrderIds.push(String(node.dataset.id));
      }
    });

    placeholderElement.remove();
    placeholderElement = null;
    const hiddenCard = grid.querySelector('.is-hidden-dragging');
    if (hiddenCard) hiddenCard.classList.remove('is-hidden-dragging');

    const prevOrderIds = (dragStartOrderIds && dragStartOrderIds.length)
      ? dragStartOrderIds
      : players.map(p => String(p.id));
    const orderChanged = newOrderIds.length !== prevOrderIds.length ||
      newOrderIds.some((id, i) => id !== prevOrderIds[i]);

    draggedPlayerId = null;
    dragStartOrderIds = null;

    if (!orderChanged) {
      applyRenderSettings();
      return;
    }

    players.sort((a, b) => newOrderIds.indexOf(String(a.id)) - newOrderIds.indexOf(String(b.id)));
    players.forEach((player, idx) => { player.baseOrder = idx; });
    sortMode = 'custom';
    saveSortModesToStorage();
    updateSortMenuUI();
    needSort = false;
    applyRenderSettings();
    syncDb();
  }

  function activateGridPointerDrag(ptr) {
    if (ptr.active) return;
    ptr.pending = false;
    ptr.active = true;
    ptr.card._suppressClick = true;

    const card = ptr.card;
    const p = ptr.player;
    draggedPlayerId = p.id;
    dragStartOrderIds = players.map(pl => String(pl.id));

    const rect = card.getBoundingClientRect();
    const unzoomedWidth = rect.width / currentZoom;
    const unzoomedHeight = rect.height / currentZoom;
    ptr.ghostW = unzoomedWidth;
    ptr.ghostH = unzoomedHeight;

    const cloneWrap = document.createElement('div');
    cloneWrap.className = 'custom-drag-ghost';
    cloneWrap.style.position = 'fixed';
    cloneWrap.style.width = unzoomedWidth + 'px';
    cloneWrap.style.height = unzoomedHeight + 'px';
    cloneWrap.style.zIndex = '100000';
    cloneWrap.style.pointerEvents = 'none';
    cloneWrap.style.zoom = currentZoom;

    const clone = card.cloneNode(true);
    clone.classList.remove('is-hidden-dragging', 'active');
    const grid = document.getElementById('playerGrid');
    if (isCameraMode && grid && grid.classList.contains('score-left')) clone.classList.add('camera-score-left');
    clone.style.margin = '0';
    clone.style.width = '100%';
    clone.style.height = '100%';
    cloneWrap.appendChild(clone);
    document.body.appendChild(cloneWrap);
    customDragGhost = cloneWrap;

    placeholderElement = document.createElement('div');
    placeholderElement.className = 'card-placeholder';
    placeholderElement.style.height = unzoomedHeight + 'px';
    card.classList.add('is-hidden-dragging');
    if (card.parentNode) card.parentNode.insertBefore(placeholderElement, card);
    requestAnimationFrame(() => syncCardPlaceholderFrame(placeholderElement));

    setPointerDragCursor(true);
    tickGridPointerDrag(ptr);
  }

  function tickGridPointerDrag(ptr) {
    if (!ptr.active || !customDragGhost) return;
    const curMouseX = ptr.lastX / currentZoom;
    const curMouseY = ptr.lastY / currentZoom;
    // 掴んだ瞬間からカーソル中心にゴーストを固定
    customDragGhost.style.left = (curMouseX - ptr.ghostW / 2) + 'px';
    customDragGhost.style.top = (curMouseY - ptr.ghostH / 2) + 'px';

    const wrapper = document.querySelector('.grid-wrapper');
    let allowed = false;
    if (wrapper) {
      const wr = wrapper.getBoundingClientRect();
      allowed = ptr.lastX >= wr.left && ptr.lastX <= wr.right && ptr.lastY >= wr.top && ptr.lastY <= wr.bottom;
    }
    setPointerDragCursor(allowed);
    if (allowed) updateGridPlaceholderFromPoint(ptr.lastX, ptr.lastY);
  }

  function beginGridCardPointerDrag(e, card, p) {
    if (gridPtrDrag || mgrPtrDrag) return;
    if (e.button !== 0) return;
    if (isCameraHideMode) return;
    if (e.target.closest('.card-console, .btn-wait, .edit-btn, .score-edit-btn, .name-edit-container, button, input')) return;

    const ptr = {
      pointerId: e.pointerId,
      card,
      player: p,
      playerId: p.id,
      startX: e.clientX,
      startY: e.clientY,
      lastX: e.clientX,
      lastY: e.clientY,
      pending: true,
      active: false,
      raf: 0,
      ghostW: 0,
      ghostH: 0
    };
    gridPtrDrag = ptr;

    const onMove = (ev) => {
      if (ev.pointerId !== ptr.pointerId) return;
      ptr.lastX = ev.clientX;
      ptr.lastY = ev.clientY;
      if (ptr.pending) {
        const dx = ev.clientX - ptr.startX;
        const dy = ev.clientY - ptr.startY;
        if (dx * dx + dy * dy < PTR_DRAG_THRESHOLD_PX * PTR_DRAG_THRESHOLD_PX) return;
        activateGridPointerDrag(ptr);
      }
      if (!ptr.active) return;
      if (ptr.raf) return;
      ptr.raf = requestAnimationFrame(() => {
        ptr.raf = 0;
        tickGridPointerDrag(ptr);
      });
    };
    const onUp = (ev) => {
      if (ev.pointerId !== ptr.pointerId) return;
      finishGridPointerDrag(true);
    };
    const onCancel = (ev) => {
      if (ev.pointerId !== ptr.pointerId) return;
      finishGridPointerDrag(false);
    };
    ptr.onMove = onMove;
    ptr.onUp = onUp;
    ptr.onCancel = onCancel;
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  }

  function executeSort() {
    if (sortMode === 'rank') {
      players.sort((a, b) => { if (b.score !== a.score) return b.score - a.score; return a.baseOrder - b.baseOrder; });
    } else if (sortMode === 'name') {
      players.sort((a, b) => { const byName = a.name.localeCompare(b.name, 'ja'); return byName !== 0 ? byName : a.baseOrder - b.baseOrder; });
    } else {
      players.sort((a, b) => a.baseOrder - b.baseOrder); 
    }
    needSort = false; 
    
    applyRenderSettings();
  }

  function updateSortMenuUI() {
    invalidateHeaderBaseWidthsCache();
    const label = document.getElementById('sortMenuLabel');
    if (label) label.textContent = SORT_MODE_LABELS[sortMode] || '順位';
    document.querySelectorAll('#sortMenuDropdown .sort-menu-item').forEach(item => {
      item.classList.toggle('active', item.dataset.mode === sortMode);
      bindHeaderMenuItemHover(item);
    });
    requestAnimationFrame(() => {
      fitBtnFitLabel(document.getElementById('sortMenuTrigger'));
      checkHeaderCollision();
      checkCameraHeaderCollision();
    });
  }

  function toggleSortMenu(e) {
    if (!dataReady) return;
    if (headerMenuPickGuard) return;
    if (e) e.stopPropagation();
    cancelDeferredClick(ZOOM_VALUE_CLICK_KEY);
    closeAllHeaderSelectMenus();
    closeCameraSizeDropdownMenus();
    const dropdown = document.getElementById('sortMenuDropdown');
    if (!dropdown.classList.contains('hidden')) {
      closeSortMenu();
      return;
    }

    const trigger = document.getElementById('sortMenuTrigger');
    const rect = trigger.getBoundingClientRect();
    document.body.appendChild(dropdown);
    dropdown.style.left = rect.left + 'px';
    dropdown.style.top = rect.bottom + 'px';
    dropdown.style.width = rect.width + 'px';
    dropdown.classList.remove('hidden');
    prepareSharedDropdownMenu(dropdown);
    syncHeaderMenuBlocker();
  }

  function closeSortMenu() {
    const dropdown = document.getElementById('sortMenuDropdown');
    if (!dropdown) return;
    parkHeaderDropdown(dropdown, document.getElementById('sortMenu'));
    syncHeaderMenuBlocker();
  }

  function setSortMode(mode, e) {
    if (!dataReady) return;
    if (e) e.stopPropagation();
    armHeaderMenuPickGuard();
    closeSortMenu();
    if (!SORT_MODE_LABELS[mode] || sortMode === mode) return;
    sortMode = mode;
    saveSortModesToStorage();
    updateSortMenuUI();
    // 手動へ戻すときは baseOrder（最後の手動並び）を上書きせず、それで並べ直す
    needSort = true;
    executeSort();
    // 名前順に切り替えたら手動順は破棄（今の表示順＝名前順を baseOrder に書き込む）
    if (mode === 'name') {
      players.forEach((player, idx) => { player.baseOrder = idx; });
    }
    syncDb();
  }

  document.addEventListener('click', function(e) {
    if (e.target.closest('#headerMenuBlocker, #sortMenuDropdown, #colSelectDropdown, #zoomSelectDropdown')) return;
    if (!e.target.closest('#sortMenu')) closeSortMenu();
    if (!e.target.closest('#colSelectWrap, #colSelectDropdown')) closeHeaderSelectMenu('col');
    if (!e.target.closest('#zoomSelectWrap, #zoomSelectDropdown')) {
      cancelDeferredClick(ZOOM_VALUE_CLICK_KEY);
      closeHeaderSelectMenu('zoom');
    }
  });

  // メイン選択解除: 押した瞬間が機能 UI なら消さない。
  // 空きで押して選択中カード上で離したらキャンセル（消さない）。それ以外の空き押しは消す。
  const MAIN_CLEAR_INTERACTIVE = 'button, .btn, .header-btn, .sort-menu, select, input, textarea, .player-card, .btn-wait, .edit-btn, .score-edit-btn, .spinner-btn, .custom-spinner, .resizer, a, [role="button"]';
  let mainClearPress = null;
  document.getElementById('mainView').addEventListener('pointerdown', function(e) {
    if (e.button !== 0) return;
    if (isCameraMode) { mainClearPress = null; return; }
    mainClearPress = {
      pointerId: e.pointerId,
      onInteractive: !!e.target.closest(MAIN_CLEAR_INTERACTIVE)
    };
  }, true);
  document.getElementById('mainView').addEventListener('pointerup', function(e) {
    if (!mainClearPress || e.pointerId !== mainClearPress.pointerId) return;
    const press = mainClearPress;
    mainClearPress = null;
    if (isCameraMode) return;
    if (press.onInteractive) return;
    const top = document.elementFromPoint(e.clientX, e.clientY);
    const card = top && top.closest ? top.closest('#mainView .player-card.active') : null;
    if (card) return;
    if (activePlayerId == null && !(needSort && sortMode === 'rank')) return;
    activePlayerId = null;
    if (needSort && sortMode === 'rank') { executeSort(); } else { render(); }
  }, true);
  document.getElementById('mainView').addEventListener('pointercancel', function(e) {
    if (mainClearPress && e.pointerId === mainClearPress.pointerId) mainClearPress = null;
  }, true);

  function spinUp(inputId, pId = null) {
    if (!dataReady) return;
    const input = document.getElementById(inputId); if (!input) return;
    let val = parseInt(input.value, 10); if (isNaN(val)) val = 0;
    input.value = clampScore(val + 1);
    if (pId) { draftInputs[pId] = input.value; updateApplyBtnColorFor(pId); } 
    else if (inputId === 'customInput') { updateApplyBtnColor(); }
    else if (inputId === 'modalInput') { updateInputModalSubmitButton(); }
    fitSpinnerInput(input);
  }
  function spinDown(inputId, pId = null) {
    if (!dataReady) return;
    const input = document.getElementById(inputId); if (!input) return;
    let val = parseInt(input.value, 10); if (isNaN(val)) val = 0;
    input.value = clampScore(val - 1);
    if (pId) { draftInputs[pId] = input.value; updateApplyBtnColorFor(pId); } 
    else if (inputId === 'customInput') { updateApplyBtnColor(); }
    else if (inputId === 'modalInput') { updateInputModalSubmitButton(); }
    fitSpinnerInput(input);
  }

  function addScoreTo(id, points) {
    if (!dataReady) return;
    const p = players.find(x => x.id === id); if (!p) return;
    p.score = clampScore(p.score + points); needSort = true; applyRenderSettings(); syncDb();
  }
  function addScore(points) { if (!activePlayerId) return; addScoreTo(activePlayerId, points); }

  function isPresetEmptyValue(value) {
    if (value === '' || value == null) return true;
    const n = parseInt(value, 10);
    return !Number.isFinite(n) || n === 0;
  }

  function presetEditDisplayValue(value) {
    if (isPresetEmptyValue(value)) return '';
    return String(parseInt(value, 10));
  }

  function findPresetChipById(id) {
    const key = String(id);
    return customPresets.find(chip => String(chip.id) === key) || null;
  }

  function sortCustomPresets() {
    const numbered = [];
    const empties = [];
    customPresets.forEach(chip => {
      if (isPresetEmptyValue(chip.value)) empties.push(chip);
      else numbered.push(chip);
    });
    numbered.sort((a, b) => a.value - b.value);
    const next = numbered.concat(empties);
    let changed = next.length !== customPresets.length;
    if (!changed) {
      for (let i = 0; i < next.length; i++) {
        if (next[i] !== customPresets[i]) {
          changed = true;
          break;
        }
      }
    }
    customPresets = next;
    return changed;
  }

  function prunePresetsForPlay() {
    sortCustomPresets();
    const seen = new Set();
    customPresets = customPresets.filter(chip => {
      if (isPresetEmptyValue(chip.value)) return false;
      if (seen.has(chip.value)) return false;
      seen.add(chip.value);
      return true;
    });
    if (customPresets.length > PRESET_CHIP_MAX) customPresets = customPresets.slice(0, PRESET_CHIP_MAX);
  }

  function cancelPresetReorder() {
    presetSkipReorder = false;
    if (!presetReorderTimer) return;
    clearTimeout(presetReorderTimer);
    presetReorderTimer = 0;
  }

  function schedulePresetReorder() {
    if (presetReorderTimer) return;
    presetReorderTimer = setTimeout(() => {
      presetReorderTimer = 0;
      if (!isPresetEditing) return;
      if (!sortCustomPresets()) return;
      renderBottomBarPresetRow();
    }, 0);
  }

  function commitFocusedPresetInput() {
    const focused = document.querySelector('#bottomBarPresetRow .preset-edit-input:focus');
    if (focused) commitPresetEditInput(focused);
  }

  function commitPresetEditInput(input) {
    if (!input) return;
    const chip = findPresetChipById(input.dataset.presetId);
    if (!chip) return;
    const baseline = input.dataset.presetBaseline ?? '';
    const raw = String(input.value).trim();
    if (raw === '' || raw === '-') {
      input.value = baseline;
    } else {
      const n = parseInt(raw, 10);
      if (!Number.isFinite(n) || n === 0) {
        input.value = '';
        chip.value = '';
      } else {
        const clamped = clampPresetValue(n);
        input.value = String(clamped);
        chip.value = clamped;
      }
    }
    input.dataset.presetBaseline = input.value;
    persistCustomPresets();
    if (presetSkipReorder) {
      presetSkipReorder = false;
      return;
    }
    schedulePresetReorder();
  }

  function bindPresetEditInput(input, chip) {
    if (!input || !chip) return;
    input.dataset.presetId = String(chip.id);
    input.placeholder = '-999〜999';
    input.value = presetEditDisplayValue(chip.value);
    input.dataset.presetBaseline = input.value;
    const keepPresetEditSelectOnMouseUp = (e) => {
      e.preventDefault();
      input.removeEventListener('mouseup', keepPresetEditSelectOnMouseUp);
    };
    input.addEventListener('focus', () => {
      input.dataset.presetBaseline = input.value;
      if (input.value === '') return;
      input.select();
      input.addEventListener('mouseup', keepPresetEditSelectOnMouseUp);
    });
    input.addEventListener('input', () => enforcePresetLimit(input));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        input.value = input.dataset.presetBaseline ?? '';
        input.blur();
        return;
      }
      if (e.key !== 'Enter') return;
      e.preventDefault();
      commitPresetEditInput(input);
      input.blur();
    });
    input.addEventListener('blur', (e) => {
      input.removeEventListener('mouseup', keepPresetEditSelectOnMouseUp);
      if (presetRowRendering) return;
      const next = e.relatedTarget;
      if (next && next.closest && next.closest('#bottomBarPresetRow')) {
        const id = next.closest('[data-preset-id]') && next.closest('[data-preset-id]').dataset.presetId;
        if (id && findPresetChipById(id)) presetKeepFocusId = id;
      }
      commitPresetEditInput(input);
      if (next && next.closest && next.closest('#bottomBarPresetRow .preset-edit-input')) {
        cancelPresetReorder();
      }
    });
  }

  function setPresetEditing(on) {
    if (on) {
      if (isPresetEditing) return;
      isPresetEditing = true;
      renderBottomBarPresetRow();
      return;
    }
    finishPresetEditing();
  }

  function finishPresetEditing() {
    if (!isPresetEditing) return;
    cancelPresetReorder();
    commitFocusedPresetInput();
    flushPresetPendingRemove();
    prunePresetsForPlay();
    isPresetEditing = false;
    presetKeepFocusId = null;
    persistCustomPresets();
    renderBottomBarPresetRow();
  }

  function presetBarElVisible(el) {
    return !!(el && el.getClientRects().length);
  }

  function capturePresetLayoutRects() {
    const rects = new Map();
    document.querySelectorAll('#bottomBarPresetRow [data-preset-id]').forEach(el => {
      rects.set(el.dataset.presetId, el.getBoundingClientRect());
    });
    const done = document.getElementById('bottomBarDoneBtn');
    const add = document.getElementById('bottomBarAddPlaceholder');
    if (presetBarElVisible(done)) rects.set('__done', done.getBoundingClientRect());
    if (presetBarElVisible(add)) rects.set('__add', add.getBoundingClientRect());
    return rects;
  }

  function clearPresetFlipStyles() {
    const els = [
      document.getElementById('bottomBarDoneBtn'),
      document.getElementById('bottomBarAddPlaceholder'),
      ...document.querySelectorAll('#bottomBarPresetRow [data-preset-id]')
    ];
    els.forEach(el => {
      if (!el) return;
      el.style.removeProperty('transition');
      el.style.transform = '';
    });
  }

  function animatePresetLayoutFlip(firstById) {
    if (!firstById || firstById.size === 0) return;
    if (presetFlipClearTimer) {
      clearTimeout(presetFlipClearTimer);
      presetFlipClearTimer = 0;
    }
    clearPresetFlipStyles();
    const play = (el, key, centerY) => {
      if (!el || !presetBarElVisible(el)) return;
      const first = firstById.get(key);
      if (!first) return;
      const last = el.getBoundingClientRect();
      const dx = first.left - last.left;
      const dy = first.top - last.top;
      if (dx === 0 && dy === 0) return;
      const rest = centerY ? 'translateY(-50%)' : 'translate(0, 0)';
      const invert = centerY
        ? `translate(${dx}px, calc(-50% + ${dy}px))`
        : `translate(${dx}px, ${dy}px)`;
      el.style.setProperty('transition', 'none', 'important');
      el.style.transform = invert;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          el.style.setProperty('transition', `transform var(--drag-anim-speed) cubic-bezier(0.4, 0, 0.2, 1)`, 'important');
          el.style.transform = rest;
        });
      });
    };
    document.querySelectorAll('#bottomBarPresetRow [data-preset-id]').forEach(el => {
      play(el, el.dataset.presetId, false);
    });
    play(document.getElementById('bottomBarDoneBtn'), '__done', true);
    play(document.getElementById('bottomBarAddPlaceholder'), '__add', true);
    presetFlipClearTimer = setTimeout(() => {
      presetFlipClearTimer = 0;
      clearPresetFlipStyles();
    }, 250);
  }

  function flushPresetPendingRemove() {
    if (presetPendingRemoveTimer) {
      clearTimeout(presetPendingRemoveTimer);
      presetPendingRemoveTimer = 0;
    }
    if (presetPendingRemoveId == null) return;
    const id = presetPendingRemoveId;
    presetPendingRemoveId = null;
    customPresets = customPresets.filter(chip => String(chip.id) !== String(id));
    persistCustomPresets();
  }

  function addPresetFromPlaceholder() {
    cancelPresetReorder();
    commitFocusedPresetInput();
    const hadPending = presetPendingRemoveId != null;
    flushPresetPendingRemove();
    if (hadPending) renderBottomBarPresetRow();
    if (customPresets.length >= PRESET_CHIP_MAX) return;
    const firstById = capturePresetLayoutRects();
    isPresetEditing = true;
    const id = presetIdSeq++;
    customPresets.push({ id, value: '' });
    presetKeepFocusId = String(id);
    renderBottomBarPresetRow({ appearId: String(id) });
    animatePresetLayoutFlip(firstById);
  }

  function deletePresetChip(id) {
    cancelPresetReorder();
    const focused = document.querySelector('#bottomBarPresetRow .preset-edit-input:focus');
    if (focused) {
      const fid = focused.closest('[data-preset-id]') && focused.closest('[data-preset-id]').dataset.presetId;
      if (fid && fid !== String(id)) commitPresetEditInput(focused);
    }
    const wrap = document.querySelector(`#bottomBarPresetRow [data-preset-id="${id}"]`);
    if (!wrap) {
      flushPresetPendingRemove();
      customPresets = customPresets.filter(chip => String(chip.id) !== String(id));
      presetKeepFocusId = null;
      renderBottomBarPresetRow();
      return;
    }
    if (wrap.classList.contains('is-preset-removing')) return;
    if (presetPendingRemoveId != null) {
      flushPresetPendingRemove();
      renderBottomBarPresetRow();
      wrap = document.querySelector(`#bottomBarPresetRow [data-preset-id="${id}"]`);
      if (!wrap) {
        customPresets = customPresets.filter(chip => String(chip.id) !== String(id));
        presetKeepFocusId = null;
        renderBottomBarPresetRow();
        return;
      }
    }
    presetKeepFocusId = null;
    wrap.classList.add('is-preset-removing');
    void wrap.offsetWidth;
    wrap.classList.add('is-preset-removing-out');
    presetPendingRemoveId = id;
    presetPendingRemoveTimer = setTimeout(() => {
      presetPendingRemoveTimer = 0;
      const firstById = capturePresetLayoutRects();
      firstById.delete(String(id));
      const pending = presetPendingRemoveId;
      presetPendingRemoveId = null;
      if (pending != null) {
        customPresets = customPresets.filter(chip => String(chip.id) !== String(pending));
      }
      renderBottomBarPresetRow();
      animatePresetLayoutFlip(firstById);
    }, 100);
  }

  function isPresetEditChrome(el) {
    return !!(el && el.closest && el.closest('#bottomBarPresetRow, #bottomBarAddPlaceholder, #bottomBarDoneBtn'));
  }

  function isPresetFinishTarget(el) {
    if (!el || !el.closest) return false;
    if (isPresetEditChrome(el)) return false;
    return !!el.closest(MAIN_CLEAR_INTERACTIVE);
  }

  function swallowPresetCommitGesture(e) {
    if (!presetSwallowClickAfterCommit) return false;
    e.preventDefault();
    e.stopImmediatePropagation();
    return true;
  }

  document.addEventListener('pointerdown', function(e) {
    if (e.button === 0 && presetSwallowClickAfterCommit) {
      presetSwallowClickAfterCommit = false;
    }
    if (!isPresetEditing) return;
    if (e.button !== 0) return;
    const focused = document.querySelector('#bottomBarPresetRow .preset-edit-input:focus');
    if (focused && isPresetEditChrome(e.target) && e.target !== focused && !focused.contains(e.target)) {
      presetSkipReorder = true;
    }
    if (focused && !isPresetEditChrome(e.target)) {
      e.preventDefault();
      e.stopImmediatePropagation();
      presetSwallowClickAfterCommit = true;
      focused.blur();
      return;
    }
    if (!isPresetFinishTarget(e.target)) return;
    finishPresetEditing();
  }, true);
  document.addEventListener('pointerup', function(e) {
    swallowPresetCommitGesture(e);
  }, true);
  document.addEventListener('pointercancel', function(e) {
    if (!swallowPresetCommitGesture(e)) return;
    presetSwallowClickAfterCommit = false;
  }, true);
  document.addEventListener('click', function(e) {
    if (!swallowPresetCommitGesture(e)) return;
    presetSwallowClickAfterCommit = false;
  }, true);

  function createPresetPlayChipEl(value) {
    const display = presetEditDisplayValue(value);
    const n = parseInt(display, 10);
    const wrap = document.createElement('div');
    wrap.className = 'bottom-bar-preset-chip';
    wrap.innerHTML =
      `<button type="button" class="preset-minus" aria-label="減らす">` +
        `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18.93 L4 5.07 L20 5.07 Z"/></svg>` +
      `</button>` +
      `<button type="button" class="preset-plus" aria-label="増やす">` +
        `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.07 L4 18.93 L20 18.93 Z"/></svg>` +
      `</button>` +
      `<span class="preset-value"></span>`;
    wrap.querySelector('.preset-value').textContent = display;
    wrap.querySelector('.preset-minus').addEventListener('click', () => {
      if (!Number.isFinite(n) || n === 0) return;
      addScore(-n);
    });
    wrap.querySelector('.preset-plus').addEventListener('click', () => {
      if (!Number.isFinite(n) || n === 0) return;
      addScore(n);
    });
    return wrap;
  }

  function createPresetEditChipEl(chip) {
    const wrap = document.createElement('div');
    wrap.className = 'bottom-bar-preset-chip bottom-bar-preset-chip-edit';
    wrap.dataset.presetId = String(chip.id);
    wrap.innerHTML =
      `<input type="text" class="preset-edit-input" inputmode="numeric" aria-label="数値">` +
      `<button type="button" class="preset-delete" aria-label="削除">` +
        `<svg viewBox="0 0 8 8" width="8" height="8" aria-hidden="true">` +
          `<path d="M1 1 L7 7" stroke-width="2" stroke-linecap="butt"/>` +
          `<path d="M7 1 L1 7" stroke-width="2" stroke-linecap="butt"/>` +
        `</svg>` +
      `</button>`;
    bindPresetEditInput(wrap.querySelector('.preset-edit-input'), chip);
    const del = wrap.querySelector('.preset-delete');
    bindUiTip(del, `preset-del-${chip.id}`, UI_TIP_PRESET_DELETE);
    del.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.stopPropagation();
    });
    del.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      deletePresetChip(chip.id);
    });
    return wrap;
  }

  function renderBottomBarPresetRow(opts) {
    cancelPresetReorder();
    if (presetRowRaf) {
      cancelAnimationFrame(presetRowRaf);
      presetRowRaf = 0;
    }
    const appearId = opts && opts.appearId;
    const row = document.getElementById('bottomBarPresetRow');
    if (!row) return;
    if (isPresetEditing) sortCustomPresets();
    const keepId = presetKeepFocusId;
    presetKeepFocusId = null;
    presetRowRendering = true;
    let appearEl = null;
    try {
      row.replaceChildren();
      customPresets.forEach(chip => {
        if (!isPresetEditing && isPresetEmptyValue(chip.value)) return;
        row.appendChild(isPresetEditing ? createPresetEditChipEl(chip) : createPresetPlayChipEl(chip.value));
      });
      if (appearId) {
        appearEl = row.querySelector(`[data-preset-id="${appearId}"]`);
        if (appearEl) appearEl.classList.add('is-preset-adding');
      }
    } finally {
      presetRowRendering = false;
    }
    layoutBottomBarPresets();
    persistCustomPresets();
    if (appearEl) {
      void appearEl.offsetWidth;
      appearEl.classList.add('is-preset-adding-in');
      setTimeout(() => {
        appearEl.classList.remove('is-preset-adding', 'is-preset-adding-in');
      }, 150);
    }
    if (!isPresetEditing || !keepId) return;
    const el = row.querySelector(`[data-preset-id="${keepId}"] .preset-edit-input`);
    if (el) el.focus();
  }

  function presetVirtualEditCount() {
    return Math.max(1, customPresets.length);
  }

  function measurePresetEditZoneCollision(bar) {
    const left = bar.querySelector('.bottom-bar-side-left');
    const right = bar.querySelector('.bottom-bar-side-right');
    if (!left || !right) return false;
    const barRect = bar.getBoundingClientRect();
    if (barRect.width < 1) return false;
    const n = presetVirtualEditCount();
    const chipsW = n * 64 + (n - 1) * 8;
    const cx = barRect.left + barRect.width / 2;
    const zoneLeft = cx - chipsW / 2 - 72;
    const zoneRight = cx + chipsW / 2 + (n < PRESET_CHIP_MAX ? 72 : 0);
    const gap = 8;
    return zoneLeft <= left.getBoundingClientRect().right + gap
      || zoneRight >= right.getBoundingClientRect().left - gap;
  }

  function schedulePresetBarAutoFit() {
    if (!isZoomAuto || isCameraMode) return;
    if (presetBarAutoFitRaf) return;
    presetBarAutoFitRaf = requestAnimationFrame(() => {
      presetBarAutoFitRaf = 0;
      if (!isZoomAuto || isCameraMode) return;
      executeAutoFit();
    });
  }

  function syncBottomBarStacked() {
    const bar = document.getElementById('bottomBar');
    if (!bar) return false;
    const should = !!(isExtendedMode && !isCameraMode && measurePresetEditZoneCollision(bar));
    const was = bar.classList.contains('is-preset-stacked');
    if (was === should) return false;
    bar.style.transition = 'none';
    bar.classList.toggle('is-preset-stacked', should);
    void bar.offsetHeight;
    bar.style.transition = '';
    return true;
  }

  function layoutBottomBarPresets() {
    const bar = document.getElementById('bottomBar');
    const row = document.getElementById('bottomBarPresetRow');
    if (!bar) return;
    const empty = !isPresetEditing && customPresets.length === 0;
    bar.classList.toggle('is-preset-empty', empty);
    bar.classList.toggle('is-preset-editing', isPresetEditing);
    bar.classList.toggle('is-preset-full', customPresets.length >= PRESET_CHIP_MAX);
    const w = (!empty && row) ? row.offsetWidth : 0;
    bar.style.setProperty('--chips-w', `${w}px`);
    syncBottomBarAddPlaceholderFrame();
    fitBtnFitLabel(document.getElementById('bottomBarDoneBtn'));
    syncBottomBarPresetChipButtons();
    if (syncBottomBarStacked()) schedulePresetBarAutoFit();
  }

  function syncBottomBarPresetChipButtons() {
    const off = !dataReady || !activePlayerId;
    document.querySelectorAll('#bottomBarPresetRow .preset-minus, #bottomBarPresetRow .preset-plus').forEach(btn => {
      btn.disabled = off;
    });
  }

  function applyCustomScoreTo(id) {
    const input = document.getElementById(`customInput_${id}`); if(!input) return;
    const val = parseInt(input.value, 10);
    if (!isNaN(val) && val !== 0) { 
      addScoreTo(id, val); 
      draftInputs[id] = ''; 
    }
  }
  function applyCustomScore() {
    const input = document.getElementById('customInput');

  function toggleMinusFor(id) {

  function toggleMinus() {

  function clearInputFor(id) {

  function updateApplyBtnColor() {

  function toggleExtended() {
    isExtendedMode = !isExtendedMode;
    applyExtendedModeUI();
    saveSettings();
    checkHeaderCollision();
    applyRenderSettings({ skipHeaderCollision: true });
  }

  function checkCameraHeaderCollision() {
    if (!isCameraMode || isCameraHideMode) return;
    const header = document.getElementById('cameraHeader');
    const controls = document.getElementById('cameraControls');
    const exitBtn = document.getElementById('cameraExitBtn');
    const hideBtn = document.getElementById('cameraHideEntryBtn');
    if (!header || !controls) return;

    const EDGE = 24;
    const GAP_MAX = 32;
    const GAP_MIN = 16;
    const groups = Array.from(controls.children);

    const resetSideBtn = (btn, side) => {
      if (!btn) return;
      btn.style.zoom = '';
      btn.style.top = '50%';
      btn.style.transform = 'translateY(-50%)';
      if (side === 'right') {
        btn.style.right = EDGE + 'px';
        btn.style.left = '';
        btn.style.transformOrigin = 'center right';
      } else {
        btn.style.left = EDGE + 'px';
        btn.style.right = '';
        btn.style.transformOrigin = 'center left';
      }
    };

    groups.forEach(group => { group.style.zoom = 1; });
    resetSideBtn(exitBtn, 'right');
    resetSideBtn(hideBtn, 'left');
    controls.style.gap = GAP_MAX + 'px';
    controls.style.position = '';
    controls.style.left = '';
    controls.style.top = '';
    controls.style.transform = '';
    void controls.offsetWidth;

    const headerW = header.clientWidth;
    const exitW = exitBtn ? exitBtn.offsetWidth : 0;
    const hideW = hideBtn ? hideBtn.offsetWidth : 0;
    const groupSum = groups.reduce((sum, group) => sum + group.getBoundingClientRect().width, 0);
    const nInterGaps = Math.max(0, groups.length - 1);
    const sideGaps = 2; // 左ボタン↔先頭 / 末尾↔終了
    const totalGaps = nInterGaps + sideGaps;

    let gap = GAP_MAX;
    let scale = 1;
    let centered = true;
    let controlsLeft = 0;

    const controlsWidthAt = (g, s) => groupSum * s + nInterGaps * g;
    const hideRight = EDGE + hideW;
    const exitLeft = headerW - EDGE - exitW;
    const centeredControlsW = controlsWidthAt(GAP_MAX, 1);
    const centeredLeft = (headerW - centeredControlsW) / 2;
    const centeredRight = centeredLeft + centeredControlsW;
    const gapLeft = centeredLeft - hideRight;
    const gapRight = exitLeft - centeredRight;

    if (gapLeft >= GAP_MAX && gapRight >= GAP_MAX) {
      centered = true;
      gap = GAP_MAX;
      scale = 1;
    } else {
      centered = false;
      const packedLeft = exitLeft - GAP_MAX - centeredControlsW;
      const minLeft = hideRight + GAP_MAX;
      if (packedLeft >= minLeft) {
        gap = GAP_MAX;
        scale = 1;
        controlsLeft = packedLeft;
      } else {
        const equalGap = (headerW - 2 * EDGE - hideW - exitW - groupSum) / totalGaps;
        if (equalGap >= GAP_MIN) {
          gap = Math.min(GAP_MAX, equalGap);
          scale = 1;
          controlsLeft = EDGE + hideW + gap;
        } else {
          gap = GAP_MIN;
          const fixedGaps = totalGaps * GAP_MIN;
          scale = Math.max(0.3, (headerW - 2 * EDGE - fixedGaps) / (groupSum + hideW + exitW));
          controlsLeft = EDGE + hideW * scale + gap;
        }
      }
    }

    controls.style.gap = gap + 'px';
    groups.forEach(group => { group.style.zoom = scale; });

    // サイドボタンは zoom ではなく scale で縮め、縦位置は常にヘッダー中央に揃える
    if (exitBtn) {
      exitBtn.style.zoom = '';
      exitBtn.style.top = '50%';
      exitBtn.style.right = EDGE + 'px';
      exitBtn.style.left = '';
      exitBtn.style.transformOrigin = 'center right';
      exitBtn.style.transform = scale === 1 ? 'translateY(-50%)' : `translateY(-50%) scale(${scale})`;
    }
    if (hideBtn) {
      hideBtn.style.zoom = '';
      hideBtn.style.top = '50%';
      hideBtn.style.left = EDGE + 'px';
      hideBtn.style.right = '';
      hideBtn.style.transformOrigin = 'center left';
      hideBtn.style.transform = scale === 1 ? 'translateY(-50%)' : `translateY(-50%) scale(${scale})`;
    }

    if (centered) {
      controls.style.position = '';
      controls.style.left = '';
      controls.style.top = '';
      controls.style.transform = '';
    } else {
      controls.style.position = 'absolute';
      controls.style.left = controlsLeft + 'px';
      controls.style.top = '50%';
      controls.style.transform = 'translateY(-50%)';
    }
    fitBtnFitLabelButtons(header);
    fitBtnFitLabelButtons(document.getElementById('cameraBottom'));
  }

  function getCameraMaxFrameWidth() {
    const contentArea = document.querySelector('.content-area');
    return contentArea ? contentArea.clientWidth : window.innerWidth;
  }

  function getCameraScreenFrameHeight() {
    const wrapper = getCameraGridWrapper();
    return wrapper ? wrapper.clientHeight : 0;
  }

  function applyCameraFrameWidth() {
    const maxW = getCameraMaxFrameWidth();
    const resizer = document.getElementById('cameraFrameResizer');
    const follow = cameraFrameWidth == null && cameraWidthDragPreview == null;
    const preview = cameraWidthDragPreview;
    if (follow) {
      if (maxW + 0.5 < CAMERA_WIDTH_MIN) {
        document.documentElement.style.setProperty('--camera-frame-width', CAMERA_WIDTH_MIN + 'px');
      } else {
        document.documentElement.style.setProperty('--camera-frame-width', '100%');
      }
    } else {
      const w = Math.max(CAMERA_WIDTH_MIN, preview != null ? preview : cameraFrameWidth);
      document.documentElement.style.setProperty('--camera-frame-width', w + 'px');
    }
    if (resizer) {
      const atMax = isCameraMode && cameraFrameWidth == null
        && (preview == null || preview >= maxW - 0.5);
      resizer.classList.toggle('is-at-max', atMax);
      resizer.classList.toggle('is-follow', isCameraMode && previewCameraWidthIsFollow());
    }
  }

  function getCameraDisplayedFrameWidth() {
    const maxW = getCameraMaxFrameWidth();
    if (cameraFrameWidth == null) return maxW < CAMERA_WIDTH_MIN ? CAMERA_WIDTH_MIN : maxW;
    return cameraFrameWidth;
  }

  function beginCameraWidthPreview(clientX) {
    resetCameraWidthEdgeExpandState();
    cameraWidthDragStartW = getCameraDisplayedFrameWidth();
    cameraWidthDragPreview = cameraWidthDragStartW;
    cameraWidthDragMoved = false;
    cameraWidthDragStartX = Number.isFinite(clientX) ? clientX : null;
  }

  function getCameraLiveFrameWidth() {
    if (cameraWidthDragPreview != null && Number.isFinite(cameraWidthDragPreview)) {
      return cameraWidthDragPreview;
    }
    return getCameraDisplayedFrameWidth();
  }

  function isCameraWidthAtScreenRight() {
    const main = document.getElementById('mainArea');
    const area = document.querySelector('.content-area');
    if (!main || !area) return false;
    return main.getBoundingClientRect().right >= area.getBoundingClientRect().right - CAMERA_VIEWPORT_BOTTOM_EPS;
  }

  function getCameraEdgeLeftPx(clientX) {
    const area = document.querySelector('.content-area');
    if (!area || !Number.isFinite(clientX)) return 0;
    return area.getBoundingClientRect().right - clientX;
  }

  function scrollCameraContentToHorizontalEnd() {
    const area = document.querySelector('.content-area');
    if (!area) return;
    const maxScroll = area.scrollWidth - area.clientWidth;
    if (maxScroll > 0) area.scrollLeft = maxScroll;
  }

  function pinCameraWidthLineToScreenRight() {
    scrollCameraContentToHorizontalEnd();
    applyCameraFrameWidth();
    fitCameraCardTextScales();
    updateCameraGuides();
    checkCameraHeaderCollision();
    syncGridScrollX();
  }

  function getCameraWidthEdgePastPx(clientX) {
    const area = getCameraContentArea();
    if (!area || !Number.isFinite(clientX)) return 0;
    return clientX - area.getBoundingClientRect().right;
  }

  function isCameraWidthAtExpandEdge() {
    return isCameraWidthAtScreenRight();
  }

  function canCameraWidthGrowPastScreen() {
    return getCameraLiveFrameWidth() < getCameraSizeWidthMaxScreenPx() - 0.5;
  }

  function applyCameraWidthEdgePreview(width) {
    const cap = getCameraSizeWidthMaxScreenPx();
    cameraWidthDragPreview = Math.max(CAMERA_WIDTH_MIN, Math.min(cap, width));
    applyCameraFrameWidth();
    fitCameraCardTextScales();
  }

  function isCameraWidthEdgeBusy() {
    return cameraWidthEdgeExpanding || cameraWidthEdgeShrinking
      || cameraWidthEdgeExpandBlocked || cameraWidthEdgeShrinkBlocked
      || cameraWidthEdgeShrinkParkClientX != null;
  }

  function stopCameraWidthEdgeExpand() {
    cameraWidthEdgeExpanding = false;
    cameraWidthEdgeExpandLastTs = 0;
    if (cameraWidthEdgeExpandRaf) {
      cancelAnimationFrame(cameraWidthEdgeExpandRaf);
      cameraWidthEdgeExpandRaf = null;
    }
  }

  function stopCameraWidthEdgeShrink() {
    cameraWidthEdgeShrinking = false;
    cameraWidthEdgeShrinkLastTs = 0;
    if (cameraWidthEdgeShrinkRaf) {
      cancelAnimationFrame(cameraWidthEdgeShrinkRaf);
      cameraWidthEdgeShrinkRaf = null;
    }
  }

  function stopCameraWidthParkCatch() {
    cameraWidthParkCatchActive = false;
    cameraWidthParkCatchLastTs = 0;
    if (cameraWidthParkCatchRaf) {
      cancelAnimationFrame(cameraWidthParkCatchRaf);
      cameraWidthParkCatchRaf = null;
    }
  }

  function resetCameraWidthEdgeExpandState() {
    stopCameraWidthEdgeExpand();
    stopCameraWidthEdgeShrink();
    stopCameraWidthParkCatch();
    cameraWidthEdgeExpandVirtualW = 0;
    cameraWidthEdgeExpandSnapW = null;
    cameraWidthEdgeExpandHoldPx = 0;
    cameraWidthEdgeExpandPausedStep = null;
    cameraWidthEdgeExpandBlocked = false;
    cameraWidthEdgeExpandPeakClientX = null;
    cameraWidthEdgeExpandTroughClientX = null;
    cameraWidthEdgeShrinkVirtualW = 0;
    cameraWidthEdgeShrinkSnapW = null;
    cameraWidthEdgeShrinkHoldPx = 0;
    cameraWidthEdgeShrinkPausedStep = null;
    cameraWidthEdgeShrinkBlocked = false;
    cameraWidthEdgeShrinkPeakClientX = null;
    cameraWidthEdgeShrinkTroughClientX = null;
    cameraWidthEdgeShrinkParkClientX = null;
  }

  function getCameraWidthStepIfNear(w, dist) {
    if (!(Number.isFinite(w) && w > 0 && Number.isFinite(dist))) return null;
    const step = Math.round(w / CAMERA_WIDTH_STEP) * CAMERA_WIDTH_STEP;
    if (step < CAMERA_WIDTH_MIN - 0.5) return null;
    if (Math.abs(w - step) > dist) return null;
    return step;
  }

  // 端拡大・縮小の80刻み。壁から16以内と幅最小の16以内は無効（下点線と同じ）
  function isCameraWidthEdgeStepAllowed(stepW, screenRightW) {
    if (!Number.isFinite(stepW) || stepW < CAMERA_WIDTH_MIN - 0.5) return false;
    if (isCameraApproachingMinWall(stepW, CAMERA_WIDTH_MIN)) return false;
    if (screenRightW > 0 && Math.abs(stepW - screenRightW) <= CAMERA_SNAP_WALL_DISTANCE) return false;
    return true;
  }

  function armCameraWidthEdgeSnapFromW(kind) {
    if (kind === 'expand') {
      cameraWidthEdgeExpandSnapW = null;
      cameraWidthEdgeExpandPausedStep = null;
      cameraWidthEdgeExpandHoldPx = 0;
      return;
    }
    cameraWidthEdgeShrinkSnapW = null;
    cameraWidthEdgeShrinkPausedStep = null;
    cameraWidthEdgeShrinkHoldPx = 0;
  }

  function parkCameraWidthAtScreenFollow() {
    const maxW = getCameraMaxFrameWidth();
    cameraWidthDragPreview = maxW < CAMERA_WIDTH_MIN ? CAMERA_WIDTH_MIN : maxW;
    setCameraWidthViewportSnap(maxW);
    pinCameraWidthLineToScreenRight();
  }

  // ポインタで止めたときだけ80に合わせる（動いている途中はフィットしない）
  function settleCameraWidthEdgeAfterPointerStop(kind) {
    if (!isCameraHorizontalScrollActive()) {
      parkCameraWidthAtScreenFollow();
      return;
    }
    const virtualW = kind === 'expand'
      ? cameraWidthEdgeExpandVirtualW
      : cameraWidthEdgeShrinkVirtualW;
    let w = kind === 'expand' ? cameraWidthEdgeExpandSnapW : cameraWidthEdgeShrinkSnapW;
    if (w == null) {
      w = getCameraWidthStepIfNear(virtualW, CAMERA_SNAP_RELEASE_DISTANCE);
      if (w != null) {
        if (kind === 'expand') cameraWidthEdgeExpandSnapW = w;
        else cameraWidthEdgeShrinkSnapW = w;
      }
    }
    const maxW = getCameraMaxFrameWidth();
    if (w != null && !isCameraWidthEdgeStepAllowed(w, maxW)) w = null;
    if (w != null && Math.abs(getCameraLiveFrameWidth() - w) > 0.5) {
      applyCameraWidthEdgePreview(w);
    }
    pinCameraWidthLineToScreenRight();
  }

  function getCrossedCameraWidthStep(prevW, nextW, goingUp) {
    if (!(Number.isFinite(prevW) && Number.isFinite(nextW))) return null;
    if (goingUp) {
      const step = Math.floor(nextW / CAMERA_WIDTH_STEP) * CAMERA_WIDTH_STEP;
      if (step >= CAMERA_WIDTH_MIN && prevW < step && nextW >= step) return step;
      return null;
    }
    const step = Math.floor(prevW / CAMERA_WIDTH_STEP) * CAMERA_WIDTH_STEP;
    if (step >= CAMERA_WIDTH_MIN && prevW > step && nextW <= step) return step;
    return null;
  }

  function startCameraWidthEdgeExpand() {
    if (cameraWidthEdgeExpanding || !canCameraWidthGrowPastScreen()) return;
    stopCameraWidthEdgeShrink();
    stopCameraWidthParkCatch();
    cameraWidthEdgeShrinkBlocked = false;
    cameraWidthEdgeShrinkPeakClientX = null;
    cameraWidthEdgeShrinkTroughClientX = null;
    cameraWidthEdgeShrinkParkClientX = null;
    cameraWidthEdgeExpanding = true;
    cameraWidthDragMoved = true;
    setCameraWidthViewportSnap(getCameraMaxFrameWidth());
    cameraWidthEdgeExpandVirtualW = getCameraLiveFrameWidth();
    armCameraWidthEdgeSnapFromW('expand');
    cameraWidthEdgeExpandLastTs = 0;
    if (!cameraWidthEdgeExpandRaf) {
      cameraWidthEdgeExpandRaf = requestAnimationFrame(pumpCameraWidthEdgeExpand);
    }
  }

  function pumpCameraWidthEdgeExpand(ts) {
    cameraWidthEdgeExpandRaf = null;
    if (!cameraWidthEdgeExpanding || !isCameraMode
      || !(cameraWidthDragging || cameraCornerDragging)) {
      cameraWidthEdgeExpanding = false;
      cameraWidthEdgeExpandLastTs = 0;
      return;
    }
    const last = cameraWidthEdgeExpandLastTs || ts;
    cameraWidthEdgeExpandLastTs = ts;
    const dt = Math.min(48, Math.max(0, ts - last));
    const cap = getCameraSizeWidthMaxScreenPx();

    if (getCameraLiveFrameWidth() < cap - 1e-9) {
      const stepPx = MGR_AUTOSCROLL_SPEED_PX_S * (dt / 1000);
      const maxW = getCameraMaxFrameWidth();
      if (cameraWidthEdgeExpandSnapW != null
        && !isCameraWidthEdgeStepAllowed(cameraWidthEdgeExpandSnapW, maxW)) {
        cameraWidthEdgeExpandSnapW = null;
        cameraWidthEdgeExpandHoldPx = 0;
      }
      if (cameraWidthEdgeExpandSnapW != null && cameraWidthEdgeExpandHoldPx < CAMERA_WIDTH_STEP) {
        cameraWidthEdgeExpandHoldPx += stepPx;
        if (Math.abs(getCameraLiveFrameWidth() - cameraWidthEdgeExpandSnapW) > 0.5) {
          applyCameraWidthEdgePreview(cameraWidthEdgeExpandSnapW);
        }
        pinCameraWidthLineToScreenRight();
        if (cameraWidthEdgeExpanding && (cameraWidthDragging || cameraCornerDragging)) {
          cameraWidthEdgeExpandRaf = requestAnimationFrame(pumpCameraWidthEdgeExpand);
        }
        return;
      }

      const prevW = cameraWidthEdgeExpandVirtualW;
      cameraWidthEdgeExpandVirtualW += stepPx;
      if (cameraWidthEdgeExpandVirtualW > cap) cameraWidthEdgeExpandVirtualW = cap;
      const virtualW = cameraWidthEdgeExpandVirtualW;
      const crossed = getCrossedCameraWidthStep(prevW, virtualW, true);
      if (crossed != null && crossed !== cameraWidthEdgeExpandPausedStep
        && isCameraWidthEdgeStepAllowed(crossed, maxW)) {
        cameraWidthEdgeExpandVirtualW = crossed;
        cameraWidthEdgeExpandPausedStep = crossed;
        cameraWidthEdgeExpandSnapW = crossed;
        cameraWidthEdgeExpandHoldPx = 0;
        applyCameraWidthEdgePreview(crossed);
      } else {
        if (cameraWidthEdgeExpandSnapW != null
          && Math.abs(virtualW - cameraWidthEdgeExpandSnapW) >= CAMERA_SNAP_RELEASE_DISTANCE) {
          cameraWidthEdgeExpandSnapW = null;
        }
        if (Math.abs(getCameraLiveFrameWidth() - virtualW) > 0.5) {
          applyCameraWidthEdgePreview(virtualW);
        }
      }
    }

    pinCameraWidthLineToScreenRight();
    if (getCameraLiveFrameWidth() >= cap - 1e-9) return;
    if (cameraWidthEdgeExpanding && (cameraWidthDragging || cameraCornerDragging)) {
      cameraWidthEdgeExpandRaf = requestAnimationFrame(pumpCameraWidthEdgeExpand);
    }
  }

  function updateCameraWidthEdgeExpandFromClientX(clientX) {
    if (!(cameraWidthDragging || cameraCornerDragging) || !isCameraMode) {
      stopCameraWidthEdgeExpand();
      return;
    }
    if (!Number.isFinite(clientX)) return;
    const past = getCameraWidthEdgePastPx(clientX);
    const dead = CAMERA_CROP_POINTER_DEAD_PX;
    const canStart = isCameraWidthAtExpandEdge()
      && past > CAMERA_SNAP_RELEASE_DISTANCE
      && canCameraWidthGrowPastScreen();
    if (cameraWidthEdgeExpandBlocked) {
      if (cameraWidthEdgeExpandTroughClientX == null || clientX < cameraWidthEdgeExpandTroughClientX) {
        cameraWidthEdgeExpandTroughClientX = clientX;
      }
      if (canStart && clientX >= cameraWidthEdgeExpandTroughClientX + dead) {
        cameraWidthEdgeExpandBlocked = false;
        cameraWidthEdgeExpandTroughClientX = null;
        startCameraWidthEdgeExpand();
        cameraWidthEdgeExpandPeakClientX = clientX;
      } else if (past <= CAMERA_SNAP_RELEASE_DISTANCE) {
        cameraWidthEdgeExpandBlocked = false;
        cameraWidthEdgeExpandTroughClientX = null;
      }
      return;
    }
    if (cameraWidthEdgeExpanding) {
      if (cameraWidthEdgeExpandPeakClientX == null || clientX > cameraWidthEdgeExpandPeakClientX) {
        cameraWidthEdgeExpandPeakClientX = clientX;
      }
      if (clientX <= cameraWidthEdgeExpandPeakClientX - dead) {
        cameraWidthEdgeExpandBlocked = true;
        cameraWidthEdgeExpandTroughClientX = clientX;
        cameraWidthEdgeExpandPeakClientX = null;
        stopCameraWidthEdgeExpand();
        settleCameraWidthEdgeAfterPointerStop('expand');
      }
      return;
    }
    if (canStart) {
      startCameraWidthEdgeExpand();
      cameraWidthEdgeExpandPeakClientX = clientX;
    }
  }

  function startCameraWidthEdgeShrink() {
    if (cameraWidthEdgeShrinking || cameraWidthEdgeExpanding) return;
    if (!isCameraHorizontalScrollActive()) return;
    const live = getCameraLiveFrameWidth();
    if (!(live > CAMERA_WIDTH_MIN + 0.5)) return;
    cameraWidthEdgeExpandBlocked = false;
    cameraWidthEdgeExpandPeakClientX = null;
    cameraWidthEdgeExpandTroughClientX = null;
    cameraWidthEdgeShrinkParkClientX = null;
    cameraWidthEdgeShrinking = true;
    cameraWidthDragMoved = true;
    setCameraWidthViewportSnap(getCameraMaxFrameWidth());
    cameraWidthEdgeShrinkVirtualW = live;
    armCameraWidthEdgeSnapFromW('shrink');
    cameraWidthEdgeShrinkLastTs = 0;
    if (!cameraWidthEdgeShrinkRaf) {
      cameraWidthEdgeShrinkRaf = requestAnimationFrame(pumpCameraWidthEdgeShrink);
    }
  }

  function pumpCameraWidthEdgeShrink(ts) {
    cameraWidthEdgeShrinkRaf = null;
    if (!cameraWidthEdgeShrinking || !isCameraMode
      || !(cameraWidthDragging || cameraCornerDragging)) {
      cameraWidthEdgeShrinking = false;
      cameraWidthEdgeShrinkLastTs = 0;
      return;
    }
    const last = cameraWidthEdgeShrinkLastTs || ts;
    cameraWidthEdgeShrinkLastTs = ts;
    const dt = Math.min(48, Math.max(0, ts - last));
    const maxW = getCameraMaxFrameWidth();
    const floorW = CAMERA_WIDTH_MIN;

    if (!isCameraHorizontalScrollActive()) {
      if (getCameraLiveFrameWidth() > floorW + 0.5) {
        cameraWidthEdgeShrinkParkClientX = Number.isFinite(cameraWidthLastClientX)
          ? cameraWidthLastClientX
          : cameraWidthEdgeShrinkParkClientX;
        parkCameraWidthAtScreenFollow();
      }
      stopCameraWidthEdgeShrink();
      return;
    }

    if (cameraWidthEdgeShrinkVirtualW > floorW + 0.5) {
      const stepPx = MGR_AUTOSCROLL_SPEED_PX_S * (dt / 1000);
      if (cameraWidthEdgeShrinkSnapW != null
        && !isCameraWidthEdgeStepAllowed(cameraWidthEdgeShrinkSnapW, maxW)) {
        cameraWidthEdgeShrinkSnapW = null;
        cameraWidthEdgeShrinkHoldPx = 0;
      }
      if (cameraWidthEdgeShrinkSnapW != null && cameraWidthEdgeShrinkHoldPx < CAMERA_WIDTH_STEP) {
        cameraWidthEdgeShrinkHoldPx += stepPx;
        if (Math.abs(getCameraLiveFrameWidth() - cameraWidthEdgeShrinkSnapW) > 0.5) {
          applyCameraWidthEdgePreview(cameraWidthEdgeShrinkSnapW);
        }
        pinCameraWidthLineToScreenRight();
        if (cameraWidthEdgeShrinking && (cameraWidthDragging || cameraCornerDragging)) {
          cameraWidthEdgeShrinkRaf = requestAnimationFrame(pumpCameraWidthEdgeShrink);
        }
        return;
      }

      const prevW = cameraWidthEdgeShrinkVirtualW;
      cameraWidthEdgeShrinkVirtualW -= stepPx;
      if (cameraWidthEdgeShrinkVirtualW < floorW) cameraWidthEdgeShrinkVirtualW = floorW;
      const virtualW = cameraWidthEdgeShrinkVirtualW;
      const crossed = getCrossedCameraWidthStep(prevW, virtualW, false);
      if (crossed != null && crossed !== cameraWidthEdgeShrinkPausedStep
        && isCameraWidthEdgeStepAllowed(crossed, maxW)) {
        cameraWidthEdgeShrinkVirtualW = crossed;
        cameraWidthEdgeShrinkPausedStep = crossed;
        cameraWidthEdgeShrinkSnapW = crossed;
        cameraWidthEdgeShrinkHoldPx = 0;
        applyCameraWidthEdgePreview(crossed);
      } else {
