        if (cameraWidthEdgeShrinkSnapW != null
          && Math.abs(virtualW - cameraWidthEdgeShrinkSnapW) >= CAMERA_SNAP_RELEASE_DISTANCE) {
          cameraWidthEdgeShrinkSnapW = null;
        }
        if (Math.abs(getCameraLiveFrameWidth() - virtualW) > 0.5) {
          applyCameraWidthEdgePreview(virtualW);
        }
      }
    }

    setCameraWidthViewportSnap(maxW);
    pinCameraWidthLineToScreenRight();
    if (!isCameraHorizontalScrollActive() || getCameraLiveFrameWidth() <= floorW + 0.5) {
      if (getCameraLiveFrameWidth() > floorW + 0.5 && !isCameraHorizontalScrollActive()) {
        cameraWidthEdgeShrinkParkClientX = Number.isFinite(cameraWidthLastClientX)
          ? cameraWidthLastClientX
          : cameraWidthEdgeShrinkParkClientX;
        parkCameraWidthAtScreenFollow();
      }
      stopCameraWidthEdgeShrink();
      return;
    }
    if (cameraWidthEdgeShrinking && (cameraWidthDragging || cameraCornerDragging)) {
      cameraWidthEdgeShrinkRaf = requestAnimationFrame(pumpCameraWidthEdgeShrink);
    }
  }

  function startCameraWidthParkCatch() {
    const maxW = getCameraMaxFrameWidth();
    if (!(maxW > 0)) {
      stopCameraWidthParkCatch();
      return;
    }
    cameraWidthParkCatchActive = true;
    cameraWidthParkCatchW = maxW < CAMERA_WIDTH_MIN ? CAMERA_WIDTH_MIN : maxW;
    cameraWidthParkCatchLastTs = 0;
    if (!cameraWidthParkCatchRaf) {
      cameraWidthParkCatchRaf = requestAnimationFrame(pumpCameraWidthParkCatch);
    }
  }

  function pumpCameraWidthParkCatch(ts) {
    cameraWidthParkCatchRaf = null;
    if (!cameraWidthParkCatchActive || !isCameraMode
      || !(cameraWidthDragging || cameraCornerDragging)) {
      stopCameraWidthParkCatch();
      return;
    }
    const contentArea = getCameraContentArea();
    if (!contentArea || !Number.isFinite(cameraWidthLastClientX)) {
      stopCameraWidthParkCatch();
      return;
    }
    const left = contentArea.getBoundingClientRect().left;
    const targetW = Math.max(
      CAMERA_WIDTH_MIN,
      Math.min(getCameraMaxFrameWidth(), cameraWidthLastClientX - left)
    );
    const last = cameraWidthParkCatchLastTs || ts;
    cameraWidthParkCatchLastTs = ts;
    const dt = Math.min(48, Math.max(0, ts - last));
    const step = CAMERA_PARK_CATCH_SPEED_PX_S * (dt / 1000);
    const dist = targetW - cameraWidthParkCatchW;
    if (Math.abs(dist) <= 0.5) {
      cameraWidthParkCatchW = targetW;
      applyCameraWidthDragClientX(left + cameraWidthParkCatchW);
      stopCameraWidthParkCatch();
      return;
    }
    const dir = dist > 0 ? 1 : -1;
    cameraWidthParkCatchW += dir * Math.min(step, Math.abs(dist));
    applyCameraWidthDragClientX(left + cameraWidthParkCatchW);
    if (Math.abs(targetW - cameraWidthParkCatchW) <= 0.5) {
      stopCameraWidthParkCatch();
      return;
    }
    cameraWidthParkCatchRaf = requestAnimationFrame(pumpCameraWidthParkCatch);
  }

  function updateCameraWidthEdgeShrinkFromClientX(clientX) {
    if (!(cameraWidthDragging || cameraCornerDragging) || !isCameraMode) {
      stopCameraWidthEdgeShrink();
      return;
    }
    if (cameraWidthEdgeExpanding) {
      stopCameraWidthEdgeShrink();
      return;
    }
    if (!Number.isFinite(clientX)) return;
    const inward = getCameraEdgeLeftPx(clientX);
    const dead = CAMERA_CROP_POINTER_DEAD_PX;
    const canStart = isCameraWidthAtExpandEdge() && isCameraHorizontalScrollActive()
      && inward > CAMERA_SNAP_RELEASE_DISTANCE
      && getCameraLiveFrameWidth() > CAMERA_WIDTH_MIN + 0.5;
    if (cameraWidthEdgeShrinkParkClientX != null) {
      const parkX = cameraWidthEdgeShrinkParkClientX;
      if (clientX <= parkX - CAMERA_SNAP_RELEASE_DISTANCE) {
        cameraWidthEdgeShrinkParkClientX = null;
        startCameraWidthParkCatch();
      }
      return;
    }
    if (cameraWidthEdgeShrinkBlocked) {
      if (!isCameraHorizontalScrollActive() || inward <= CAMERA_SNAP_RELEASE_DISTANCE) {
        cameraWidthEdgeShrinkBlocked = false;
        cameraWidthEdgeShrinkTroughClientX = null;
        cameraWidthEdgeShrinkPeakClientX = null;
        return;
      }
      if (cameraWidthEdgeShrinkTroughClientX == null || clientX > cameraWidthEdgeShrinkTroughClientX) {
        cameraWidthEdgeShrinkTroughClientX = clientX;
      }
      if (canStart && clientX <= cameraWidthEdgeShrinkTroughClientX - dead) {
        cameraWidthEdgeShrinkBlocked = false;
        cameraWidthEdgeShrinkTroughClientX = null;
        startCameraWidthEdgeShrink();
        cameraWidthEdgeShrinkPeakClientX = clientX;
      }
      return;
    }
    if (cameraWidthEdgeShrinking) {
      if (!isCameraHorizontalScrollActive()) {
        cameraWidthEdgeShrinkParkClientX = clientX;
        stopCameraWidthEdgeShrink();
        parkCameraWidthAtScreenFollow();
        return;
      }
      if (cameraWidthEdgeShrinkPeakClientX == null || clientX < cameraWidthEdgeShrinkPeakClientX) {
        cameraWidthEdgeShrinkPeakClientX = clientX;
      }
      if (clientX >= cameraWidthEdgeShrinkPeakClientX + dead) {
        cameraWidthEdgeShrinkBlocked = true;
        cameraWidthEdgeShrinkTroughClientX = clientX;
        cameraWidthEdgeShrinkPeakClientX = null;
        stopCameraWidthEdgeShrink();
        settleCameraWidthEdgeAfterPointerStop('shrink');
      }
      return;
    }
    if (canStart) {
      startCameraWidthEdgeShrink();
      cameraWidthEdgeShrinkPeakClientX = clientX;
    }
  }

  function updateCameraWidthEdgeFromClientX(clientX) {
    if (Number.isFinite(clientX)) cameraWidthLastClientX = clientX;
    updateCameraWidthEdgeShrinkFromClientX(clientX);
    updateCameraWidthEdgeExpandFromClientX(clientX);
  }

  function shouldApplyCameraWidthDragClientX() {
    return !cameraWidthEdgeExpanding && !cameraWidthEdgeShrinking && !cameraWidthParkCatchActive;
  }

  function commitCameraWidthAfterDrag(didMove) {
    const maxW = getCameraMaxFrameWidth();
    const cap = getCameraSizeWidthMaxScreenPx();
    const preview = cameraWidthDragPreview;
    resetCameraWidthEdgeExpandState();
    cameraWidthDragPreview = null;
    cameraWidthDragStartW = null;
    cameraWidthDragStartX = null;
    cameraWidthLastClientX = null;
    const moved = didMove;
    cameraWidthDragMoved = false;
    if (moved && !isCameraAspectLockOn()) forgetCameraAspectLockRemembered();
    if (moved && preview != null && Number.isFinite(preview)) {
      if (preview > maxW + 0.5) {
        cameraFrameWidth = Math.max(CAMERA_WIDTH_MIN, Math.min(cap, preview));
      } else if (maxW >= CAMERA_WIDTH_MIN - 0.5 && preview >= maxW - 0.5) {
        cameraFrameWidth = null;
      } else {
        cameraFrameWidth = Math.max(CAMERA_WIDTH_MIN, preview);
      }
    }
    applyCameraFrameWidth();
  }

  // 刻み用。画面右端ぴったり／外側は無効（右端そのものは viewport 吸着）
  function isCameraSnapWidthAllowed(width, screenRightW) {
    if (!Number.isFinite(width)) return false;
    if (!(screenRightW > 0)) return true;
    if (width > screenRightW + 0.5) return false;
    if (Math.abs(width - screenRightW) <= 0.5) return false;
    return true;
  }

  // 表示画面の下端（内容Y）とぴったり／外側の吸着ポイントは無効
  function isCameraSnapYAllowed(y, viewportBottom) {
    if (!Number.isFinite(y)) return false;
    if (!(viewportBottom > 0)) return true;
    if (y > viewportBottom + 0.5) return false;
    if (Math.abs(y - viewportBottom) <= 0.5) return false;
    return true;
  }

  // 最大壁へ向かう途中（壁距離内）。刻みが壁到達を邪魔しない
  function isCameraApproachingMaxWall(pos, maxWall) {
    return Number.isFinite(maxWall) && maxWall > 0 && Number.isFinite(pos)
      && pos >= maxWall - CAMERA_SNAP_WALL_DISTANCE;
  }

  // 最小壁へ向かう途中（壁距離内）。刻みが壁到達を邪魔しない
  function isCameraApproachingMinWall(pos, minWall) {
    return Number.isFinite(minWall) && Number.isFinite(pos)
      && pos <= minWall + CAMERA_SNAP_WALL_DISTANCE;
  }

  // 右端へ向かう途中（壁距離内）
  function isCameraWidthApproachingScreenRight(width, screenRightW) {
    return isCameraApproachingMaxWall(width, screenRightW);
  }

  // 50% / 150% のときの一番下のカード+24（今のカード下端ではない）
  function getCameraZoomLimitBoundaryY(limitZoom) {
    const content = Math.max(1, getCameraContentMaxY());
    if (limitZoom <= 0.5 + 0.001) {
      if (currentZoom <= 0.5 + 0.001) return content;
      return content * (0.5 / currentZoom);
    }
    if (currentZoom >= 1.5 - 0.001) return content;
    return content * (1.5 / currentZoom);
  }

  function getCameraCropYAtMinZoom() {
    if (currentZoom <= 0.5 + 1e-9) return getCameraContentMaxY();
    if (cameraCropDragY50 != null && Number.isFinite(cameraCropDragY50)) return cameraCropDragY50;
    const h = measureCameraCaptureHeightPxAtZoom(0.5);
    const y = h / CAMERA_CAPTURE_SCALE;
    if (cameraCropDragging || cameraCornerDragging) cameraCropDragY50 = y;
    return y;
  }

  function getCameraCropYAtMaxZoom() {
    if (currentZoom >= 1.5 - 1e-9) return getCameraContentMaxY();
    if (cameraCropDragY150 != null && Number.isFinite(cameraCropDragY150)) return cameraCropDragY150;
    const h = measureCameraCaptureHeightPxAtZoom(1.5);
    const y = h / CAMERA_CAPTURE_SCALE;
    if (cameraCropDragging || cameraCornerDragging) cameraCropDragY150 = y;
    return y;
  }

  function canCameraCropFillViewportAtMaxZoom() {
    const vp = getCameraVisibleBottomContentY();
    const y150 = getCameraCropYAtMaxZoom();
    return vp > 0 && Number.isFinite(y150) && y150 >= vp - CAMERA_VIEWPORT_BOTTOM_EPS;
  }

  function getCameraCropZoomYLimits() {
    const range = getCameraAutoCropYRange();
    const atMinZoom = currentZoom <= 0.5 + 1e-9;
    const minReachableY = getCameraCropYAtMinZoom();
    const maxReachableY = getCameraCropYAtMaxZoom();
    return {
      range,
      atMinZoom,
      atMaxZoom: currentZoom >= 1.5 - 1e-9,
      minZoomFloorY: Math.max(range.minY, minReachableY),
      maxZoomCeilingY: Math.min(range.maxY, maxReachableY)
    };
  }

  // 50%下限。摘み中のグレー実線用（最大の白／オートとは別）
  function isCameraCropAtMinZoomLimit() {
    if (!(currentZoom <= 0.5 + 0.001)) return false;
    const { minZoomFloorY } = getCameraCropZoomYLimits();
    const y = getCameraContentMaxY();
    return y > 0 && Number.isFinite(minZoomFloorY) && y <= minZoomFloorY + 0.5;
  }

  // 150%上限。摘み中のグレー実線用。画面内は is-follow が白で勝つ
  function isCameraCropAtMaxZoomLimit() {
    const y = cameraCropPendingY != null ? cameraCropPendingY : getCameraContentMaxY();
    if (isCameraAutoPinnedAtMaxReachable(y)) return true;
    if (!(currentZoom >= 1.5 - 0.001)) return false;
    const { maxZoomCeilingY } = getCameraCropZoomYLimits();
    const contentY = getCameraContentMaxY();
    return contentY > 0 && Number.isFinite(maxZoomCeilingY) && contentY >= maxZoomCeilingY - 0.5;
  }

  function getCameraCropLineLandingY(pointerY) {
    if (!Number.isFinite(pointerY)) return pointerY;
    const { range, minZoomFloorY, maxZoomCeilingY } = getCameraCropZoomYLimits();
    let y = Math.max(range.minY, Math.min(range.maxY, pointerY));
    y = Math.max(minZoomFloorY, Math.min(maxZoomCeilingY, y));
    return clampCameraAutoBoundaryY(y);
  }

  // 下線：画面下端・150%カード+24 が下16以内、または 50%カード+24 が上16以内
  function isCameraYInSnapWallZone(y, viewportBottom) {
    if (!Number.isFinite(y)) return false;
    const y50 = getCameraZoomLimitBoundaryY(0.5);
    const y150 = getCameraZoomLimitBoundaryY(1.5);
    if (isCameraApproachingMinWall(y, y50)) return true;
    if (viewportBottom > 0 && isCameraApproachingMaxWall(y, viewportBottom)) return true;
    if (isCameraApproachingMaxWall(y, y150)) return true;
    return false;
  }

  // 右線：画面右端が右16以内、または幅最小が左16以内（右端そのものの吸着は残す）
  function isCameraWidthInSnapWallZone(width, screenRightW) {
    if (!Number.isFinite(width)) return false;
    if (isCameraApproachingMinWall(width, CAMERA_WIDTH_MIN)) return true;
    if (screenRightW > 0 && isCameraApproachingMaxWall(width, screenRightW)) return true;
    return false;
  }

  // 吸着ロックを維持してよいか（壁帯は呼び出し側で切る）
  function shouldHoldCameraSnap(rawPos, snapPos) {
    if (!Number.isFinite(rawPos) || !Number.isFinite(snapPos)) return false;
    return Math.abs(rawPos - snapPos) <= CAMERA_SNAP_RELEASE_DISTANCE;
  }

  function setCameraCropViewportSnap(viewportBottom) {
    if (!(viewportBottom > 0)) {
      cameraCropSnapTarget = null;
      return;
    }
    cameraCropSnapTarget = { type: 'viewport', y: viewportBottom };
  }

  function setCameraWidthViewportSnap(screenRightW) {
    if (!(screenRightW > 0)) {
      cameraWidthSnapTarget = null;
      return;
    }
    cameraWidthSnapTarget = { type: 'viewport', width: screenRightW };
  }

  function getCameraWidthSnapCandidate(rawWidth) {
    const maxW = getCameraMaxFrameWidth();
    const stepWidth = Math.max(
      CAMERA_WIDTH_MIN,
      Math.min(maxW, Math.round(rawWidth / CAMERA_WIDTH_STEP) * CAMERA_WIDTH_STEP)
    );
    const candidates = [CAMERA_WIDTH_MIN, stepWidth].filter(w =>
      isCameraSnapWidthAllowed(w, maxW) && !isCameraWidthInSnapWallZone(w, maxW)
    );
    if (!candidates.length) {
      return { width: null, distance: Infinity };
    }
    return candidates.reduce((best, width) => {
      const distance = Math.abs(rawWidth - width);
      return distance < best.distance ? { width, distance } : best;
    }, { width: candidates[0], distance: Math.abs(rawWidth - candidates[0]) });
  }

  // 右点線／角ドラッグ共通の幅更新（吸着含む）
  // 幅経路は render / executeAutoFit しない（オートは倍率専用）
  // 下限は CAMERA_WIDTH_MIN。狭める: 未満へは不可／広げる: 常に可（画面端まで）
  function applyCameraWidthDragClientX(clientX) {
    const contentArea = document.querySelector('.content-area');
    if (!contentArea || !Number.isFinite(clientX)) return;
    const maxW = getCameraMaxFrameWidth();
    if (isCameraWidthEdgeBusy()) {
      setCameraWidthViewportSnap(maxW);
      pinCameraWidthLineToScreenRight();
      return;
    }
    if (isCameraHorizontalScrollActive() && isCameraWidthAtScreenRight()) {
      if (cameraWidthDragPreview == null) cameraWidthDragPreview = getCameraDisplayedFrameWidth();
      setCameraWidthViewportSnap(maxW);
      pinCameraWidthLineToScreenRight();
      return;
    }
    const left = contentArea.getBoundingClientRect().left;
    const widthMin = CAMERA_WIDTH_MIN;
    const areaRect = contentArea.getBoundingClientRect();
    if (clientX < areaRect.left) return;
    const pinnedClientX = Math.min(clientX, areaRect.right);
    let rawWidth = pinnedClientX - left;
    if (maxW >= widthMin) rawWidth = Math.max(widthMin, Math.min(maxW, rawWidth));
    else rawWidth = widthMin;
    let displayWidth = rawWidth;

    const nearWidthWall = isCameraWidthInSnapWallZone(rawWidth, maxW);
    if (nearWidthWall && cameraWidthSnapTarget && cameraWidthSnapTarget.type === 'step') {
      cameraWidthSnapTarget = null;
    }

    const canViewportSnap = maxW >= widthMin - 0.5;
    if (cameraWidthSnapTarget && cameraWidthSnapTarget.type === 'viewport') {
      if (canViewportSnap && shouldHoldCameraSnap(rawWidth, maxW)) {
        cameraWidthSnapTarget = { type: 'viewport', width: maxW };
        displayWidth = maxW;
      } else {
        cameraWidthSnapTarget = null;
      }
    }
    if (cameraWidthSnapTarget && cameraWidthSnapTarget.type === 'step') {
      const snapW = cameraWidthSnapTarget.width;
      const hold =
        !nearWidthWall &&
        !isCameraWidthInSnapWallZone(snapW, maxW) &&
        isCameraSnapWidthAllowed(snapW, maxW) &&
        shouldHoldCameraSnap(rawWidth, snapW);
      if (hold) {
        displayWidth = snapW;
      } else {
        cameraWidthSnapTarget = null;
      }
    }
    if (!nearWidthWall && !cameraWidthSnapTarget) {
      const candidate = getCameraWidthSnapCandidate(rawWidth);
      if (candidate.width != null && candidate.distance <= CAMERA_SNAP_ATTRACT_DISTANCE) {
        cameraWidthSnapTarget = { type: 'step', width: candidate.width };
        displayWidth = candidate.width;
      }
    }
    // 画面右端：左側のみ。入る8・外れる16。端手前16pxの刻み無効とは独立
    if (
      !cameraWidthSnapTarget &&
      canViewportSnap &&
      rawWidth <= maxW + 0.5 &&
      (maxW - rawWidth) <= CAMERA_SNAP_ATTRACT_DISTANCE
    ) {
      cameraWidthSnapTarget = { type: 'viewport', width: maxW };
      displayWidth = maxW;
    }

    if (!cameraWidthDragMoved) {
      if (cameraWidthDragStartX != null
        && Math.abs(clientX - cameraWidthDragStartX) < CAMERA_CROP_POINTER_DEAD_PX) {
        return;
      }
      cameraWidthDragMoved = true;
    }
    cameraWidthDragPreview = displayWidth;
    applyCameraFrameWidth();
    fitCameraCardTextScales();

    updateCameraGuides();
    checkCameraHeaderCollision();
  }

  function getCameraGridWrapper() {
    return document.querySelector('.grid-wrapper');
  }

  // ポインタ／要素の画面Y → grid-wrapper 内容座標（スクロールしても不変）
  function getCameraContentYFromClientY(clientY, options) {
    const wrapper = getCameraGridWrapper();
    if (!wrapper || !Number.isFinite(clientY)) return null;
    const rect = wrapper.getBoundingClientRect();
    // ドラッグ中: wrapper より上の異常値（0 等）を上端クランプすると縮小最小へ飛ぶ → 無視
    // 下側は画面外でも下端にピン（下端ドラッグを維持）
    if (options && options.drag) {
      if (clientY < rect.top) return null;
      const pinnedClientY = Math.min(clientY, rect.bottom);
      return pinnedClientY - rect.top + wrapper.scrollTop;
    }
    const clampedClientY = Math.max(rect.top, Math.min(rect.bottom, clientY));
    return clampedClientY - rect.top + wrapper.scrollTop;
  }

  function getCameraVisibleBottomContentY() {
    const wrapper = getCameraGridWrapper();
    if (!wrapper) return 0;
    return wrapper.scrollTop + wrapper.clientHeight;
  }

  function isCameraScrolledToVerticalEnd() {
    const wrapper = getCameraGridWrapper();
    if (!wrapper) return false;
    const maxScroll = wrapper.scrollHeight - wrapper.clientHeight;
    if (maxScroll <= 1) return false;
    return wrapper.scrollTop >= maxScroll - 2;
  }

  function getCameraRowInfo() {
    const mainArea = document.getElementById('mainArea');
    const wrapper = getCameraGridWrapper();
    if (!wrapper) return { rows: [], mainArea, wrapper: null };
    const wRect = wrapper.getBoundingClientRect();
    const scrollTop = wrapper.scrollTop;
    const cards = Array.from(document.querySelectorAll('#playerGrid .player-card:not(.is-hidden-dragging)'));
    const rows = [];
    cards.forEach(card => {
      const rect = card.getBoundingClientRect();
      const top = rect.top - wRect.top + scrollTop;
      const bottom = rect.bottom - wRect.top + scrollTop;
      let row = rows.find(item => Math.abs(item.top - top) < 4);
      if (!row) {
        row = { top, bottom, cards: [] };
        rows.push(row);
      }
      row.cards.push(card);
      row.top = Math.min(row.top, top);
      row.bottom = Math.max(row.bottom, bottom);
    });
    rows.sort((a, b) => a.top - b.top);
    return { rows, mainArea, wrapper };
  }

  function getCameraContentMaxY() {
    const { rows } = getCameraRowInfo();
    if (!rows.length) return 0;
    return rows[rows.length - 1].bottom + CAMERA_EDGE_PADDING;
  }

  function getCameraAutoCropYRange() {
    const wrapper = getCameraGridWrapper();
    const scrollTop = wrapper ? wrapper.scrollTop : 0;
    const viewportBottom = getCameraVisibleBottomContentY();
    // 点線ドラッグは「今見えている枠の下端」を動かし、倍率でカード下端+24 を追従させる
    const minY = scrollTop + 48 + CAMERA_HEIGHT_STEP;
    const maxY = Math.max(minY + CAMERA_HEIGHT_STEP, viewportBottom);
    return { minY, maxY, viewportBottom };
  }

  function resolveCameraCropGeometry() {
    const { rows, wrapper } = getCameraRowInfo();
    const viewportBottom = getCameraVisibleBottomContentY();
    if (!rows.length) {
      return {
        boundaryY: viewportBottom,
        visualTop: Math.max(0, viewportBottom - CAMERA_CROP_LINE_H),
        captureHeight: viewportBottom,
        atLimit: true,
        canDrag: false,
        kind: 'max',
        atViewportBottom: true,
        rows: [],
        viewportBottom
      };
    }

    const maxY = rows[rows.length - 1].bottom + CAMERA_EDGE_PADDING;
    let kind = cameraCropKind;
    let boundaryY;

    // ドラッグ中だけ点線をポインタに追従。離したあとはカード下端+24
    // 撮影サイズ指定時は指定高さ（fixed）を維持
    if (kind === 'free' && cameraCropDragging && cameraCropBoundaryY != null && isFinite(cameraCropBoundaryY)) {
      boundaryY = cameraCropBoundaryY;
    } else if (cameraCropFixedY != null && isFinite(cameraCropFixedY) && !cameraCropDragMoved) {
      kind = 'fixed';
      boundaryY = cameraCropFixedY;
    } else {
      kind = 'max';
      boundaryY = maxY;
    }

    const captureHeight = Math.max(1, (kind === 'free' || kind === 'fixed') ? boundaryY : maxY);

    let displayBoundaryY = boundaryY;
    if (kind === 'free' || (kind === 'fixed' && cameraLockDragging)) {
      if (viewportBottom > 0) displayBoundaryY = Math.min(displayBoundaryY, viewportBottom);
    } else if (kind === 'fixed') {
      displayBoundaryY = boundaryY;
    } else {
      displayBoundaryY = Math.min(boundaryY, maxY);
      if (maxY <= viewportBottom + 1.5) {
        displayBoundaryY = Math.min(displayBoundaryY, viewportBottom);
      }
    }
    // 画面下端吸着中はカード+24と枠の数px差で線を動かさない
    if (cameraCropDragging && cameraCropSnapTarget && cameraCropSnapTarget.type === 'viewport'
      && viewportBottom > 0) {
      displayBoundaryY = viewportBottom;
    }
    const scrollTop = wrapper ? wrapper.scrollTop : 0;
    const clientH = wrapper ? wrapper.clientHeight : 0;
    let visualTop = Math.max(0, displayBoundaryY - CAMERA_CROP_LINE_H);
    const lineInViewY = displayBoundaryY - scrollTop;
    const atViewportBottom = clientH > 0 && lineInViewY >= clientH - 5;
    const atLimit = kind === 'max' || Math.abs(boundaryY - maxY) < 0.75;

    return {
      boundaryY,
      visualTop,
      displayBoundaryY,
      captureHeight,
      atLimit,
      atViewportBottom,
      canDrag: rows.length >= 1,
      kind,
      rows,
      viewportBottom
    };
  }

  function getCameraCaptureWidth() {
    return document.getElementById('mainArea').clientWidth;
  }

  function getCameraCaptureHeight() {
    return resolveCameraCropGeometry().captureHeight;
  }

  const CUSTOM_SB_SIZE = 16;
  const CUSTOM_SB_THUMB_MIN = 12;

  function hideCustomSb(track, thumb) {
    if (track) {
      track.classList.add('hidden');
      track.setAttribute('aria-hidden', 'true');
    }
    if (thumb) thumb.style.transform = '';
  }

  function scrollerOverflows(el, axis) {
    if (!el) return false;
    const extra = axis === 'x'
      ? el.scrollWidth - el.clientWidth
      : el.scrollHeight - el.clientHeight;
    return extra > 0;
  }

  function layoutCustomSbThumb(scroller, track, thumb, axis) {
    if (axis === 'y') {
      const trackH = track.clientHeight;
      const thumbH = Math.min(trackH, Math.round(Math.max(
        CUSTOM_SB_THUMB_MIN,
        (scroller.clientHeight / Math.max(1, scroller.scrollHeight)) * trackH
      )));
      const maxScroll = Math.max(1, scroller.scrollHeight - scroller.clientHeight);
      const maxMove = Math.max(0, trackH - thumbH);
      const y = Math.min(maxMove, Math.round((scroller.scrollTop / maxScroll) * maxMove));
      thumb.style.height = thumbH + 'px';
      thumb.style.width = '';
      thumb.style.transform = `translateY(${y}px)`;
    } else {
      const trackW = track.clientWidth;
      const thumbW = Math.min(trackW, Math.round(Math.max(
        CUSTOM_SB_THUMB_MIN,
        (scroller.clientWidth / Math.max(1, scroller.scrollWidth)) * trackW
      )));
      const maxScroll = Math.max(1, scroller.scrollWidth - scroller.clientWidth);
      const maxMove = Math.max(0, trackW - thumbW);
      const x = Math.min(maxMove, Math.round((scroller.scrollLeft / maxScroll) * maxMove));
      thumb.style.width = thumbW + 'px';
      thumb.style.height = '';
      thumb.style.transform = `translateX(${x}px)`;
    }
  }

  function setCustomSbFromPointer(scroller, track, thumb, axis, client, offset) {
    const rect = track.getBoundingClientRect();
    if (axis === 'y') {
      const thumbH = thumb.offsetHeight || CUSTOM_SB_THUMB_MIN;
      const maxMove = Math.max(1, rect.height - thumbH);
      const ratio = Math.max(0, Math.min(1, (client - rect.top - offset) / maxMove));
      scroller.scrollTop = ratio * Math.max(0, scroller.scrollHeight - scroller.clientHeight);
    } else {
      const thumbW = thumb.offsetWidth || CUSTOM_SB_THUMB_MIN;
      const maxMove = Math.max(1, rect.width - thumbW);
      const ratio = Math.max(0, Math.min(1, (client - rect.left - offset) / maxMove));
      scroller.scrollLeft = ratio * Math.max(0, scroller.scrollWidth - scroller.clientWidth);
    }
  }

  function bindCustomSbTrack(track, getScroller, axis) {
    if (!track || track.dataset.customSbBound === '1') return;
    track.dataset.customSbBound = '1';
    const thumb = track.querySelector('.custom-sb-thumb');
    let dragging = false;
    let pointerId = null;
    let offset = 0;
    track.addEventListener('pointerdown', (e) => {
      const scroller = getScroller();
      if (!scroller || e.button !== 0 || track.classList.contains('hidden')) return;
      e.preventDefault();
      e.stopPropagation();
      const thumbRect = thumb.getBoundingClientRect();
      const onThumb = axis === 'y'
        ? (e.clientY >= thumbRect.top && e.clientY <= thumbRect.bottom)
        : (e.clientX >= thumbRect.left && e.clientX <= thumbRect.right);
      offset = onThumb
        ? (axis === 'y' ? e.clientY - thumbRect.top : e.clientX - thumbRect.left)
        : (axis === 'y' ? thumbRect.height / 2 : thumbRect.width / 2);
      if (!onThumb) setCustomSbFromPointer(scroller, track, thumb, axis, axis === 'y' ? e.clientY : e.clientX, offset);
      dragging = true;
      pointerId = e.pointerId;
      track.classList.add('is-dragging');
      try { track.setPointerCapture(e.pointerId); } catch (_) {}
    });
    track.addEventListener('pointermove', (e) => {
      if (!dragging || e.pointerId !== pointerId) return;
      const scroller = getScroller();
      if (!scroller) return;
      setCustomSbFromPointer(scroller, track, thumb, axis, axis === 'y' ? e.clientY : e.clientX, offset);
    });
    const endDrag = (e) => {
      if (!dragging) return;
      if (e && pointerId != null && e.pointerId != null && e.pointerId !== pointerId) return;
      dragging = false;
      pointerId = null;
      track.classList.remove('is-dragging');
    };
    track.addEventListener('pointerup', endDrag);
    track.addEventListener('pointercancel', endDrag);
  }

  function syncGridScrollY() {
    const wrapper = document.querySelector('.grid-wrapper');
    const track = document.getElementById('gridScrollY');
    const thumb = document.getElementById('gridScrollYThumb');
    if (!wrapper || !track || !thumb) return false;
    const active = scrollerOverflows(wrapper, 'y');
    wrapper.classList.toggle('has-custom-sb-y', active);
    if (!active) {
      hideCustomSb(track, thumb);
      syncCameraChromeForVScroll(false);
      return false;
    }
    track.classList.remove('hidden');
    track.setAttribute('aria-hidden', 'false');
    if (isCameraMode) {
      const area = document.querySelector('.content-area');
      const areaRect = area ? area.getBoundingClientRect() : wrapper.getBoundingClientRect();
      const vw = document.documentElement.clientWidth;
      // 横バーも出ているときは右下16×16を空けて合体（縦バー下端を16px短く）
      const hAlso = scrollerOverflows(area, 'x');
      const height = Math.max(0, areaRect.height - (hAlso ? CUSTOM_SB_SIZE : 0));
      track.style.left = (vw - CUSTOM_SB_SIZE) + 'px';
      track.style.top = areaRect.top + 'px';
      track.style.height = height + 'px';
      syncCameraChromeForVScroll(true);
    } else {
      const wrapRect = wrapper.getBoundingClientRect();
      const right = wrapRect.right;
      const top = wrapRect.top;
      const height = Math.max(0, wrapRect.bottom - wrapRect.top);
      if (height < CUSTOM_SB_THUMB_MIN) {
        hideCustomSb(track, thumb);
        syncCameraChromeForVScroll(false);
        return false;
      }
      track.style.left = (right - CUSTOM_SB_SIZE) + 'px';
      track.style.top = top + 'px';
      track.style.height = height + 'px';
      syncCameraChromeForVScroll(false);
    }
    layoutCustomSbThumb(wrapper, track, thumb, 'y');
    return true;
  }

  function syncCameraChromeForVScroll(show) {
    const on = !!(isCameraMode && show);
    const header = document.getElementById('cameraHeader');
    const bottom = document.getElementById('cameraBottom');
    if (header) header.classList.toggle('is-inset-v-scroll', on);
    if (bottom) bottom.classList.toggle('is-inset-v-scroll', on);
  }

  function syncCameraBottomForHScroll(show) {
    const bottom = document.getElementById('cameraBottom');
    if (bottom) bottom.classList.toggle('is-above-h-scroll', !!show);
  }

  function syncGridScrollX() {
    const track = document.getElementById('gridScrollX');
    const thumb = document.getElementById('gridScrollXThumb');
    const area = document.querySelector('.content-area');
    if (!track || !thumb || !area) return;
    const hOverflow = isCameraMode && scrollerOverflows(area, 'x');
    if (!hOverflow) {
      syncCameraBottomForHScroll(false);
      hideCustomSb(track, thumb);
      return;
    }
    const vw = document.documentElement.clientWidth;
    const vh = document.documentElement.clientHeight;
    const vTrack = document.getElementById('gridScrollY');
    const vVisible = vTrack && !vTrack.classList.contains('hidden');
    const width = Math.max(0, vw - (vVisible ? CUSTOM_SB_SIZE : 0));
    if (width < CUSTOM_SB_THUMB_MIN) {
      syncCameraBottomForHScroll(false);
      hideCustomSb(track, thumb);
      return;
    }
    syncCameraBottomForHScroll(true);
    track.classList.remove('hidden');
    track.setAttribute('aria-hidden', 'false');
    track.style.left = '0px';
    track.style.top = (vh - CUSTOM_SB_SIZE) + 'px';
    track.style.width = width + 'px';
    layoutCustomSbThumb(area, track, thumb, 'x');
  }

  function syncManagerListSb(listId, trackId) {
    const list = document.getElementById(listId);
    const track = document.getElementById(trackId);
    const thumb = track ? track.querySelector('.custom-sb-thumb') : null;
    if (!list || !track || !thumb) return;
    if (!scrollerOverflows(list, 'y')) {
      hideCustomSb(track, thumb);
      return;
    }
    track.classList.remove('hidden');
    track.setAttribute('aria-hidden', 'false');
    layoutCustomSbThumb(list, track, thumb, 'y');
  }

  function syncCustomScrollbars() {
    syncGridScrollY();
    syncGridScrollX();
    syncManagerListSb('tempMainList', 'managerMainSb');
    syncManagerListSb('tempWaitList', 'managerWaitSb');
  }

  function bindCustomScrollbars() {
    bindCustomSbTrack(document.getElementById('gridScrollY'), () => document.querySelector('.grid-wrapper'), 'y');
    bindCustomSbTrack(document.getElementById('gridScrollX'), () => document.querySelector('.content-area'), 'x');
    bindCustomSbTrack(document.getElementById('managerMainSb'), () => document.getElementById('tempMainList'), 'y');
    bindCustomSbTrack(document.getElementById('managerWaitSb'), () => document.getElementById('tempWaitList'), 'y');
    const wrapper = document.querySelector('.grid-wrapper');
    if (wrapper && wrapper.dataset.customSbScrollBound !== '1') {
      wrapper.dataset.customSbScrollBound = '1';
      wrapper.addEventListener('scroll', () => { syncGridScrollY(); }, { passive: true });
    }
    const area = document.querySelector('.content-area');
    if (area && area.dataset.customSbScrollBound !== '1') {
      area.dataset.customSbScrollBound = '1';
      area.addEventListener('scroll', () => {
        if (!isCameraMode) return;
        syncGridScrollX();
        syncCameraCropLineChrome();
      }, { passive: true });
    }
    if (typeof ResizeObserver !== 'undefined' && !window.__customSbRo) {
      window.__customSbRo = new ResizeObserver(() => syncCustomScrollbars());
      if (wrapper) window.__customSbRo.observe(wrapper);
      if (area) window.__customSbRo.observe(area);
    }
    syncCustomScrollbars();
  }

  // ホイール: 通常／撮影はウインドウ内どこでもカード一覧。メンバー管理は .manager-col(#101010)内どこでもその列リスト
  function bindGlobalWheelScroll() {
    if (window.__globalWheelScrollBound) return;
    window.__globalWheelScrollBound = true;
    document.addEventListener('wheel', (e) => {
      if (e.ctrlKey) return;
      const t = e.target;
      if (!(t instanceof Element)) return;
      if (t.closest('select')) return;

      const managerModal = document.getElementById('managerModal');
      if (managerModal && !managerModal.classList.contains('hidden')) {
        const col = t.closest('#managerModal .manager-col');
        if (col) {
          const list = col.querySelector('.list-container');
          if (list) {
            e.preventDefault();
            list.scrollTop += e.deltaY;
          }
          return;
        }
        // モーダル内の列外（フッター等）では裏のカードを動かさない
        return;
      }

      // 他モーダル表示中はカードを動かさない（撮影設定はパネル外＝背後スクロール可）
      const cameraSizeModal = document.getElementById('cameraSizeModal');
      if (cameraSizeModal && !cameraSizeModal.classList.contains('hidden')) {
        if (t.closest('#cameraSizeModal .modal-content')) return;
      } else if (t.closest('.modal-overlay:not(.hidden)')) {
        return;
      }

      const wrapper = document.querySelector('.grid-wrapper');
      if (!wrapper) return;
      e.preventDefault();
      wrapper.scrollTop += e.deltaY;
      if (isCameraMode && e.deltaX) {
        const area = document.querySelector('.content-area');
        if (area) area.scrollLeft += e.deltaX;
      }
    }, { passive: false });
  }

  // スクロールバー（ガター）の画面X範囲
  function getCameraScrollbarClientRect() {
    const track = document.getElementById('gridScrollY');
    if (!track || track.classList.contains('hidden')) return null;
    const rect = track.getBoundingClientRect();
    if (rect.width < 1) return null;
    return { left: rect.left, right: rect.right };
  }

  function isCameraVerticalScrollActive() {
    return scrollerOverflows(getCameraGridWrapper(), 'y');
  }

  function getCameraContentArea() {
    return document.querySelector('.content-area');
  }

  function isCameraHorizontalScrollActive() {
    return scrollerOverflows(getCameraContentArea(), 'x');
  }

  // 下点線を main-view 幅で1本描き、ヒット帯を同期（スクロールバーより点線優先）
  // 角の持ち主：白実線 > グレー実線 > 明るい点線 > 点線。同じ段は下線（横優先）
  function cameraGuidePaintRank(el) {
    if (!el) return 0;
    const c = el.classList;
    if (c.contains('is-follow') && c.contains('is-dragging')) return 4;
    if (c.contains('is-snapped')) return 3;
    if (c.contains('is-hovering') || c.contains('is-dragging')) return 2;
    return 1;
  }

  function applyCameraGuideCornerJoin() {
    const line = document.getElementById('cameraCropLine');
    const resizer = document.getElementById('cameraFrameResizer');
    if (!isCameraMode || !line || !resizer) return;
    if (line.classList.contains('hidden') || resizer.classList.contains('hidden')) return;
    const ownerW = cameraGuidePaintRank(resizer) > cameraGuidePaintRank(line);
    if (ownerW) {
      line.style.right = CAMERA_CROP_LINE_H + 'px';
      resizer.style.height = Math.max(0, line.offsetTop + CAMERA_CROP_LINE_H) + 'px';
    } else {
      line.style.right = '0px';
      resizer.style.height = Math.max(0, line.offsetTop) + 'px';
    }
  }

  function syncCameraGuideCornerAfterPaint() {
    syncCameraFrameResizerHeight();
    syncCameraCropLineHit();
  }

  function syncCameraCropLineHit() {
    const line = document.getElementById('cameraCropLine');
    const hit = document.getElementById('cameraCropLineHit');
    const main = document.getElementById('mainArea');
    if (!hit) return;
    if (!isCameraMode || !line || line.classList.contains('hidden') || !main) {
      hit.style.width = '0px';
      hit.style.height = '0px';
      return;
    }
    const lr = line.getBoundingClientRect();
    const hitRight = Math.min(lr.right, main.getBoundingClientRect().right - 4);
    hit.style.left = lr.left + 'px';
    hit.style.top = (lr.top - 2) + 'px';
    hit.style.width = Math.max(0, hitRight - lr.left) + 'px';
    hit.style.height = '6px';
  }

  function syncCameraCropLineChrome() {
    const line = document.getElementById('cameraCropLine');
    const hit = document.getElementById('cameraCropLineHit');
    const main = document.getElementById('mainArea');
    const wrapper = getCameraGridWrapper();
    if (!hit) return;

    const clearHit = () => {
      hit.style.width = '0px';
      hit.style.height = '0px';
    };
    const clearLineChrome = () => {
      if (!line) return;
      line.style.top = '';
      line.style.left = '';
      line.style.right = '';
      line.style.width = '';
    };

    if (!isCameraMode || !line || line.classList.contains('hidden') || !main || !wrapper) {
      clearLineChrome();
      clearHit();
      syncCustomScrollbars();
      syncCameraFrameResizerHeight();
      return;
    }

    const geo = resolveCameraCropGeometry();

    // 撮影領域内（main-view 基準）。横スクロールで中身と一緒に動く
    line.style.left = '0px';
    line.style.right = '0px';
    line.style.width = '';
    line.style.top = (wrapper.offsetTop + geo.visualTop - wrapper.scrollTop) + 'px';

    syncCustomScrollbars();
    syncCameraFrameResizerHeight();
    syncCameraCropLineHit();
  }

  // 右点線を撮影下壁（下点線）までに揃え、ヒット帯を fixed でヘッダーより上に置く
  function syncCameraFrameResizerHeight() {
    const resizer = document.getElementById('cameraFrameResizer');
    const line = document.getElementById('cameraCropLine');
    const main = document.getElementById('mainArea');
    const widthHit = document.getElementById('cameraFrameResizerHit');
    const cornerHit = document.getElementById('cameraFrameCornerHit');
    if (!resizer || !main) return;

    const clearWidthHit = () => {
      if (!widthHit) return;
      widthHit.style.left = '0px';
      widthHit.style.top = '0px';
      widthHit.style.width = '0px';
      widthHit.style.height = '0px';
    };
    const clearCornerHit = () => {
      if (!cornerHit) return;
      cornerHit.style.left = '0px';
      cornerHit.style.top = '0px';
      cornerHit.style.width = '0px';
      cornerHit.style.height = '0px';
    };

    if (!isCameraMode || !line || line.classList.contains('hidden') || resizer.classList.contains('hidden')) {
      resizer.style.height = '';
      resizer.style.top = '';
      resizer.style.left = '';
      resizer.style.right = '';
      resizer.style.width = '';
      clearWidthHit();
      clearCornerHit();
      return;
    }
    const lineRect = line.getBoundingClientRect();
    resizer.style.left = 'auto';
    resizer.style.right = '0px';
    resizer.style.top = '0px';
    resizer.style.width = '2px';
    applyCameraGuideCornerJoin();

    if (widthHit) {
      const rr = resizer.getBoundingClientRect();
      // 線2px の左右に各2px（合計6）
      widthHit.style.left = (rr.left - 2) + 'px';
      widthHit.style.top = rr.top + 'px';
      widthHit.style.width = Math.max(0, rr.width + 4) + 'px';
      widthHit.style.height = Math.max(0, rr.height) + 'px';
    }

    // 右下交差 6×6（線中心を基準に 2+2+2）
    // 右・下とも画面端のときは 8×8 の右下を線の外側（画面角）に合わせ、ウインドウ内だけにする
    if (cornerHit) {
      if (line.classList.contains('is-disabled')) {
        clearCornerHit();
      } else {
        const rr = resizer.getBoundingClientRect();
        const atScreenCorner = line.classList.contains('is-at-viewport-bottom')
          && isCameraWidthAtScreenRight();
        if (atScreenCorner) {
          cornerHit.style.left = (rr.right - 8) + 'px';
          cornerHit.style.top = (lineRect.bottom - 8) + 'px';
          cornerHit.style.width = '8px';
          cornerHit.style.height = '8px';
        } else {
          const cx = (rr.left + rr.right) / 2;
          const cy = (lineRect.top + lineRect.bottom) / 2;
          cornerHit.style.left = (cx - 3) + 'px';
          cornerHit.style.top = (cy - 3) + 'px';
          cornerHit.style.width = '6px';
          cornerHit.style.height = '6px';
        }
      }
    }
  }

  // 角の重なり: 交差（corner）優先。それ以外はカーソルに近い点線。同距離なら右点線優先
  function preferCameraGuideHandle(clientX, clientY) {
    if (isCameraHideMode || isCameraSizeModalOpen()) return null;
    const line = document.getElementById('cameraCropLine');
    const cropHit = document.getElementById('cameraCropLineHit');
    const resizer = document.getElementById('cameraFrameResizer');
    const widthHit = document.getElementById('cameraFrameResizerHit');
    const cornerHit = document.getElementById('cameraFrameCornerHit');
    const main = document.getElementById('mainArea');
    const header = document.getElementById('cameraHeader');
    const cropOk = !!(isCameraMode && line && cropHit && !line.classList.contains('hidden')
      && !line.classList.contains('is-disabled'));
    const widthOk = !!(isCameraMode && resizer && widthHit && !resizer.classList.contains('hidden'));
    if (!cropOk && !widthOk) return null;

    if (cropOk && widthOk && cornerHit) {
      const kr = cornerHit.getBoundingClientRect();
      if (kr.width > 0 && kr.height > 0
        && clientX >= kr.left && clientX <= kr.right
        && clientY >= kr.top && clientY <= kr.bottom) {
        return 'corner';
      }
    }

    if (!cropOk) return 'width';
    if (!widthOk) return 'crop';

    const lr = line.getBoundingClientRect();
    const rr = resizer.getBoundingClientRect();
    const cr = cropHit.getBoundingClientRect();
    const wr = widthHit.getBoundingClientRect();
    const mainRight = main ? main.getBoundingClientRect().right : cr.right;
    const headerBottom = header && !header.classList.contains('hidden')
      ? header.getBoundingClientRect().bottom
      : 0;
    const inCropHit = clientX >= cr.left && clientX <= cr.right && clientY >= cr.top && clientY <= cr.bottom;
    // 表示上は右端まで線があるので、バー右側〜撮影右端でも下壁近さを判定に含める
    const distCrop = Math.abs(clientY - (lr.top + lr.bottom) / 2);
    const nearCropLine = distCrop <= 3;
    const inCropX = clientX >= lr.left && clientX <= mainRight;
    let inCrop = inCropHit || (nearCropLine && inCropX);
    // ヘッダー帯では、下点線が実際にそこにあるときだけ crop 扱い
    // （右点線ヒットはヘッダー上まで伸びるため、誤って crop 開始→縮小限界へ飛ぶのを防ぐ）
    const lineOverlapsHeader = lr.top < headerBottom + 8;
    if (headerBottom > 0 && clientY < headerBottom && !lineOverlapsHeader) {
      inCrop = false;
    }
    // ボトムバーのボタンが実際に前面に被さっている座標では掴めない
    if (inCrop) {
      const cameraBottom = document.getElementById('cameraBottom');
      if (cameraBottom && !cameraBottom.classList.contains('hidden')) {
        const elAtPoint = document.elementFromPoint(clientX, clientY);
        if (elAtPoint && cameraBottom.contains(elAtPoint)) inCrop = false;
      }
    }
    const inWidth = clientX >= wr.left && clientX <= wr.right && clientY >= wr.top && clientY <= wr.bottom;

    if (!inCrop && !inWidth) return null;
    if (inCrop && !inWidth) return 'crop';
    if (!inCrop && inWidth) return 'width';

    const distWidth = Math.abs(clientX - (rr.left + rr.right) / 2);
    return distWidth <= distCrop ? 'width' : 'crop';
  }

  function refreshCameraGuideHover(clientX, clientY) {
    const line = document.getElementById('cameraCropLine');
    const resizer = document.getElementById('cameraFrameResizer');
    if (!line || !resizer) return;
    if (!isCameraMode || isCameraHideMode || isCameraSizeModalOpen() || line.classList.contains('hidden')) {
      line.classList.remove('is-hovering');
      resizer.classList.remove('is-hovering');
      syncCameraGuideCornerAfterPaint();
      return;
    }
    if (clientX == null || clientY == null
      || clientX < 0 || clientY < 0
      || clientX > window.innerWidth || clientY > window.innerHeight) {
      line.classList.remove('is-hovering');
      resizer.classList.remove('is-hovering');
      syncCameraGuideCornerAfterPaint();
      return;
    }
    const prefer = preferCameraGuideHandle(clientX, clientY);
    const cropHover = (prefer === 'crop' || prefer === 'corner') && !cameraCropDragging && !cameraCornerDragging;
    const widthHover = (prefer === 'width' || prefer === 'corner') && !cameraWidthDragging && !cameraCornerDragging;
    line.classList.toggle('is-hovering', cropHover);
    resizer.classList.toggle('is-hovering', widthHover);
    syncCameraGuideCornerAfterPaint();
  }

  function updateCameraSizeLabel() {
    if (!isCameraMode) return;
    const width = Math.round(getCameraCaptureWidth()) * CAMERA_CAPTURE_SCALE;
    const height = Math.round(getCameraCaptureHeight()) * CAMERA_CAPTURE_SCALE;
    const btn = document.getElementById('cameraSizeLabel');
    const label = btn && btn.querySelector('.btn-fit-label');
    if (label) {
      label.textContent = `${width} × ${height} px`;
      label.style.transform = '';
      delete label.dataset.currentScale;
    }
    const captureW = document.getElementById('cameraSizeCaptureW');
    const captureH = document.getElementById('cameraSizeCaptureH');
    if (captureW) captureW.textContent = String(width);
    if (captureH) captureH.textContent = String(height);
    if (isCameraSizeModalOpen()) syncCameraSizeModalLiveState();
    const aspectEl = document.getElementById('cameraSizePadlockAspect');
    if (aspectEl) aspectEl.textContent = getCameraCaptureAspectRatioLabel();
    syncCameraSizePresetMenuWidthIfNeeded();
  }

  function hideUiTip() {
    const tipEl = document.getElementById('uiTip');
    if (tipEl) tipEl.classList.add('hidden');
    uiTipZone = null;
  }

  function noteUiTipPointer(clientX, clientY) {
    if (typeof clientX === 'number') uiTipLastClientX = clientX;
    if (typeof clientY === 'number') uiTipLastClientY = clientY;
  }

  function getUiTipZoneElement(zoneKey) {
    if (!zoneKey) return null;
    if (zoneKey === 'camera-crop-hit') {
      return document.getElementById('cameraCropLineHit') || document.getElementById('cameraCropLine');
    }
    if (zoneKey === 'camera-frame-resizer') {
      return document.getElementById('cameraFrameResizerHit')
        || document.getElementById('cameraFrameResizer');
    }
    if (zoneKey === 'camera-frame-corner') {
      return document.getElementById('cameraFrameCornerHit');
    }
    try {
      return document.querySelector(`[data-ui-tip-zone="${CSS.escape(zoneKey)}"]`);
    } catch (_) {
      return document.querySelector(`[data-ui-tip-zone="${zoneKey}"]`);
    }
  }

  // elementFromPoint だけだと端・capture 直後に誤判定しやすいので矩形でも見る
  function isClientPointInUiTipZone(clientX, clientY, zoneKey) {
    if (!zoneKey || !Number.isFinite(clientX) || !Number.isFinite(clientY)) return false;
    if (zoneKey === 'camera-crop-hit' || zoneKey === 'camera-frame-resizer' || zoneKey === 'camera-frame-corner') {
      const prefer = preferCameraGuideHandle(clientX, clientY);
      if (zoneKey === 'camera-crop-hit') return prefer === 'crop';
      if (zoneKey === 'camera-frame-resizer') return prefer === 'width';
      return prefer === 'corner';
    }
    const under = getElementFromClientPoint(clientX, clientY);
    if (under && resolveUiTipZoneFromEvent({ target: under }) === zoneKey) return true;
    const el = getUiTipZoneElement(zoneKey);
    if (!el || el.classList.contains('hidden')) return false;
    const r = el.getBoundingClientRect();
    return clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom;
  }

  function getElementFromClientPoint(clientX, clientY) {
    if (!Number.isFinite(clientX) || !Number.isFinite(clientY)) return null;
    if (clientX < 0 || clientY < 0 || clientX > window.innerWidth || clientY > window.innerHeight) {
      return null;
    }
    const x = Math.min(clientX, Math.max(0, window.innerWidth - 1));
    const y = Math.min(clientY, Math.max(0, window.innerHeight - 1));
    try {
      return document.elementFromPoint(x, y);
    } catch (_) {
      return null;
    }
  }

  function isClientPointOutsideWindow(clientX, clientY) {
    return !Number.isFinite(clientX) || !Number.isFinite(clientY)
      || clientX < 0 || clientY < 0
      || clientX > window.innerWidth || clientY > window.innerHeight;
  }

  function clearUiTipPressLockIfOutside(clientX, clientY) {
    if (!uiTipPressLock) return;
    if (!isClientPointOutsideWindow(clientX, clientY)
      && isClientPointInUiTipZone(clientX, clientY, uiTipPressLock)) return;
    uiTipPressLock = null;
  }

  // 離した位置がその有効箇所の上にあるときだけロック（画面外リリースではかけない）
  function lockUiTipPressIfInZone(zoneKey, clientX, clientY) {
    if (!zoneKey) return;
    if (isClientPointOutsideWindow(clientX, clientY) || !isClientPointInUiTipZone(clientX, clientY, zoneKey)) {
      if (uiTipPressLock === zoneKey) uiTipPressLock = null;
      return;
    }
    uiTipPressLock = zoneKey;
  }

  function resolveUiTipZoneAtPoint(clientX, clientY) {
    if (isCameraMode && !isCameraHideMode && !isCameraSizeModalOpen()) {
      const prefer = preferCameraGuideHandle(clientX, clientY);
      if (prefer === 'corner') return 'camera-frame-corner';
      if (prefer === 'width') return 'camera-frame-resizer';
      if (prefer === 'crop') return 'camera-crop-hit';
    }
    const under = getElementFromClientPoint(clientX, clientY);
    return resolveUiTipZoneFromEvent({ target: under });
  }

  function getUiTipTextForZone(zoneKey) {
    if (!zoneKey) return '';
    if (zoneKey === 'camera-crop-hit') return getCameraCropTipText() || '';
    if (zoneKey === 'camera-frame-resizer') return getCameraWidthTipText() || '';
    if (zoneKey === 'camera-frame-corner') return getCameraCornerTipText() || '';
    const getter = uiTipZoneTextGetters[zoneKey];
    if (typeof getter === 'function') {
      try {
        return getter() || '';
      } catch (_) {
        return '';
      }
    }
    const el = getUiTipZoneElement(zoneKey);
    return (el && el.getAttribute('data-tip')) || '';
  }

  function syncUiTipFromPointer(clientX, clientY, buttons) {
    noteUiTipPointer(clientX, clientY);
    if (isPointerDragActive() || cameraCropDragging || cameraWidthDragging || cameraCornerDragging) {
      hideUiTip();
      return;
    }
    if (buttons) {
      hideUiTip();
      return;
    }
    if (isClientPointOutsideWindow(clientX, clientY)) {
      uiTipPressLock = null;
      hideUiTip();
      refreshCameraGuideHover(clientX, clientY);
      return;
    }
    clearUiTipPressLockIfOutside(clientX, clientY);
    refreshCameraGuideHover(clientX, clientY);
    const zone = resolveUiTipZoneAtPoint(clientX, clientY);
    if (!zone) {
      hideUiTip();
      return;
    }
    const text = getUiTipTextForZone(zone);
    if (!text) {
      if (uiTipZone === zone) hideUiTip();
      return;
    }
    showUiTipAt(clientX, clientY, text, zone, 0);
  }

  function finishUiTipAfterGuideDrag(didMove, zoneKey, clientX, clientY) {
    hideUiTip();
    if (didMove) {
      uiTipPressLock = null;
      if (!isClientPointOutsideWindow(clientX, clientY)) {
        syncUiTipFromPointer(clientX, clientY, 0);
      } else {
        refreshCameraGuideHover(clientX, clientY);
      }
      return;
    }
    lockUiTipPressIfInZone(zoneKey, clientX, clientY);
    refreshCameraGuideHover(clientX, clientY);
  }

  // DOM再描画・点線移動などで pointerleave が飛ばずチップが残るのを防ぐ
  function dismissUiTipIfNotHovered() {
    if (!uiTipZone) return;
    const tipEl = document.getElementById('uiTip');
    if (!tipEl || tipEl.classList.contains('hidden')) return;
    if (cameraCropDragging || cameraWidthDragging || cameraCornerDragging) {
      hideUiTip();
      return;
    }
    const zone = uiTipZone;
    if (!isClientPointInUiTipZone(uiTipLastClientX, uiTipLastClientY, zone)) {
      hideUiTip();
      return;
    }
    // まだ乗っているなら動的文言だけ追従
    if (zone === 'camera-crop-hit') {
      const t = getCameraCropTipText();
      if (t && tipEl.textContent !== t) tipEl.textContent = t;
    } else if (zone === 'camera-frame-resizer') {
      const t = getCameraWidthTipText();
      if (t && tipEl.textContent !== t) tipEl.textContent = t;
    } else if (zone === 'camera-frame-corner') {
      const t = getCameraCornerTipText();
      if (t && tipEl.textContent !== t) tipEl.textContent = t;
    }
  }

  function showUiTipAt(clientX, clientY, text, zoneKey, buttons) {
    if (isPointerDragActive()) return;
    if (isCameraSizeModalOpen() && (
      zoneKey === 'camera-crop-hit' || zoneKey === 'camera-frame-resizer' || zoneKey === 'camera-frame-corner'
    )) return;
    const tipEl = document.getElementById('uiTip');
    if (!tipEl || !text) return;
    noteUiTipPointer(clientX, clientY);
    // マウスボタン押下中は出さない
    if (buttons) return;
    // ボタン押下後は、その有効箇所を一度出るまで再表示しない
    if (zoneKey != null && uiTipPressLock === zoneKey) return;
    // 同じ有効箇所にいる間は位置を動かさない（文言だけ状態変化に追従）
    if (zoneKey != null && uiTipZone === zoneKey && !tipEl.classList.contains('hidden')) {
      if (tipEl.textContent !== text) tipEl.textContent = text;
      return;
    }
    tipEl.textContent = text;
    tipEl.classList.remove('hidden');
    // 一旦測ってから配置（右端・下端で画面外に出ないよう反転／クランプ）
    tipEl.style.left = '0px';
    tipEl.style.top = '0px';
    const rect = tipEl.getBoundingClientRect();
    const margin = 8;
    let left = clientX + 12;
    let top = clientY + 16;
    if (left + rect.width > window.innerWidth - margin) {
      left = clientX - 12 - rect.width;
    }
    if (top + rect.height > window.innerHeight - margin) {
      top = clientY - 16 - rect.height;
    }
    if (left < margin) left = margin;
    if (top < margin) top = margin;
    if (left + rect.width > window.innerWidth - margin) {
      left = Math.max(margin, window.innerWidth - margin - rect.width);
    }
    if (top + rect.height > window.innerHeight - margin) {
      top = Math.max(margin, window.innerHeight - margin - rect.height);
    }
    tipEl.style.left = left + 'px';
    tipEl.style.top = top + 'px';
    uiTipZone = zoneKey != null ? zoneKey : 'anon';
  }

  function bindUiTip(el, zoneKey, getText, options) {
    if (!el || !zoneKey || el.dataset.uiTipBound === '1') return;
    el.dataset.uiTipBound = '1';
    el.setAttribute('data-ui-tip-zone', zoneKey);
    const resolveText = typeof getText === 'function' ? getText : () => getText;
    uiTipZoneTextGetters[zoneKey] = () => {
      if (options && typeof options.isActive === 'function' && !options.isActive()) return '';
      return resolveText() || '';
    };

    const syncTip = (e) => {
      noteUiTipPointer(e.clientX, e.clientY);
      if (options && typeof options.isActive === 'function' && !options.isActive()) {
        if (uiTipZone === zoneKey) hideUiTip();
        return;
      }
      if (e.buttons) {
        hideUiTip();
        return;
      }
      const text = resolveText(e);
      if (!text) {
        if (uiTipZone === zoneKey) hideUiTip();
        return;
      }
      showUiTipAt(e.clientX, e.clientY, text, zoneKey, e.buttons);
    };

    el.addEventListener('pointerenter', syncTip);
    el.addEventListener('pointermove', syncTip);
    el.addEventListener('pointerleave', () => {
      // ロック解除は leave に頼らない（偽 leave / 端での欠落対策）。
      // 外れた判定は clearUiTipPressLockIfOutside に統一。
      if (options && typeof options.ignoreLeaveWhile === 'function' && options.ignoreLeaveWhile()) {
        hideUiTip();
        return;
      }
      if (uiTipZone === zoneKey) hideUiTip();
    });
  }

  function initStaticUiTips() {
    const q = (sel) => document.querySelector(sel);
    bindUiTip(q('button[onclick="changeColsManual(-1)"]'), 'cols-dec', '列数を減らす');
    bindUiTip(q('button[onclick="changeColsManual(1)"]'), 'cols-inc', '列数を増やす');
    bindUiTip(q('button[onclick="changeZoomManual(-1)"]'), 'zoom-dec', '倍率を下げる');
    bindUiTip(q('button[onclick="changeZoomManual(1)"]'), 'zoom-inc', '倍率を上げる');
    bindHeaderSelects();
    bindUiTip(document.getElementById('zoomSelectValueHit'), 'zoom-100', () => (
      isZoomValueHitInstantOpen() || isZoomExactly100() ? '' : UI_TIP_ZOOM_100
    ));
    bindUiTip(document.getElementById('zoomAutoBtn'), 'zoom-auto', UI_TIP_ZOOM_AUTO);
    bindUiTip(document.getElementById('cameraModeBtn'), 'camera-mode', '撮影モード');
    bindUiTip(q('button[onclick="toggleMinus()"]'), 'panel-sign-flip', UI_TIP_SIGN_FLIP);
    bindUiTip(q('button[onclick="clearInput()"]'), 'panel-clear', UI_TIP_CLEAR_INPUT);
    bindUiTip(q('#managerModal .btn-swap'), 'manager-swap', UI_TIP_MANAGER_SWAP);
    bindUiTip(document.getElementById('cameraSizeLockBtn'), 'camera-size-aspect-lock', () => (
      cameraSizeAspectLocked ? UI_TIP_ASPECT_UNLOCK : UI_TIP_ASPECT_LOCK
    ));
    bindUiTip(document.getElementById('cameraSizePadlockBtn'), 'camera-size-padlock', getCameraSizePadlockTipText);
    bindUiTip(document.getElementById('cameraSizePresetBtn'), 'camera-size-preset', UI_TIP_CAMERA_SIZE_PRESET, {
      isActive: () => {
        const btn = document.getElementById('cameraSizePresetBtn');
        return !(btn && btn.classList.contains('is-open'));
      }
    });
    bindUiTip(document.getElementById('cameraSizeLabel'), 'camera-size-open', UI_TIP_CAMERA_SIZE_OPEN);
    bindUiTip(document.getElementById('bottomBarAddPlaceholder'), 'preset-add', UI_TIP_PRESET_ADD);
    bindUiTip(document.getElementById('bottomBarEditIcon'), 'preset-edit', UI_TIP_PRESET_EDIT);
  }

  function resolveUiTipZoneFromEvent(e) {
    const t = e && e.target;
    if (!t || !t.closest) return null;
    // 点線本体／ヒット帯は同じ有効箇所
    if (t.closest('#cameraFrameCornerHit')) return 'camera-frame-corner';
    if (t.closest('#cameraCropLineHit, #cameraCropLine')) return 'camera-crop-hit';
    if (t.closest('#cameraFrameResizer, #cameraFrameResizerHit')) return 'camera-frame-resizer';
    const tipHost = t.closest('[data-ui-tip-zone]');
    if (tipHost) {
      const z = tipHost.getAttribute('data-ui-tip-zone');
      if (z) return z;
    }
    const row = t.closest('#managerModal .list-item');
    if (!row || row.classList.contains('is-editing')) return null;
    if (t.closest('.list-item-pen, .list-item-delete, .list-item-check-hit')) return null;
    return `manager-row-${row.dataset.side}-${row.dataset.index}`;
  }

  function releaseUiTipPressLock(zoneKey) {
    if (zoneKey != null && uiTipPressLock === zoneKey) uiTipPressLock = null;
  }

  function resetUiTipState() {
    hideUiTip();
    uiTipPressLock = null;
  }

  function suppressUiTipOnPress(e) {
    noteUiTipPointer(e.clientX, e.clientY);
    const zone = resolveUiTipZoneFromEvent(e) || uiTipZone;
    hideUiTip();
    if (zone) uiTipPressLock = zone;
  }

  // カメラ未入場でも効くよう、ここで一度だけグローバル登録
  // （以前は bindCameraGuideEvents 内にあり、カメラ未使用だとメンバー管理で押下消去が動かなかった）
  if (!window.__uiTipGlobalsBound) {
    window.__uiTipGlobalsBound = true;
    window.addEventListener('pointerdown', suppressUiTipOnPress, true);
    window.addEventListener('mousedown', suppressUiTipOnPress, true);
    // leave が飛ばない／ウインドウ外から乗せるケースは座標から出す
    const onUiTipPointer = (e) => {
      if (isPointerDragActive()) return;
      syncUiTipFromPointer(e.clientX, e.clientY, e.buttons);
    };
    window.addEventListener('pointermove', onUiTipPointer, true);
    window.addEventListener('pointerover', onUiTipPointer, true);
    window.addEventListener('pointerup', (e) => {
      if (isPointerDragActive() || e.buttons) return;
      if (isClientPointOutsideWindow(e.clientX, e.clientY)) uiTipPressLock = null;
      else clearUiTipPressLockIfOutside(e.clientX, e.clientY);
    }, true);
    // ウインドウ外へ出たらロックもチップも外す（再入場で pointerenter が飛ばない対策）
    document.documentElement.addEventListener('pointerleave', () => {
      uiTipPressLock = null;
      hideUiTip();
    });
    // ウィンドウ外へ出たら確実にクリア
    window.addEventListener('blur', resetUiTipState);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) resetUiTipState();
    });
  }

  // 点線ドラッグ中は名前/スコア監視を止める（毎フレーム observe し直すとカードがびくつく）
  function pauseCameraScaleObservers() {
    nameScaleObserver.disconnect();
    scoreScaleObserver.disconnect();
    btnLabelScaleObserver.disconnect();
    spinnerInputFitObserver.disconnect();
  }
  function resumeCameraScaleObservers() {
    document.querySelectorAll('#playerGrid .card-name-box').forEach(el => nameScaleObserver.observe(el));
    document.querySelectorAll('#playerGrid .card-score-display').forEach(el => scoreScaleObserver.observe(el));
    observeBtnFitLabelButtons();
    document.querySelectorAll('#playerGrid .ext-grid-bottom .input-wrapper').forEach(el => spinnerInputFitObserver.observe(el));
  }
  // 監視停止中でも倍率変更後に文字スケールを追従（離した瞬間の一括補正＝びくつきを防ぐ）
  function fitCameraCardTextScales() {
    document.querySelectorAll('#playerGrid .card-name-box').forEach(boxEl => {
      if (!boxEl.offsetParent) return;
      const nameEl = boxEl.querySelector('.card-name');
      if (!nameEl) return;
      const currentScale = parseFloat(nameEl.dataset.currentScale) || 1.0;
      const exactNaturalW = currentScale > 0 ? nameEl.getBoundingClientRect().width / currentScale : 0;
      const exactAvailableW = boxEl.getBoundingClientRect().width;
      syncFitTransformScale(nameEl, exactNaturalW, exactAvailableW, 'currentScale');
    });
    document.querySelectorAll('#playerGrid .card-score-display').forEach(el => fitScoreBox(el));
    fitBtnFitLabelButtons(document.getElementById('playerGrid'));
    fitBtnFitLabelButtons(document.querySelector('.control-panel'));
    document.querySelectorAll('#playerGrid .card-console').forEach(el => syncExtBottomToTop(el));
    document.querySelectorAll('#playerGrid .ext-grid-bottom .input-wrapper input').forEach(el => fitSpinnerInput(el));
  }

  // 離したとき：ドラッグ中の倍率はそのまま。線はカード下端+24。
  // オートも摘み中の白も同じ判定。今離したらオン（オンのまま含む）なら白。
  // 元の位置は開始時のカード+24。A は開始より4px以上下かつ端拡大に入らない16px以内。
  // 150%オートOFFは画面端と同じく4px以上下でオン（16pxは端拡大用なので見ない）
  // true=オン / false=オフ / null=変えない
  function decideCameraCropAutoOnRelease(releaseClientY, atEdge) {
    const startY = cameraCropDragStartClientY;
    const startMaxY = cameraCropDragStartMaxY;
    const startZoom = cameraCropDragStartZoom;
    const sizeUnchanged = Number.isFinite(startMaxY)
      ? Math.abs(getCameraContentMaxY() - startMaxY) <= 0.5
      : (!Number.isFinite(startZoom)
        || Math.abs(currentZoom - startZoom) < 0.0005);
    const dy = (startY != null && Number.isFinite(releaseClientY))
      ? releaseClientY - startY
      : 0;
    const past = getCameraEdgePastPx(releaseClientY);
    const targetY = cameraCropPendingY != null ? cameraCropPendingY : cameraCropBoundaryY;
    const atZoomMax = currentZoom >= 1.5 - 0.001
      || isCameraAutoPinnedAtMaxReachable(targetY);
    if (atZoomMax && (cameraCropDidEdgeExpand || isCameraVerticalScrollActive())) return false;
    if (!cameraCropDidEdgeExpand && !isZoomAuto && atZoomMax
      && dy >= CAMERA_CROP_POINTER_DEAD_PX) {
      return true;
    }
    if (sizeUnchanged) {
      if (!isZoomAuto && atEdge
        && dy >= CAMERA_CROP_POINTER_DEAD_PX
        && past <= CAMERA_SNAP_RELEASE_DISTANCE
        && !isCameraVerticalScrollActive()) {
        return true;
      }
      return null;
    }
    if (!cameraCropDidEdgeExpand && atZoomMax) return true;
    if (atEdge && !isCameraVerticalScrollActive()) return true;
    return false;
  }

  function previewCameraCropIsFollow() {
    if (!(cameraCropDragging || cameraCornerDragging)) return isZoomAuto;
    const targetY = cameraCropPendingY != null ? cameraCropPendingY : cameraCropBoundaryY;
    const viewportBottom = getCameraVisibleBottomContentY() || 0;
    const geo = resolveCameraCropGeometry();
    const atEdge = cameraCropNearBottomLatch
      || isCameraYAtViewportBottom(targetY, viewportBottom)
      || geo.atViewportBottom;
    const decision = decideCameraCropAutoOnRelease(cameraCropLastClientY, atEdge);
    if (decision === true) return true;
    if (decision === false) return false;
    return isZoomAuto;
  }

  function previewCameraWidthIsFollow() {
    if (!(cameraWidthDragging || cameraCornerDragging)) return cameraFrameWidth == null;
    if (cameraWidthParkCatchActive) return false;
    const maxW = getCameraMaxFrameWidth();
    const live = getCameraLiveFrameWidth();
    if (live > maxW + 0.5) return false;
    if (cameraWidthSnapTarget && cameraWidthSnapTarget.type === 'viewport') return true;
    return maxW >= CAMERA_WIDTH_MIN - 0.5 && live >= maxW - 0.5;
  }

  function settleCameraCropAfterDrag(didMove, releaseClientY) {
    const targetY = cameraCropPendingY != null ? cameraCropPendingY : cameraCropBoundaryY;
    const viewportBottom = getCameraVisibleBottomContentY() || 0;
    const atScreenBottom = cameraCropNearBottomLatch
      || isCameraYAtViewportBottom(targetY, viewportBottom);
    const geo = resolveCameraCropGeometry();
    const atEdge = atScreenBottom || geo.atViewportBottom;
    const turnAutoOn = decideCameraCropAutoOnRelease(releaseClientY, atEdge);
    finalizeReleasedCameraCrop(targetY, didMove);
    if (didMove && !isCameraAspectLockOn()) forgetCameraAspectLockRemembered();
    if (turnAutoOn === true) {
      if (isCameraSizeLockActive()) {
        isZoomAuto = false;
        if (didMove && Number.isFinite(targetY)) {
          alignCameraLayoutToDisplayedHeight(getCameraDisplayedHeightPx(targetY));
        }
        commitCameraCropRememberedFromLayout();
        rememberCameraModeManualZoom();
      } else {
        if (didMove) rememberCameraModeManualZoom(currentZoom, true);
        isZoomAuto = true;
        cameraCropRememberedY = null;
        forgetCameraAspectLockRemembered();
      }
    } else if (turnAutoOn === false) {
      isZoomAuto = false;
      if (didMove && Number.isFinite(targetY)) {
        alignCameraLayoutToDisplayedHeight(getCameraDisplayedHeightPx(targetY));
      }
      commitCameraCropRememberedFromLayout();
      rememberCameraModeManualZoom();
    } else if (!isZoomAuto && didMove && Number.isFinite(targetY)) {
      alignCameraLayoutToDisplayedHeight(getCameraDisplayedHeightPx(targetY));
      commitCameraCropRememberedFromLayout();
      rememberCameraModeManualZoom();
    }
    updateZoomUI();
  }

  function finalizeReleasedCameraCrop(targetY, didMove) {
    if (isCameraAutoPinnedAtMinReachable(targetY)
      || (currentZoom <= 0.5 + 0.001 && currentZoom > 0.5)) {
      settleCameraAutoToMinZoomFloor();
    } else if (isCameraAutoPinnedAtMaxReachable(targetY)
      || (currentZoom >= 1.5 - 0.001 && currentZoom < 1.5)) {
      settleCameraAutoToMaxZoomCeiling();
    }
    if (didMove) resetCameraCropToMax();
    updateZoomUI();
  }

  function isCameraYAtViewportBottom(y, viewportBottom) {
    return viewportBottom > 0 && y != null && Number.isFinite(y)
      && y >= viewportBottom - CAMERA_VIEWPORT_BOTTOM_EPS;
  }

  function isPendingCropAtViewportBottom() {
    const targetY = cameraCropPendingY != null ? cameraCropPendingY : cameraCropBoundaryY;
    const viewportBottom = getCameraVisibleBottomContentY() || 0;
    return cameraCropNearBottomLatch || isCameraYAtViewportBottom(targetY, viewportBottom);
  }

  function resetCameraCropToMax() {
    cameraCropKind = 'max';
    cameraCropBoundaryY = null;
    cameraCropFixedY = null;
    cameraCropSnapTarget = null;
    resetCameraGridEdgePadding();
  }

  function applyCameraGuideDblClick(kind) {
    if (!isCameraMode || isCameraSizeModalOpen()) return;
    if (isCameraAspectLockOn()) setCameraAspectLockLive(false);
    if (kind === 'corner') {
      resetCameraCaptureToDefault({ hideTip: true, uiTipPressLock: 'camera-frame-corner' });
      return;
    }
    if (kind === 'width') {
      hideUiTip();
      uiTipPressLock = 'camera-frame-resizer';
      if (cameraFrameWidth == null) return;
      cameraFrameWidth = null;
      applyCameraFrameWidth();
      fitCameraCardTextScales();
      updateCameraGuides();
      checkCameraHeaderCollision();
      return;
    }
    hideUiTip();
    uiTipPressLock = 'camera-crop-hit';
    const geo = resolveCameraCropGeometry();
    if (isCameraCropAtDefaultMax(geo)) return;
    isZoomAuto = true;
    cameraCropRememberedY = null;
    resetCameraCropToMax();
    executeAutoFit();
    checkCameraHeaderCollision();
  }

  function resetCameraGridEdgePadding() {
    const wrapper = getCameraGridWrapper();
    if (!wrapper) return;
    wrapper.style.paddingTop = '';
    wrapper.style.paddingBottom = '';
  }

  function releaseCameraCropHeightFudge() {
    const wrapper = getCameraGridWrapper();
    const hadPad = !!(wrapper && (wrapper.style.paddingTop || wrapper.style.paddingBottom));
    const hadFixed = cameraCropFixedY != null && isFinite(cameraCropFixedY);
    if (!hadPad && !hadFixed) return;
    resetCameraGridEdgePadding();
    cameraCropFixedY = null;
    cameraCropKind = 'max';
    cameraCropBoundaryY = null;
    cameraCropPendingY = null;
    const y = getCameraContentMaxY();
    if (y > 0 && Number.isFinite(y)) cameraCropDragStartMaxY = y;
    updateCameraGuides();
  }

  function getCameraGridEdgePaddingSnapshot() {
    const wrapper = getCameraGridWrapper();
    return {
      padTop: wrapper ? wrapper.style.paddingTop : '',
      padBottom: wrapper ? wrapper.style.paddingBottom : ''
    };
  }

  function applyCameraGridEdgePaddingSnapshot(snap) {
    const wrapper = getCameraGridWrapper();
    if (!wrapper) return;
    wrapper.style.paddingTop = (snap && snap.padTop) || '';
    wrapper.style.paddingBottom = (snap && snap.padBottom) || '';
  }

  function applyCameraGridEdgePaddingSplit(deltaPx) {
    const wrapper = getCameraGridWrapper();
    if (!wrapper) return;
    const base = CAMERA_EDGE_PADDING;
    const delta = Math.round(Number(deltaPx) || 0);
    let topPad = base + Math.trunc(delta / 2);
    let bottomPad = base + (delta - Math.trunc(delta / 2));
    if (topPad < 0) {
      bottomPad += topPad;
      topPad = 0;
    }
    if (bottomPad < 0) {
      topPad += bottomPad;
      bottomPad = 0;
    }
    if (topPad < 0) topPad = 0;
    if (bottomPad < 0) bottomPad = 0;
    wrapper.style.paddingTop = topPad + 'px';
    wrapper.style.paddingBottom = bottomPad + 'px';
  }

  function syncCameraCropAfterLayout() {
    if (!isCameraMode || cameraCropDragging || cameraLockDragging) return;
    if (cameraWidthDragging && !cameraCornerDragging) return;
    if (cameraCropFixedY != null && isFinite(cameraCropFixedY)) return;
    resetCameraCropToMax();
  }

  function updateCameraGuides() {
    if (!isCameraMode) return;
    const line = document.getElementById('cameraCropLine');
    const resizer = document.getElementById('cameraFrameResizer');
    if (!line || !resizer) return;

    syncCameraCropAfterLayout();
    resizer.classList.remove('hidden');
    const maxW = getCameraMaxFrameWidth();
    const preview = cameraWidthDragPreview;
    const widthAtFollowMax = cameraFrameWidth == null
      && (preview == null || preview >= maxW - 0.5);
    resizer.classList.toggle('is-at-max', widthAtFollowMax);
    resizer.classList.toggle('is-follow', previewCameraWidthIsFollow());
    const widthEdgeHoldSnap =
      (cameraWidthEdgeExpanding && cameraWidthEdgeExpandSnapW != null
        && cameraWidthEdgeExpandHoldPx < CAMERA_WIDTH_STEP)
      || (cameraWidthEdgeShrinking && cameraWidthEdgeShrinkSnapW != null
        && cameraWidthEdgeShrinkHoldPx < CAMERA_WIDTH_STEP);
    const liveW = getCameraLiveFrameWidth();
    const widthOnStep = getCameraWidthStepIfNear(liveW, 0.5) != null && liveW > maxW + 0.5;
    const widthAtRangeLimit = (cameraWidthDragging || cameraCornerDragging)
      && (isCameraFrameWidthAtSizeRangeLimit(liveW)
        || liveW >= getCameraSizeWidthMaxScreenPx() - 0.5);
    const widthStepSnap = widthEdgeHoldSnap
      || ((cameraWidthDragging || cameraCornerDragging) && widthOnStep)
      || !!(cameraWidthSnapTarget && cameraWidthSnapTarget.type === 'step')
      || widthAtRangeLimit;
    resizer.classList.toggle('is-snapped', widthStepSnap);

    const { rows } = getCameraRowInfo();
    if (!rows.length) {
      line.classList.add('hidden');
      syncCameraCropLineChrome();
      updateCameraSizeLabel();
      updateCameraResetDefaultBtn();
      paintLockedSnapUi();
      return;
    }

    const geo = resolveCameraCropGeometry();
    cameraCropKind = geo.kind;

    line.classList.remove('hidden');
    line.classList.toggle('is-at-limit', geo.atLimit && !cameraCropDragging && cameraCropSnapTarget == null);
    line.classList.toggle('is-at-viewport-bottom', geo.atViewportBottom);
    line.classList.toggle('is-follow', previewCameraCropIsFollow());
    line.classList.toggle('is-disabled', !geo.canDrag);
    const cropEdgeHoldSnap =
      (cameraCropEdgeExpanding && cameraCropEdgeExpandSnapY != null
        && cameraCropEdgeExpandHoldPx < CAMERA_HEIGHT_STEP)
      || (cameraCropEdgeShrinking && cameraCropEdgeShrinkSnapY != null
        && cameraCropEdgeShrinkHoldPx < CAMERA_HEIGHT_STEP);
    const contentOnStep = getCameraHeightStepIfNear(getCameraContentMaxY(), 0.5) != null;
    const cropStepSnap = cropEdgeHoldSnap
      || ((cameraCropDragging || cameraCornerDragging)
        && (contentOnStep || isCameraCropAtMinZoomLimit() || isCameraCropAtMaxZoomLimit()))
      || !!(cameraCropSnapTarget && cameraCropSnapTarget.type === 'step');
    line.classList.toggle('is-snapped', cropStepSnap);
    // top / 幅 / ヒットは sync（main-view 絶対配置）
    syncCameraCropLineChrome();
    // 即時ツールチップ用（native title は遅延があるため使わない）
    const hit = document.getElementById('cameraCropLineHit');
    const tip = getCameraCropTipText();
    if (hit) {
      hit.setAttribute('data-ui-tip-zone', 'camera-crop-hit');
      if (tip) hit.setAttribute('data-tip', tip);
      else hit.removeAttribute('data-tip');
    }
    // 点線移動で leave が飛ばずチップが残るのをここで回収
    dismissUiTipIfNotHovered();
    line.removeAttribute('title');
    if (hit) hit.removeAttribute('title');
    resizer.removeAttribute('title');
    resizer.setAttribute('data-ui-tip-zone', 'camera-frame-resizer');

    updateCameraSizeLabel();
    updateCameraResetDefaultBtn();
    paintLockedSnapUi();
  }

  function executeAutoZoomToMatchBoundary(targetY, options) {
    if (players.length === 0) return Math.max(1, targetY);
    // 再入禁止（ドラッグ中の rAF 連打でメインスレッドが固まるのを防ぐ）
    if (cameraCropZoomFitting) {
      return Math.max(1, getCameraContentMaxY());
    }

    const grid = document.getElementById('playerGrid');
    // ドラッグ中に render() すると pointer capture が切れ、線が動かずカードも消えることがある
    // CSS zoom だけで寸法が変わるので、DOM 再構築はしない
    const prevTransition = grid ? grid.style.transition : '';
    if (grid) grid.style.transition = 'none';
    // zoom 変更のたびに名前/スコアの ResizeObserver が全カードで走るとフリーズするため一時停止
    nameScaleObserver.disconnect();
    scoreScaleObserver.disconnect();
    cameraCropZoomFitting = true;
    try {
      // ドラッグ中: 比率＋0.001を最大2回（丸めで0.5pxに届かない帯用）。40回は下端着地のみ
      const edgePack = !!(options && options.precise);
      const ratioIters = edgePack ? 16 : 4;
      const stepIters = edgePack ? 40 : 2;
      const tol = 0.5;
      const zoomRound = 1000;
      const zoomStep = 0.001;

      const catchHoldMin = cameraCropParkCatchActive;
      for (let i = 0; i < ratioIters; i++) {
        const current = Math.max(1, getCameraContentMaxY());
        if (edgePack
          ? getCameraDisplayedHeightPx(current) === getCameraDisplayedHeightPx(targetY)
          : Math.abs(current - targetY) <= tol) break;
        let nextZoom = currentZoom * (targetY / current);
        const hitMinFloor = nextZoom <= 0.5 && !catchHoldMin;
        const hitMaxCeiling = nextZoom >= 1.5;
        nextZoom = Math.round(nextZoom * zoomRound) / zoomRound;
        nextZoom = Math.max(catchHoldMin ? 0.501 : 0.5, Math.min(1.5, nextZoom));
        if (hitMinFloor) nextZoom = 0.5;
        if (hitMaxCeiling) nextZoom = 1.5;
        if (Math.abs(nextZoom - currentZoom) < 0.0005) break;
        currentZoom = nextZoom;
        updateCSSVariables();
        if (grid) void grid.offsetHeight;
        if (hitMinFloor || hitMaxCeiling) break;
      }

      for (let i = 0; i < stepIters; i++) {
        const current = getCameraContentMaxY();
        const diff = targetY - current;
        if (edgePack
          ? getCameraDisplayedHeightPx(current) === getCameraDisplayedHeightPx(targetY)
          : Math.abs(diff) <= tol) break;
        if (diff > 0 && currentZoom >= 1.5 - 1e-9) break;
        if (diff < 0 && currentZoom <= (catchHoldMin ? 0.501 : 0.5) + 1e-9) break;
        const step = diff > 0 ? zoomStep : -zoomStep;
        const floorZ = catchHoldMin ? 0.501 : 0.5;
        const nextZoom = Math.max(floorZ, Math.min(1.5, Math.round((currentZoom + step) * zoomRound) / zoomRound));
        if (nextZoom === currentZoom) break;
        currentZoom = nextZoom;
        updateCSSVariables();
        if (grid) void grid.offsetHeight;
      }

      if (!Number.isFinite(currentZoom) || currentZoom <= 0) currentZoom = 1.0;
      // 追いつき中は 0.5 確定しない（線が仮の50%で飛んで実測とズレる）
      if (!cameraCropParkCatchActive) snapCameraZoomToExactLimitIfNear();
      updateCSSVariables();
      // ドラッグ中も最終倍率確定後に文字スケールを同期（Observer が止まっているため手動で補正）
      if (cameraCropDragging || cameraCornerDragging || cameraLockDragging) fitCameraCardTextScales();
      updateZoomUI();
      return getCameraContentMaxY();
    } finally {
      cameraCropZoomFitting = false;
      // 同フレーム復帰だと zoom 0.2s が補間される。ドラッグ中は none のまま、離したあとは finalize/settle 側で戻す
      if (grid) {
        if (cameraCropDragging || cameraCornerDragging || cameraLockDragging) {
          grid.style.transition = 'none';
        } else {
          void grid.offsetHeight;
          const restore = prevTransition;
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              if (grid && !cameraCropDragging && !cameraLockDragging && !cameraCropZoomFitting) {
                grid.style.transition = restore;
              }
            });
          });
        }
      }
      // 監視を再開（ドラッグ中は begin で止めたまま。離したときに resume）
      if (!(cameraCropDragging || cameraCornerDragging || cameraLockDragging) && !cameraScaleObserversHeld) {
        resumeCameraScaleObservers();
      }
    }
  }

  // オート点線の表示／目標Yを、現在倍率で到達可能な範囲に収める（50%直前の一瞬のはみ出し防止）
  function clampCameraAutoBoundaryY(y) {
    if (!Number.isFinite(y)) return y;
    if (cameraCropDragging || cameraCornerDragging) {
      const minY = getCameraCropYAtMinZoom();
      const maxY = getCameraCropYAtMaxZoom();
      if (y < minY - 0.5) y = minY;
      if (y > maxY + 0.5) y = maxY;
      return y;
    }
    const content = Math.max(1, getCameraContentMaxY());
    if (currentZoom <= 0.5 + 0.001) {
      if (y < content) y = content;
    } else {
      const minReachableY = content * (0.5 / currentZoom);
      if (y < minReachableY - 0.5) y = minReachableY;
    }
    if (currentZoom >= 1.5 - 0.001) {
      if (y > content) y = content;
    } else {
      const maxReachableY = content * (1.5 / currentZoom);
      if (y > maxReachableY + 0.5) y = maxReachableY;
    }
    return y;
  }

  // 50%最小へ正確着地（0.502止めのまま離すと表示が1098/1102等にバラつく）
  function isCameraAutoPinnedAtMinReachable(y) {
    if (!(currentZoom > 0.5 + 0.001)) return false;
    const content = Math.max(1, getCameraContentMaxY());
    const minReach = content * (0.5 / currentZoom);
    return Number.isFinite(y) && y <= minReach + 1.0;
  }

  function isCameraAutoPinnedAtMaxReachable(y) {
    if (!(currentZoom < 1.5 - 0.001)) return false;
    const content = Math.max(1, getCameraContentMaxY());
    const maxReach = content * (1.5 / currentZoom);
    return Number.isFinite(y) && y >= maxReach - 1.0;
  }

  function settleCameraZoomToLimit(limitZoom) {
    const z = limitZoom <= 0.5 ? 0.5 : 1.5;
    if (Math.abs(currentZoom - z) < 1e-12) return getCameraContentMaxY();
    const grid = document.getElementById('playerGrid');
    if (grid) grid.style.transition = 'none';
    nameScaleObserver.disconnect();
    scoreScaleObserver.disconnect();
    currentZoom = z;
    updateCSSVariables();
    if (grid) void grid.offsetHeight;
    if (cameraCropDragging || cameraCornerDragging) fitCameraCardTextScales();
    updateZoomUI();
    return getCameraContentMaxY();
  }

  function settleCameraAutoToMinZoomFloor() {
    return settleCameraZoomToLimit(0.5);
  }

  function settleCameraAutoToMaxZoomCeiling() {
    return settleCameraZoomToLimit(1.5);
  }

  function snapCameraCropLineToZoomLimitIfAtWall(rawY, minZoomFloorY, maxZoomCeilingY) {
    if (rawY <= minZoomFloorY + 0.5 && currentZoom > 0.5 + 1e-9) {
      const y = settleCameraAutoToMinZoomFloor();
      cameraCropDragY50 = y;
      cameraCropPendingY = y;
      cameraCropBoundaryY = y;
