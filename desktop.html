    updateManagerListScrollFades(document.getElementById('tempWaitList'));
  }

  function bindManagerListScrollFades() {
    ['tempMainList', 'tempWaitList'].forEach(id => {
      const el = document.getElementById(id);
      if (!el || el.dataset.scrollFadeBound === '1') return;
      el.dataset.scrollFadeBound = '1';
      const sync = () => updateManagerListScrollFades(el);
      el.addEventListener('scroll', sync, { passive: true });
      if (typeof ResizeObserver !== 'undefined') {
        const ro = new ResizeObserver(sync);
        ro.observe(el);
      }
    });
  }

  function renderTempLists() {
    document.getElementById('tempMainCount').innerText = tempPlayers.length;
    const searchStr = document.getElementById('waitSearch').value.toLowerCase();
    clearManagerDragIndicators();

    const mainList = document.getElementById('tempMainList');
    mainList.innerHTML = '';
    tempPlayers.forEach((p, i) => {
      if (searchStr && !p.name.toLowerCase().includes(searchStr)) return;
      mainList.appendChild(createManagerListItem('main', p, i));
    });

    const waitList = document.getElementById('tempWaitList');
    waitList.innerHTML = '';
    tempWaitroom.forEach((w, i) => {
      if (searchStr && !w.name.toLowerCase().includes(searchStr)) return;
      waitList.appendChild(createManagerListItem('wait', w, i));
    });
    // リスト破棄で leave が飛ばずチップが残るのを回収（⇄ など静的チップは維持）
    dismissUiTipIfNotHovered();
    updateManagerActionButtons();
    requestAnimationFrame(() => {
      bindManagerListScrollFades();
      syncAllManagerListScrollFades();
      checkManagerHeaderTitleFit();
    });
  }

  function createManagerListItem(side, entry, index) {
    const div = document.createElement('div');
    div.className = 'list-item' + (entry.selected ? ' is-selected' : '');
    div.dataset.side = side;
    div.dataset.index = String(index);

    const resolveRowZone = (t) => {
      if (t.closest('.list-item-pen')) return 'pen';
      if (t.closest('.list-item-delete')) return 'delete';
      if (t.closest('.list-item-check-hit')) return 'check';
      return 'row';
    };
    armPressReleaseZones(div, resolveRowZone);

    const checkHit = document.createElement('label');
    checkHit.className = 'list-item-check-hit';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.className = 'list-item-check';
    checkbox.checked = !!entry.selected;
    checkHit.addEventListener('click', (e) => {
      e.stopPropagation();
      // チェック領域で押して外で離したときはネイティブもトグルしないが、
      // 万一の二重反応を避けるためゾーン不一致なら change を打ち消す
      if (!pressReleaseMatched(div, 'check')) {
        e.preventDefault();
      }
    });
    checkHit.addEventListener('pointerdown', (e) => e.stopPropagation());
    checkbox.addEventListener('change', () => {
      if (side === 'main') tempPlayers[index].selected = checkbox.checked;
      else tempWaitroom[index].selected = checkbox.checked;
      div.classList.toggle('is-selected', checkbox.checked);
      updateManagerActionButtons();
    });
    checkHit.appendChild(checkbox);

    const leading = document.createElement('div');
    leading.className = 'list-item-leading';

    const nameEl = document.createElement('span');
    nameEl.className = 'list-item-name';
    nameEl.textContent = entry.name;

    const penBtn = document.createElement('button');
    penBtn.type = 'button';
    penBtn.className = 'list-item-pen';
    penBtn.innerHTML = '<span class="list-item-icon">✎</span>';
    penBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
    penBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!pressReleaseMatched(div, 'pen')) return;
      hideUiTip();
      beginManagerNameEdit(side, index, div, nameEl, penBtn);
    });
    bindUiTip(penBtn, `manager-pen-${side}-${index}`, '名前を編集');

    nameEl.addEventListener('dblclick', (e) => {
      e.preventDefault();
      e.stopPropagation();
    });

    leading.appendChild(nameEl);
    leading.appendChild(penBtn);

    const deleteBtn = document.createElement('button');
    deleteBtn.type = 'button';
    deleteBtn.className = 'list-item-delete';
    deleteBtn.innerHTML = '<span class="list-item-icon">×</span>';
    deleteBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
    deleteBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!pressReleaseMatched(div, 'delete')) return;
      hideUiTip();
      deleteManagerMember(side, index);
    });
    bindUiTip(deleteBtn, `manager-del-${side}-${index}`, '完全に削除');

    div.appendChild(checkHit);
    div.appendChild(leading);
    div.appendChild(deleteBtn);
    bindManagerListTip(div);

    // 行ボディで press→release したときだけ選択トグル。
    // ペン／❌／チェックで押して外で離すと共通祖先に click が来るが、ゾーン不一致で無視する。
    // 名前上は 200ms 以内の2回目で編集。トグルは同じ 200ms 遅延
    div.addEventListener('click', (e) => {
      if (div._suppressClick) {
        div._suppressClick = false;
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      if (div.classList.contains('is-editing')) return;
      if (e.target.closest('.list-item-pen, .list-item-delete, .list-item-check-hit')) return;
      const toggle = () => {
        checkbox.checked = !checkbox.checked;
        checkbox.dispatchEvent(new Event('change', { bubbles: true }));
      };
      if (e.target.closest('.list-item-name')) {
        const key = `manager-name-${side}-${index}`;
        if (deferredClickTimers.has(key)) {
          cancelDeferredClick(key);
          hideUiTip();
          beginManagerNameEdit(side, index, div, nameEl, penBtn);
          return;
        }
        if (!pressReleaseMatched(div, 'row')) return;
        armDeferredClick(key, toggle);
        return;
      }
      if (!pressReleaseMatched(div, 'row')) return;
      toggle();
    });

    div.addEventListener('pointerdown', (e) => {
      beginManagerPointerDrag(e, side, index, div);
    });

    return div;
  }

  function clearManagerSelectionDomOnly() {
    tempPlayers.forEach(p => { p.selected = false; });
    tempWaitroom.forEach(w => { w.selected = false; });
    document.querySelectorAll('#managerModal .list-item.is-selected').forEach(el => {
      el.classList.remove('is-selected');
      const cb = el.querySelector('.list-item-check');
      if (cb) cb.checked = false;
    });
    updateManagerActionButtons();
  }

  function countManagerSelectedOnSide(side) {
    const arr = side === 'main' ? tempPlayers : tempWaitroom;
    return arr.reduce((n, e) => n + (e.selected ? 1 : 0), 0);
  }

  function activateManagerPointerDrag(ptr) {
    if (ptr.active) return;
    ptr.pending = false;
    ptr.active = true;
    ptr.rowEl._suppressClick = true;
    hideUiTip();
    uiTipPressLock = null;
    managerDragSourceSide = ptr.sourceSide;

    const arr = ptr.sourceSide === 'main' ? tempPlayers : tempWaitroom;
    const entry = arr[ptr.sourceIndex];
    // 未選択を動かした瞬間 → 全解除して単独つまみ（クリックだけのときは触らない）
    if (entry && !entry.selected && hasManagerSelection()) {
      clearManagerSelectionDomOnly();
      ptr.multiMove = false;
      ptr.moveCount = 1;
    } else {
      const selectedOnSide = countManagerSelectedOnSide(ptr.sourceSide);
      ptr.multiMove = !!(entry && entry.selected && selectedOnSide >= 2);
      ptr.moveCount = ptr.multiMove ? selectedOnSide : 1;
    }

    cancelDeferredClick(`manager-name-${ptr.sourceSide}-${ptr.sourceIndex}`);

    ptr.rowEl.classList.add('is-dragging');
    ptr.rowEl._suppressClick = true;
    ptr.dragRowEls = [ptr.rowEl];
    if (ptr.multiMove) {
      document.querySelectorAll(`#managerModal .list-item[data-side="${ptr.sourceSide}"]`).forEach(el => {
        const idx = parseInt(el.dataset.index, 10);
        const sideArr = ptr.sourceSide === 'main' ? tempPlayers : tempWaitroom;
        if (!Number.isFinite(idx) || !sideArr[idx] || !sideArr[idx].selected) return;
        if (el === ptr.rowEl) return;
        el.classList.add('is-dragging');
        el._suppressClick = true;
        ptr.dragRowEls.push(el);
      });
    }

    const mainCol = document.querySelector('#managerModal .manager-col:not(.wait)');
    const waitCol = document.querySelector('#managerModal .manager-col.wait');
    const modalContent = document.querySelector('#managerModal .modal-content');
    ptr.colEls = { main: mainCol, wait: waitCol };
    ptr.listEls = {
      main: document.getElementById('tempMainList'),
      wait: document.getElementById('tempWaitList')
    };
    ptr.colRects = {
      main: mainCol ? mainCol.getBoundingClientRect() : null,
      wait: waitCol ? waitCol.getBoundingClientRect() : null
    };
    ptr.modalContentRect = modalContent ? modalContent.getBoundingClientRect() : null;
    ptr.listGeom = {
      main: cacheManagerListGeom('tempMainList'),
      wait: cacheManagerListGeom('tempWaitList')
    };
    ptr.autoScrollLastTs = 0;

    const rect = ptr.rowEl.getBoundingClientRect();
    ptr.offsetX = rect.width / 2;
    ptr.offsetY = 16;

    const ghost = document.createElement('div');
    ghost.className = 'manager-drag-ghost' + (ptr.multiMove ? ' is-multi' : '');
    ghost.style.width = rect.width + 'px';
    const inner = document.createElement('div');
    inner.className = 'manager-drag-ghost-inner';
    if (ptr.multiMove) {
      const badge = document.createElement('span');
      badge.className = 'manager-drag-ghost-count';
      badge.textContent = String(ptr.moveCount);
      inner.appendChild(badge);
    } else {
      const nameText = (ptr.rowEl.querySelector('.list-item-name') || {}).textContent || '';
      const nameEl = document.createElement('span');
      nameEl.className = 'manager-drag-ghost-name';
      nameEl.textContent = nameText;
      inner.appendChild(nameEl);
    }
    ghost.appendChild(inner);
    document.body.appendChild(ghost);
    ptr.ghost = ghost;

    setPointerDragCursor(true);
    pumpManagerPointerDragFrame(ptr);
  }

  function hitManagerColSideFromRects(ptr, x, y) {
    const rects = ptr.colRects;
    if (!rects) return null;
    const main = rects.main;
    if (main && x >= main.left && x <= main.right && y >= main.top && y <= main.bottom) return 'main';
    const wait = rects.wait;
    if (wait && x >= wait.left && x <= wait.right && y >= wait.top && y <= wait.bottom) return 'wait';
    return null;
  }

  function isPointInManagerModalContent(ptr, x, y) {
    const r = ptr.modalContentRect;
    if (!r) return false;
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }

  /** 列(#101010)内の上下帯でリストを自動スクロール。禁止（列外）では動かさない */
  function refreshManagerDragColRects(ptr) {
    if (!ptr.colEls || !ptr.colRects) return;
    if (ptr.colEls.main) ptr.colRects.main = ptr.colEls.main.getBoundingClientRect();
    if (ptr.colEls.wait) ptr.colRects.wait = ptr.colEls.wait.getBoundingClientRect();
  }

  function applyManagerListAutoScroll(ptr, dtMs) {
    if (!ptr.active || dtMs <= 0) return false;
    refreshManagerDragColRects(ptr);
    const side = hitManagerColSideFromRects(ptr, ptr.lastX, ptr.lastY);
    if (!side) return false;

    const listEl = ptr.listEls && ptr.listEls[side];
    const colEl = ptr.colEls && ptr.colEls[side];
    if (!listEl || !colEl) return false;

    const maxScroll = listEl.scrollHeight - listEl.clientHeight;
    if (maxScroll <= 0) return false;

    const colRect = ptr.colRects[side];
    const listRect = listEl.getBoundingClientRect();
    const x = ptr.lastX;
    const y = ptr.lastY;
    if (!colRect || x < colRect.left || x > colRect.right || y < colRect.top || y > colRect.bottom) return false;

    const topZoneEnd = listRect.top + MGR_AUTOSCROLL_ZONE_PX;
    const bottomZoneStart = listRect.bottom - MGR_AUTOSCROLL_ZONE_PX;
    let dir = 0; // -1 up / +1 down
    if (topZoneEnd >= bottomZoneStart) {
      const mid = (listRect.top + listRect.bottom) / 2;
      dir = (y <= mid) ? -1 : 1;
    } else if (y <= topZoneEnd) {
      dir = -1;
    } else if (y >= bottomZoneStart) {
      dir = 1;
    } else {
      return false;
    }

    if (dir < 0 && listEl.scrollTop <= 0) return false;
    if (dir > 0 && listEl.scrollTop >= maxScroll - 0.5) return false;

    const delta = dir * MGR_AUTOSCROLL_SPEED_PX_S * (dtMs / 1000);
    const prev = listEl.scrollTop;
    listEl.scrollTop = Math.max(0, Math.min(maxScroll, prev + delta));
    return listEl.scrollTop !== prev;
  }

  function pumpManagerPointerDragFrame(ptr) {
    if (!ptr.active || mgrPtrDrag !== ptr) return;
    if (ptr.raf) return;
    ptr.raf = requestAnimationFrame((ts) => {
      ptr.raf = 0;
      if (!ptr.active || mgrPtrDrag !== ptr) return;
      const last = ptr.autoScrollLastTs || ts;
      ptr.autoScrollLastTs = ts;
      const dt = Math.min(48, Math.max(0, ts - last));
      applyManagerListAutoScroll(ptr, dt);
      tickManagerPointerDrag(ptr);
      pumpManagerPointerDragFrame(ptr);
    });
  }

  function tickManagerPointerDrag(ptr) {
    if (!ptr.active || !ptr.ghost) return;
    ptr.ghost.style.left = (ptr.lastX - ptr.offsetX) + 'px';
    ptr.ghost.style.top = (ptr.lastY - ptr.offsetY) + 'px';

    const targetSide = hitManagerColSideFromRects(ptr, ptr.lastX, ptr.lastY);

    // 複数持ち：相手カラム以外はドロップ不可だが、モーダル内は掴み手／外だけ禁止
    if (ptr.multiMove) {
      clearManagerDragIndicators();
      if (targetSide && targetSide !== ptr.sourceSide) {
        ptr.canDrop = true;
        ptr.targetSide = targetSide;
        setPointerDragCursor(true);
        setManagerColDropHighlight(targetSide);
        ptr.insertIndex = 0;
        return;
      }
      ptr.canDrop = false;
      ptr.targetSide = null;
      if (mgrDropHighlightSide != null) clearManagerColDropHighlights();
      setPointerDragCursor(isPointInManagerModalContent(ptr, ptr.lastX, ptr.lastY));
      return;
    }

    if (!targetSide) {
      if (ptr.canDrop || ptr.targetSide) {
        ptr.canDrop = false;
        ptr.targetSide = null;
        clearManagerDragIndicators();
        clearManagerColDropHighlights();
      }
      setPointerDragCursor(false);
      return;
    }

    ptr.canDrop = true;
    ptr.targetSide = targetSide;
    setPointerDragCursor(true);

    // 他エリア：列ハイライトのみ（白線なし）
    if (managerDragSourceSide && managerDragSourceSide !== targetSide) {
      setManagerColDropHighlight(targetSide);
      ptr.insertIndex = 0;
      return;
    }

    // 同一エリア：箱に入った瞬間で線（上＝直前／下＝直後）
    if (mgrDropHighlightSide != null) clearManagerColDropHighlights();
    ptr.insertIndex = applyManagerInsertByGeometry(
      ptr.listGeom && ptr.listGeom[targetSide],
      ptr.lastY,
      ptr.sourceSide === targetSide ? ptr.sourceIndex : null
    );
  }

  function endManagerPointerDrag(ptr, commit) {
    if (mgrPtrDrag !== ptr) return;
    mgrPtrDrag = null;

    window.removeEventListener('pointermove', ptr.onMove);
    window.removeEventListener('pointerup', ptr.onUp);
    window.removeEventListener('pointercancel', ptr.onCancel);
    if (ptr.raf) {
      cancelAnimationFrame(ptr.raf);
      ptr.raf = 0;
    }

    const didDrag = ptr.active;
    const canDrop = ptr.canDrop;
    const sourceSide = ptr.sourceSide;
    const sourceIndex = ptr.sourceIndex;
    const targetSide = ptr.targetSide;
    const insertIndex = ptr.insertIndex;
    const multiMove = !!ptr.multiMove;

    if (ptr.ghost && ptr.ghost.parentNode) ptr.ghost.parentNode.removeChild(ptr.ghost);
    ptr.ghost = null;
    if (ptr.dragRowEls && ptr.dragRowEls.length) {
      ptr.dragRowEls.forEach(el => {
        el.classList.remove('is-dragging');
        el._suppressClick = false;
      });
    } else if (ptr.rowEl) {
      ptr.rowEl.classList.remove('is-dragging');
      ptr.rowEl._suppressClick = false;
    }
    document.querySelectorAll('#managerModal .list-item').forEach(el => {
      el._suppressClick = false;
    });
    managerDragSourceSide = null;
    clearManagerDragIndicators();
    clearManagerColDropHighlights();
    clearPointerDragCursor();

    let dropChanged = false;
    if (didDrag && commit && canDrop && targetSide) {
      dropChanged = !!applyManagerDrop(sourceSide, sourceIndex, targetSide, insertIndex, multiMove);
    }
    // 直後の誤 click を握る条件:
    // - 移動成功 → 移動先への誤選択防止
    // - 変更なし＆選択が残っている → トグル／余白解除で選択が壊れるのを防止
    // （選択なしの微ドラッグでは立てない → クリック死を減らす）
    if (didDrag && (dropChanged || hasManagerSelection())) {
      mgrSwallowClickAfterDrag = true;
    }
  }

  function beginManagerPointerDrag(e, side, index, rowEl) {
    if (mgrPtrDrag || gridPtrDrag) return;
    if (e.button !== 0) return;
    // 誰か名前編集中はリスト全体つまめない
    if (document.querySelector('#managerModal .list-item.is-editing')) return;
    if (rowEl.classList.contains('is-editing')) return;
    if (e.target.closest('input, button, .list-item-check-hit, .list-item-pen, .list-item-delete')) return;

    const arr = side === 'main' ? tempPlayers : tempWaitroom;
    const entry = arr[index];
    if (!entry) return;

    const ptr = {
      pointerId: e.pointerId,
      sourceSide: side,
      sourceIndex: index,
      rowEl,
      startX: e.clientX,
      startY: e.clientY,
      lastX: e.clientX,
      lastY: e.clientY,
      offsetX: 0,
      offsetY: 0,
      pending: true,
      active: false,
      ghost: null,
      raf: 0,
      canDrop: false,
      targetSide: null,
      insertIndex: 0,
      multiMove: false,
      moveCount: 1,
      dragRowEls: null
    };
    mgrPtrDrag = ptr;

    const onMove = (ev) => {
      if (ev.pointerId !== ptr.pointerId) return;
      ptr.lastX = ev.clientX;
      ptr.lastY = ev.clientY;
      if (ptr.pending) {
        const dx = ev.clientX - ptr.startX;
        const dy = ev.clientY - ptr.startY;
        if (dx * dx + dy * dy < PTR_DRAG_THRESHOLD_PX * PTR_DRAG_THRESHOLD_PX) return;
        activateManagerPointerDrag(ptr);
      }
      // 移動座標は ptr.last* に入る。描画／自動スクロールは pump の rAF が担当
    };
    const onUp = (ev) => {
      if (ev.pointerId !== ptr.pointerId) return;
      endManagerPointerDrag(ptr, true);
    };
    const onCancel = (ev) => {
      if (ev.pointerId !== ptr.pointerId) return;
      endManagerPointerDrag(ptr, false);
    };
    ptr.onMove = onMove;
    ptr.onUp = onUp;
    ptr.onCancel = onCancel;
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  }

  function deleteManagerMember(side, index) {
    if (side === 'main') {
      if (index < 0 || index >= tempPlayers.length) return;
      tempPlayers.splice(index, 1);
    } else {
      if (index < 0 || index >= tempWaitroom.length) return;
      tempWaitroom.splice(index, 1);
    }
    renderTempLists();
    updateManagerActionButtons();
  }

  function beginManagerNameEdit(side, index, rowEl, nameEl, penBtn) {
    const arr = side === 'main' ? tempPlayers : tempWaitroom;
    if (!arr[index] || rowEl.classList.contains('is-editing')) return;
    if (document.querySelector('#managerModal .list-item.is-editing')) return;

    const originalName = arr[index].name;
    resetUiTipState();
    const modal = document.getElementById('managerModal');
    if (modal) modal.classList.add('is-name-editing');
    rowEl.classList.add('is-editing');
    nameEl.classList.add('is-editing-name');
    nameEl.contentEditable = 'true';
    nameEl.spellcheck = false;
    nameEl.setAttribute('role', 'textbox');

    let finished = false;
    const finish = (commit, fromBlur) => {
      if (finished) return;
      finished = true;
      nameEl.contentEditable = 'false';
      nameEl.classList.remove('is-editing-name');
      let next = commit ? nameEl.textContent.replace(/\n/g, '').trim() : originalName;
      if (next === '') next = originalName;
      if (next.length > 10) next = next.substring(0, 10);
      arr[index].name = next;
      if (fromBlur) {
        mgrSwallowClickAfterEdit = true;
      } else if (modal) {
        modal.classList.remove('is-name-editing');
      }
      renderTempLists();
      updateManagerActionButtons();
    };

    nameEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        finish(true, false);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        finish(false, false);
      }
    });
    nameEl.addEventListener('input', () => {
      const raw = nameEl.textContent.replace(/\n/g, '');
      if (raw.length > 10) {
        nameEl.textContent = raw.slice(0, 10);
        const range = document.createRange();
        range.selectNodeContents(nameEl);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    });
    nameEl.addEventListener('blur', () => finish(true, true));
    nameEl.addEventListener('pointerdown', (e) => e.stopPropagation());
    // 行内（旧ペン/削除・チェック位置含む）は入力ボックス扱い。mousedown のデフォルトを止め blur 確定を防ぐ
    rowEl.addEventListener('mousedown', (e) => {
      if (finished) return;
      e.stopPropagation();
      if (e.target === nameEl || nameEl.contains(e.target)) return;
      e.preventDefault();
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0 && nameEl.contains(sel.anchorNode)) {
        sel.collapseToEnd();
      }
    });

    setTimeout(() => {
      nameEl.focus();
      const range = document.createRange();
      range.selectNodeContents(nameEl);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }, 0);
  }

  function clearManagerDragIndicators() {
    document.querySelectorAll('#managerModal .list-item.drag-over-before, #managerModal .list-item.drag-over-after').forEach(el => {
      el.classList.remove('drag-over-before', 'drag-over-after');
    });
    hideManagerInsertEdgeLine();
    mgrInsertIndicatorKey = null;
  }

  function ensureManagerInsertEdgeLine() {
    let el = document.getElementById('managerInsertEdgeLine');
    if (!el) {
      el = document.createElement('div');
      el.id = 'managerInsertEdgeLine';
      el.className = 'manager-insert-edge-line';
      el.hidden = true;
      document.body.appendChild(el);
    }
    return el;
  }

  function hideManagerInsertEdgeLine() {
    const el = document.getElementById('managerInsertEdgeLine');
    if (el) el.hidden = true;
  }

  /** 端用別線：before=線2+余白1+名前 / after=名前+余白1+線2（行擬似要素は使わない） */
  function showManagerInsertEdgeLine(row, before) {
    const el = ensureManagerInsertEdgeLine();
    const rect = row.getBoundingClientRect();
    const inset = 4;
    el.style.left = `${rect.left + inset}px`;
    el.style.width = `${Math.max(0, rect.width - inset * 2)}px`;
    el.style.top = before ? `${rect.top - 3}px` : `${rect.bottom + 1}px`;
    el.hidden = false;
  }

  function clearManagerColDropHighlights() {
    if (mgrDropHighlightSide == null) return;
    document.querySelectorAll('#managerModal .manager-col.is-drop-target').forEach(el => {
      el.classList.remove('is-drop-target');
    });
    mgrDropHighlightSide = null;
  }

  function setManagerColDropHighlight(side) {
    if (mgrDropHighlightSide === side) return;
    clearManagerColDropHighlights();
    clearManagerDragIndicators();
    const col = side === 'wait'
      ? document.querySelector('#managerModal .manager-col.wait')
      : document.querySelector('#managerModal .manager-col:not(.wait)');
    if (col) col.classList.add('is-drop-target');
    mgrDropHighlightSide = side;
  }

  function applyManagerInsertIndicator(row, before, useEdge) {
    if (!row) return;
    const cls = before ? 'drag-over-before' : 'drag-over-after';
    const key = `${row.dataset.side || ''}_${row.dataset.index || ''}_${cls}_${useEdge ? 'edge' : 'mid'}`;
    if (mgrInsertIndicatorKey === key) {
      if (useEdge) showManagerInsertEdgeLine(row, before);
      return;
    }
    clearManagerDragIndicators();
    if (useEdge) {
      showManagerInsertEdgeLine(row, before);
    } else {
      row.classList.add(cls);
    }
    mgrInsertIndicatorKey = key;
  }

  function cacheManagerListGeom(listId) {
    const listEl = document.getElementById(listId);
    if (!listEl) return null;
    const items = listEl.querySelectorAll('.list-item:not(.is-dragging)');
    return { items };
  }

  /**
   * カーソルが箱に入った瞬間に線を出す（mid ではない）。
   * 上へ移す → その人の直前／下へ移す → その人の直後（対称）。
   * sameSideSourceIndex があるとき、位置不変なら白線なし。
   */
  function applyManagerInsertByGeometry(geom, clientY, sameSideSourceIndex) {
    if (!geom || !geom.items || !geom.items.length) {
      clearManagerDragIndicators();
      return 0;
    }
    const items = geom.items;
    const n = items.length;

    // 箱に入った → 直前候補（最初に bottom を超えない行）
    let lo = 0;
    let hi = n - 1;
    let beforeAt = n;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      const rect = items[mid].getBoundingClientRect();
      if (clientY < rect.bottom) {
        beforeAt = mid;
        hi = mid - 1;
      } else {
        lo = mid + 1;
      }
    }

    // 箱に入った → 直後候補（最後に top 以上の行）
    lo = 0;
    hi = n - 1;
    let afterAt = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      const rect = items[mid].getBoundingClientRect();
      if (clientY >= rect.top) {
        afterAt = mid;
        lo = mid + 1;
      } else {
        hi = mid - 1;
      }
    }

    const indexOf = (row, fallback) => {
      const idx = parseInt(row.dataset.index, 10);
      return Number.isFinite(idx) ? idx : fallback;
    };

    const beforeInsert = beforeAt < n ? indexOf(items[beforeAt], beforeAt) : (
      afterAt >= 0 ? indexOf(items[afterAt], afterAt) + 1 : 0
    );
    const afterInsert = afterAt >= 0 ? indexOf(items[afterAt], afterAt) + 1 : 0;

    // ソースより下の箱にいる → 直後。それ以外（上／先頭）→ 直前
    const movingDown = sameSideSourceIndex != null && beforeInsert > sameSideSourceIndex;
    let insertIndex;
    let row;
    let before;
    if (movingDown) {
      if (afterAt < 0) {
        clearManagerDragIndicators();
        return 0;
      }
      row = items[afterAt];
      before = false;
      insertIndex = afterInsert;
    } else if (beforeAt >= n) {
      row = items[n - 1];
      before = false;
      insertIndex = indexOf(row, n - 1) + 1;
    } else {
      row = items[beforeAt];
      before = true;
      insertIndex = beforeInsert;
    }

    if (sameSideSourceIndex != null
        && (insertIndex === sameSideSourceIndex || insertIndex === sameSideSourceIndex + 1)) {
      clearManagerDragIndicators();
      return insertIndex;
    }

    const useEdge = before ? (row === items[0]) : (row === items[n - 1]);
    applyManagerInsertIndicator(row, before, useEdge);
    return insertIndex;
  }

  /** 参加中→待機：スコア等をマネージャ内で保持（DBへは名前のみ） */
  function toWaitEntryFromMain(p) {
    return {
      name: p.name,
      id: p.id,
      score: p.score,
      baseScore: p.baseScore,
      baseOrder: p.baseOrder,
      selected: false,
      _fromMain: true
    };
  }

  /** 待機→参加中：保持データがあれば復元、なければ新規0点 */
  function toMainEntryFromWait(w) {
    if (w && w._fromMain) {
      return {
        id: w.id,
        name: w.name,
        score: Number(w.score) || 0,
        baseScore: Number(w.baseScore) || 0,
        baseOrder: Number.isFinite(Number(w.baseOrder)) ? Number(w.baseOrder) : 0,
        selected: false,
        _restored: true
      };
    }
    return {
      id: createPlayerId(),
      name: w.name,
      score: 0,
      baseScore: 0,
      baseOrder: 0,
      selected: false,
      _fresh: true
    };
  }

  function executeSwap() {
    if (!dataReady) return;
    const movingToWait = tempPlayers.filter(p => p.selected);
    const keepingInMain = tempPlayers.filter(p => !p.selected);
    const movingToMain = tempWaitroom.filter(w => w.selected);
    const keepingInWait = tempWaitroom.filter(w => !w.selected);

    tempPlayers = keepingInMain;
    tempWaitroom = keepingInWait;

    movingToWait.forEach(p => {
      placeManagerMemberOnSide('wait', toWaitEntryFromMain(p));
    });
    movingToMain.forEach(w => {
      placeManagerMemberOnSide('main', toMainEntryFromWait(w));
    });

    tempPlayers.forEach(p => p.selected = false);
    tempWaitroom.forEach(w => w.selected = false);

    document.getElementById('waitSearch').value = '';

    renderTempLists();
    updateManagerActionButtons();
  }

  /** 他エリア／追加：並びモードに従って位置決め */
  function placeManagerMemberOnSide(targetSide, moved) {
    if (targetSide === 'main') {
      if (tempMainSortMode === 'rank') {
        // 新規0点は同点帯の末尾（メイン画面の新規追加と同じ）。復帰メンバーは元の score/baseOrder で並べる
        if (moved._fresh || !moved._restored) {
          const maxOrder = tempPlayers.length > 0 ? Math.max(...tempPlayers.map(p => p.baseOrder || 0)) : 0;
          moved.baseOrder = maxOrder + 1;
        }
        delete moved._fresh;
        delete moved._restored;
        tempPlayers.push(moved);
        sortTempPlayersByMode('rank');
      } else if (tempMainSortMode === 'name') {
        delete moved._fresh;
        delete moved._restored;
        tempPlayers.push(moved);
        sortTempPlayersByMode('name');
      } else {
        delete moved._fresh;
        delete moved._restored;
        tempPlayers.push(moved);
      }
      return;
    }
    if (tempWaitSortMode === 'name') {
      tempWaitroom.push(moved);
      sortTempWaitByName();
    } else {
      tempWaitroom.push(moved);
    }
  }

  /** @returns {boolean} 実際に並び／所属が変わったか */
  function applyManagerDrop(sourceSide, sourceIndex, targetSide, insertIndex, multiMove) {
    clearManagerDragIndicators();
    clearManagerColDropHighlights();
    if ((sourceSide !== 'main' && sourceSide !== 'wait') || !Number.isFinite(sourceIndex)) return false;

    const sourceArr = sourceSide === 'main' ? tempPlayers : tempWaitroom;
    if (sourceIndex < 0 || sourceIndex >= sourceArr.length) return false;

    const clearSelectionAfterChange = () => {
      tempPlayers.forEach(p => { p.selected = false; });
      tempWaitroom.forEach(w => { w.selected = false; });
    };

    // 複数選択ドラッグ：相手カラムへ一括（差し込みなし・並びモードの配置ルール）
    if (multiMove) {
      if (sourceSide === targetSide) return false;
      const moving = [];
      for (let i = sourceArr.length - 1; i >= 0; i--) {
        if (!sourceArr[i].selected) continue;
        moving.unshift(sourceArr.splice(i, 1)[0]);
      }
      if (!moving.length) return false;
      moving.forEach(item => {
        const moved = targetSide === 'main'
          ? toMainEntryFromWait(item)
          : toWaitEntryFromMain(item);
        moved.selected = false;
        placeManagerMemberOnSide(targetSide, moved);
      });
      clearSelectionAfterChange();
      renderTempLists();
      updateManagerActionButtons();
      return true;
    }

    if (sourceSide === targetSide) {
      let to = insertIndex;
      if (to > sourceIndex) to -= 1;
      if (to === sourceIndex) return false; // 位置不変 → 選択維持
      const [item] = sourceArr.splice(sourceIndex, 1);
      sourceArr.splice(to, 0, item);
      if (targetSide === 'main') {
        tempMainSortMode = 'custom';
        updateManagerSortRadios();
      } else {
        tempWaitSortMode = 'custom';
        updateManagerSortRadios();
      }
      clearSelectionAfterChange();
      renderTempLists();
      updateManagerActionButtons();
      return true;
    }

    const [item] = sourceArr.splice(sourceIndex, 1);
    if (!item) return false;
    const moved = targetSide === 'main'
      ? toMainEntryFromWait(item)
      : toWaitEntryFromMain(item);
    placeManagerMemberOnSide(targetSide, moved);
    clearSelectionAfterChange();
    renderTempLists();
    updateManagerActionButtons();
    return true;
  }

  function createMainMember() {
    if (!dataReady) return;
    const input = document.getElementById('newMainMember');
    let val = input.value.trim();
    if (val !== '') {
      if (val.length > 10) val = val.substring(0, 10);
      placeManagerMemberOnSide('main', {
        id: createPlayerId(),
        name: val,
        score: 0,
        baseScore: 0,
        baseOrder: 0,
        selected: false,
        _fresh: true
      });
      input.value = '';
      renderTempLists();
      updateManagerActionButtons();
    }
  }

  function createWaitMember() {
    if (!dataReady) return;
    const input = document.getElementById('newWaitMember');
    let val = input.value.trim();
    if (val !== '') {
      if (val.length > 10) val = val.substring(0, 10);
      placeManagerMemberOnSide('wait', { name: val, selected: false });
      input.value = '';
      renderTempLists();
      updateManagerActionButtons();
    }
  }

  // DOM 構築直後からロック（onload 前の一瞬もガードと見た目を揃える）
  updateDataReadyControls();
</script>
</body>
</html>
