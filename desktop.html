      );
      if (next) {
        const walls = getLockedCornerLiveWalls();
        const crossed = lockedCornerShrinkWallCrossed(prev, next, walls);
        if (crossed) {
          parkLockedCornerEdge(crossed.parkH, crossed.parkW, !!(crossed.parkH && crossed.parkW));
          return;
        }
        const exactHit = lockedCornerCrossedOverflowExactPair(
          prev, next, false, cameraLockCornerEdgeShrinkPausedExact
        );
        if (exactHit) {
          cameraLockCornerEdgeShrinkExactPair = exactHit;
          cameraLockCornerEdgeShrinkStepAxis = null;
          cameraLockCornerEdgeShrinkStepHoldPx = 0;
          cameraLockCornerEdgeShrinkPausedExact = lockedExactStepKey(exactHit);
          const held = {
            w: cameraLockCornerEdgeShrinkVirtualW,
            h: cameraLockCornerEdgeShrinkVirtualH
          };
          applyLockedCornerOverflowExactPair(exactHit, held);
          cameraLockCornerEdgeShrinkVirtualW = held.w;
          cameraLockCornerEdgeShrinkVirtualH = held.h;
        } else {
        const stepHit = lockedCornerCrossedOverflowStep(
          prev, next, false,
          cameraLockCornerEdgeShrinkPausedStepW,
          cameraLockCornerEdgeShrinkPausedStepH
        );
        if (stepHit) {
          cameraLockCornerEdgeShrinkExactPair = null;
          cameraLockCornerEdgeShrinkStepAxis = stepHit.axis;
          cameraLockCornerEdgeShrinkStepValue = stepHit.value;
          cameraLockCornerEdgeShrinkStepHoldPx = 0;
          if (stepHit.axis === 'w') cameraLockCornerEdgeShrinkPausedStepW = stepHit.value;
          else cameraLockCornerEdgeShrinkPausedStepH = stepHit.value;
          const held = {
            w: cameraLockCornerEdgeShrinkVirtualW,
            h: cameraLockCornerEdgeShrinkVirtualH
          };
          applyLockedCornerOverflowStep(stepHit.axis, stepHit.value, held);
          cameraLockCornerEdgeShrinkVirtualW = held.w;
          cameraLockCornerEdgeShrinkVirtualH = held.h;
        } else {
          if (cameraLockCornerEdgeShrinkExactPair
            && clearLockedCornerOverflowExactIfFar(
              cameraLockCornerEdgeShrinkExactPair,
              next
            )) {
            cameraLockCornerEdgeShrinkExactPair = null;
          }
          if (cameraLockCornerEdgeShrinkStepAxis != null
            && clearLockedCornerOverflowStepIfFar(
              cameraLockCornerEdgeShrinkStepAxis,
              cameraLockCornerEdgeShrinkStepValue,
              next
            )) {
            cameraLockCornerEdgeShrinkStepAxis = null;
          }
          cameraLockCornerEdgeShrinkVirtualW = next.w;
          cameraLockCornerEdgeShrinkVirtualH = next.h;
          applyLockedCornerSteppedSize(next);
          if (cameraLockCornerEdgeShrinkExactPair) {
            setLockedEdgeExactStepSnap(cameraLockCornerEdgeShrinkExactPair);
          } else if (cameraLockCornerEdgeShrinkStepAxis != null) {
            setLockedEdgeStepSnap(
              cameraLockCornerEdgeShrinkStepAxis,
              cameraLockCornerEdgeShrinkStepValue
            );
          }
        }
        }
      }
    } else if (dt > 0) {
      pinLockedCornerFollows();
    }

    syncLockedCornerHadBars();
    if (maybeParkLockedCornerFromBars()) return;
    if (!lockedCornerCanShrink()) {
      cameraLockCornerEdgeShrinkAtFloor = true;
      stopLockedCornerEdgeShrink();
      pinLockedCornerFollows();
      return;
    }
    if (cameraLockCornerEdgeShrinking && cameraLockDragging && cameraLockKind === 'corner') {
      cameraLockCornerEdgeShrinkRaf = requestAnimationFrame(pumpLockedCornerEdgeShrink);
    }
  }

  function startLockedCornerParkCatch(fixedSize) {
    stopLockedCornerEdgeExpand();
    stopLockedCornerEdgeShrink();
    const cur = getLockedCornerCurrentSize();
    cameraLockSnap = null;
    cameraLockCornerParkCatchActive = true;
    cameraLockCornerParkCatchW = cur.w;
    cameraLockCornerParkCatchH = cur.h;
    if (fixedSize && Number.isFinite(fixedSize.w) && Number.isFinite(fixedSize.h)) {
      cameraLockCornerParkCatchFixed = true;
      cameraLockCornerParkCatchFixedW = fixedSize.w;
      cameraLockCornerParkCatchFixedH = fixedSize.h;
    } else {
      cameraLockCornerParkCatchFixed = false;
      cameraLockCornerParkCatchFixedW = 0;
      cameraLockCornerParkCatchFixedH = 0;
    }
    cameraLockCornerParkCatchLastTs = 0;
    if (parkLockedCornerRemainingIfNeeded()) return;
    if (!cameraLockCornerParkCatchRaf) {
      cameraLockCornerParkCatchRaf = requestAnimationFrame(pumpLockedCornerParkCatch);
    }
  }

  function lockedCornerParkCatchTarget() {
    if (cameraLockCornerParkCatchFixed) {
      return { w: cameraLockCornerParkCatchFixedW, h: cameraLockCornerParkCatchFixedH };
    }
    return lockedCornerCanonicalSize(cameraLockLastClientX, cameraLockLastClientY);
  }

  function finishLockedCornerWallCatch() {
    cameraLockCornerParkCount = 2;
    cameraLockCornerParkedH = true;
    cameraLockCornerParkedW = true;
    cameraLockCornerAwaitSecondPark = false;
    cameraLockCornerAllowOverflowHypot = false;
    pinLockedCornerFollows();
    setLockedCornerParkSnap(true, true);
    cameraLockCornerParkClientX = Number.isFinite(cameraLockLastClientX)
      ? cameraLockLastClientX : cameraLockCornerParkClientX;
    cameraLockCornerParkClientY = Number.isFinite(cameraLockLastClientY)
      ? cameraLockLastClientY : cameraLockCornerParkClientY;
    cameraLockCornerParkSide = lockedCornerSidePx(cameraLockCornerParkClientX, cameraLockCornerParkClientY);
  }

  function lockedCornerRemainingParkAxes(size, walls) {
    if (!cameraLockCornerAwaitSecondPark || cameraLockCornerParkCount !== 1) return null;
    if (cameraLockCornerParkCatchFixed) return null;
    walls = lockedCornerWallsOrLive(walls);
    const cur = size || getLockedCornerCurrentSize();
    if (cameraLockCornerParkedW && !cameraLockCornerParkedH) {
      if (lockedCornerSizeAtHeightWall(cur, walls)) return null;
      return { parkH: true, parkW: false };
    }
    if (cameraLockCornerParkedH && !cameraLockCornerParkedW) {
      if (lockedCornerSizeAtWidthWall(cur, walls)) return null;
      return { parkH: false, parkW: true };
    }
    return null;
  }

  function parkLockedCornerRemainingIfNeeded(size) {
    const walls = getLockedCornerLiveWalls();
    const wall = lockedCornerRemainingParkAxes(size, walls);
    if (!wall) return false;
    const cur = size || getLockedCornerCurrentSize();
    const past = (wall.parkH && lockedCornerSizePastHeight(cur, walls))
      || (wall.parkW && lockedCornerSizePastWidth(cur, walls));
    if (past) return false;
    stopLockedCornerParkCatch();
    parkLockedCornerAtWalls(wall.parkH, wall.parkW, walls);
    finishLockedCornerWallCatch();
    return true;
  }

  function lockedCornerSecondParkWallIfCrossing(prev, next, walls) {
    if (!cameraLockCornerAwaitSecondPark || cameraLockCornerParkCount !== 1) return null;
    if (cameraLockCornerParkCatchFixed) return null;
    walls = lockedCornerWallsOrLive(walls);
    const otherH = cameraLockCornerParkedW && !cameraLockCornerParkedH;
    const otherW = cameraLockCornerParkedH && !cameraLockCornerParkedW;
    if (!otherH && !otherW) return null;
    const prevOverflow = (otherH && lockedCornerSizePastHeight(prev, walls))
      || (otherW && lockedCornerSizePastWidth(prev, walls));
    if (!prevOverflow) return null;
    const nextOverflow = (otherH && lockedCornerSizePastHeight(next, walls))
      || (otherW && lockedCornerSizePastWidth(next, walls));
    if (nextOverflow) return null;
    return { parkH: otherH, parkW: otherW };
  }

  function pumpLockedCornerParkCatch(ts) {
    cameraLockCornerParkCatchRaf = null;
    if (!cameraLockCornerParkCatchActive || !cameraLockDragging || cameraLockKind !== 'corner' || !isCameraMode) {
      stopLockedCornerParkCatch();
      return;
    }
    const target = lockedCornerParkCatchTarget();
    if (!target) {
      stopLockedCornerParkCatch();
      return;
    }
    if (parkLockedCornerRemainingIfNeeded()) return;
    const dt = lockedCornerRafDt(cameraLockCornerParkCatchLastTs, ts);
    cameraLockCornerParkCatchLastTs = ts;
    const distNow = Math.hypot(
      target.w - cameraLockCornerParkCatchW,
      target.h - cameraLockCornerParkCatchH
    );
    if (!(dt > 0)) {
      if (distNow <= 0.5) {
        const wasFixed = cameraLockCornerParkCatchFixed;
        stopLockedCornerParkCatch();
        if (wasFixed) finishLockedCornerWallCatch();
        else {
          cameraLockCornerAwaitSecondPark = false;
          cameraLockCornerAllowOverflowHypot = true;
        }
        return;
      }
      cameraLockCornerParkCatchRaf = requestAnimationFrame(pumpLockedCornerParkCatch);
      return;
    }
    const step = CAMERA_PARK_CATCH_SPEED_PX_S * (dt / 1000);
    const prev = { w: cameraLockCornerParkCatchW, h: cameraLockCornerParkCatchH };
    const distW = target.w - cameraLockCornerParkCatchW;
    const distH = target.h - cameraLockCornerParkCatchH;
    const dist = Math.hypot(distW, distH);
    if (dist <= 0.5) {
      cameraLockCornerParkCatchW = target.w;
      cameraLockCornerParkCatchH = target.h;
    } else {
      const t = Math.min(1, step / dist);
      cameraLockCornerParkCatchW += distW * t;
      cameraLockCornerParkCatchH += distH * t;
    }
    const next = { w: cameraLockCornerParkCatchW, h: cameraLockCornerParkCatchH };
    const walls = getLockedCornerLiveWalls();
    const wall = lockedCornerSecondParkWallIfCrossing(prev, next, walls);
    if (wall) {
      stopLockedCornerParkCatch();
      parkLockedCornerAtWalls(wall.parkH, wall.parkW, walls);
      const cur = getLockedCornerCurrentSize();
      cameraLockCornerParkCatchW = cur.w;
      cameraLockCornerParkCatchH = cur.h;
      finishLockedCornerWallCatch();
      return;
    }
    const growing = next.w > prev.w + 1e-9 || next.h > prev.h + 1e-9;
    const expandWall = growing ? lockedCornerExpandWallIfPast(next, walls) : null;
    if (expandWall) {
      stopLockedCornerParkCatch();
      parkLockedCornerAtWalls(expandWall.parkH, expandWall.parkW, walls);
      return;
    }
    applyLockedCornerLines(cameraLockCornerParkCatchW, cameraLockCornerParkCatchH);
    const left = Math.hypot(target.w - cameraLockCornerParkCatchW, target.h - cameraLockCornerParkCatchH);
    if (left <= 0.5) {
      const targetWall = lockedCornerExpandWallIfPast(target, walls);
      if (targetWall) {
        stopLockedCornerParkCatch();
        parkLockedCornerAtWalls(targetWall.parkH, targetWall.parkW, walls);
        return;
      }
      applyLockedCornerLines(target.w, target.h);
      const wasFixed = cameraLockCornerParkCatchFixed;
      stopLockedCornerParkCatch();
      if (wasFixed) finishLockedCornerWallCatch();
      else {
        cameraLockCornerAwaitSecondPark = false;
        cameraLockCornerAllowOverflowHypot = true;
      }
      return;
    }
    cameraLockCornerParkCatchRaf = requestAnimationFrame(pumpLockedCornerParkCatch);
  }

  function resumeLockedCornerAfterPark(clientX, clientY) {
    startLockedCornerParkCatch();
  }

  function updateLockedCornerEdgeShrinkFromClient(clientX, clientY) {
    if (!cameraLockDragging || cameraLockKind !== 'corner' || !isCameraMode) {
      stopLockedCornerEdgeShrink();
      return;
    }
    if (cameraLockCornerEdgeExpanding) {
      stopLockedCornerEdgeShrink();
      return;
    }
    const dead = CAMERA_CROP_POINTER_DEAD_PX;
    const side = lockedCornerSidePx(clientX, clientY);
    const along = lockedCornerPtrAlong(clientX, clientY);
    if (side >= -CAMERA_SNAP_RELEASE_DISTANCE) cameraLockCornerEdgeShrinkAtFloor = false;
    const canStart = isLockedCornerAtScreenEdge()
      && side < -CAMERA_SNAP_RELEASE_DISTANCE
      && lockedCornerCanShrink()
      && cameraLockCornerParkCount === 0
      && !cameraLockCornerAllowOverflowHypot
      && !cameraLockCornerEdgeShrinkAtFloor;

    if (cameraLockCornerParkSide != null) {
      if (cameraLockCornerParkSide - side >= CAMERA_SNAP_RELEASE_DISTANCE) {
        clearLockedCornerParkWait();
        resumeLockedCornerAfterPark(clientX, clientY);
      }
      return;
    }

    if (cameraLockCornerEdgeShrinkBlocked) {
      if (!lockedCornerCanShrink() || side >= -CAMERA_SNAP_RELEASE_DISTANCE) {
        cameraLockCornerEdgeShrinkBlocked = false;
        cameraLockCornerEdgeShrinkTroughSide = null;
        cameraLockCornerEdgeShrinkPeakSide = null;
        return;
      }
      if (cameraLockCornerEdgeShrinkTroughSide == null || along > cameraLockCornerEdgeShrinkTroughSide) {
        cameraLockCornerEdgeShrinkTroughSide = along;
      }
      if (canStart && along <= cameraLockCornerEdgeShrinkTroughSide - dead) {
        cameraLockCornerEdgeShrinkBlocked = false;
        cameraLockCornerEdgeShrinkTroughSide = null;
        startLockedCornerEdgeShrink();
        cameraLockCornerEdgeShrinkPeakSide = along;
      }
      return;
    }

    if (cameraLockCornerEdgeShrinking) {
      syncLockedCornerHadBars();
      if (maybeParkLockedCornerFromBars()) return;
      if (cameraLockCornerEdgeShrinkPeakSide == null || along < cameraLockCornerEdgeShrinkPeakSide) {
        cameraLockCornerEdgeShrinkPeakSide = along;
      }
      if (along >= cameraLockCornerEdgeShrinkPeakSide + dead) {
        cameraLockCornerEdgeShrinkBlocked = true;
        cameraLockCornerEdgeShrinkTroughSide = along;
        cameraLockCornerEdgeShrinkPeakSide = null;
        stopLockedCornerEdgeShrink();
        pinLockedCornerFollows();
      }
      return;
    }

    if (canStart) {
      startLockedCornerEdgeShrink();
      cameraLockCornerEdgeShrinkPeakSide = along;
    }
  }

  function updateLockedCornerEdgeFromClient(clientX, clientY) {
    if (Number.isFinite(clientX)) cameraLockLastClientX = clientX;
    if (Number.isFinite(clientY)) cameraLockLastClientY = clientY;
    if (cameraLockCornerParkCatchActive) return;
    if (updateLockedCornerRemainWallWait(clientX, clientY)) return;
    updateLockedCornerEdgeExpandFromClient(clientX, clientY);
    if (cameraLockCornerEdgeExpanding || cameraLockCornerEdgeExpandBlocked) {
      stopLockedCornerEdgeShrink();
      return;
    }
    updateLockedCornerEdgeShrinkFromClient(clientX, clientY);
  }

  function lockedCornerHWallPx() {
    if (!canLockedHeightReachViewport()) return null;
    const walls = getLockedCornerLiveWalls();
    const screenH = walls.screenH;
    if (!(screenH > 0)) return null;
    const r = getCameraLockRatio();
    const needW = screenH * r;
    const maxW = walls.maxW;
    if (needW < CAMERA_WIDTH_MIN - 0.5) return null;
    if (maxW > 0 && needW > maxW + 0.5) return null;
    if (isLockedExactStepHeight(screenH)) return null;
    return screenH;
  }

  function lockedCornerWWallPx() {
    const walls = getLockedCornerLiveWalls();
    const maxW = walls.maxW;
    const r = getCameraLockRatio();
    if (!(r > 0) || !(maxW >= CAMERA_WIDTH_MIN - 0.5)) return null;
    const needH = maxW / r;
    const { minH, maxH, vp } = getLockedReachableHeight();
    if (needH < minH - 0.5 || needH > maxH + 0.5) return null;
    if (vp > 0 && needH > vp + 0.5) return null;
    if (isLockedExactStepWidth(maxW)) return null;
    return maxW;
  }

  function pickLockedCornerWallSnap(rawW, rawH) {
    const walls = getLockedCornerLiveWalls();
    const bothFit = lockedCornerScreenBothFit(walls);
    if (bothFit) {
      const bothSnap = lockedCornerScreenBothFitSnap(bothFit, walls);
      const holdRaw = bothSnap.axis === 'w' ? rawW : rawH;
      const holdWall = bothSnap.value;
      if (cameraLockSnap && cameraLockSnap.both && cameraLockSnap.type === 'viewport'
        && shouldHoldCameraSnap(holdRaw, holdWall)) {
        if (cameraLockSnap.axis === bothSnap.axis && cameraLockSnap.value === bothSnap.value) {
          return cameraLockSnap;
        }
        return bothSnap;
      }
      if (holdRaw <= holdWall + 0.5 && (holdWall - holdRaw) <= CAMERA_SNAP_ATTRACT_DISTANCE) {
        return bothSnap;
      }
      return null;
    }
    const hWall = lockedCornerHWallPx();
    const wWall = lockedCornerWWallPx();
    const holding = cameraLockSnap && cameraLockSnap.type === 'viewport' && !cameraLockSnap.both;
    if (holding && cameraLockSnap.axis === 'h' && hWall != null
      && shouldHoldCameraSnap(rawH, hWall)) {
      return cameraLockSnap;
    }
    if (holding && cameraLockSnap.axis === 'w' && wWall != null
      && shouldHoldCameraSnap(rawW, wWall)) {
      return cameraLockSnap;
    }
    const nearH = hWall != null && rawH <= hWall + 0.5
      && (hWall - rawH) <= CAMERA_SNAP_ATTRACT_DISTANCE;
    const nearW = wWall != null && rawW <= wWall + 0.5
      && (wWall - rawW) <= CAMERA_SNAP_ATTRACT_DISTANCE;
    if (nearH && nearW) {
      if ((wWall - rawW) < (hWall - rawH)) {
        return { axis: 'w', type: 'viewport', value: wWall };
      }
      return { axis: 'h', type: 'viewport', value: hWall };
    }
    if (nearH) return { axis: 'h', type: 'viewport', value: hWall };
    if (nearW) return { axis: 'w', type: 'viewport', value: wWall };
    return null;
  }

  // 画面内 80。壁の 8/16 は pickLockedCornerWallSnap のまま。先に付いた軸を 16 まで持つ
  // グレーは吸着している軸だけ。同点80／画面壁同点は both（線は両方実線）
  function lockedCornerStepSnapOf(axis, value) {
    return { axis: axis, type: 'step', value: value };
  }

  // 16帯でも画面端フィット（同点含む）は残す。限界はフィットしない
  function lockedFitAtLimitWidth(w) {
    const maxW = getLockedCornerWidthWall();
    return maxW > 0 && Math.abs(w - maxW) <= 0.5;
  }

  function lockedFitAtLimitHeight(h) {
    const screenH = getLockedCornerHeightWall();
    return screenH > 0 && Math.abs(h - screenH) <= 0.5;
  }

  function lockedCornerExactStepInScreenOk(pair) {
    if (!pair) return false;
    const maxW = getLockedCornerWidthWall();
    const screenH = getLockedCornerHeightWall();
    if (maxW > 0 && pair.w > maxW + 0.5) return false;
    if (screenH > 0 && pair.h > screenH + 0.5) return false;
    if (isCameraWidthInSnapWallZone(pair.w, maxW) && !lockedFitAtLimitWidth(pair.w)) return false;
    if (isCameraYInSnapWallZone(pair.h, screenH) && !lockedFitAtLimitHeight(pair.h)) return false;
    return true;
  }

  function lockedCornerExactStepCand(rawW, rawH) {
    const pairs = ensureLockedExactStepPairs();
    let best = null;
    for (let i = 0; i < pairs.length; i++) {
      const p = pairs[i];
      if (!lockedCornerExactStepInScreenOk(p)) continue;
      const dW = Math.abs(rawW - p.w);
      const dH = Math.abs(rawH - p.h);
      if (dW > CAMERA_SNAP_ATTRACT_DISTANCE && dH > CAMERA_SNAP_ATTRACT_DISTANCE) continue;
      const d = Math.min(dW, dH);
      if (!best || d < best.d) best = { pair: p, d: d };
    }
    return best;
  }

  function lockedCornerExactStepHoldOk(rawW, rawH, snap) {
    if (!snap || snap.type !== 'step' || !snap.both) return false;
    const pair = { w: snap.pairW, h: snap.pairH };
    if (!lockedCornerExactStepInScreenOk(pair)) return false;
    const maxW = getLockedCornerWidthWall();
    const screenH = getLockedCornerHeightWall();
    if (isCameraWidthInSnapWallZone(rawW, maxW)) return false;
    if (isCameraYInSnapWallZone(rawH, screenH)) return false;
    const v = snap.axis === 'w' ? rawW : rawH;
    return shouldHoldCameraSnap(v, snap.value);
  }

  function lockedCornerWidthStepCand(rawW) {
    const r = getCameraLockRatio();
    const maxW = getLockedCornerWidthWall();
    if (!(r > 0) || isCameraWidthInSnapWallZone(rawW, maxW)) return null;
    const { minH, maxH } = getLockedReachableHeight();
    const screenH = getLockedCornerHeightWall();
    const stepWidth = Math.max(
      CAMERA_WIDTH_MIN,
      Math.min(maxW, Math.round(rawW / CAMERA_WIDTH_STEP) * CAMERA_WIDTH_STEP)
    );
    const cands = [CAMERA_WIDTH_MIN, stepWidth].filter(function (w, i, arr) {
      if (arr.indexOf(w) !== i) return false;
      if (!isCameraSnapWidthAllowed(w, maxW)) return false;
      if (isCameraWidthInSnapWallZone(w, maxW)) return false;
      if (isLockedExactStepWidth(w)) return false;
      const needH = w / r;
      if (needH < minH - 0.5 || needH > maxH + 0.5) return false;
      if (screenH > 0 && needH > screenH + 0.5) return false;
      return true;
    });
    if (!cands.length) return null;
    return cands.reduce(function (best, w) {
      const d = Math.abs(rawW - w);
      return d < best.d ? { v: w, d: d } : best;
    }, { v: cands[0], d: Math.abs(rawW - cands[0]) });
  }

  function lockedCornerHeightStepCand(rawH) {
    const r = getCameraLockRatio();
    const maxW = getLockedCornerWidthWall();
    const screenH = getLockedCornerHeightWall();
    const { minH, maxH } = getLockedReachableHeight();
    if (!(r > 0) || isCameraYInSnapWallZone(rawH, screenH)) return null;
    const stepY = Math.round(rawH / CAMERA_HEIGHT_STEP) * CAMERA_HEIGHT_STEP;
    if (!(stepY > 0 && stepY >= minH - 0.5 && stepY <= maxH + 0.5)) return null;
    if (!isCameraSnapYAllowed(stepY, screenH)) return null;
    if (isLockedExactStepHeight(stepY)) return null;
    const needW = stepY * r;
    if (needW < CAMERA_WIDTH_MIN - 0.5 || needW > maxW + 0.5) return null;
    return { v: stepY, d: Math.abs(rawH - stepY) };
  }

  function lockedCornerStepHoldOk(rawW, rawH, snap) {
    if (!snap || snap.type !== 'step' || snap.both) return false;
    const maxW = getLockedCornerWidthWall();
    const screenH = getLockedCornerHeightWall();
    if (snap.axis === 'w') {
      if (isCameraWidthInSnapWallZone(rawW, maxW)) return false;
      if (isCameraWidthInSnapWallZone(snap.value, maxW)) return false;
      return shouldHoldCameraSnap(rawW, snap.value);
    }
    if (isCameraYInSnapWallZone(rawH, screenH)) return false;
    if (isCameraYInSnapWallZone(snap.value, screenH)) return false;
    return shouldHoldCameraSnap(rawH, snap.value);
  }

  function pickLockedCornerStepSnap(rawW, rawH) {
    if (lockedCornerExactStepHoldOk(rawW, rawH, cameraLockSnap)) {
      return lockedCornerExactStepSnapOf({ w: cameraLockSnap.pairW, h: cameraLockSnap.pairH });
    }
    if (lockedCornerStepHoldOk(rawW, rawH, cameraLockSnap)) {
      return lockedCornerStepSnapOf(cameraLockSnap.axis, cameraLockSnap.value);
    }
    const exact = lockedCornerExactStepCand(rawW, rawH);
    if (exact) return lockedCornerExactStepSnapOf(exact.pair);
    const wCand = lockedCornerWidthStepCand(rawW);
    const hCand = lockedCornerHeightStepCand(rawH);
    const nearW = !!(wCand && wCand.d <= CAMERA_SNAP_ATTRACT_DISTANCE);
    const nearH = !!(hCand && hCand.d <= CAMERA_SNAP_ATTRACT_DISTANCE);
    if (nearW && nearH) {
      // 初回だけ近い方。同距は横。保持中は上の hold で乗り換えない
      if (wCand.d <= hCand.d) return lockedCornerStepSnapOf('w', wCand.v);
      return lockedCornerStepSnapOf('h', hCand.v);
    }
    if (nearW) return lockedCornerStepSnapOf('w', wCand.v);
    if (nearH) return lockedCornerStepSnapOf('h', hCand.v);
    return null;
  }

  function applyLockedCornerInScreenMove(clientX, clientY) {
    const raw = lockedCornerRawCanonical(clientX, clientY);
    const target = capLockedCornerEdgeSize(raw.w, raw.h) || raw;
    const wall = pickLockedCornerWallSnap(target.w, target.h);
    if (wall) {
      cameraLockSnap = wall;
      cameraLockLastAxis = wall.axis;
      if (wall.both) {
        applyLockedCornerScreenBothFit(
          { fit: wall.axis, base: 'w' },
          getLockedCornerLiveWalls(),
          false
        );
      } else if (wall.axis === 'w') applyLockedFromWidth(wall.value, true);
      else applyLockedFromHeight(wall.value, true);
      return;
    }
    const walls = getLockedCornerLiveWalls();
    const clamp = lockedCornerExpandWallIfPast(target, walls);
    if (clamp) {
      parkLockedCornerAtWalls(clamp.parkH, clamp.parkW, walls);
      return;
    }
    const step = pickLockedCornerStepSnap(target.w, target.h);
    if (step) {
      cameraLockSnap = step;
      cameraLockLastAxis = step.axis;
      if (step.both) applyLockedExactStepPair({ w: step.pairW, h: step.pairH });
      else if (step.axis === 'w') applyLockedFromWidth(step.value, false);
      else applyLockedFromHeight(step.value, false);
      return;
    }
    cameraLockSnap = null;
    cameraLockLastAxis = null;
    applyLockedCornerLines(target.w, target.h);
  }

  function lockedPointerFromOrigin(clientX, clientY, pinToViewport) {
    const contentArea = getCameraContentArea() || document.querySelector('.content-area');
    const wrapper = getCameraGridWrapper();
    let w = getCameraDisplayedFrameWidth();
    let h = Math.max(1, getCameraCaptureHeight());
    if (contentArea && Number.isFinite(clientX)) {
      const rect = contentArea.getBoundingClientRect();
      if (!pinToViewport) {
        w = clientX - rect.left;
      } else if (clientX >= rect.left) {
        w = Math.max(CAMERA_WIDTH_MIN, Math.min(clientX, rect.right) - rect.left);
      }
    }
    if (wrapper && Number.isFinite(clientY)) {
      const rect = wrapper.getBoundingClientRect();
      if (!pinToViewport) {
        h = clientY - rect.top + wrapper.scrollTop;
      } else if (clientY >= rect.top) {
        h = Math.min(clientY, rect.bottom) - rect.top + wrapper.scrollTop;
      }
    }
    return { w, h };
  }

  function getLockedCornerCurrentSize() {
    const w = Math.max(1, getCameraDisplayedFrameWidth());
    const h = cameraCropFixedY != null && Number.isFinite(cameraCropFixedY)
      ? cameraCropFixedY
      : Math.max(1, getCameraCaptureHeight());
    return { w, h };
  }

  function applyLockedCornerLines(widthPx, heightCss) {
    cameraLockSnap = null;
    if (commitLockedCornerCalculatorSize(widthPx, heightCss)) return;
    pinLockedFollowWidthIfOverflow();
    pinLockedFollowCropIfOverflow();
    updateCameraGuides();
    paintLockedSnapUi();
  }

  function lockedCornerTarget(rawW, rawH) {
    const cur = getLockedCornerCurrentSize();
    if (!Number.isFinite(rawW) || !Number.isFinite(rawH)) return { w: cur.w, h: cur.h };
    const startW = cameraLockStartW > 0 ? cameraLockStartW : cur.w;
    const startH = cameraLockStartH > 0 ? cameraLockStartH : cur.h;
    const startDist = Math.hypot(startW, startH);
    if (!(startDist > 0)) return { w: cur.w, h: cur.h };
    const k = Math.hypot(Math.max(0, rawW), Math.max(0, rawH)) / startDist;
    return { w: startW * k, h: startH * k };
  }

  function moveLockedCorner(clientX, clientY) {
    updateLockedCornerEdgeFromClient(clientX, clientY);
    if (cameraLockCornerEdgeExpanding || cameraLockCornerEdgeShrinking || cameraLockCornerParkCatchActive) {
      return;
    }
    if (isLockedCornerEdgeBusy()) {
      pinLockedCornerFollows();
      return;
    }
    const vBar = isCameraVerticalScrollActive();
    const hBar = isLockedWidthPastScreen();
    if (!cameraLockCornerAllowOverflowHypot && (vBar || hBar)) {
      pinLockedCornerFollows();
      return;
    }
    applyLockedCornerInScreenMove(clientX, clientY);
  }

  function beginLockedGuideDrag(kind, e) {
    if (!isCameraMode || isCameraHideMode || isCameraSizeModalOpen() || e.button !== 0) return false;
    e.preventDefault();
    e.stopPropagation();
    hideUiTip();
    uiTipPressLock = kind === 'width' ? 'camera-frame-resizer'
      : kind === 'corner' ? 'camera-frame-corner' : 'camera-crop-hit';
    cancelCameraRememberedYSettle();
    pauseCameraScaleObservers();
    cancelLockedZoomMatch();
    cameraLockDragging = true;
    cameraLockKind = kind;
    cameraLockPointerId = e.pointerId;
    cameraLockMoved = false;
    cameraLockSnap = null;
    cameraLockLastAxis = null;
    cameraLockCornerGrow = null;
    cameraLockFollowH = null;
    cameraLockWallForW = null;
    cameraLockLastClientY = Number.isFinite(e.clientY) ? e.clientY : null;
    cameraLockLastClientX = Number.isFinite(e.clientX) ? e.clientX : null;
    resetLockedCropEdgeState();
    resetLockedWidthEdgeState();
    resetLockedCornerEdgeState();
    if (kind === 'corner') {
      ensureLockedExactStepPairs();
    }
    cameraLockStartX = e.clientX;
    cameraLockStartY = e.clientY;
    {
      const cur0 = getLockedCornerCurrentSize();
      cameraLockStartW = cur0.w;
      cameraLockStartH = cur0.h;
    }
    const line = document.getElementById('cameraCropLine');
    const resizer = document.getElementById('cameraFrameResizer');
    if (line) {
      line.classList.toggle('is-dragging', kind !== 'width');
      line.classList.remove('is-hovering');
    }
    if (resizer) {
      resizer.classList.toggle('is-dragging', kind !== 'crop');
      resizer.classList.remove('is-hovering', 'is-snapped');
    }
    document.body.style.cursor = kind === 'width' ? 'col-resize' : kind === 'corner' ? 'move' : 'row-resize';
    const captureEl = kind === 'width'
      ? (document.getElementById('cameraFrameResizerHit') || resizer)
      : kind === 'corner'
        ? document.getElementById('cameraFrameCornerHit')
        : (document.getElementById('cameraCropLineHit') || line);
    try { if (captureEl) captureEl.setPointerCapture(e.pointerId); } catch (_) {}
    syncCameraCropLineChrome();
    return true;
  }

  function onLockedGuidePointerMove(e) {
    if (!cameraLockDragging || !isCameraMode) return;
    if (cameraLockPointerId != null && e.pointerId != null && e.pointerId !== cameraLockPointerId) return;
    if ((e.buttons & 1) === 0) {
      const kind = cameraLockKind;
      const line = document.getElementById('cameraCropLine');
      const resizer = document.getElementById('cameraFrameResizer');
      const captureEl = kind === 'width'
        ? (document.getElementById('cameraFrameResizerHit') || resizer)
        : kind === 'corner'
          ? document.getElementById('cameraFrameCornerHit')
          : (document.getElementById('cameraCropLineHit') || line);
      const captured = cameraLockPointerId != null && captureEl
        && typeof captureEl.hasPointerCapture === 'function'
        && captureEl.hasPointerCapture(cameraLockPointerId);
      if (!(captured && e.pointerId === cameraLockPointerId)) {
        endLockedGuideDrag(null);
        return;
      }
    }
    if (!cameraLockMoved) {
      const dx = Number.isFinite(e.clientX) ? Math.abs(e.clientX - cameraLockStartX) : 0;
      const dy = Number.isFinite(e.clientY) ? Math.abs(e.clientY - cameraLockStartY) : 0;
      if (cameraLockKind === 'crop' && dy < CAMERA_CROP_POINTER_DEAD_PX) return;
      if (cameraLockKind === 'width' && dx < CAMERA_CROP_POINTER_DEAD_PX) return;
      if (cameraLockKind === 'corner' && dx < CAMERA_CROP_POINTER_DEAD_PX && dy < CAMERA_CROP_POINTER_DEAD_PX) return;
      cameraLockMoved = true;
    }
    if (cameraLockKind === 'crop') moveLockedCrop(e.clientY);
    else if (cameraLockKind === 'width') moveLockedWidth(e.clientX);
    else moveLockedCorner(e.clientX, e.clientY);
  }

  function endLockedGuideDrag(e) {
    if (!cameraLockDragging) return;
    if (e && e.type && e.type.startsWith('pointer') && cameraLockPointerId != null
      && e.pointerId != null && e.pointerId !== cameraLockPointerId) return;
    const kind = cameraLockKind;
    const didMove = cameraLockMoved;
    const dblClick = !didMove && isCameraGuideCompleteClick(e) && noteCameraGuideClick(kind);
    if (didMove) breakCameraGuideDblClick();
    const releaseX = e && Number.isFinite(e.clientX) ? e.clientX : null;
    const releaseY = e && Number.isFinite(e.clientY) ? e.clientY : null;
    const line = document.getElementById('cameraCropLine');
    const resizer = document.getElementById('cameraFrameResizer');
    const captureEl = kind === 'width'
      ? (document.getElementById('cameraFrameResizerHit') || resizer)
      : kind === 'corner'
        ? document.getElementById('cameraFrameCornerHit')
        : (document.getElementById('cameraCropLineHit') || line);
    if (cameraLockPointerId != null && captureEl) {
      try { captureEl.releasePointerCapture(cameraLockPointerId); } catch (_) {}
    }
    resetLockedCropEdgeState();
    resetLockedWidthEdgeState();
    resetLockedCornerEdgeState();
    cameraLockLastClientY = null;
    cameraLockLastClientX = null;
    if (didMove && cameraLockAppliedW > 0 && cameraLockAppliedH > 0) {
      cancelLockedZoomMatch();
      matchLockedZoomToLine(cameraLockAppliedW, cameraLockAppliedH);
    } else {
      cancelLockedZoomMatch();
    }
    cameraLockDragging = false;
    cameraLockKind = null;
    cameraLockPointerId = null;
    cameraLockMoved = false;
    cameraLockSnap = null;
    document.body.style.cursor = '';
    if (line) line.classList.remove('is-dragging', 'is-snapped');
    if (resizer) resizer.classList.remove('is-dragging', 'is-snapped');
    if (!didMove) {
      resumeCameraScaleObservers();
      const zoneIdle = kind === 'width' ? 'camera-frame-resizer'
        : kind === 'corner' ? 'camera-frame-corner' : 'camera-crop-hit';
      finishUiTipAfterGuideDrag(false, zoneIdle, releaseX, releaseY);
      if (dblClick) applyCameraGuideDblClick(kind);
      return;
    }
    isZoomAuto = false;
    commitCameraCropRememberedFromLayout();
    rememberCameraModeManualZoom();
    updateZoomUI();
    resumeCameraScaleObservers();
    const grid = document.getElementById('playerGrid');
    if (grid) {
      void grid.offsetHeight;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (grid && !cameraLockDragging && !cameraCropDragging && !cameraCropZoomFitting) {
            grid.style.transition = '';
          }
        });
      });
    }
    const zone = kind === 'width' ? 'camera-frame-resizer'
      : kind === 'corner' ? 'camera-frame-corner' : 'camera-crop-hit';
    finishUiTipAfterGuideDrag(didMove, zone, releaseX, releaseY);
  }

  // ＋／プルダウン専用。摘みのフィット・限界計算機は通さない。高さ＝その倍率のカード下端+24
  function applyLockedWidthToCurrentHeight() {

  function syncCameraSizeAspectFieldsFromPx(width, height) {

  function cameraSizeAspectFieldValue(raw) {
    const s = String(raw == null ? '' : raw).replace(/[^\d.]/g, '');
    const dot = s.indexOf('.');
    if (dot < 0) return s;
    const intPart = s.slice(0, dot).replace(/\D+/g, '');
    const frac = s.slice(dot + 1).replace(/\D+/g, '');
    return frac ? `${intPart}.${frac}` : intPart;
  }

  function digitsOnlyCameraSizeValue(raw) {
    return String(raw == null ? '' : raw).replace(/\D+/g, '');

    if (e) e.stopPropagation();

    if (!btn || btn.disabled) return;
    const captureW = Number(btn.dataset.captureW);
    const captureH = Number(btn.dataset.captureH);
    if (!(captureW > 0) || !(captureH > 0)) return;

    const isInitial = btn.dataset.isInitial === '1';
    forgetCameraSizeColumnLockPause();
    closeCameraSizeDropdownMenus();

    if (isInitial) {
      applyCameraCaptureInitialPreset();
      applied = true;

      if (applied && isCameraSizeLockActive()) adoptCameraSizeLockFromCurrentCapture();

      document.getElementById('cameraSizeAspectW')?.value

    const ah = parseFloat(cameraSizeAspectFieldValue(
      document.getElementById('cameraSizeAspectH')?.value

  function syncCameraSizeModalSizeFieldsFromCapture() {
    const size = getCameraCapturePxSize();
    const widthInput = document.getElementById('cameraSizeWidthInput');
    const heightInput = document.getElementById('cameraSizeHeightInput');
    const captureW = document.getElementById('cameraSizeCaptureW');
    const captureH = document.getElementById('cameraSizeCaptureH');

    if (heightInput) heightInput.value = String(size.height);

    cameraSizeModalLiveSyncH = size.height;

  function formatRequestedCameraSizeAspect(aw, ah) {
    const ww = Number(aw);
    const hh = Number(ah);
    if (!(ww > 0) || !(hh > 0) || !Number.isFinite(ww) || !Number.isFinite(hh)) return null;
    const rw = Math.round(ww);
    const rh = Math.round(hh);
    if (Math.abs(ww - rw) < 1e-9 && Math.abs(hh - rh) < 1e-9 && rw <= 20 && rh <= 20) {
      const reduced = reduceAspectRatio(rw, rh);
      return { w: String(reduced.w), h: String(reduced.h) };
    }
    if (ww >= hh) return { w: formatCameraSizeAspectDecimal(ww / hh), h: '1' };
    return { w: '1', h: formatCameraSizeAspectDecimal(hh / ww) };
  }

  function writeCameraSizeAspectFields(aw, ah) {
    const shown = formatRequestedCameraSizeAspect(aw, ah);
    if (!shown) return;
    const aspectW = document.getElementById('cameraSizeAspectW');
    const aspectH = document.getElementById('cameraSizeAspectH');
    if (aspectW) aspectW.value = shown.w;
    if (aspectH) aspectH.value = shown.h;
  }

  function placeCameraSizeAspectLayout(screenW, screenH) {
    const capW = Math.round(getCameraSizeWidthMaxScreenPx());
    const w = Math.max(CAMERA_WIDTH_MIN, Math.min(capW, Math.round(Number(screenW))));
    const h = Number(screenH);
    if (!(w > 0) || !Number.isFinite(h) || !(h > 0)) return;
    const captureH = getCameraDisplayedHeightPx(h);
    isZoomAuto = false;
    cameraWidthDragPreview = null;
    cameraWidthSnapTarget = null;
    cameraFrameWidth = w;
    applyCameraFrameWidth();
    const mainArea = document.getElementById('mainArea');
    if (mainArea) void mainArea.offsetWidth;
    cameraCropFixedY = captureH / CAMERA_CAPTURE_SCALE;
    cameraCropKind = 'fixed';
    cameraCropBoundaryY = null;
    cameraCropSnapTarget = null;
    cameraCropRememberedY = cameraCropFixedY;
    matchLockedZoomToLine(w, captureH);
    updateCameraGuides();
    paintLockedSnapUi();
    checkCameraHeaderCollision();
    scheduleRefreshCameraDefaultAutoZoom();
  }

  function applyCameraSizeAspect(aw, ah, options) {
    if (!isCameraMode || !isCameraSizeModalOpen()) return;
    const r = Number(aw) / Number(ah);
    if (!(r > 0) || !Number.isFinite(r)) {
      syncCameraSizeModalValuesFromCapture(cameraSizeAspectLocked);
      updateCameraSizeActionButtons();
      return;
    }
    forgetCameraSizeColumnLockPause();
    const w0 = Math.round(getCameraDisplayedFrameWidth());
    const { minH, maxH } = getLockedReachableHeight(w0);
    const minW = CAMERA_WIDTH_MIN;
    const maxW = Math.round(getCameraSizeWidthMaxScreenPx());
    let pair = roundLockedPairFromBase('w', w0, r);
    let broken = false;
    const heightOk = minH > 0 && maxH >= minH && pair.h >= minH - 0.5 && pair.h <= maxH + 0.5;
    if (!heightOk && minH > 0 && maxH >= minH) {
      const pinH = pair.h > maxH ? maxH : minH;
      pair = roundLockedPairFromBase('h', pinH, r);
      if (pair.w < minW - 0.5 || pair.w > maxW + 0.5) {
        broken = true;
        pair = pair.w < minW ? { w: minW, h: maxH } : { w: maxW, h: minH };
      }
    }
    placeCameraSizeAspectLayout(pair.w, pair.h);
    if (broken) {
      syncCameraSizeModalValuesFromCapture(cameraSizeAspectLocked);
    } else {
      syncCameraSizeModalSizeFieldsFromCapture();
      if (!(options && options.keepTypedFields)) writeCameraSizeAspectFields(aw, ah);
    }
    updateCameraSizeActionButtons();
    syncCameraSizePresetMenuActive();
    syncCameraSizeAspectMenuActive();
    updateCameraSizeRangeLabels();
  }

  function finishCameraSizeTypedDimApply(keepAspectFields) {
    forgetCameraSizeColumnLockPause();
    if (keepAspectFields) syncCameraSizeModalSizeFieldsFromCapture();
    else syncCameraSizeModalValuesFromCapture(cameraSizeAspectLocked);
    updateCameraSizeActionButtons();
    syncCameraSizePresetMenuActive();
    if (!keepAspectFields) syncCameraSizeAspectMenuActive();
    updateCameraSizeRangeLabels();

    const raw = parseInt(
      digitsOnlyCameraSizeValue(document.getElementById('cameraSizeWidthInput')?.value),
      10
    );
    if (!(raw > 0) || !Number.isFinite(raw)) {
      syncCameraSizeModalValuesFromCapture(cameraSizeAspectLocked);
      updateCameraSizeActionButtons();
      return;
    }
    const ranges = getCameraSizeModalDimRangesScreen();
    const screenW = clampCameraSizeScreen(raw / CAMERA_CAPTURE_SCALE, ranges.w.min, ranges.w.max);
    if (cameraSizeAspectLocked && ranges.r > 0) {
      const pair = roundLockedPairFromBase('w', screenW, ranges.r);
      placeCameraSizeAspectLayout(pair.w, pair.h);
      finishCameraSizeTypedDimApply(true);
      return;
    }
    const hNow = Math.round(getCameraCapturePxSize().height / CAMERA_CAPTURE_SCALE);
    placeCameraSizeAspectLayout(screenW, hNow);
    finishCameraSizeTypedDimApply(false);
  }

  function applyCameraSizeTypedHeight() {
    if (!isCameraMode || !isCameraSizeModalOpen()) return;
    const raw = parseInt(
      digitsOnlyCameraSizeValue(document.getElementById('cameraSizeHeightInput')?.value),

    const screenH = clampCameraSizeScreen(raw / CAMERA_CAPTURE_SCALE, ranges.h.min, ranges.h.max);

      const pair = roundLockedPairFromBase('h', screenH, ranges.r);
      placeCameraSizeAspectLayout(pair.w, pair.h);
      finishCameraSizeTypedDimApply(true);
      return;

    placeCameraSizeAspectLayout(wNow, screenH);

    if (heightInput) heightInput.value = String(values.height);

    syncCameraSizeColLabel();
    closeCameraSizeDropdownMenus();
    cameraSizeModalUntouchedKind = isCameraCaptureAtDefault() ? 'default' : 'fixed';
    cameraSizeModalUntouchedW = size.width;
    cameraSizeModalUntouchedH = size.height;
    cameraSizeModalLiveSyncW = size.width;
    cameraSizeModalLiveSyncH = size.height;
    cameraSizeModalUntouchedLocked = isCameraAspectLockOn();
    cameraSizeModalLockBaseline = captureCameraAspectLockSnapshot();
    cameraSizeModalCaptureBaseline = getCameraSizeCaptureSnapshot();
    cameraSizeCaptureDisplayWidthPx = 0;

    cameraSizeModalUntouchedW = 0;

    cameraSizeModalLiveSyncW = 0;

    cameraSizeModalLockBaseline = null;
    cameraSizeModalUntouchedLocked = false;
    cameraSizeModalUntouchedCols = '';
    forgetCameraSizeColumnLockPause();
    cameraSizeColRangeRefreshPending = false;
    cameraSizeColShownValue = '';
    cameraSizePresetMenuCache = null;
    cameraSizeCaptureDisplayWidthPx = 0;
    cameraSizePresetInitialPending = false;
    cameraSizePresetMenuBuilt = false;
    cameraSizePresetInitialClusterWidthPx = 0;
    const presetMenu = document.getElementById('cameraSizePresetMenu');
    if (presetMenu) presetMenu.innerHTML = '';
    cameraSizeAspectLocked = false;
    clearCameraSizeFieldDrafts();
    if (uiTipZone === 'camera-size-aspect-lock' || uiTipZone === 'camera-size-preset') hideUiTip();

  function closeCameraSizeModal(e) {
    if (isCameraSizeMenuOpen()) {
      closeCameraSizeDropdownMenus();
      if (e) e.stopPropagation();
      return;
    }
    if (e && e.type === 'click' && e.currentTarget.classList.contains('modal-overlay')) {
      if (overlayMouseDownTarget !== e.currentTarget || overlayMouseUpTarget !== e.currentTarget) return;
    }
    if (e) e.stopPropagation();
    if (isCameraSizeModalDirty()) {
      showConfirm('変更内容を破棄して閉じますか？').then(ok => {
        if (!ok) return;
        revertCameraSizeModalToOpenSnapshot();
        doCloseCameraSizeModal();
      });
      return;
    }
    doCloseCameraSizeModal();
  }

    closeCameraSizeDropdownMenus();
    if (isCameraSizeModalDirty()) revertCameraSizeModalToOpenSnapshot();
    doCloseCameraSizeModal();
  }

  function commitCameraSizeModalLockToLive() {
    const want = !!cameraSizeAspectLocked;
    if (want) {
      setCameraAspectLockLive(true, readCameraSizeAspectFieldPair());
      return;
    }
    forgetCameraAspectLockRemembered();
    if (!isCameraAspectLockOn()) return;
    clearCameraAspectLock({ keepCrop: true });
    syncCameraAspectLockPadlockUi();
    if (isCameraMode) {
      updateCameraGuides();
      paintLockedSnapUi();
      updateCameraResetDefaultBtn();
      checkCameraHeaderCollision();
    }
  }

  function applyCameraSizeModal() {
    if (!isCameraSizeModalDirty()) return;
    rememberCameraModeManualZoom(currentZoom);
    commitCameraCropRememberedFromLayout();
    commitCameraSizeModalLockToLive();
    updateZoomUI();

    if (!isCameraSizeModalDirty()) return;

    closeCameraSizeDropdownMenus();
    updateCameraSizeActionButtons();

  function onCameraSizeDigitInput(e) {
    const el = e && e.target;
    if (!el) return;
    const id = el.id;
    const next = (id === 'cameraSizeAspectW' || id === 'cameraSizeAspectH')
      ? cameraSizeAspectFieldValue(el.value)
      : digitsOnlyCameraSizeValue(el.value);
    if (el.value !== next) el.value = next;
    updateCameraSizeActionButtons();
  }

  if (!window.__cameraSizeModalBound) {
    window.__cameraSizeModalBound = true;
    document.addEventListener('input', function(e) {
      const id = e.target && e.target.id;
      if (id === 'cameraSizeAspectW' || id === 'cameraSizeAspectH' ||
          id === 'cameraSizeWidthInput' || id === 'cameraSizeHeightInput') {
        onCameraSizeDigitInput(e);
      }
    });
    document.addEventListener('focusin', function(e) {
      const id = e.target && e.target.id;
      if (id === 'cameraSizeAspectW' || id === 'cameraSizeAspectH') {
        beginCameraSizeAspectDraft();
      } else if (id === 'cameraSizeWidthInput') {
        beginCameraSizeWidthDraft();
      } else if (id === 'cameraSizeHeightInput') {
        beginCameraSizeHeightDraft();
      }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      if (!isCameraSizeModalOpen()) return;
      const id = e.target && e.target.id;
      if (id === 'cameraSizeAspectW' || id === 'cameraSizeAspectH') {
        e.preventDefault();
        beginCameraSizeAspectDraft();
        commitCameraSizeAspectFields(true);
        return;
      }
      if (id === 'cameraSizeWidthInput') {
        e.preventDefault();
        beginCameraSizeWidthDraft();
        commitCameraSizeWidthField(true);
        return;
      }
      if (id === 'cameraSizeHeightInput') {
        e.preventDefault();
        beginCameraSizeHeightDraft();
        commitCameraSizeHeightField(true);
      }
    });
    document.addEventListener('pointerdown', function(e) {
      if (!isCameraSizeModalOpen()) return;
      const t = e.target;
      if (isCameraSizeColControlTarget(t)) {
        clearCameraSizeFieldDrafts();
        return;
      }
      if (cameraSizeAspectDrafting && !isCameraSizeAspectBoxTarget(t)) {
        commitCameraSizeAspectFields();
      }
      if (cameraSizeWidthDrafting && !(t && t.id === 'cameraSizeWidthInput')) {
        commitCameraSizeWidthField();
      }
      if (cameraSizeHeightDrafting && !(t && t.id === 'cameraSizeHeightInput')) {
        commitCameraSizeHeightField();
      }
    }, true);
    document.addEventListener('focusout', function(e) {
      if (!isCameraSizeModalOpen()) return;
      const id = e.target && e.target.id;
      if (id === 'cameraSizeAspectW' || id === 'cameraSizeAspectH') {
        if (!cameraSizeAspectDrafting) return;
        const box = document.getElementById('cameraSizeAspectBox');
        const next = e.relatedTarget;
        if (next && box && box.contains(next)) return;
        setTimeout(() => {
          if (!cameraSizeAspectDrafting || !isCameraSizeModalOpen()) return;
          const active = document.activeElement;
          const liveBox = document.getElementById('cameraSizeAspectBox');
          if (liveBox && active && liveBox.contains(active)) return;
          commitCameraSizeAspectFields();
        }, 0);
        return;
      }
      if (id === 'cameraSizeWidthInput') {
        if (!cameraSizeWidthDrafting) return;
        const next = e.relatedTarget;
        if (next && next.id === 'cameraSizeWidthInput') return;
        setTimeout(() => {
          if (!cameraSizeWidthDrafting || !isCameraSizeModalOpen()) return;
          if (document.activeElement && document.activeElement.id === 'cameraSizeWidthInput') return;
          commitCameraSizeWidthField();
        }, 0);
        return;
      }
      if (id === 'cameraSizeHeightInput') {
        if (!cameraSizeHeightDrafting) return;
        const next = e.relatedTarget;
        if (next && next.id === 'cameraSizeHeightInput') return;
        setTimeout(() => {
          if (!cameraSizeHeightDrafting || !isCameraSizeModalOpen()) return;
          if (document.activeElement && document.activeElement.id === 'cameraSizeHeightInput') return;
          commitCameraSizeHeightField();
        }, 0);
      }
    });
    document.addEventListener('click', function(e) {
      const modal = document.getElementById('cameraSizeModal');
      if (!modal || modal.classList.contains('hidden')) return;
      if (e.target.closest && e.target.closest(
        '.camera-size-dd-wrap, .camera-size-col-wrap, #cameraSizePresetMenu, #cameraSizeAspectMenu, #cameraSizeColMenu'
      )) return;
      closeCameraSizeDropdownMenus();
    }, true);
    ['cameraSizeChromeBlocker', 'cameraSizePanelBlocker'].forEach((id) => {
      const el = document.getElementById(id);
      if (!el || el._cameraSizeBlockerBound) return;
      el._cameraSizeBlockerBound = true;
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
      el.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        closeCameraSizeDropdownMenus();
      });
    });
  }

  function resolveConfirm(result) {

    if (resolver) resolver(!!result);

      if (overlayMouseDownTarget !== e.currentTarget || overlayMouseUpTarget !== e.currentTarget) return;

  function commitCameraHideMode() {
    if (!isCameraHideMode || !isCameraHideModeDirty()) return;
    const snap = cameraHideModeSnapshot;
    const rowsEnter = snap && Number.isFinite(snap.rowCount) ? snap.rowCount : null;
    const rowsChanged = rowsEnter != null
      && getCameraGridRowCountFromN(players.length) !== rowsEnter;
    if (!rowsChanged) {
      restoreCameraHideModeLayout(snap);
      leaveCameraHideModeShell();
      return;
    }
    const cap = restoreCameraHideZoomAndWidth(snap);
    clearCameraAspectLock();
    syncCameraAspectLockPadlockUi();
    resetCameraCropToMax();
    if (cap && cap.isZoomAuto) {
      isZoomAuto = true;
      cameraCropRememberedY = null;
      leaveCameraHideModeShell();
      executeAutoFit();
      updateZoomUI();
      return;
    }
    isZoomAuto = false;
    currentZoom = cap && Number.isFinite(cap.zoom) && cap.zoom > 0 ? cap.zoom : 1.0;
    cameraModeManualZoom = currentZoom;
    updateCSSVariables();
    updateZoomUI();
    fitCameraCardTextScales();
    leaveCameraHideModeShell();
    resetCameraCropToMax();
    commitCameraCropRememberedFromLayout();

    cameraHiddenPlayers = [];
    players.forEach((player, i) => { player.baseOrder = i; });
    needSort = false;

    const gridEl = document.getElementById('playerGrid');
    const prevTransition = gridEl ? gridEl.style.transition : '';
    if (gridEl) gridEl.style.transition = 'none';

    applyCameraHideLayoutKeepZoom();
    if (firstById && firstById.size) {
      animateCardsFlip(firstById);
      beginCameraHideFlipGuidesHold();

    if (gridEl) {
      void gridEl.offsetWidth;
      gridEl.style.transition = prevTransition;

    updateCameraHideModeActionButtons();

  function hideCardInCameraHideMode(id, e) {
    e.stopPropagation();
    if (!isCameraMode || !isCameraHideMode) return;

    const idx = players.findIndex(x => x.id === id);
    if (idx < 0) return;

    const grid = document.getElementById('playerGrid');
    const card = grid ? grid.querySelector(`.player-card[data-id="${id}"]`) : null;

    const commitHide = (firstById) => {
      const removeIdx = players.findIndex(x => x.id === id);
      if (removeIdx < 0) return;
      const p = players.splice(removeIdx, 1)[0];
      cameraHiddenPlayers.push(p);
      if (activePlayerId === id) activePlayerId = null;

      players.forEach((player, i) => { player.baseOrder = i; });
      needSort = false;

      const gridEl = document.getElementById('playerGrid');
      const prevTransition = gridEl ? gridEl.style.transition : '';
      if (gridEl) gridEl.style.transition = 'none';

      applyCameraHideLayoutKeepZoom();
      if (firstById) {
        animateCardsFlip(firstById);
        beginCameraHideFlipGuidesHold();
      }

      if (gridEl) {
        void gridEl.offsetWidth;
        gridEl.style.transition = prevTransition;
      }
      updateCameraHideModeActionButtons();
    };

    if (!card) {
      commitHide(null);
      return;
    }
    if (card.classList.contains('is-removing')) return;

    const firstById = getCardRectsById(grid);
    firstById.delete(id);
    card.classList.add('is-removing');
    void card.offsetWidth;
    card.classList.add('is-removing-out');

    setTimeout(() => commitHide(firstById), 100);
  }

  function moveToWaitroom(id, e) {
    e.stopPropagation();
    if (!dataReady || isCameraMode) return;

    const idx = players.findIndex(x => x.id === id);
    if (idx < 0) return;

    const grid = document.getElementById('playerGrid');
    const card = grid ? grid.querySelector(`.player-card[data-id="${id}"]`) : null;

    const commitRemoval = (firstById) => {
      const removeIdx = players.findIndex(x => x.id === id);
      if (removeIdx < 0) return;
      const p = players.splice(removeIdx, 1)[0];
      waitroom.push({ name: p.name });
      if (activePlayerId === id) activePlayerId = null;

      // 表示中の並びを維持したまま詰める（再ソートすると同点時などに位置が入れ替わる）
      // カスタム以外では baseOrder（手動並びの記憶）を壊さない
      if (sortMode === 'custom') {
        players.forEach((player, i) => { player.baseOrder = i; });
      }
      needSort = false;

      const gridEl = document.getElementById('playerGrid');
      const prevTransition = gridEl ? gridEl.style.transition : '';
      if (gridEl) gridEl.style.transition = 'none';

      // 詰め移動とオートフィット拡大を同時に行う
      applyRenderSettings();
      if (firstById) animateCardsFlip(firstById);

      if (gridEl) {
        void gridEl.offsetWidth;
        gridEl.style.transition = prevTransition;
      }
      syncDb();
    };

    if (!card) {
      commitRemoval(null);
      return;
    }
    if (card.classList.contains('is-removing')) return;

    const firstById = getCardRectsById(grid);
    firstById.delete(id);
    card.classList.add('is-removing');
    void card.offsetWidth;
    card.classList.add('is-removing-out');

    setTimeout(() => commitRemoval(firstById), 100);

    const mode = modalMode;

    if (!mode) return;
    modalSubmitting = true;

      let val = document.getElementById('modalInput').value.trim();
      if(mode === 'add' && val !== '') {

        const newId = createPlayerId(); const maxOrder = players.length > 0 ? Math.max(...players.map(p => p.baseOrder)) : 0;
        players.push({ id: newId, name: val, score: 0, baseScore: 0, baseOrder: maxOrder + 1 }); activePlayerId = newId; needSort = true;

    const isHotspot = (target) => {

      const selectedCount = arr.reduce((n, e) => n + (e.selected ? 1 : 0), 0);

      return selectedCount >= 2 ? MANAGER_LIST_DRAG_TIP_MOVE : MANAGER_LIST_DRAG_TIP;

      showUiTipAt(e.clientX, e.clientY, tipTextForRow(), zoneKey, e.buttons);

  // メイン画面と同様: 操作可能な UI 以外の空き押しで選択解除。
  // 判定は押した瞬間基準。空き押し→選択中カード上で離しはキャンセル（消さない）。
  // 名前箱どうしの gap 4px は誤操作扱い（消さない）。
  const MANAGER_CLEAR_INTERACTIVE = 'button, .btn, .btn-swap, input, textarea, select, .list-item, .list-item-check-hit, .list-item-pen, .list-item-delete, a, [role="button"], label, .search-box, .manager-sort-radios';
  let managerClearPress = null;

  function isManagerListItemGapAtPoint(clientX, clientY) {
    const top = document.elementFromPoint(clientX, clientY);
    if (!top || !top.closest) return false;
    const list = top.closest('#managerModal .list-container');
    if (!list) return false;
    if (top.closest('.list-item')) return false;
    const items = list.querySelectorAll('.list-item');
    if (items.length < 2) return false;
    const y = clientY;
    for (let i = 0; i < items.length - 1; i++) {
      const bottom = items[i].getBoundingClientRect().bottom;
      const nextTop = items[i + 1].getBoundingClientRect().top;
      if (y > bottom && y < nextTop) return true;
    }
    return false;
  }

  document.querySelector('#managerModal .modal-content').addEventListener('pointerdown', function(e) {
    // 前ジェスチャの swallow 食い残りを、新しい押下で捨てる（このあとの click は通す）
    if (e.button === 0 && mgrSwallowClickAfterDrag) {
      mgrSwallowClickAfterDrag = false;
    }
    if (e.button !== 0) return;
    if (isManagerNameEditLocked()) {
      managerClearPress = null;
      return;
    }
    managerClearPress = {
      pointerId: e.pointerId,
      onInteractive: !!e.target.closest(MANAGER_CLEAR_INTERACTIVE),
      inItemGap: isManagerListItemGapAtPoint(e.clientX, e.clientY)
    };
  }, true);

  document.querySelector('#managerModal .modal-content').addEventListener('pointerup', function(e) {
    if (!managerClearPress || e.pointerId !== managerClearPress.pointerId) return;
    const press = managerClearPress;
    managerClearPress = null;
    if (isManagerNameEditLocked()) return;
    if (press.onInteractive || press.inItemGap) return;
    if (isManagerListItemGapAtPoint(e.clientX, e.clientY)) return;
    const top = document.elementFromPoint(e.clientX, e.clientY);
    const selectedItem = top && top.closest ? top.closest('#managerModal .list-item.is-selected') : null;
    if (selectedItem) return;
    if (!hasManagerSelection()) return;
    clearManagerSelectionOnly();
  }, true);

  document.querySelector('#managerModal .modal-content').addEventListener('pointercancel', function(e) {
    if (managerClearPress && e.pointerId === managerClearPress.pointerId) managerClearPress = null;
  }, true);

  document.querySelector('#managerModal .modal-content').addEventListener('click', function(e) {

      document.getElementById('managerModal')?.classList.contains('is-name-editing') &&

  // 縦並び時: 「参加中／待機中」が全選択・ソートと重ならないよう scale（ヘッダー圧縮に近い考え方）
  function isManagerVerticalLayout() {
    return window.matchMedia('(max-width: 799px)').matches;
  }

  function resetManagerHeaderTitleFit(row) {
    const title = row.querySelector('.manager-header-title');
    const left = row.querySelector(':scope > button');
    const right = row.querySelector(':scope > .manager-sort-radios');
    if (title) title.style.zoom = '';
    if (left) left.style.zoom = '';
    if (right) right.style.zoom = '';
  }

  function checkManagerHeaderTitleFit() {
    const rows = document.querySelectorAll('#managerModal .manager-header-controls');
    if (!rows.length) return;
    if (!isManagerVerticalLayout()) {
      rows.forEach(resetManagerHeaderTitleFit);
      return;
    }
    const minGap = 4;
    rows.forEach(row => {
      const title = row.querySelector('.manager-header-title');
      const left = row.querySelector(':scope > button');
      const right = row.querySelector(':scope > .manager-sort-radios');
      if (!title || !left || !right) return;
      title.style.zoom = 1;
      left.style.zoom = 1;
      right.style.zoom = 1;
      void row.offsetWidth;

      const rowW = row.clientWidth;
      const pad = 8; // .manager-header-controls 左右 padding
      const leftW = left.offsetWidth;
      const rightW = right.offsetWidth;
      const titleW = title.offsetWidth;
      // 中央タイトル半幅 + 最小すき間 が左右ボタン内側に収まる s
      const leftBudget = rowW / 2 - pad - minGap;
      const rightBudget = rowW / 2 - pad - minGap;
      const sLeft = leftBudget / (leftW + titleW / 2);
      const sRight = rightBudget / (rightW + titleW / 2);
      let s = Math.min(1, sLeft, sRight);
      if (!isFinite(s) || s <= 0) s = 0.3;
      s = Math.max(0.3, s);
      title.style.zoom = s;
      left.style.zoom = s;
      right.style.zoom = s;
    });
  }

  let managerHeaderFitRo = null;
  function bindManagerHeaderTitleFit() {
    const modal = document.getElementById('managerModal');
    if (!modal || managerHeaderFitRo) return;
    managerHeaderFitRo = new ResizeObserver(() => checkManagerHeaderTitleFit());
    modal.querySelectorAll('.manager-col').forEach(col => managerHeaderFitRo.observe(col));

  function saveManager() {
    if (!dataReady) return;
    if (!isManagerActionsEnabled()) return;
    const hasSelection = hasManagerSelection();
    const commitSave = () => {
      players = JSON.parse(JSON.stringify(tempPlayers));
      // 控え室DBは名前のみ。マネージャ内の一時フィールドは保存しない
      waitroom = tempWaitroom.map(w => ({ name: w.name }));
      players.forEach((p, idx) => { p.baseOrder = idx; delete p.selected; });
      ensureUniquePlayerIds(players);
      if (activePlayerId != null && !players.some(p => String(p.id) === String(activePlayerId))) {
        activePlayerId = null;

      sortMode = tempMainSortMode;
      waitSortMode = tempWaitSortMode;
      saveSortModesToStorage();
      updateSortMenuUI();
      needSort = true;
      executeSort();
      // 名前順で保存した場合は手動順を名前順で上書き済み（baseOrder = idx）
      syncDb();
      doCloseManager();
    };

    if (!hasSelection) {
      commitSave();
      return;
    }

    showConfirm('選択中のメンバーを移動して保存しますか？').then(ok => {
      if (!ok) return;
      executeSwap();
      commitSave();

  function updateManagerListScrollFades(listEl) {
    if (!listEl) return;
    const shell = listEl.closest('.list-scroll-shell');
    if (!shell) return;
    const top = listEl.scrollTop > 0;
    const bottom = listEl.scrollTop + listEl.clientHeight < listEl.scrollHeight - 1;
    shell.classList.toggle('has-scroll-top', top);
    shell.classList.toggle('has-scroll-bottom', bottom);
    if (listEl.id === 'tempMainList') syncManagerListSb('tempMainList', 'managerMainSb');
    if (listEl.id === 'tempWaitList') syncManagerListSb('tempWaitList', 'managerWaitSb');
  }

  function syncAllManagerListScrollFades() {
