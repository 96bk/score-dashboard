      cameraCropKind = 'free';
      cameraCropSnapTarget = null;
      updateCameraGuides();
      return true;
    }
    if (rawY >= maxZoomCeilingY - 0.5 && currentZoom < 1.5 - 1e-9) {
      const vp = getCameraVisibleBottomContentY();
      // 上限が画面端のときは150%壁ではない（画面いっぱい着地）。150%確定すると端フィットと殴る
      if (vp > 0 && Math.abs(maxZoomCeilingY - vp) <= CAMERA_VIEWPORT_BOTTOM_EPS) return false;
      const y = settleCameraAutoToMaxZoomCeiling();
      cameraCropPendingY = y;
      cameraCropBoundaryY = y;
      cameraCropKind = 'free';
      cameraCropSnapTarget = null;
      updateCameraGuides();
      return true;
    }
    return false;
  }

  // オートボタンの 50/150 クランプと同じ。ドラッグ中に揃える（離してから計算しない）
  function snapCameraZoomToExactLimitIfNear() {
    if (currentZoom >= 1.5 - 0.001 && currentZoom < 1.5) {
      settleCameraAutoToMaxZoomCeiling();
      return true;
    }
    if (currentZoom <= 0.5 + 0.001 && currentZoom > 0.5) {
      settleCameraAutoToMinZoomFloor();
      return true;
    }
    return false;
  }

  function finishCameraDragZoomMatch() {
    if (!cameraCropDragging && !cameraCornerDragging) return;
    updateZoomUI();
    const boundaryY = clampCameraAutoBoundaryY(cameraCropPendingY);
    cameraCropKind = 'free';
    cameraCropBoundaryY = boundaryY;
    cameraCropPendingY = boundaryY;
    updateCameraGuides();
  }

  // 画面いっぱい着地はオートボタンと同じ倍率。ドラッグ中の精密合わせは使わない
  // 縦バーありは窓より長いので着地ではない（150%ではみ出しを含む）
  function matchCameraZoomAtViewportEdge() {
    const vp = getCameraVisibleBottomContentY();
    if (!(vp > 0) || isCameraVerticalScrollActive()) return;
    if (cameraCropAutoFitRaf) {
      cancelAnimationFrame(cameraCropAutoFitRaf);
      cameraCropAutoFitRaf = null;
    }
    cameraCropPendingY = vp;
    tryApplyCameraDefaultAutoZoom(vp);
    finishCameraDragZoomMatch();
  }

  // バーなし・点線が画面端＝画面いっぱい。保存済みのオート着地倍率を使う
  function matchCameraZoomIfViewportFit() {
    if (isCameraVerticalScrollActive()) return false;
    matchCameraZoomAtViewportEdge();
    pinCameraCropLineToViewportBottom();
    return true;
  }

  function applyPendingCameraZoomMatch(options) {
    if (!isCameraMode || cameraCropZoomFitting || !cameraCropDragging) return;
    if (cameraCropPendingY == null || !Number.isFinite(cameraCropPendingY)) return;
    const flush = !!(options && options.flush);

    const viewportBottom = getCameraVisibleBottomContentY();
    let y = cameraCropPendingY;
    // ドラッグ中は画面内に収まる高さ以上へは合わせない（下ピッタリで誤差のはみ出し防止）
    // 縦バーありの150%は窓より長いのが正しいので切らない
    if (viewportBottom > 0 && !isCameraVerticalScrollActive()) {
      y = Math.min(y, viewportBottom);
    }

    const contentNow = getCameraContentMaxY();
    const liveTol = 0.5;
    // 50%/150%で届かないYへは合わせない（線のはみ出し防止）
    y = clampCameraAutoBoundaryY(y);
    if (viewportBottom > 0 && isCameraYAtViewportBottom(y, viewportBottom)) {
      matchCameraZoomAtViewportEdge();
      return;
    }
    if (isCameraAutoPinnedAtMaxReachable(y)
      || (currentZoom >= 1.5 - 0.001 && currentZoom < 1.5)) {
      const ceilingY = settleCameraAutoToMaxZoomCeiling();
      cameraCropPendingY = ceilingY;
      finishCameraDragZoomMatch();
      return;
    }
    if (isCameraAutoPinnedAtMinReachable(y)
      || (currentZoom <= 0.5 + 0.001 && currentZoom > 0.5)) {
      const floorY = settleCameraAutoToMinZoomFloor();
      cameraCropPendingY = floorY;
      finishCameraDragZoomMatch();
      return;
    }
    const matched = flush
      ? getCameraDisplayedHeightPx(contentNow) === getCameraDisplayedHeightPx(y)
      : Math.abs(y - contentNow) <= liveTol;
    if (matched) {
      snapCameraZoomToExactLimitIfNear();
      const settledY = getCameraContentMaxY();
      cameraCropKind = 'free';
      cameraCropBoundaryY = settledY;
      cameraCropPendingY = settledY;
      updateCameraGuides();
      return;
    }
    executeAutoZoomToMatchBoundary(y, flush ? { precise: true } : undefined);
    finishCameraDragZoomMatch();
  }

  function flushPendingCameraZoomMatch() {
    if (cameraCropAutoFitRaf) {
      cancelAnimationFrame(cameraCropAutoFitRaf);
      cameraCropAutoFitRaf = null;
    }
    applyPendingCameraZoomMatch({ flush: true });
  }

  function scheduleAutoZoomToMatchBoundary(targetY) {
    cameraCropPendingY = targetY;
    const viewportBottom = getCameraVisibleBottomContentY();
    if (viewportBottom > 0 && isCameraYAtViewportBottom(targetY, viewportBottom)
      && !isCameraVerticalScrollActive()) {
      matchCameraZoomAtViewportEdge();
      return;
    }
    if (cameraCropAutoFitRaf) cancelAnimationFrame(cameraCropAutoFitRaf);
    cameraCropAutoFitRaf = requestAnimationFrame(() => {
      cameraCropAutoFitRaf = null;
      applyPendingCameraZoomMatch();
    });
  }

  function getCameraEdgePastPx(clientY) {
    const wrapper = getCameraGridWrapper();
    if (!wrapper || !Number.isFinite(clientY)) return 0;
    return clientY - wrapper.getBoundingClientRect().bottom;
  }

  function getCameraEdgeAbovePx(clientY) {
    const wrapper = getCameraGridWrapper();
    if (!wrapper || !Number.isFinite(clientY)) return 0;
    return wrapper.getBoundingClientRect().bottom - clientY;
  }

  function pinCameraCropLineToViewportBottom() {
    const vp = getCameraVisibleBottomContentY() || 0;
    const y150 = getCameraCropYAtMaxZoom();
    const fill = vp > 0 && Number.isFinite(y150) && y150 >= vp - CAMERA_VIEWPORT_BOTTOM_EPS;
    cameraCropKind = 'free';
    if (!fill) {
      cameraCropNearBottomLatch = false;
      cameraCropSnapTarget = null;
      const y = Number.isFinite(y150) && y150 > 0 ? y150 : getCameraContentMaxY();
      cameraCropBoundaryY = y;
      cameraCropPendingY = y;
      updateCameraGuides();
      return;
    }
    cameraCropNearBottomLatch = true;
    scrollCameraWrapperToVerticalEnd();
    const y = getCameraVisibleBottomContentY();
    cameraCropBoundaryY = y;
    cameraCropPendingY = y;
    setCameraCropViewportSnap(y);
    updateCameraGuides();
  }

  function scrollCameraWrapperToVerticalEnd() {
    const wrapper = getCameraGridWrapper();
    if (!wrapper) return;
    const maxScroll = wrapper.scrollHeight - wrapper.clientHeight;
    if (maxScroll > 0) wrapper.scrollTop = maxScroll;
  }

  function isCameraCropAtExpandEdge() {
    if (!canCameraCropFillViewportAtMaxZoom()) return false;
    if (cameraCropNearBottomLatch) return true;
    const viewportBottom = getCameraVisibleBottomContentY() || 0;
    const y = cameraCropPendingY != null ? cameraCropPendingY : getCameraContentMaxY();
    return isCameraYAtViewportBottom(y, viewportBottom);
  }

  function stopCameraCropEdgeExpand() {
    cameraCropEdgeExpanding = false;
    cameraCropEdgeExpandLastTs = 0;
    if (cameraCropEdgeExpandRaf) {
      cancelAnimationFrame(cameraCropEdgeExpandRaf);
      cameraCropEdgeExpandRaf = null;
    }
  }

  function stopCameraCropEdgeShrink() {
    cameraCropEdgeShrinking = false;
    cameraCropEdgeShrinkLastTs = 0;
    if (cameraCropEdgeShrinkRaf) {
      cancelAnimationFrame(cameraCropEdgeShrinkRaf);
      cameraCropEdgeShrinkRaf = null;
    }
  }

  function stopCameraCropParkCatch() {
    cameraCropParkCatchActive = false;
    cameraCropParkCatchLastTs = 0;
    if (cameraCropParkCatchRaf) {
      cancelAnimationFrame(cameraCropParkCatchRaf);
      cameraCropParkCatchRaf = null;
    }
  }

  function startCameraCropParkCatch() {
    const vp = getCameraVisibleBottomContentY();
    if (!(vp > 0)) {
      stopCameraCropParkCatch();
      return;
    }
    getCameraCropYAtMinZoom();
    cameraCropParkCatchActive = true;
    cameraCropParkCatchY = vp;
    cameraCropParkCatchLastTs = 0;
    cameraCropSnapTarget = null;
    if (!cameraCropParkCatchRaf) {
      cameraCropParkCatchRaf = requestAnimationFrame(pumpCameraCropParkCatch);
    }
  }

  function pumpCameraCropParkCatch(ts) {
    cameraCropParkCatchRaf = null;
    if (!cameraCropParkCatchActive || !cameraCropDragging || !isCameraMode) {
      stopCameraCropParkCatch();
      return;
    }
    const pointerY = getCameraContentYFromClientY(cameraCropLastClientY, { drag: true });
    if (pointerY == null) {
      stopCameraCropParkCatch();
      return;
    }
    const targetY = getCameraCropLineLandingY(pointerY);
    const last = cameraCropParkCatchLastTs || ts;
    cameraCropParkCatchLastTs = ts;
    const dt = Math.min(48, Math.max(0, ts - last));
    const step = CAMERA_PARK_CATCH_SPEED_PX_S * (dt / 1000);
    const dist = targetY - cameraCropParkCatchY;
    const arrive = Math.abs(dist) <= 0.5 || Math.abs(dist) <= step;
    if (arrive) {
      cameraCropParkCatchY = targetY;
      stopCameraCropParkCatch();
      applyCameraCropDragY(targetY);
      return;
    }
    const dir = dist > 0 ? 1 : -1;
    cameraCropParkCatchY += dir * step;
    applyCameraCropDragY(cameraCropParkCatchY);
    cameraCropParkCatchRaf = requestAnimationFrame(pumpCameraCropParkCatch);
  }

  function resetCameraCropEdgeExpandState() {
    stopCameraCropEdgeExpand();
    stopCameraCropEdgeShrink();
    stopCameraCropParkCatch();
    cameraCropDidEdgeExpand = false;
    cameraCropEdgeExpandVirtualY = 0;
    cameraCropEdgeExpandSnapY = null;
    cameraCropEdgeExpandHoldPx = 0;
    cameraCropEdgeExpandPausedStep = null;
    cameraCropEdgeExpandBlocked = false;
    cameraCropEdgeExpandPeakClientY = null;
    cameraCropEdgeExpandTroughClientY = null;
    cameraCropEdgeShrinkVirtualY = 0;
    cameraCropEdgeShrinkSnapY = null;
    cameraCropEdgeShrinkHoldPx = 0;
    cameraCropEdgeShrinkPausedStep = null;
    cameraCropEdgeShrinkBlocked = false;
    cameraCropEdgeShrinkPeakClientY = null;
    cameraCropEdgeShrinkTroughClientY = null;
    cameraCropEdgeShrinkParkClientY = null;
  }

  function getCameraHeightStepIfNear(y, dist) {
    if (!(Number.isFinite(y) && y > 0 && Number.isFinite(dist))) return null;
    const step = Math.round(y / CAMERA_HEIGHT_STEP) * CAMERA_HEIGHT_STEP;
    if (step <= 0) return null;
    if (Math.abs(y - step) > dist) return null;
    return step;
  }

  function armCameraCropEdgeSnapFromY(kind) {
    if (kind === 'expand') {
      cameraCropEdgeExpandSnapY = null;
      cameraCropEdgeExpandPausedStep = null;
      cameraCropEdgeExpandHoldPx = 0;
      return;
    }
    cameraCropEdgeShrinkSnapY = null;
    cameraCropEdgeShrinkPausedStep = null;
    cameraCropEdgeShrinkHoldPx = 0;
  }

  // ポインタで止めたときだけ80に合わせる（動いている途中はフィットしない）
  function settleCameraCropEdgeAfterPointerStop(kind) {
    if (matchCameraZoomIfViewportFit()) return;
    const virtualY = kind === 'expand'
      ? cameraCropEdgeExpandVirtualY
      : cameraCropEdgeShrinkVirtualY;
    let y = kind === 'expand' ? cameraCropEdgeExpandSnapY : cameraCropEdgeShrinkSnapY;
    if (y == null) {
      y = getCameraHeightStepIfNear(virtualY, CAMERA_SNAP_RELEASE_DISTANCE);
      if (y != null) {
        if (kind === 'expand') cameraCropEdgeExpandSnapY = y;
        else cameraCropEdgeShrinkSnapY = y;
      }
    }
    if (y != null && Math.abs(getCameraContentMaxY() - y) > 0.5) {
      executeAutoZoomToMatchBoundary(y, { precise: true });
    }
    pinCameraCropLineToViewportBottom();
  }

  function getCrossedCameraHeightStep(prevY, nextY, goingUp) {
    if (!(Number.isFinite(prevY) && Number.isFinite(nextY))) return null;
    if (goingUp) {
      const step = Math.floor(nextY / CAMERA_HEIGHT_STEP) * CAMERA_HEIGHT_STEP;
      if (step > 0 && prevY < step && nextY >= step) return step;
      return null;
    }
    const step = Math.floor(prevY / CAMERA_HEIGHT_STEP) * CAMERA_HEIGHT_STEP;
    if (step > 0 && prevY > step && nextY <= step) return step;
    return null;
  }

  function startCameraCropEdgeExpand() {
    if (cameraCropEdgeExpanding || currentZoom >= 1.5 - 1e-9) return;
    if (!canCameraCropFillViewportAtMaxZoom()) return;
    stopCameraCropEdgeShrink();
    stopCameraCropParkCatch();
    cameraCropEdgeShrinkBlocked = false;
    cameraCropEdgeShrinkPeakClientY = null;
    cameraCropEdgeShrinkTroughClientY = null;
    cameraCropEdgeShrinkParkClientY = null;
    cameraCropEdgeExpanding = true;
    cameraCropDidEdgeExpand = true;
    cameraCropDragMoved = true;
    releaseCameraCropHeightFudge();
    cameraCropNearBottomLatch = true;
    setCameraCropViewportSnap(getCameraVisibleBottomContentY());
    cameraCropEdgeExpandVirtualY = getCameraContentMaxY();
    armCameraCropEdgeSnapFromY('expand');
    cameraCropEdgeExpandLastTs = 0;
    if (cameraCropAutoFitRaf) {
      cancelAnimationFrame(cameraCropAutoFitRaf);
      cameraCropAutoFitRaf = null;
    }
    if (!cameraCropEdgeExpandRaf) {
      cameraCropEdgeExpandRaf = requestAnimationFrame(pumpCameraCropEdgeExpand);
    }
  }

  function pumpCameraCropEdgeExpand(ts) {
    cameraCropEdgeExpandRaf = null;
    if (!cameraCropDragging || !cameraCropEdgeExpanding || !isCameraMode) {
      cameraCropEdgeExpanding = false;
      cameraCropEdgeExpandLastTs = 0;
      return;
    }
    const last = cameraCropEdgeExpandLastTs || ts;
    cameraCropEdgeExpandLastTs = ts;
    const dt = Math.min(48, Math.max(0, ts - last));

    if (currentZoom < 1.5 - 1e-9) {
      const stepPx = MGR_AUTOSCROLL_SPEED_PX_S * (dt / 1000);
      if (cameraCropEdgeExpandSnapY != null && cameraCropEdgeExpandHoldPx < CAMERA_HEIGHT_STEP) {
        cameraCropEdgeExpandHoldPx += stepPx;
        if (Math.abs(getCameraContentMaxY() - cameraCropEdgeExpandSnapY) > 0.5) {
          executeAutoZoomToMatchBoundary(cameraCropEdgeExpandSnapY);
        }
        pinCameraCropLineToViewportBottom();
        if (cameraCropDragging && cameraCropEdgeExpanding) {
          cameraCropEdgeExpandRaf = requestAnimationFrame(pumpCameraCropEdgeExpand);
        }
        return;
      }

      const prevY = cameraCropEdgeExpandVirtualY;
      cameraCropEdgeExpandVirtualY += stepPx;
      const virtualY = cameraCropEdgeExpandVirtualY;
      const crossed = getCrossedCameraHeightStep(prevY, virtualY, true);
      if (crossed != null && crossed !== cameraCropEdgeExpandPausedStep) {
        cameraCropEdgeExpandVirtualY = crossed;
        cameraCropEdgeExpandPausedStep = crossed;
        cameraCropEdgeExpandSnapY = crossed;
        cameraCropEdgeExpandHoldPx = 0;
        executeAutoZoomToMatchBoundary(crossed, { precise: true });
      } else {
        if (cameraCropEdgeExpandSnapY != null
          && Math.abs(virtualY - cameraCropEdgeExpandSnapY) >= CAMERA_SNAP_RELEASE_DISTANCE) {
          cameraCropEdgeExpandSnapY = null;
        }
        if (Math.abs(getCameraContentMaxY() - cameraCropEdgeExpandVirtualY) > 0.5) {
          executeAutoZoomToMatchBoundary(cameraCropEdgeExpandVirtualY);
        }
      }
      // 0.001判定で1.499止めにしない。端拡大は1.5まで着地させる
      if (currentZoom >= 1.5 - 0.001 && currentZoom < 1.5 - 1e-9) {
        currentZoom = 1.5;
        updateCSSVariables();
        updateZoomUI();
      }
    }

    pinCameraCropLineToViewportBottom();
    if (currentZoom >= 1.5 - 1e-9) return;
    if (cameraCropDragging && cameraCropEdgeExpanding) {
      cameraCropEdgeExpandRaf = requestAnimationFrame(pumpCameraCropEdgeExpand);
    }
  }

  function updateCameraCropEdgeExpandFromClientY(clientY) {
    if (!cameraCropDragging || !isCameraMode) {
      stopCameraCropEdgeExpand();
      return;
    }
    if (!Number.isFinite(clientY)) return;
    const past = getCameraEdgePastPx(clientY);
    const dead = CAMERA_CROP_POINTER_DEAD_PX;
    const canStart = isCameraCropAtExpandEdge()
      && past > CAMERA_SNAP_RELEASE_DISTANCE
      && currentZoom < 1.5 - 1e-9;
    if (cameraCropEdgeExpandBlocked) {
      if (cameraCropEdgeExpandTroughClientY == null || clientY < cameraCropEdgeExpandTroughClientY) {
        cameraCropEdgeExpandTroughClientY = clientY;
      }
      if (canStart && clientY >= cameraCropEdgeExpandTroughClientY + dead) {
        cameraCropEdgeExpandBlocked = false;
        cameraCropEdgeExpandTroughClientY = null;
        startCameraCropEdgeExpand();
        cameraCropEdgeExpandPeakClientY = clientY;
      } else if (past <= CAMERA_SNAP_RELEASE_DISTANCE) {
        cameraCropEdgeExpandBlocked = false;
        cameraCropEdgeExpandTroughClientY = null;
      }
      return;
    }
    if (cameraCropEdgeExpanding) {
      if (cameraCropEdgeExpandPeakClientY == null || clientY > cameraCropEdgeExpandPeakClientY) {
        cameraCropEdgeExpandPeakClientY = clientY;
      }
      if (clientY <= cameraCropEdgeExpandPeakClientY - dead) {
        cameraCropEdgeExpandBlocked = true;
        cameraCropEdgeExpandTroughClientY = clientY;
        cameraCropEdgeExpandPeakClientY = null;
        stopCameraCropEdgeExpand();
        settleCameraCropEdgeAfterPointerStop('expand');
      }
      return;
    }
    if (canStart) {
      startCameraCropEdgeExpand();
      cameraCropEdgeExpandPeakClientY = clientY;
    }
  }

  function startCameraCropEdgeShrink() {
    if (cameraCropEdgeShrinking || cameraCropEdgeExpanding) return;
    if (currentZoom <= 0.5 + 0.001) return;
    if (!isCameraVerticalScrollActive()) return;
    cameraCropEdgeExpandBlocked = false;
    cameraCropEdgeExpandPeakClientY = null;
    cameraCropEdgeExpandTroughClientY = null;
    cameraCropEdgeShrinkParkClientY = null;
    cameraCropEdgeShrinking = true;
    cameraCropDragMoved = true;
    releaseCameraCropHeightFudge();
    cameraCropNearBottomLatch = true;
    setCameraCropViewportSnap(getCameraVisibleBottomContentY());
    cameraCropEdgeShrinkVirtualY = getCameraContentMaxY();
    armCameraCropEdgeSnapFromY('shrink');
    cameraCropEdgeShrinkLastTs = 0;
    if (cameraCropAutoFitRaf) {
      cancelAnimationFrame(cameraCropAutoFitRaf);
      cameraCropAutoFitRaf = null;
    }
    if (!cameraCropEdgeShrinkRaf) {
      cameraCropEdgeShrinkRaf = requestAnimationFrame(pumpCameraCropEdgeShrink);
    }
  }

  function pumpCameraCropEdgeShrink(ts) {
    cameraCropEdgeShrinkRaf = null;
    if (!cameraCropDragging || !cameraCropEdgeShrinking || !isCameraMode) {
      cameraCropEdgeShrinking = false;
      cameraCropEdgeShrinkLastTs = 0;
      return;
    }
    const last = cameraCropEdgeShrinkLastTs || ts;
    cameraCropEdgeShrinkLastTs = ts;
    const dt = Math.min(48, Math.max(0, ts - last));

    if (currentZoom > 0.5 + 0.001 && isCameraVerticalScrollActive()) {
      const stepPx = MGR_AUTOSCROLL_SPEED_PX_S * (dt / 1000);
      if (cameraCropEdgeShrinkSnapY != null && cameraCropEdgeShrinkHoldPx < CAMERA_HEIGHT_STEP) {
        cameraCropEdgeShrinkHoldPx += stepPx;
        if (Math.abs(getCameraContentMaxY() - cameraCropEdgeShrinkSnapY) > 0.5) {
          executeAutoZoomToMatchBoundary(cameraCropEdgeShrinkSnapY);
        }
        pinCameraCropLineToViewportBottom();
        if (cameraCropDragging && cameraCropEdgeShrinking) {
          cameraCropEdgeShrinkRaf = requestAnimationFrame(pumpCameraCropEdgeShrink);
        }
        return;
      }

      const prevY = cameraCropEdgeShrinkVirtualY;
      cameraCropEdgeShrinkVirtualY -= stepPx;
      const minReach = getCameraZoomLimitBoundaryY(0.5);
      if (cameraCropEdgeShrinkVirtualY < minReach) cameraCropEdgeShrinkVirtualY = minReach;
      const virtualY = cameraCropEdgeShrinkVirtualY;
      const crossed = getCrossedCameraHeightStep(prevY, virtualY, false);
      if (crossed != null && crossed !== cameraCropEdgeShrinkPausedStep) {
        cameraCropEdgeShrinkVirtualY = crossed;
        cameraCropEdgeShrinkPausedStep = crossed;
        cameraCropEdgeShrinkSnapY = crossed;
        cameraCropEdgeShrinkHoldPx = 0;
        executeAutoZoomToMatchBoundary(crossed, { precise: true });
      } else {
        if (cameraCropEdgeShrinkSnapY != null
          && Math.abs(virtualY - cameraCropEdgeShrinkSnapY) >= CAMERA_SNAP_RELEASE_DISTANCE) {
          cameraCropEdgeShrinkSnapY = null;
        }
        if (Math.abs(getCameraContentMaxY() - virtualY) > 0.5) {
          executeAutoZoomToMatchBoundary(virtualY);
        }
      }
      if (currentZoom <= 0.5 + 0.001 && currentZoom > 0.5) {
        settleCameraAutoToMinZoomFloor();
      }
    }

    pinCameraCropLineToViewportBottom();
    if (!isCameraVerticalScrollActive() || currentZoom <= 0.5 + 0.001) {
      if (currentZoom > 0.5 + 0.001 && !isCameraVerticalScrollActive()) {
        cameraCropEdgeShrinkParkClientY = Number.isFinite(cameraCropLastClientY)
          ? cameraCropLastClientY
          : cameraCropEdgeShrinkParkClientY;
        matchCameraZoomIfViewportFit();
      }
      stopCameraCropEdgeShrink();
      return;
    }
    if (cameraCropDragging && cameraCropEdgeShrinking) {
      cameraCropEdgeShrinkRaf = requestAnimationFrame(pumpCameraCropEdgeShrink);
    }
  }

  function updateCameraCropEdgeShrinkFromClientY(clientY) {
    if (!cameraCropDragging || !isCameraMode) {
      stopCameraCropEdgeShrink();
      return;
    }
    if (cameraCropEdgeExpanding) {
      stopCameraCropEdgeShrink();
      return;
    }
    if (!Number.isFinite(clientY)) return;
    const above = getCameraEdgeAbovePx(clientY);
    const dead = CAMERA_CROP_POINTER_DEAD_PX;
    const canStart = isCameraCropAtExpandEdge() && isCameraVerticalScrollActive()
      && above > CAMERA_SNAP_RELEASE_DISTANCE && currentZoom > 0.5 + 0.001;
    if (cameraCropEdgeShrinkParkClientY != null) {
      const parkY = cameraCropEdgeShrinkParkClientY;
      if (clientY <= parkY - CAMERA_SNAP_RELEASE_DISTANCE) {
        cameraCropEdgeShrinkParkClientY = null;
        cameraCropNearBottomLatch = false;
        cameraCropLeftBottomThisDrag = true;
        startCameraCropParkCatch();
      }
      return;
    }
    if (cameraCropEdgeShrinkBlocked) {
      if (!isCameraVerticalScrollActive() || above <= CAMERA_SNAP_RELEASE_DISTANCE) {
        cameraCropEdgeShrinkBlocked = false;
        cameraCropEdgeShrinkTroughClientY = null;
        cameraCropEdgeShrinkPeakClientY = null;
        return;
      }
      if (cameraCropEdgeShrinkTroughClientY == null || clientY > cameraCropEdgeShrinkTroughClientY) {
        cameraCropEdgeShrinkTroughClientY = clientY;
      }
      if (canStart && clientY <= cameraCropEdgeShrinkTroughClientY - dead) {
        cameraCropEdgeShrinkBlocked = false;
        cameraCropEdgeShrinkTroughClientY = null;
        startCameraCropEdgeShrink();
        cameraCropEdgeShrinkPeakClientY = clientY;
      }
      return;
    }
    if (cameraCropEdgeShrinking) {
      if (!isCameraVerticalScrollActive()) {
        cameraCropEdgeShrinkParkClientY = clientY;
        stopCameraCropEdgeShrink();
        matchCameraZoomIfViewportFit();
        return;
      }
      if (cameraCropEdgeShrinkPeakClientY == null || clientY < cameraCropEdgeShrinkPeakClientY) {
        cameraCropEdgeShrinkPeakClientY = clientY;
      }
      if (clientY >= cameraCropEdgeShrinkPeakClientY + dead) {
        cameraCropEdgeShrinkBlocked = true;
        cameraCropEdgeShrinkTroughClientY = clientY;
        cameraCropEdgeShrinkPeakClientY = null;
        stopCameraCropEdgeShrink();
        settleCameraCropEdgeAfterPointerStop('shrink');
      }
      return;
    }
    if (canStart) {
      startCameraCropEdgeShrink();
      cameraCropEdgeShrinkPeakClientY = clientY;
    }
  }

  function applyCameraCropDragY(localY) {
    if (!Number.isFinite(localY)) return;
    if (!cameraCropParkCatchActive && (cameraCropEdgeExpanding || cameraCropEdgeShrinking
      || cameraCropEdgeExpandBlocked || cameraCropEdgeShrinkBlocked
      || cameraCropEdgeShrinkParkClientY != null)) {
      pinCameraCropLineToViewportBottom();
      return;
    }
    cameraCropEdgeExpandSnapY = null;
    cameraCropEdgeShrinkSnapY = null;
    const { range, atMinZoom, atMaxZoom, minZoomFloorY, maxZoomCeilingY } = getCameraCropZoomYLimits();
    let rawY = Math.max(range.minY, Math.min(range.maxY, localY));
    if (cameraCropParkCatchActive) {
      if (rawY < minZoomFloorY) rawY = minZoomFloorY;
      if (rawY > maxZoomCeilingY) rawY = maxZoomCeilingY;
      rawY = clampCameraAutoBoundaryY(rawY);
      cameraCropSnapTarget = null;
      cameraCropNearBottomLatch = false;
      cameraCropLeftBottomThisDrag = true;
      cameraCropPendingY = rawY;
      cameraCropKind = 'free';
      cameraCropBoundaryY = rawY;
      updateCameraGuides();
      if (
        !(atMinZoom && rawY <= minZoomFloorY + 0.5) &&
        !(atMaxZoom && rawY >= maxZoomCeilingY - 0.5)
      ) {
        scheduleAutoZoomToMatchBoundary(rawY);
      }
      return;
    }
    const pointerY = rawY;

    const stepY = Math.round(rawY / CAMERA_HEIGHT_STEP) * CAMERA_HEIGHT_STEP;
    const clampedStep = Math.max(range.minY, Math.min(range.maxY, stepY));
    const vp = range.viewportBottom;
    const nearYWall = isCameraYInSnapWallZone(rawY, vp);
    if (nearYWall && cameraCropSnapTarget && cameraCropSnapTarget.type === 'step') {
      cameraCropSnapTarget = null;
    }

    const canViewportSnap = vp > 0
      && vp >= minZoomFloorY - 0.5
      && vp <= maxZoomCeilingY + 0.5;
    if (cameraCropSnapTarget && cameraCropSnapTarget.type === 'viewport') {
      if (canViewportSnap && (isCameraVerticalScrollActive() || shouldHoldCameraSnap(rawY, vp))) {
        cameraCropSnapTarget = { type: 'viewport', y: vp };
        rawY = vp;
      } else {
        cameraCropSnapTarget = null;
      }
    }
    if (cameraCropSnapTarget && cameraCropSnapTarget.type === 'step') {
      const snapY = cameraCropSnapTarget.y;
      const snapOk =
        !nearYWall &&
        !isCameraYInSnapWallZone(snapY, vp) &&
        isCameraSnapYAllowed(snapY, vp) &&
        shouldHoldCameraSnap(rawY, snapY) &&
        snapY >= minZoomFloorY - 0.5 &&
        snapY <= maxZoomCeilingY + 0.5;
      if (snapOk) {
        rawY = snapY;
      } else {
        cameraCropSnapTarget = null;
      }
    }
    if (
      !nearYWall &&
      !cameraCropSnapTarget &&
      !isCameraYInSnapWallZone(clampedStep, vp) &&
      isCameraSnapYAllowed(clampedStep, vp) &&
      !(atMinZoom && clampedStep < minZoomFloorY - 0.5) &&
      !(atMaxZoom && clampedStep > maxZoomCeilingY + 0.5) &&
      Math.abs(rawY - clampedStep) <= CAMERA_SNAP_ATTRACT_DISTANCE
    ) {
      cameraCropSnapTarget = { type: 'step', y: clampedStep };
      rawY = clampedStep;
    }
    // 画面下端：下側のみ。入る8・外れる16。端手前16pxの刻み無効とは独立
    if (
      !cameraCropSnapTarget &&
      canViewportSnap &&
      rawY <= vp + 0.5 &&
      (vp - rawY) <= CAMERA_SNAP_ATTRACT_DISTANCE
    ) {
      cameraCropSnapTarget = { type: 'viewport', y: vp };
      rawY = vp;
    }

    if (rawY < minZoomFloorY) {
      rawY = minZoomFloorY;
      cameraCropSnapTarget = null;
    }
    if (rawY > maxZoomCeilingY) {
      rawY = maxZoomCeilingY;
      if (!(cameraCropSnapTarget && cameraCropSnapTarget.type === 'viewport' && canViewportSnap)) {
        cameraCropSnapTarget = null;
      }
    }
    const beforeReachClamp = rawY;
    rawY = clampCameraAutoBoundaryY(rawY);
    if (currentZoom > 0.5 + 0.001 && beforeReachClamp < rawY - 0.5) {
      rawY = settleCameraAutoToMinZoomFloor();
      cameraCropSnapTarget = null;
      cameraCropDragY50 = rawY;
    } else if (currentZoom <= 0.5 + 0.001 && currentZoom > 0.5) {
      rawY = settleCameraAutoToMinZoomFloor();
      cameraCropSnapTarget = null;
      cameraCropDragY50 = rawY;
    } else if (currentZoom < 1.5 - 1e-9 && beforeReachClamp > rawY + 0.5) {
      rawY = settleCameraAutoToMaxZoomCeiling();
      cameraCropSnapTarget = null;
      cameraCropDragY150 = rawY;
    } else if (currentZoom >= 1.5 - 0.001 && currentZoom < 1.5) {
      rawY = settleCameraAutoToMaxZoomCeiling();
      cameraCropSnapTarget = null;
      cameraCropDragY150 = rawY;
    }
    if (cameraCropSnapTarget && cameraCropSnapTarget.type === 'viewport') {
      const liveMax = currentZoom >= 1.5 - 1e-9 ? getCameraContentMaxY() : maxZoomCeilingY;
      if (vp > 0 && liveMax < vp - CAMERA_VIEWPORT_BOTTOM_EPS) {
        rawY = Math.min(rawY, liveMax);
        cameraCropSnapTarget = null;
      } else if (canViewportSnap && (isCameraVerticalScrollActive() || shouldHoldCameraSnap(rawY, vp))) {
        rawY = vp;
        cameraCropSnapTarget = { type: 'viewport', y: vp };
      } else if (Math.abs(rawY - vp) > 0.5) {
        cameraCropSnapTarget = null;
      }
    } else if (cameraCropSnapTarget && Math.abs(rawY - cameraCropSnapTarget.y) > 0.5) {
      cameraCropSnapTarget = null;
    }

    if (isCameraYAtViewportBottom(rawY, range.viewportBottom)) {
      cameraCropNearBottomLatch = true;
    } else {
      cameraCropNearBottomLatch = false;
      cameraCropLeftBottomThisDrag = true;
    }
    const lineUnmoved = cameraCropDragStartMaxY != null && Number.isFinite(cameraCropDragStartMaxY)
      && Math.abs(getCameraContentMaxY() - cameraCropDragStartMaxY) <= 0.5;
    const notPulledUp = cameraCropDragStartMaxY != null && Number.isFinite(cameraCropDragStartMaxY)
      && rawY >= cameraCropDragStartMaxY - 0.5;
    const atPin = isCameraYAtViewportBottom(rawY, range.viewportBottom);
    const pointerAtEdge = isCameraYAtViewportBottom(pointerY, vp);
    // 線（カード+24）が端にいるときだけ合わせをスキップ。吸着後の rawY は使わない
    const lineAtPin = isCameraYAtViewportBottom(getCameraContentMaxY(), vp);
    const skipZoomAtStartBottom = !cameraCropParkCatchActive
      && lineUnmoved && notPulledUp && pointerAtEdge
      && (lineAtPin || cameraCropStartedAtBottom);
    if (skipZoomAtStartBottom) {
      pinCameraCropLineToViewportBottom();
      return;
    }
    // バーありの画面下端は一気に合わせない。上方向は 240px/秒の縮小
    if (isCameraVerticalScrollActive() && cameraCropSnapTarget && cameraCropSnapTarget.type === 'viewport') {
      pinCameraCropLineToViewportBottom();
      return;
    }
    // 端拡大後、ポインタが端のままなら枠へ合わせ直すと縮むので倍率は維持。線は画面下端。
    // 同じドラッグで上へ動かしたあとに端へ戻すときは、画面下端へ合わせる
    if (cameraCropDidEdgeExpand && atPin && pointerAtEdge && notPulledUp && !cameraCropLeftBottomThisDrag) {
      pinCameraCropLineToViewportBottom();
      return;
    }

    const onStepSnap = !!(cameraCropSnapTarget && cameraCropSnapTarget.type === 'step'
      && Math.abs(rawY - cameraCropSnapTarget.y) < 0.5);

    if (cameraCropPendingY != null && Math.abs(rawY - cameraCropPendingY) < 0.5) {
      if (snapCameraCropLineToZoomLimitIfAtWall(rawY, minZoomFloorY, maxZoomCeilingY)) return;
      if (isCameraAutoPinnedAtMinReachable(rawY)
        || (currentZoom <= 0.5 + 0.001 && currentZoom > 0.5)) {
        const floorY = settleCameraAutoToMinZoomFloor();
        cameraCropDragY50 = floorY;
        cameraCropPendingY = floorY;
        cameraCropBoundaryY = floorY;
        cameraCropKind = 'free';
        cameraCropSnapTarget = null;
        updateCameraGuides();
      } else if (isCameraAutoPinnedAtMaxReachable(rawY)
        || (currentZoom >= 1.5 - 0.001 && currentZoom < 1.5)) {
        const ceilingY = settleCameraAutoToMaxZoomCeiling();
        cameraCropPendingY = ceilingY;
        cameraCropBoundaryY = ceilingY;
        cameraCropKind = 'free';
        cameraCropSnapTarget = null;
        updateCameraGuides();
      }
      return;
    }

    if (onStepSnap) {
      if (snapCameraCropLineToZoomLimitIfAtWall(rawY, minZoomFloorY, maxZoomCeilingY)) return;
      cameraCropPendingY = rawY;
      cameraCropKind = 'free';
      cameraCropBoundaryY = rawY;
      updateCameraGuides();
      if (
        (atMinZoom && rawY <= minZoomFloorY + 0.5) ||
        (atMaxZoom && rawY >= maxZoomCeilingY - 0.5) ||
        skipZoomAtStartBottom
      ) {
        return;
      }
      scheduleAutoZoomToMatchBoundary(rawY);
      return;
    }

    if (snapCameraCropLineToZoomLimitIfAtWall(rawY, minZoomFloorY, maxZoomCeilingY)) return;
    cameraCropPendingY = rawY;
    cameraCropKind = 'free';
    cameraCropBoundaryY = rawY;
    updateCameraGuides();
    if (
      (atMinZoom && rawY <= minZoomFloorY + 0.5) ||
      (atMaxZoom && rawY >= maxZoomCeilingY - 0.5) ||
      skipZoomAtStartBottom
    ) {
      return;
    }
    scheduleAutoZoomToMatchBoundary(rawY);
  }

  function bindCameraGuideEvents() {
    if (cameraGuideEventsBound) return;
    cameraGuideEventsBound = true;

    const line = document.getElementById('cameraCropLine');
    const resizer = document.getElementById('cameraFrameResizer');
    const wrapper = document.querySelector('.grid-wrapper');
    let cameraCornerDragStartX = 0;

    const beginCameraCropDrag = (e) => {
      if (!isCameraMode || isCameraHideMode || isCameraSizeModalOpen() || e.button !== 0) return false;
      const geo = resolveCameraCropGeometry();
      if (!geo.canDrag) return false;
      // ヘッダー帯では、下点線が実際にそこにあるときだけ開始（誤って縮小限界へ飛ぶのを防ぐ）
      const header = document.getElementById('cameraHeader');
      const headerBottom = header && !header.classList.contains('hidden')
        ? header.getBoundingClientRect().bottom
        : 0;
      const lineRect = line.getBoundingClientRect();
      if (headerBottom > 0 && e.clientY < headerBottom && lineRect.top >= headerBottom + 8) {
        return false;
      }
      // 横／角ドラッグが残っていると同時進行になるのを防ぐ

    window.addEventListener('pointerup', endCornerDrag, true);
    window.addEventListener('mouseup', endCornerDrag, true);
    window.addEventListener('pointercancel', endCornerDrag, true);
    if (cornerHit) {
      cornerHit.addEventListener('lostpointercapture', (e) => {
        if (cameraLockDragging) {
          if (cameraLockPointerId != null && e.pointerId !== cameraLockPointerId) return;
          if ((e.buttons & 1) === 0) endLockedGuideDrag(null);
          return;
        }
        if (!cameraCornerDragging) return;
        if (cameraCornerPointerId != null && e.pointerId !== cameraCornerPointerId) return;
        if ((e.buttons & 1) === 0) endCornerDrag(null);
      });
    }

    window.addEventListener('pointermove', (e) => {
      if (cameraLockDragging) return;
      if (cameraCornerDragging) return;
      if (!cameraWidthDragging || !isCameraMode) return;
      if (cameraWidthPointerId != null && e.pointerId !== cameraWidthPointerId) return;
      // 画面外では buttons が 0 になり得る。capture 中は pointerup まで継続
      if ((e.buttons & 1) === 0) {
        const captureEl = document.getElementById('cameraFrameResizerHit') || resizer;
        const captured = cameraWidthPointerId != null
          && typeof captureEl.hasPointerCapture === 'function'
          && captureEl.hasPointerCapture(cameraWidthPointerId);
        if (!captured) {
          endWidthDrag(e);
          return;
        }
      }

      if (!cameraWidthDragMoved) {
        if (cameraWidthDragStartX != null
          && Math.abs(e.clientX - cameraWidthDragStartX) < CAMERA_CROP_POINTER_DEAD_PX) {
          return;
        }
      }
      updateCameraWidthEdgeFromClientX(e.clientX);
      if (shouldApplyCameraWidthDragClientX()) applyCameraWidthDragClientX(e.clientX);
    });

    const endWidthDrag = (e) => {
      if (!cameraWidthDragging) return;
      if (cameraCornerDragging) return;
      if (e && cameraWidthPointerId != null && e.pointerId != null && e.pointerId !== cameraWidthPointerId) return;
      const releaseX = e && Number.isFinite(e.clientX) ? e.clientX : null;
      const releaseY = e && Number.isFinite(e.clientY) ? e.clientY : null;
      const widthMoved = cameraWidthDragMoved;
      const dblClick = !widthMoved && isCameraGuideCompleteClick(e) && noteCameraGuideClick('width');
      if (widthMoved) breakCameraGuideDblClick();
      cameraWidthDragging = false;
      resizer.classList.remove('is-dragging', 'is-snapped');
      document.body.style.cursor = '';
      cameraWidthSnapTarget = null;
      if (cameraWidthPointerId != null) {
        const captureEl = document.getElementById('cameraFrameResizerHit') || resizer;
        try { captureEl.releasePointerCapture(cameraWidthPointerId); } catch (_) {}
      }
      cameraWidthPointerId = null;
      commitCameraWidthAfterDrag(widthMoved);
      fitCameraCardTextScales();
      updateCameraGuides();
      checkCameraHeaderCollision();
      finishUiTipAfterGuideDrag(widthMoved, 'camera-frame-resizer', releaseX, releaseY);
      if (dblClick) applyCameraGuideDblClick('width');
    };
    window.addEventListener('pointerup', endWidthDrag);
    window.addEventListener('pointercancel', endWidthDrag);
    window.addEventListener('mouseup', endWidthDrag);
    window.addEventListener('blur', () => {
      if (line) line.classList.remove('is-hovering');
      if (resizer) resizer.classList.remove('is-hovering');
      syncCameraGuideCornerAfterPaint();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (cameraLockDragging) endLockedGuideDrag(null);
        else if (cameraCornerDragging) endCornerDrag(null);
        else endWidthDrag(null);
      }
    });
    resizer.addEventListener('lostpointercapture', (e) => {
      if (cameraLockDragging) {
        if (cameraLockPointerId != null && e.pointerId !== cameraLockPointerId) return;
        if ((e.buttons & 1) === 0) endLockedGuideDrag(null);
        return;
      }
      endWidthDrag(e);
    });
    if (resizerHit && resizerHit !== resizer) {
      resizerHit.addEventListener('lostpointercapture', (e) => {
        if (cameraLockDragging) {
          if (cameraLockPointerId != null && e.pointerId !== cameraLockPointerId) return;
          if ((e.buttons & 1) === 0) endLockedGuideDrag(null);
        }
      });
    }

    if (wrapper) {
      wrapper.addEventListener('scroll', () => {
        if (isCameraMode) updateCameraGuides();
      });
    }
  }

  // html2canvas は CSS zoom を再現しない。クローンでは zoom を 1 にし、
  // 見た目pxへ寸法を焼き、列幅を整数pxに揃える。
  function getCaptureAdjZoom(zoom) {
    if (!(zoom > 0)) return 1;
    if (zoom < 1) {
      // 50〜100% → 見た目 75〜100%
      return (0.75 + (zoom - 0.5) / 0.5 * 0.25) / zoom;
    }
    if (zoom > 1) {
      // 100〜150% → 見た目 100〜125%
      return (1.0 + (zoom - 1.0) / 0.5 * 0.25) / zoom;
    }
    return 1;
  }

  // html2canvas は ::before/::after を html2canvaspseudoelement に実体化する。
  // カード枠の inset shadow はそのコピーに残るので、影付きのものだけ外す。
  function stripCameraCapturePseudoShadows(doc) {
    doc.querySelectorAll('html2canvaspseudoelement').forEach(el => {
      const shadow = (
        (el.style.getPropertyValue && el.style.getPropertyValue('box-shadow')) ||
        el.style.boxShadow ||
        ''
      ).trim();
      if (shadow && shadow !== 'none') el.remove();
    });
  }

  // 画面の列トラックを測り、見た目pxを整数に丸めてクローンへ載せる（撮り側で再分割しない）。
  // 外側24pxは .grid-wrapper の padding（zoomしない）なのでグリッドには足さない。
  function parseCssPxList(value) {
    if (!value) return [];
    return String(value).split(/\s+/).map(parseFloat).filter(n => Number.isFinite(n) && n > 0);
  }

  function measureLiveCameraColumnVisuals(z, cols) {
    const n = (typeof cols === 'number' && cols > 0) ? cols : 0;
    const fallbackGap = Math.round(20 * z);
    const liveGrid = document.getElementById('playerGrid');
    if (!liveGrid || !(z > 0) || !(n > 0)) return { visualGap: fallbackGap, visualCols: null };
    const cs = getComputedStyle(liveGrid);
    const layoutGapRaw = parseFloat(cs.columnGap || cs.gap);
    const layoutGap = Number.isFinite(layoutGapRaw) ? layoutGapRaw : 20;
    const tracks = parseCssPxList(cs.gridTemplateColumns);
    if (tracks.length < n) return { visualGap: Math.round(layoutGap * z), visualCols: null };
    const used = tracks.slice(0, n);
    const trackSum = used.reduce((a, b) => a + b, 0);
    const wrap = liveGrid.closest('.grid-wrapper');
    const parentW = wrap && wrap.clientWidth > 0 ? wrap.clientWidth : 0;
    const layoutSpan = trackSum + layoutGap * (n - 1);
    const alreadyVisual = parentW > 0 &&
      Math.abs(layoutSpan - parentW) < Math.abs(layoutSpan - parentW / z);
    const scale = alreadyVisual ? 1 : z;
    return {
      visualGap: Math.max(0, Math.round(layoutGap * scale)),
      visualCols: used.map(w => Math.max(1, Math.round(w * scale)))
    };
  }

  function snapCameraCaptureGrid(grid, captureW, z, cols) {
    const n = (typeof cols === 'number' && cols > 0) ? cols : 1;
    if (!grid || !(z > 0)) return;
    const measured = measureLiveCameraColumnVisuals(z, n);
    let visualCols = measured.visualCols;
    let visualGap = measured.visualGap;
    if (!visualCols || visualCols.length !== n) {
      const parentW = Math.max(1, Math.round(captureW) - 48);
      visualGap = Math.round(20 * z);
      const visualInner = parentW - visualGap * (n - 1);
      if (visualInner < n) return;
      const base = Math.floor(visualInner / n);
      let rem = visualInner - base * n;
      visualCols = [];
      for (let i = 0; i < n; i++) {
        visualCols.push(base + (rem > 0 ? 1 : 0));
        if (rem > 0) rem--;
      }
    }
    const tracksW = visualCols.reduce((a, b) => a + b, 0) + visualGap * Math.max(0, n - 1);
    grid.style.padding = '0';
    grid.style.gap = `${visualGap}px`;
    grid.style.width = `${tracksW}px`;
    grid.style.transform = 'none';
    grid.style.gridTemplateColumns = visualCols.map(w => `${w}px`).join(' ');
    void grid.offsetWidth;
  }

    clonedDoc.querySelectorAll('.card-console').forEach(el => {

    const captureStyle = clonedDoc.createElement('style');
    captureStyle.textContent = `
      .grid-container,

  async function takeCameraScreenshot() {
    if (!isCameraMode || isCameraHideMode) return;
    const target = document.getElementById('mainArea');
    const captureW = Math.round(getCameraCaptureWidth());
    const captureH = Math.round(getCameraCaptureHeight());
    const liveMainH = Math.round(target.clientHeight);
    const liveW = Math.round(window.innerWidth);
    const liveH = Math.round(window.innerHeight);
    const canvas = await html2canvas(target, {
      backgroundColor: '#000000',
      scale: CAMERA_CAPTURE_SCALE,
      width: captureW,
      height: captureH,
      windowWidth: liveW,
      windowHeight: liveH,
      x: 0,
      y: 0,
      scrollX: -window.scrollX,
      scrollY: -window.scrollY,
      useCORS: true,
      onclone: (clonedDoc) => {
        prepareCameraCaptureClone(clonedDoc, captureW, liveMainH);
      }
    });

    const date = new Date();
    const pad2 = value => String(value).padStart(2, '0');
    const centiseconds = pad2(Math.floor(date.getMilliseconds() / 10));
    const filename = `Score Dashboard ${date.getFullYear()}.${pad2(date.getMonth() + 1)}.${pad2(date.getDate())} - ${pad2(date.getHours())}.${pad2(date.getMinutes())}.${pad2(date.getSeconds())}.${centiseconds}.png`;
    const link = document.createElement('a');
    link.download = filename;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

    if (!openOverlayIds.has(el.id)) {

  // 撮影サイズプリセット（幅降順）

    { w: 1024, h: 768, aw: 4, ah: 3 },
    { w: 1280, h: 720, aw: 16, ah: 9 },
    { w: 1600, h: 1200, aw: 4, ah: 3 },

      cropRememberedY: cameraCropRememberedY,

      ? snap.manualZoom

  function refreshCameraSizePresetMenuCache() {
    const h = getCameraSizeHeightRangePx();
    const initial = getCameraSizePresetInitialPx();
    cameraSizePresetMenuCache = {
      heightMin: h.min,
      heightMax: h.max,
      initialW: initial.width,
      initialH: initial.height
    };
    return cameraSizePresetMenuCache;
  }

  function getCameraSizePresetMenuCache() {
    return cameraSizePresetMenuCache || refreshCameraSizePresetMenuCache();
  }

  function findClosestZoomForCaptureHeight(targetH, frameWidthPx) {
    const ZMIN = 0.5;
    const ZMAX = 1.5;
    const STEP = 0.001;
    const roundZ = (z) => Math.round(z * 1000) / 1000;
    const memo = new Map();
    const measure = (z) => {
      const key = roundZ(z);
      if (memo.has(key)) return memo.get(key);
      const h = measureCameraCaptureHeightPxAtZoom(key, frameWidthPx);
      memo.set(key, h);
      return h;
    };

    let lo = ZMIN;
    let hi = ZMAX;
    let bestZ = roundZ(Number.isFinite(currentZoom) ? currentZoom : 1);
    let bestErr = Math.abs(measure(bestZ) - targetH);

    for (let i = 0; i < 12; i++) {
      const mid = roundZ((lo + hi) / 2);
      const h = measure(mid);
      const err = Math.abs(h - targetH);
      if (err < bestErr) {
        bestZ = mid;
        bestErr = err;
      }
      if (bestErr === 0) return bestZ;
      if (h < targetH) lo = mid;
      else hi = mid;
      if (hi - lo <= STEP) break;
    }

    const from = Math.max(ZMIN, roundZ(bestZ - 0.01));
    const to = Math.min(ZMAX, roundZ(bestZ + 0.01));
    for (let z = from; z <= to + 1e-9; z = roundZ(z + STEP)) {
      const err = Math.abs(measure(z) - targetH);
      if (err < bestErr) {
        bestZ = z;
        bestErr = err;
        if (bestErr === 0) return bestZ;
      }
    }
    return bestZ;
  }

  function resolveCameraPresetFrameWidthPx(captureW) {
    const wRange = getCameraSizeWidthRangePx();
    if (captureW < wRange.min || captureW > wRange.max) return null;
    const screenW = Math.round(captureW / CAMERA_CAPTURE_SCALE);
    if (screenW * CAMERA_CAPTURE_SCALE !== captureW) return null;
    if (screenW < CAMERA_WIDTH_MIN) return null;
    return screenW;
  }

  function isCameraCapturePresetReachable(captureW, captureH) {
    const frameW = resolveCameraPresetFrameWidthPx(captureW);
    if (frameW == null) return false;
    const cache = getCameraSizePresetMenuCache();
    return captureH >= cache.heightMin && captureH <= cache.heightMax;
  }

  function applyCameraCaptureInitialPreset() {
    cameraWidthDragPreview = null;
    cameraWidthSnapTarget = null;
    const relock = isCameraSizeLockActive();
    isZoomAuto = true;
    cameraCropRememberedY = null;
    cameraFrameWidth = null;
    resetCameraCropToMax();
    applyCameraFrameWidth();
    executeAutoFit(relock ? { force: true } : undefined);
    fitCameraCardTextScales();
    updateCameraGuides();
    checkCameraHeaderCollision();
    if (relock) adoptCameraSizeLockFromCurrentCapture();
  }

  function applyCameraCapturePxSize(captureW, captureH) {
    const frameW = resolveCameraPresetFrameWidthPx(captureW);
    if (frameW == null) return false;
    if (!isCameraCapturePresetReachable(captureW, captureH)) return false;

    const rollback = getCameraSizeCaptureSnapshot();
    cameraWidthDragPreview = null;
    cameraWidthSnapTarget = null;
    const maxW = Math.round(getCameraMaxFrameWidth());
    cameraFrameWidth = Math.abs(frameW - maxW) <= 0.5 ? null : frameW;
    applyCameraFrameWidth();
    const mainArea = document.getElementById('mainArea');
    if (mainArea) void mainArea.offsetWidth;

    isZoomAuto = false;
    applyCameraCaptureHeightPx(captureH, { frameWidthPx: frameW });
    updateCameraGuides();
    checkCameraHeaderCollision();
    scheduleRefreshCameraDefaultAutoZoom();

    const size = getCameraCapturePxSize();
    if (size.width !== captureW || size.height !== captureH) {
      restoreCameraSizeCaptureSnapshot(rollback);
      return false;
    }
    return true;
  }

  function syncCameraSizeModalValuesFromCapture(locked) {
    const size = getCameraCapturePxSize();
    const aspect = formatCameraSizeAspectDisplay(size.width, size.height);
    applyCameraSizeModalValues({
      aspectW: aspect.w,
      aspectH: aspect.h,
      width: size.width,
      height: size.height,
      locked: locked !== undefined ? !!locked : cameraSizeAspectLocked
    });
    cameraSizeModalLiveSyncW = size.width;
    cameraSizeModalLiveSyncH = size.height;
  }

  function getCameraSizePresetInitialPx() {
    // 幅＝画面いっぱい。高さ＝いまの窓でオートONした着地（cameraDefaultAutoZoom）
    const maxFrameW = Math.max(1, Math.round(getCameraMaxFrameWidth()));
    const width = maxFrameW * CAMERA_CAPTURE_SCALE;
    const z = (Number.isFinite(cameraDefaultAutoZoom) && cameraDefaultAutoZoom > 0)
      ? cameraDefaultAutoZoom
      : currentZoom;
    const height = measureCameraCaptureHeightPxAtZoom(z, maxFrameW);
    return {
      width: Math.max(1, width),
      height: Math.max(1, height)
    };
  }

  function cameraSizePresetInnerText(aspect) {
    return aspect ? `${aspect.aw}:${aspect.ah}` : '既定';
  }

  /** 文言: 幅4桁枠 × 高さ4桁枠 (中身)。pad は閉じ括弧の右。半角は文字として残す */
  function buildCameraSizePresetLabelHtml(w, h, aspect) {
    const inner = cameraSizePresetInnerText(aspect);
    return `<span class="camera-size-preset-cluster">`
      + `<span class="camera-size-wh-num">${w}</span>`
      + ` × `
      + `<span class="camera-size-wh-num camera-size-wh-num-h">${h}</span>`
      + ` (<span class="camera-size-preset-inner">${inner}</span>)`
      + `<span class="camera-size-preset-pad" aria-hidden="true"></span>`
      + `</span>`;
  }

  function withCameraSizePresetMenuLaidOut(menu, fn) {
    if (!menu) return;
    const wasHidden = menu.classList.contains('hidden');
    const prevVisibility = menu.style.visibility;
    if (wasHidden) {
      menu.style.visibility = 'hidden';
      menu.classList.remove('hidden');
    }
    try {
      fn();
    } finally {
      if (wasHidden) {
        menu.classList.add('hidden');
        menu.style.visibility = prevVisibility;
      }
    }
  }

  /** 括弧の中身だけ測り、最大との差を閉じ括弧の右に足す（0未満は足さない） */
  function applyCameraSizePresetInnerPads(menu) {
    if (!menu) return;
    const inners = Array.from(menu.querySelectorAll('.camera-size-preset-inner'));
    const pads = Array.from(menu.querySelectorAll('.camera-size-preset-pad'));
    if (!inners.length || inners.length !== pads.length) return;
    const widths = inners.map((el) => el.getBoundingClientRect().width);
    const maxW = widths.reduce((m, w) => (w > m ? w : m), 0);
    pads.forEach((pad, i) => {
      pad.style.width = `${Math.max(0, maxW - widths[i])}px`;
    });
  }

  function fillCameraSizePresetMenu() {
    const menu = document.getElementById('cameraSizePresetMenu');
    if (!menu) return;
    menu.innerHTML = '';
    const cache = getCameraSizePresetMenuCache();
    const initialPx = { width: cache.initialW, height: cache.initialH };
    const cur = getCameraCapturePxSize();
    const rows = [
      { w: initialPx.width, h: initialPx.height, aspect: null, isInitial: true },
      ...CAMERA_SIZE_PRESETS.map((p) => ({
        w: p.w,
        h: p.h,
        aspect: { aw: p.aw, ah: p.ah },
        isInitial: false
      }))
    ];
    let activeIdx = -1;
    if (cur.width === initialPx.width && cur.height === initialPx.height) {
      activeIdx = 0;
    } else {
      const presetIdx = CAMERA_SIZE_PRESETS.findIndex((p) => p.w === cur.width && p.h === cur.height);
      if (presetIdx >= 0) activeIdx = presetIdx + 1;
    }
    rows.forEach((row, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      const unreachable = row.isInitial
        ? false
        : !isCameraCapturePresetReachable(row.w, row.h);
      btn.disabled = unreachable;
      const isActive = !unreachable && idx === activeIdx;
      btn.className = 'sort-menu-item' + (isActive ? ' active' : '');
      btn.setAttribute('role', 'option');
      btn.dataset.captureW = String(row.w);
      btn.dataset.captureH = String(row.h);
      if (row.isInitial) btn.dataset.isInitial = '1';
      if (row.aspect) {
        btn.dataset.aspectW = String(row.aspect.aw);
        btn.dataset.aspectH = String(row.aspect.ah);
      }
      if (unreachable) btn.setAttribute('aria-disabled', 'true');
      btn.innerHTML = buildCameraSizePresetLabelHtml(row.w, row.h, row.aspect);
      if (!unreachable) btn.addEventListener('click', pickCameraSizePreset);
      menu.appendChild(btn);
    });
    prepareSharedDropdownMenu(menu);
    withCameraSizePresetMenuLaidOut(menu, () => {
      applyCameraSizePresetInnerPads(menu);
      const cluster = menu.querySelector('[data-is-initial="1"] .camera-size-preset-cluster');
      cameraSizePresetInitialClusterWidthPx = cluster
        ? Math.round(cluster.getBoundingClientRect().width)
        : 0;
    });
    cameraSizePresetMenuBuilt = true;
  }

  function syncCameraSizePresetMenuActive() {
    const menu = document.getElementById('cameraSizePresetMenu');
    if (!menu) return;
    const cur = getCameraCapturePxSize();
    menu.querySelectorAll('.sort-menu-item').forEach((btn) => {
      const match = Number(btn.dataset.captureW) === cur.width
        && Number(btn.dataset.captureH) === cur.height;
      btn.classList.toggle('active', match && !btn.disabled);

  function updateCameraSizePresetInitialRow() {
    if (!isCameraSizeModalOpen()) return;
    const initial = getCameraSizePresetInitialPx();
    if (cameraSizePresetMenuCache) {
      cameraSizePresetMenuCache.initialW = initial.width;
      cameraSizePresetMenuCache.initialH = initial.height;

    const btn = menu && menu.querySelector('[data-is-initial="1"]');

    btn.dataset.captureH = String(initial.height);

    if (hEl) hEl.textContent = String(initial.height);

      const nextW = Math.round(cluster.getBoundingClientRect().width);

      cameraSizePresetInitialClusterWidthPx = nextW;

  function flushCameraSizePresetInitialIfPending() {

  function syncCameraSizeAspectMenuActive() {
